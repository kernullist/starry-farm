function updateHud()
{
    if (!S)
    {
        return;
    }
    var key = S.gold + '|' + S.time + '|' + S.day + '|' + S.season + '|' + Math.round(S.energy) +
        '|' + S.sel + '|' + S.health + '|' + S.weather + '|' + S.goalIdx + '|' + invSig();
    if (key === UI.lastHudKey)
    {
        return;
    }
    UI.lastHudKey = key;

    $('clockDate').textContent = S.year + '년 ' + dateLabel();
    $('clockDay').textContent = DAY_KR[dayOfWeek()] + '요일';
    $('clockTime').textContent = timeLabel();
    $('goldVal').textContent = S.gold.toLocaleString();

    var pct = Math.max(0, Math.min(1, S.energy / S.maxEnergy));
    $('energyFill').style.height = (pct * 100) + '%';
    $('energyTxt').textContent = Math.round(S.energy);
    $('energyFill').style.background = pct < .2 ? 'linear-gradient(180deg,#ff9a6a,#d84a2a)'
        : 'linear-gradient(180deg,#8fdc5a,#4fa32c)';

    var hw = $('healthWrap');
    if (MAP && MAP.id === 'mine')
    {
        hw.style.display = 'block';
        $('healthFill').style.height = Math.max(0, (S.health / S.maxHealth) * 100) + '%';
    }
    else
    {
        hw.style.display = 'none';
    }

    drawClockDial();
    buildToolbar();
    updateGoalChip();
    updateFestChip();

    var wc = $('weatherChip');
    if (MAP && MAP.id === 'mine')
    {
        wc.textContent = '⛏ ' + MINE.floor + '층';
    }
    else
    {
        var icons = { sun: '☀️', rain: '🌧️', storm: '⛈️', snow: '❄️', wind: '🍃' };
        wc.textContent = icons[S.weather] + ' ' + WEATHER_KR[S.weather] + (MAP ? '  ·  ' + MAP.name : '');
    }
}

function invSig()
{
    var s = '', i;
    for (i = 0; i < S.invSize; i++)
    {
        var sl = S.inv[i];
        s += sl ? (sl.id + sl.n + (sl.q || 0)) : '-';
    }
    return s;
}

function drawClockDial()
{
    var cv = $('clockDial');
    if (!cv)
    {
        return;
    }
    var g = cv.getContext('2d');
    g.clearRect(0, 0, 72, 40);
    // arc from 6:00 to 26:00
    var p = Math.max(0, Math.min(1, (S.time - DAY_START) / (DAY_END - DAY_START)));
    var cx = 36, cy = 36, r = 28;
    g.lineWidth = 6;
    g.strokeStyle = '#c8a878';
    g.beginPath();
    g.arc(cx, cy, r, Math.PI, 0);
    g.stroke();
    g.strokeStyle = p < .55 ? '#6ab8e8' : (p < .8 ? '#e8a848' : '#4a4a8a');
    g.beginPath();
    g.arc(cx, cy, r, Math.PI, Math.PI + Math.PI * p);
    g.stroke();
    var a = Math.PI + Math.PI * p;
    g.fillStyle = '#4a2c14';
    g.beginPath();
    g.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 4, 0, Math.PI * 2);
    g.fill();
}

function buildToolbar()
{
    var tb = $('toolbar');
    tb.innerHTML = '';
    var n = Math.min(12, S.invSize);
    var i;
    for (i = 0; i < n; i++)
    {
        (function (idx)
        {
            var sl = S.inv[idx];
            var d = el('div', 'slot' + (idx === S.sel ? ' sel' : ''));
            if (sl)
            {

function afterWake(sum)
{
    var i;
    // profession choices from any level 5 / 10 reached
    var pending = null;
    for (i = 0; i < sum.levels.length; i++)
    {
        var lv = sum.levels[i];
        if ((lv.lvl === 5 || lv.lvl === 10) && PROFESSIONS[lv.skill])
        {
            if (!S.prof[lv.skill])
            {
                S.prof[lv.skill] = {};
            }
            if (!S.prof[lv.skill][lv.lvl])
            {
                pending = lv;
                break;
            }
        }
    }
    if (pending)
    {
        askProfession(pending, function ()
        {
            afterWake(sum);
        });
        return;
    }
    tickMarriage();
    // safety net: some stats (tilled, shipped income, hearts) advance without
    // passing through a checkGoal() call site, so re-evaluate every morning.
    // Clearing one goal can immediately satisfy the next, hence the loop.
    var gg;
    for (gg = 0; gg < 4; gg++)
    {
        if (!checkGoal())
        {
            break;
        }
    }
    checkTrophies();
    if (S.flags.toolReady)
    {
        S.flags.toolReady = false;
        toast('클린트가 도구 작업을 끝냈어요!');
    }
    if (S.flags.buildReady)
    {
        S.flags.buildReady = false;
        toast('로빈이 건물을 완성했어요!');
    }
    var fest = todayFestival();
    if (fest)
    {
        setTimeout(function ()
        {
            modalMsg('🎪 오늘은 ' + fest.name, fest.desc + '\n\n' +
                fest.start + '시부터 ' + fest.end + '시까지 ' +
                ({ town: '마을 광장', beach: '해변', forest: '숲' }[fest.map]) + '에서 열려요.');
        }, 300);
    }
    rebuildActors();
}

function askProfession(lv, done)
{
    var opts = PROFESSIONS[lv.skill][lv.lvl];
    var m = modalShell('⭐ ' + SKILL_KR[lv.skill] + ' Lv.' + lv.lvl + ' 전문화', false);
    m.body.appendChild(el('div', 'hint', '하나를 고르세요. 나중에 바꿀 수 없어요.'));
    var i;
    for (i = 0; i < opts.length; i++)
    {
        (function (o)
        {
            var row = el('div', 'listRow');
            var tx = el('div', 'tx');
            tx.innerHTML = '<b>' + o.name + '</b>';
            tx.appendChild(el('small', '', o.desc));
            row.appendChild(tx);
            var b = el('button', 'btn small green', '선택');
            b.onclick = function ()
            {
                S.prof[lv.skill][lv.lvl] = o.id;
                closeModal();
                toast(o.name + ' 전문화를 얻었어요!');
                if (o.id === 'fighter')
                {
                    S.maxHealth += 15;

                    S.maxHealth += 25;
                    S.health = S.maxHealth;
                }
                done();
            };
            row.appendChild(b);
            m.body.appendChild(row);
        })(opts[i]);
    }
    openModal(m);
}

function cvOf(img, size)

{

        {

function itemDesc(sl)
{
    var it = ITEMS[sl.id];
    var s = '';
    var kindKr = { tool: '도구', seed: '씨앗', crop: '작물', forage: '채집물', fish: '물고기',
        mineral: '광물', artisan: '가공품', cook: '요리', craft: '제작', resource: '자원',
        animal: '축산물', hat: '모자', misc: '기타' }[it.kind] || '';
    s += kindKr;
    if (it.price > 0 || sl.px)
    {
        s += '  ·  판매가 ' + itemPrice(sl) + 'G';
    }
    if (it.energy)
    {
        s += '\n기력 +' + it.energy;
    }
    if (CROPS[sl.id])
    {
        var cd = CROPS[sl.id];
        s += '\n' + cd.season.split(',').map(function (x) { return SEASON_KR[x]; }).join('/') +
            ' · ' + cd.days + '일 성장' + (cd.regrow ? ' · ' + cd.regrow + '일마다 재수확' : '');
    }
    if (it.desc)
    {
        s += '\n' + it.desc;
    }
    return s;
}

// ---------- shops ----------

function openShop(shopId)
{
    var sh = SHOPS[shopId];
    var m = modalShell('🛒 ' + sh.name);
    var tabs = el('div', 'tabRow');
    var bodyBuy = el('div');
    var bodySell = el('div');
    var tBuy = el('button', 'tab on', '사기');
    var tSell = el('button', 'tab', '팔기');
    tabs.appendChild(tBuy);
    tabs.appendChild(tSell);
    m.insertBefore(tabs, m.body);

    function show(which)
    {
        tBuy.className = 'tab' + (which === 'buy' ? ' on' : '');
        tSell.className = 'tab' + (which === 'sell' ? ' on' : '');
        m.body.innerHTML = '';
        m.body.appendChild(which === 'buy' ? bodyBuy : bodySell);
    }
    tBuy.onclick = function () { show('buy'); };
    tSell.onclick = function () { show('sell'); };

    // buy list
    function rebuildBuy()
    {
        bodyBuy.innerHTML = '';
        var i;
        for (i = 0; i < sh.stock.length; i++)
        {
            var st = sh.stock[i];
            if (st.hide)
            {
                continue;
            }
            if (st.season && st.season.indexOf(seasonId()) < 0)
            {
                continue;
            }
            if (st.year && S.year < st.year)
            {
                continue;
            }
            if (st.need && st.need.hearts)
            {
                var ok = false, k;
                for (k in S.npc)
                {
                    if (S.npc.hasOwnProperty(k) && NPC_BY_ID[k] && NPC_BY_ID[k].wed && hearts(k) >= st.need.hearts)
                    {
                        ok = true;
                        break;
                    }
                }
                if (!ok)
                {
                    continue;
                }
            }
            (function (stock)
            {
                var it = ITEMS[stock.id];
                var price = stock.price || it.buy || Math.max(1, it.price * 2);
                var row = el('div', 'listRow');
                var ic = el('div', 'ic');
                ic.appendChild(cvOf(itemIcon(stock.id, 30), 30));
                row.appendChild(ic);
                var tx = el('div', 'tx');
                tx.innerHTML = '<b>' + it.name + '</b>';
                var sub = el('small', '', price + 'G' + (CROPS[stock.id] ? '  ·  ' + CROPS[stock.id].days + '일 성장' : ''));
                tx.appendChild(sub);
                row.appendChild(tx);
                var wrap = el('div');
                wrap.style.cssText = 'display:flex;gap:4px;';
                var b1 = el('button', 'btn small', '1개');
                var b5 = el('button', 'btn small green', '5개');
                b1.onclick = function () { buyItem(stock.id, price, 1); };
                b5.onclick = function () { buyItem(stock.id, price, 5); };
                wrap.appendChild(b1);
                wrap.appendChild(b5);
                row.appendChild(wrap);
                bodyBuy.appendChild(row);
            })(st);
        }
        if (sh.service === 'upgrade')
        {
            bodyBuy.appendChild(el('div', 'sectionTitle', '🔨 도구 업그레이드'));
            addUpgradeRows(bodyBuy);
            bodyBuy.appendChild(el('div', 'sectionTitle', '💎 지오드 열기 (25G)'));
            addGeodeRow(bodyBuy);
        }
        if (sh.service === 'build')
        {
            bodyBuy.appendChild(el('div', 'sectionTitle', '🏠 건물 짓기'));
            addBuildRows(bodyBuy);
        }
        if (sh.service === 'animals')
        {
            bodyBuy.appendChild(el('div', 'sectionTitle', '🐮 동물 사기'));
            addAnimalRows(bodyBuy);
        }
        if (sh.service === 'rod')
        {
            bodyBuy.appendChild(el('div', 'sectionTitle', '🎣 낚싯대'));
            addRodRows(bodyBuy);
        }
    }

    function buyItem(id, price, n)
    {
        var total = price * n;
        if (S.gold < total)
        {
            toast('골드가 부족해요.');
            return;
        }
        if (invFull() && invCount(id) === 0)
        {
            toast('가방이 가득 찼어요.');
            return;
        }
        S.gold -= total;
        give(id, n);
        sfx('coin');
        toast(ITEMS[id].name + ' ×' + n + ' 구입');
        UI.lastHudKey = '';
        rebuildSell();
    }

    function rebuildSell()
    {
        bodySell.innerHTML = '';
        bodySell.appendChild(el('div', 'hint', '팔 물건을 누르세요. 도구는 팔 수 없어요.'));
        var grid = el('div', 'grid');
        var i;
        for (i = 0; i < S.invSize; i++)
        {
            (function (idx)
            {
                var sl = S.inv[idx];
                var c = el('div', 'cell' + (sl && isTool(sl.id) ? ' dim' : ''));
                if (sl)
                {
                    c.appendChild(cvOf(itemIcon(sl.id, 30), 30));
                    if (sl.n > 1)
                    {
                        c.appendChild(el('span', 'qty', String(sl.n)));
                    }
                    if (sl.q)
                    {
                        c.appendChild(el('span', 'qual s' + sl.q));
                    }
                    c.onclick = function ()
                    {
                        if (isTool(sl.id))
                        {
                            toast('도구는 팔 수 없어요.');
                            return;
                        }
                        var unit = itemPrice(sl);
                        modalChoice(ITEMS[sl.id].name + ' 팔기', '개당 ' + unit + 'G · ' + sl.n + '개 보유', [
                            { t: '1개 (' + unit + 'G)', cb: function ()
                            {
                                sellFromSlot(idx, 1);
                            } },
                            { t: '전부 (' + (unit * sl.n) + 'G)', cls: 'blue', cb: function ()
                            {
                                sellFromSlot(idx, sl.n);
                            } },
                            { t: '취소', cls: 'gray', cb: function ()
                            {
                                closeModal();
                                openShop(shopId);
                            } }
                        ]);
                    };
                }
                grid.appendChild(c);
            })(i);
        }
        bodySell.appendChild(grid);
    }

    function sellFromSlot(idx, n)
    {
        var sl = S.inv[idx];
        if (!sl)
        {
            return;
        }
        var unit = itemPrice(sl);
        S.gold += unit * n;
        S.stats.earned += unit * n;
        sl.n -= n;
        if (sl.n <= 0)
        {
            S.inv[idx] = null;
        }
        sfx('coin');
        UI.lastHudKey = '';
        closeModal();
        openShop(shopId);
    }

    rebuildBuy();
    rebuildSell();
    show('buy');
    openModal(m);
}

function addUpgradeRows(host)
{
    var tools = [['hoe', '괭이'], ['can', '물뿌리개'], ['axe', '도끼'], ['pick', '곡괭이']];
    var i;
    if (S.upgrade)
    {
        host.appendChild(el('div', 'hint', '작업 중: ' + S.upgrade.days + '일 남았어요.'));
        return;
    }
    for (i = 0; i < tools.length; i++)
    {
        (function (t)
        {
            var cur = S.tools[t[0]] || 0;
            if (cur >= 4)
            {
                return;
            }
            var next = cur + 1;
            var cost = TOOL_UPGRADE_COST[next];
            var bar = TOOL_UPGRADE_BAR[next];
            var row = el('div', 'listRow');
            var ic = el('div', 'ic');
            ic.appendChild(cvOf(itemIcon(t[0], 30), 30));
            row.appendChild(ic);
            var tx = el('div', 'tx');
            tx.innerHTML = '<b>' + TOOL_TIERS[next] + ' ' + t[1] + '</b>';
            tx.appendChild(el('small', '', cost + 'G + ' + ITEMS[bar].name + ' 5개 · 2일 소요'));
            row.appendChild(tx);
            var b = el('button', 'btn small green', '맡기기');
            b.disabled = S.gold < cost || invCount(bar) < 5;
            b.onclick = function ()
            {
                S.gold -= cost;
                removeItem(bar, 5);
                S.upgrade = { tool: t[0], tier: next, days: 2 };
                closeModal();
                toast('2일 뒤에 찾으러 오세요!');
                UI.lastHudKey = '';
            };
            row.appendChild(b);
            host.appendChild(row);
        })(tools[i]);
    }
}

function addBuildRows(host)

            {

                {
                    needTxt.push(ITEMS[kk].name + ' ' + bd.need[kk]);
                }

            {

                {

                }

            b.onclick = function ()
            {

}

function startBuild(kind, bd)
{
    var kk;
    S.gold -= bd.cost;
    for (kk in bd.need)
    {
        if (bd.need.hasOwnProperty(kk))
        {
            removeItem(kk, bd.need[kk]);
        }
    }
    if (bd.from)
    {
        var i, target = null;
        for (i = 0; i < S.farmBuildings.length; i++)
        {
            if (S.farmBuildings[i].kind === bd.from)
            {
                target = S.farmBuildings[i];
                break;
            }
        }
        S.pendingBuild = { kind: kind, days: bd.days, upgradeOf: target ? target.id : null };
    }
    else
    {
        var spot = findBuildSpot(bd.w, bd.h);
        if (!spot)
        {
            toast('농장에 자리가 없어요.');
            return;
        }
        S.pendingBuild = { kind: kind, days: bd.days, x: spot.x, y: spot.y };
    }
    closeModal();
    modalMsg('로빈', bd.name + ' 공사를 시작할게요!\n' + bd.days + '일 뒤에 완성됩니다.');
    UI.lastHudKey = '';
}

function findBuildSpot(w, h)
{
    var farm = loadMap('farm');
    var x, y, i, j;
    for (y = 12; y < farm.h - h - 2; y++)
    {
        for (x = 30; x < farm.w - w - 2; x++)
        {
            var ok = true;
            for (j = 0; j < h + 1 && ok; j++)
            {
                for (i = 0; i < w && ok; i++)
                {
                    if (isSolid(farm, x + i, y + j) || objAt(farm, x + i, y + j))
                    {
                        ok = false;
                    }
                    if (soilAt('farm', x + i, y + j))
                    {
                        ok = false;
                    }
                }
            }
            if (ok)
            {
                return { x: x, y: y };
            }
        }
    }
    return null;
}

                    x: home.x + 1, y: home.y + 1
                });
                home.animals.push(1);
                closeModal();
                modalMsg('마니', a.name + '을(를) 데려왔어요!\n\n매일 쓰다듬어 주고 먹이를 주면 애정도가 올라가요.');

    {

    }
}

function findHome(kind)
{
    var a = ANIMALS[kind];
    var tierNeed = a.tier || 1;
    var i;
    for (i = 0; i < S.farmBuildings.length; i++)
    {
        var b = S.farmBuildings[i];
        var base = b.kind.indexOf('coop') === 0 ? 'coop' : 'barn';
        if (base !== a.home)
        {
            continue;
        }
        var tier = b.kind.indexOf('_deluxe') > 0 ? 3 : (b.kind.indexOf('_big') > 0 ? 2 : 1);
        if (tier < tierNeed)
        {
            continue;
        }
        if (b.animals.length >= b.cap)
        {
            continue;
        }
        return b;
    }
    return null;
}

// ---------- crafting / cooking ----------

function openCraft(mode)
{
    var isCook = mode === 'cook';
    var list = isCook ? COOKING : CRAFTING;
    var known = isCook ? S.recipes : S.crafts;
    var m = modalShell(isCook ? '🍳 요리' : '🔨 제작');
    var i;
    var any = false;
    for (i = 0; i < list.length; i++)
    {
        (function (rec)
        {
            var it = ITEMS[rec.id];
            if (!it)
            {
                return;
            }
            var unlocked = true;
            if (!isCook && rec.lvl)
            {
                var k;
                for (k in rec.lvl)
                {
                    if (rec.lvl.hasOwnProperty(k) && S.skills[k] < rec.lvl[k])
                    {
                        unlocked = false;
                    }
                }
            }
            if (isCook && known.indexOf(rec.id) < 0)
            {
                unlocked = false;
            }
            if (!unlocked)
            {
                return;
            }
            any = true;
            var row = el('div', 'listRow');
            var ic = el('div', 'ic');
            ic.appendChild(cvOf(itemIcon(rec.id, 30), 30));
            row.appendChild(ic);
            var tx = el('div', 'tx');
            tx.innerHTML = '<b>' + it.name + '</b>';
            var parts = [], can = true, kk;
            for (kk in rec.need)
            {
                if (!rec.need.hasOwnProperty(kk))
                {
                    continue;
                }
                var realId = resolveNeed(kk, rec);
                var have = invCount(realId);
                var want = rec.need[kk];
                parts.push((ITEMS[realId] ? ITEMS[realId].name : kk) + ' ' + have + '/' + want);
                if (have < want)
                {
                    can = false;
                }
            }
            tx.appendChild(el('small', '', parts.join(', ')));
            row.appendChild(tx);
            var b = el('button', 'btn small green', isCook ? '요리' : '제작');
            b.disabled = !can;
            b.onclick = function ()
            {
                var kk2;
                for (kk2 in rec.need)
                {
                    if (rec.need.hasOwnProperty(kk2))
                    {
                        removeItem(resolveNeed(kk2, rec), rec.need[kk2]);
                    }
                }
                give(rec.id, rec.out || 1);
                S.stats[isCook ? 'cooked' : 'crafted']++;
                checkGoal();
                sfx('harvest');
                toast(it.name + ' 완성!');
                closeModal();
                openCraft(mode);
                UI.lastHudKey = '';
            };
            row.appendChild(b);
            m.body.appendChild(row);
        })(list[i]);
    }
    if (!any)
    {
        m.body.appendChild(el('div', 'hint', isCook
            ? '아직 배운 요리법이 없어요. 마을 사람들과 친해지면 알려줍니다.'
            : '스킬 레벨을 올리면 새 제작법이 열려요.'));
    }
    openModal(m);
}

function resolveNeed(k, rec)
{
    if (ITEMS[k])
    {
        return k;
    }
    if (rec.sub && rec.sub[k])
    {
        return rec.sub[k];
    }
    if (k === 'fish_any')
    {
        var i;
        for (i = 0; i < S.inv.length; i++)
        {
            if (S.inv[i] && ITEMS[S.inv[i].id].kind === 'fish')
            {
                return S.inv[i].id;
            }
        }
        return 'sunfish';
    }
    var orIdx = k.indexOf('_or_');
    if (orIdx > 0)
    {
        return k.slice(0, orIdx);
    }
    return k;
}

{

// ---------- animal panel ----------

function openAnimalHouse(bid)
{
    var b = null, i;
    for (i = 0; i < S.farmBuildings.length; i++)
    {
        if (S.farmBuildings[i].id === bid)
        {
            b = S.farmBuildings[i];
        }
    }
    if (!b)
    {
        return;
    }
    var m = modalShell('🏠 ' + BUILDINGS[b.kind].name);
    var mine = [];
    for (i = 0; i < S.animals.length; i++)
    {
        if (S.animals[i].home === bid)
        {
            mine.push(S.animals[i]);
        }
    }
    if (mine.length === 0)
    {
        m.body.appendChild(el('div', 'hint', '아직 동물이 없어요. 마니 목장에서 데려오세요.'));
    }
    for (i = 0; i < mine.length; i++)
    {
        (function (a)
        {
            var def = ANIMALS[a.kind];
            var row = el('div', 'listRow');
            var ic = el('div', 'ic');
            ic.appendChild(cvOf(sprAnimal(def.sprite, 0, !a.mature), 30));
            row.appendChild(ic);
            var tx = el('div', 'tx');
            tx.innerHTML = '<b>' + def.name + (a.mature ? '' : ' (아기)') + '</b>';
            tx.appendChild(el('small', '', '애정도 ' + Math.floor(a.love / 200) + '/5' +
                (a.hungry ? '  ·  😖 배고픔' : '') + (a.product ? '  ·  ' + ITEMS[a.product.id].name + ' 있음' : '')));
            row.appendChild(tx);
            var wrap = el('div');
            wrap.style.cssText = 'display:flex;gap:4px;';
            var pb = el('button', 'btn small' + (a.pet ? ' gray' : ' green'), a.pet ? '✔' : '🤚');
            pb.disabled = a.pet;
            pb.onclick = function ()
            {
                a.pet = true;
                a.love = Math.min(1000, a.love + 30);
                closeModal();
                openAnimalHouse(bid);
                sfx('pickup');
            };
            wrap.appendChild(pb);
            var fb = el('button', 'btn small' + (a.fed ? ' gray' : ' blue'), a.fed ? '✔' : '🌾');
            fb.disabled = a.fed || invCount('hay') === 0;
            fb.onclick = function ()
            {
                removeItem('hay', 1);
                a.fed = true;
                closeModal();
                openAnimalHouse(bid);
            };
            wrap.appendChild(fb);
            if (a.product)
            {
                var cb2 = el('button', 'btn small', '📥');
                cb2.onclick = function ()
                {
                    give(a.product.id, 1, a.product.q);
                    addXp('farming', 5);
                    a.product = null;
                    closeModal();
                    openAnimalHouse(bid);
                    sfx('pickup');
                    UI.lastHudKey = '';
                };
                wrap.appendChild(cb2);
            }
            row.appendChild(wrap);
            m.body.appendChild(row);
        })(mine[i]);
    }
    m.body.appendChild(el('div', 'hint', '매일 쓰다듬고(🤚) 건초를 주면(🌾) 애정도가 오르고 좋은 산물이 나와요.'));
    openModal(m);
}

// ---------- museum ----------

function openMuseum()
{
    var m = modalShell('🏺 박물관');
    var donated = 0, k;
    for (k in S.museum)
    {
        if (S.museum.hasOwnProperty(k))
        {
            donated++;
        }
    }
    m.body.appendChild(el('div', 'hint', '광물과 유물을 기증하면 보상을 받습니다. 기증: ' + donated + '점'));
    var grid = el('div', 'grid');
    var i;
    for (i = 0; i < S.invSize; i++)
    {
        (function (idx)
        {
            var sl = S.inv[idx];
            if (!sl)
            {
                grid.appendChild(el('div', 'cell'));
                return;
            }
            var it = ITEMS[sl.id];
            var can = (it.kind === 'mineral' || it.kind === 'artifact') && !S.museum[sl.id];
            var c = el('div', 'cell' + (can ? '' : ' dim'));
            c.appendChild(cvOf(itemIcon(sl.id, 30), 30));
            if (can)
            {
                c.onclick = function ()
                {
                    S.museum[sl.id] = true;
                    removeItem(sl.id, 1, sl.q);
                    var n = 0, kk;
                    for (kk in S.museum)
                    {
                        if (S.museum.hasOwnProperty(kk))
                        {
                            n++;
                        }
                    }
                    var reward = null;
                    if (n === 5)
                    {
                        reward = { id: 'fert_quality', n: 10 };
                    }
                    else if (n === 10)
                    {
                        reward = { id: 'sprinkler_q', n: 1 };
                    }
                    else if (n === 20)
                    {
                        reward = { id: 'diamond', n: 1 };
                    }
                    else if (n === 30)
                    {
                        reward = { id: 'prismatic_shard', n: 1 };
                    }
                    if (reward)
                    {
                        give(reward.id, reward.n);
                        toast('기증 보상: ' + ITEMS[reward.id].name);
                    }
                    sfx('bundle');
                    addFriend('gunther', 40);
                    checkGoal();
                    closeModal();
                    openMuseum();
                    UI.lastHudKey = '';
                };
            }
            grid.appendChild(c);
        })(i);
    }
    m.body.appendChild(grid);
    openModal(m);
}

// ---------- goal chip ----------

// The festival objective sits under the goal chip so there is always an answer
// to "what am I supposed to be doing at this thing".
function updateFestChip()
{
    var chip = $('festChip');
    if (!chip)
    {
        return;
    }
    var ob = (typeof festObjective === 'function') ? festObjective() : null;
    if (!ob)
    {
        chip.style.display = 'none';
        return;
    }
    chip.style.display = 'block';
    chip.innerHTML = '';
    var t = el('div', '', '🎪 ' + ob.t);
    t.style.cssText = 'font-size:12px;';
    chip.appendChild(t);
    if (ob.need > 1)
    {
        var s2 = el('div', '', ob.have + ' / ' + ob.need);
        s2.style.cssText = 'font-size:10px;color:#7a5730;';
        chip.appendChild(s2);
        var bar = el('div');
        bar.style.cssText = 'height:5px;background:#c8a878;border-radius:3px;overflow:hidden;margin-top:2px;border:1px solid #7a4a22;';
        var fill = el('div');
        var pct = Math.min(100, Math.round(ob.have / ob.need * 100));
        fill.style.cssText = 'height:100%;width:' + pct + '%;background:' + (pct >= 100 ? '#e8c838' : '#6aa84f') + ';';
        bar.appendChild(fill);
        chip.appendChild(bar);
    }
    if (ob.hint)
    {
        var h = el('div', '', ob.hint);
        h.style.cssText = 'font-size:10px;color:#7a5730;margin-top:2px;';
        chip.appendChild(h);
    }
}

function updateGoalChip()
{
    var chip = $('questChip');
    if (!chip)
    {
        return;
    }
    var p = goalProgress();
    if (!p)
    {
        chip.style.display = 'none';
        return;
    }
    chip.style.display = 'block';
    var pct = Math.min(100, Math.round(p.have / p.need * 100));
    chip.innerHTML = '';
    var t = el('div', '', '🎯 ' + p.goal.t);
    t.style.cssText = 'font-size:12px;';
    chip.appendChild(t);
    var s = el('div', '', p.have.toLocaleString() + ' / ' + p.need.toLocaleString());
    s.style.cssText = 'font-size:10px;color:#7a5730;';
    chip.appendChild(s);
    var bar = el('div');
    bar.style.cssText = 'height:5px;background:#c8a878;border-radius:3px;overflow:hidden;margin-top:2px;border:1px solid #7a4a22;';
    var fill = el('div');
    fill.style.cssText = 'height:100%;width:' + pct + '%;background:' + (pct >= 100 ? '#e8c838' : '#6aa84f') + ';';
    bar.appendChild(fill);
    chip.appendChild(bar);
    chip.onclick = function ()
    {
        openJournal();
    };
    chip.style.cursor = 'pointer';
}

// An annual event only feels annual if you can look back at last year.
function buildFestPage(page)
{
    page.appendChild(el('div', 'hint',
        '축제에서 한 일이 해마다 기록돼요. 올해 남은 축제도 함께 보여줘요.'));

    var log = S.festLog || [];
    if (!log.length)
    {
        page.appendChild(el('div', 'hint', '\n아직 참가한 축제가 없어요.'));
    }

    // newest year first
    var years = [], i;
    for (i = 0; i < log.length; i++)
    {
        if (years.indexOf(log[i].y) < 0)
        {
            years.push(log[i].y);
        }
    }
    years.sort(function (a, b) { return b - a; });

    for (i = 0; i < years.length; i++)
    {
        (function (yr)
        {
            page.appendChild(el('div', 'sectionTitle', yr + '년차'));
            var rows = festLogFor(yr), j;
            for (j = 0; j < rows.length; j++)
            {
                var row = el('div', 'listRow');
                var tx = el('div', 'tx');
                tx.innerHTML = '<b>🎪 ' + rows[j].n + '</b>';
                tx.appendChild(el('small', '', rows[j].t));
                row.appendChild(tx);
                page.appendChild(row);
            }
        })(years[i]);
    }

    // what is still to come this year
    var left = [];
    for (i = 0; i < FESTIVALS.length; i++)
    {
        var f = FESTIVALS[i];
        var fi = ['spring', 'summer', 'fall', 'winter'].indexOf(f.season);
        var done = false, k;
        for (k = 0; k < log.length; k++)
        {
            if (log[k].y === S.year && log[k].k === f.kind)
            {
                done = true;
            }
        }
        if (done)
        {
            continue;
        }
        if (fi > S.season || (fi === S.season && f.day >= S.day))
        {
            left.push(f);
        }
    }
    if (left.length)
    {
        page.appendChild(el('div', 'sectionTitle', '올해 남은 축제'));
        for (i = 0; i < left.length; i++)
        {
            var r2 = el('div', 'listRow');
            var t2 = el('div', 'tx');
            t2.innerHTML = '<b>' + left[i].name + '</b>';
            t2.appendChild(el('small', '',
                SEASON_KR[left[i].season] + ' ' + left[i].day + '일 · ' +
                ({ town: '마을 광장', beach: '해변', forest: '숲' }[left[i].map])));
            r2.appendChild(t2);
            page.appendChild(r2);
        }
    }
}

// Starry Farm - canvas setup, render loop, input, player actions.
// All comments ASCII only.

var CV = null, G = null;
var VIEW = { w: 320, h: 200, scale: 3, cssW: 0, cssH: 0 };
var INPUT = { dx: 0, dy: 0, stickId: -1, sx: 0, sy: 0, tapTarget: null, toolHeld: false };
var PLAYER = { frame: 0, ft: 0, moving: false, act: 0, actKind: '' };
var FX = [];
var LAST = 0, ACC = 0;
var WATER_FRAME = 0, WATER_T = 0;

// ---------- boot ----------


// A single concatenated script means one top-level throw silently kills every
// later top-level statement while leaving all function declarations hoisted.
// The result looks like a working title screen with a hollow game behind it,
// which is very hard to diagnose. Fail loudly instead.
function assertLoaded()
{
    var need = [
        ['ITEMS', typeof ITEMS !== 'undefined' && ITEMS && ITEMS.hoe],
        ['MAPS', typeof MAPS !== 'undefined' && MAPS && MAPS.farm],
        ['INTERIORS', typeof INTERIORS !== 'undefined' && INTERIORS && INTERIORS.farmhouse],
        ['CROPS', typeof CROPS !== 'undefined' && CROPS && CROPS.parsnip_seeds],
        ['FISH', typeof FISH !== 'undefined' && FISH && FISH.length > 0],
        ['NPCS', typeof NPCS !== 'undefined' && NPCS && NPCS.length > 0],
        ['MONSTERS', typeof MONSTERS !== 'undefined' && MONSTERS && MONSTERS.mummy],
        ['BUNDLES', typeof BUNDLES !== 'undefined' && BUNDLES && BUNDLES.length > 0],
        ['QUEST_CHAIN', typeof QUEST_CHAIN !== 'undefined' && QUEST_CHAIN && QUEST_CHAIN.length > 0],
        ['TROPHIES', typeof TROPHIES !== 'undefined' && TROPHIES && TROPHIES.length > 0],
        ['ARTIFACTS', typeof ARTIFACTS !== 'undefined' && ARTIFACTS && ARTIFACTS.length > 0],
        ['desert map', typeof MAPS !== 'undefined' && MAPS && MAPS.desert],
        ['FEST_DECOR', typeof FEST_DECOR !== 'undefined' && FEST_DECOR && FEST_DECOR.egg_hunt],
        // this one caught a silent failure: EDGE_PRI is declared in sprites.js but
        // keyed by constants from world.js, so building it too early produced a
        // table with a single "undefined" key and the ground fringe never ran.
        ['EDGE_PRI', typeof EDGE_PRI !== 'undefined' && EDGE_PRI &&
            EDGE_PRI[T_GRASS] !== undefined && EDGE_PRI[T_SAND] !== undefined &&
            EDGE_PRI.undefined === undefined],
        // gender sat on all 29 villagers for nine versions without ever being
        // read. Assert the wiring, not the field.
        ['NPC form', typeof NPC_BY_ID !== 'undefined' && NPC_BY_ID &&
            NPC_BY_ID.abigail && NPC_BY_ID.abigail.look.form === 'b' &&
            NPC_BY_ID.alex && NPC_BY_ID.alex.look.form === 'a'],
        ['OUTFITS', typeof OUTFITS !== 'undefined' && OUTFITS && OUTFITS.length === 3],
        ['mirror', typeof buildLookEditor === 'function' && typeof openMirror === 'function'],
        // eight hats, each with a spec to draw it and an item to obtain it
        ['hats', typeof HAT_STYLES !== 'undefined' && HAT_STYLES && HAT_STYLES.length === 8 &&
            (function ()
            {
                var i;
                for (i = 0; i < HAT_STYLES.length; i++)
                {
                    if (!HAT_SPEC[HAT_STYLES[i]])
                    {
                        return false;
                    }
                }
                return typeof ITEMS !== 'undefined' && ITEMS.hat_straw && ITEMS.hat_santa &&
                    ITEMS.hat_straw.kind === 'hat';
            })()],
        // A villager hat with a typo'd style silently falls back to straw, so
        // every style the town actually wears has to resolve to a spec.
        ['NPC hats', (function ()
        {
            if (typeof NPCS === 'undefined' || !NPCS)
            {
                return false;
            }
            var i, worn = 0;
            for (i = 0; i < NPCS.length; i++)
            {
                var h = NPCS[i].look.hat;
                if (!h)
                {
                    continue;
                }
                if (!h.style || !h.col || !HAT_SPEC[h.style])
                {
                    return false;
                }
                worn++;
            }
            return worn === 11;
        })()],
        // o.eye was read by the sprite code but set by nobody, so all 29 shared
        // one eye colour. Assert variety, not the field.
        ['NPC faces', (function ()
        {
            if (typeof NPCS === 'undefined' || !NPCS || !NPCS.length)
            {
                return false;
            }
            var seen = {}, i;
            for (i = 0; i < NPCS.length; i++)
            {
                if (!NPCS[i].look.eye || !NPCS[i].look.face)
                {
                    return false;
                }
                seen[NPCS[i].look.eye] = 1;
            }
            return Object.keys(seen).length >= 4;
        })()]
    ];
    var missing = [], i;
    for (i = 0; i < need.length; i++)
    {
        if (!need[i][1])
        {
            missing.push(need[i][0]);
        }
    }
    if (missing.length === 0)
    {
        return true;
    }
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#2a1410;color:#ffd8c0;' +
        'font:14px monospace;padding:24px;white-space:pre-wrap;overflow:auto;';
    d.textContent = '데이터 초기화 실패\n\n' +
        '초기화되지 않은 전역: ' + missing.join(', ') + '\n\n' +
        '원인: 스크립트 앞부분에서 예외가 발생해 이후 최상위 코드가 실행되지 않았습니다.\n' +
        '(build.ps1 의 파일 순서를 확인하세요 - 뒤 파일이 정의하는 것을 앞 파일이 건드리면 이렇게 됩니다.)';
    document.body.appendChild(d);
    return false;
}

function boot()
{
    if (!assertLoaded())
    {
        return;
    }
    CV = document.getElementById('cv');
    G = CV.getContext('2d');

    try

// The new-game screen and the mirror show the same thirteen rows. Kept as one
// function on purpose: split in two, the next option added would land in only
// one of them.
function buildLookEditor(host, look, pk)
{
    var marks = [];
    var prev = makeCv(48, 81);
    prev.style.cssText = 'width:48px;height:81px;image-rendering:pixelated;display:block;margin:0 auto 8px;';
    host.appendChild(prev);

    function redraw()
    {
        var g = prev.getContext('2d');
        g.imageSmoothingEnabled = false;
        g.clearRect(0, 0, 48, 81);
        // The bake key does not carry colours, and this preview changes in
        // place, so drop every frame cached for it. The old code sidestepped
        // the cache with a random key instead, which baked a new sprite on
        // every tap and never freed one.
        var k;
        for (k in SPR_CACHE)
        {
            if (SPR_CACHE.hasOwnProperty(k) && k.indexOf('p:' + pk + ':') === 0)
            {
                delete SPR_CACHE[k];
            }
        }
        g.drawImage(personSprite(pk, look, 0, 0), 0, 0, PW, PH, 0, 0, 48, 81);
    }
    redraw();

    function picker(label, key, vals)
    {
        var row = el('div');
        row.style.cssText = 'display:flex;align-items:center;gap:5px;margin:4px 0;flex-wrap:wrap;';
        var cap0 = el('span', 'hint', label);
        row.appendChild(cap0);
        // An entry is either a bare value or a [value, caption] pair
        var btns = [];
        function mark()
        {
            var j;
            for (j = 0; j < btns.length; j++)
            {
                var on = look[key] === btns[j].v;
                btns[j].b.style.borderColor = on ? '#f4d878' : '#4a2c14';
                btns[j].b.style.boxShadow = on ? '0 0 0 2px #7a4a12' : 'none';
            }
        }
        var i;
        for (i = 0; i < vals.length; i++)
        {
            (function (raw)
            {
                var v = (typeof raw === 'string') ? raw : raw[0];
                var cap = (typeof raw === 'string') ? '' : raw[1];
                // values are not always strings - freckles is a boolean
                var isCol = (typeof v === 'string') && v.charAt(0) === '#';
                var b = el('button');
                b.style.cssText = 'height:26px;min-width:26px;border-radius:6px;padding:0 6px;' +
                    'border:2px solid #4a2c14;cursor:pointer;font-family:inherit;font-size:11px;' +
                    'background:' + (isCol ? v : '#e8dcc0');
                if (!isCol)
                {
                    b.textContent = cap || String(v).charAt(0).toUpperCase();
                }
                b.onclick = function ()
                {
                    look[key] = v;
                    mark();
                    syncBottom();
                    redraw();
                };
                btns.push({ b: b, v: v });
                row.appendChild(b);
            })(vals[i]);
        }
        mark();
        marks.push({ key: key, vals: vals, mark: mark, row: row, cap: cap0 });
        host.appendChild(row);
    }

    // The bottom colour paints trousers or a skirt, but a dress is drawn in the
    // top colour from collar to hem - so on 원피스 this row genuinely does
    // nothing. Say so instead of letting a tap silently have no effect.
    function syncBottom()
    {
        var i;
        for (i = 0; i < marks.length; i++)
        {
            if (marks[i].key !== 'pants')
            {
                continue;
            }
            var dress = look.outfit === 'dress';
            marks[i].cap.textContent = dress ? '하의 (원피스는 위 색을 써요)'
                : (look.outfit === 'skirt' ? '치마 색' : '바지 색');
            marks[i].row.style.opacity = dress ? '.45' : '1';
        }
    }

    // Thirteen rows of pickers is a lot to work through one at a time. One tap
    // that rolls the lot is more fun than any single row, and it is the way out
    // for anyone who does not want to choose.
    var dice = el('button', 'btn small', '🎲 무작위');
    dice.style.cssText += 'display:block;margin:0 auto 8px;';
    dice.onclick = function ()
    {
        var i;
        for (i = 0; i < marks.length; i++)
        {
            var vals = marks[i].vals;
            var raw = vals[Math.floor(Math.random() * vals.length)];
            look[marks[i].key] = (typeof raw === 'string') ? raw : raw[0];
        }
        for (i = 0; i < marks.length; i++)
        {
            marks[i].mark();
        }
        syncBottom();
        redraw();
    };
    host.appendChild(dice);

    picker('성별', 'form', [['a', '남자'], ['b', '여자']]);
    picker('피부', 'skin', ['#f6dcc0', '#f0c8a0', '#d8a878', '#a87850', '#7a4a2a']);
    picker('머리색', 'hair', ['#3a2a1a', '#8a5a2a', '#d8a838', '#c84838', '#8a5ad0', '#48b8d0', '#e8e8e8']);
    picker('머리모양', 'hairStyle', [['bowl', '단발'], ['short', '짧게'], ['spiky', '삐죽'],
        ['bun', '올림'], ['curly', '곱슬'], ['pony', '포니'], ['wave', '웨이브'], ['long', '긴머리']]);

    host.appendChild(el('div', 'sectionTitle', '얼굴'));
    picker('얼굴형', 'face', [['round', '동글'], ['oval', '갸름'], ['soft', '통통']]);
    picker('눈 모양', 'eyes', [['round', '큰눈'], ['narrow', '실눈'], ['wide', '왕눈']]);
    picker('눈동자', 'eye', EYE_COLORS);
    picker('입', 'mouth', [['smile', '보통'], ['grin', '활짝'], ['small', '작게']]);
    picker('주근깨', 'freckles', [[false, '없음'], [true, '있음']]);

    host.appendChild(el('div', 'sectionTitle', '옷'));
    picker('옷차림', 'outfit', [['pants', '바지'], ['skirt', '치마'], ['dress', '원피스']]);
    picker('윗옷 색', 'shirt', ['#4a7ac8', '#c85a48', '#5a9a4a', '#d8a838', '#a858c8', '#e0e0e8', '#3a3a4a']);
    picker('바지 색', 'pants', ['#3a4a6a', '#5a3a24', '#3a3a42', '#3a6a4a', '#c85a8a', '#6a4a8a', '#c8b090']);
    // Shoes show under every outfit - bare calves below a skirt or dress still
    // end in them - so this row never needs the dimming the bottom row does.
    picker('신발 색', 'shoe', ['#4a2a12', '#2a2a30', '#8a6a3a', '#a03a3a', '#e0e0e8', '#3a5a80']);
    syncBottom();
    return redraw;
}

{
    var m = modalShell('새 농장', false);
    m.body.appendChild(el('div', 'hint', '이름과 농장 이름을 정해주세요.'));
    var n1 = el('input', 'fld');

// ---------- sizing ----------

function resize()
{
    var w = window.innerWidth;
    var h = window.innerHeight;
    // target roughly 16 tiles across on an iPad; integer scale keeps pixels crisp.
    // 32px art at scale 2 costs the same fill rate as 16px art at scale 3 did.
    var scale = Math.floor(Math.min(w / 460, h / 300));
    scale = Math.max(2, Math.min(5, scale));
    VIEW.scale = scale;
    VIEW.cssW = w;
    VIEW.cssH = h;
    VIEW.w = Math.ceil(w / scale);
    VIEW.h = Math.ceil(h / scale);
    CV.width = VIEW.w * scale;
    CV.height = VIEW.h * scale;
    CV.style.width = w + 'px';
    CV.style.height = h + 'px';
    G = CV.getContext('2d');
    G.imageSmoothingEnabled = false;
    CAM.vw = VIEW.w;
    CAM.vh = VIEW.h;
}

// ---------- input ----------

function bindInput()
{
    var zone = document.getElementById('stickZone');
    var knob = document.getElementById('stickKnob');
    var base = document.getElementById('stickBase');

    function stickStart(e)
    {
        e.preventDefault();
        var t = e.changedTouches ? e.changedTouches[0] : e;
        INPUT.stickId = e.changedTouches ? t.identifier : 'mouse';
        var r = base.getBoundingClientRect();
        INPUT.sx = r.left + r.width / 2;
        INPUT.sy = r.top + r.height / 2;
        zone.classList.add('act');
        stickMove(e);
    }

    function stickMove(e)
    {
        if (INPUT.stickId === -1)
        {
            return;
        }
        e.preventDefault();
        var t = null;
        if (e.changedTouches)
        {
            var i;
            for (i = 0; i < e.changedTouches.length; i++)
            {
                if (e.changedTouches[i].identifier === INPUT.stickId)
                {
                    t = e.changedTouches[i];
                }
            }
            if (!t)
            {
                return;
            }
        }
        else
        {
            t = e;
        }
        var dx = t.clientX - INPUT.sx;
        var dy = t.clientY - INPUT.sy;
        var d = Math.sqrt(dx * dx + dy * dy);
        var max = 44;
        if (d > max)
        {
            dx = dx / d * max;
            dy = dy / d * max;
            d = max;
        }
        knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        var dead = 8;
        if (d < dead)
        {
            INPUT.dx = 0;
            INPUT.dy = 0;
        }
        else
        {
            INPUT.dx = dx / max;
            INPUT.dy = dy / max;
            INPUT.tapTarget = null;
        }
    }

    function stickEnd(e)
    {
        if (INPUT.stickId === -1)
        {
            return;
        }
        INPUT.stickId = -1;
        INPUT.dx = 0;
        INPUT.dy = 0;
        knob.style.transform = 'translate(0,0)';
        zone.classList.remove('act');
    }

    zone.addEventListener('touchstart', stickStart, { passive: false });
    zone.addEventListener('touchmove', stickMove, { passive: false });
    zone.addEventListener('touchend', stickEnd);
    zone.addEventListener('touchcancel', stickEnd);
    zone.addEventListener('mousedown', stickStart);
    window.addEventListener('mousemove', function (e)
    {
        if (INPUT.stickId === 'mouse')
        {
            stickMove(e);
        }
    });
    window.addEventListener('mouseup', function (e)
    {
        if (INPUT.stickId === 'mouse')
        {
            stickEnd(e);
        }
    });

    // action buttons
    var bt = document.getElementById('btnTool');
    var bu = document.getElementById('btnUse');

    function toolDown(e)
    {
        e.preventDefault();
        INPUT.toolHeld = true;
        if (FISHING.on)
        {
            fishingHold(true);
            return;
        }
        doToolAction();
    }
    function toolUp(e)
    {
        INPUT.toolHeld = false;
        if (FISHING.on)
        {
            fishingHold(false);
        }
    }
    bt.addEventListener('touchstart', toolDown, { passive: false });
    bt.addEventListener('touchend', toolUp);
    bt.addEventListener('touchcancel', toolUp);
    bt.addEventListener('mousedown', toolDown);
    bt.addEventListener('mouseup', toolUp);
    bt.addEventListener('mouseleave', toolUp);

    function useDown(e)
    {
        e.preventDefault();
        doUseAction();
    }
    bu.addEventListener('touchstart', useDown, { passive: false });
    bu.addEventListener('mousedown', useDown);

    // tap to move on the canvas
    var wrap = document.getElementById('cvWrap');
    function tap(e)
    {
        if (!S || UI.modal || UI.dialogue)
        {
            return;
        }
        var t = e.changedTouches ? e.changedTouches[0] : e;
        var x = (t.clientX / VIEW.scale) + CAM.x;
        var y = (t.clientY / VIEW.scale) + CAM.y;
        INPUT.tapTarget = { x: x, y: y };
    }
    wrap.addEventListener('touchstart', tap, { passive: true });
    wrap.addEventListener('mousedown', tap);

    // keyboard (desktop testing / play)
    var keys = {};
    window.addEventListener('keydown', function (e)
    {
        keys[e.key.toLowerCase()] = true;
        if (!S || UI.modal)
        {
            return;
        }
        if (e.key === ' ' || e.key === 'Enter')
        {
            e.preventDefault();
            doUseAction();
        }
        if (e.key.toLowerCase() === 'c' || e.key === 'Shift')
        {
            if (FISHING.on)
            {
                fishingHold(true);
            }
            else
            {
                doToolAction();
            }
        }
        if (e.key === 'e' || e.key === 'i')
        {
            openInventory();
        }
        if (e.key >= '1' && e.key <= '9')
        {
            S.sel = parseInt(e.key, 10) - 1;
            UI.lastHudKey = '';
        }
        if (e.key === '0')
        {
            S.sel = 9;
            UI.lastHudKey = '';
        }
    });
    window.addEventListener('keyup', function (e)
    {
        keys[e.key.toLowerCase()] = false;
        if (e.key.toLowerCase() === 'c' || e.key === 'Shift')
        {
            if (FISHING.on)
            {
                fishingHold(false);
            }
        }
    });
    INPUT.keys = keys;
}

function keyVector()
{
    var k = INPUT.keys || {};
    var dx = 0, dy = 0;
    if (k.arrowleft || k.a)
    {
        dx -= 1;
    }
    if (k.arrowright || k.d)
    {
        dx += 1;
    }
    if (k.arrowup || k.w)
    {
        dy -= 1;
    }
    if (k.arrowdown || k.s)
    {
        dy += 1;
    }
    return { dx: dx, dy: dy };
}

// ---------- player movement ----------

function movePlayer(dt)
{
    var dx = INPUT.dx, dy = INPUT.dy;
    var kv = keyVector();
    if (kv.dx || kv.dy)
    {
        dx = kv.dx;
        dy = kv.dy;
        INPUT.tapTarget = null;
    }
    if (dx === 0 && dy === 0 && INPUT.tapTarget)
    {
        var tdx = INPUT.tapTarget.x - S.px;
        var tdy = INPUT.tapTarget.y - S.py;
        var td = Math.sqrt(tdx * tdx + tdy * tdy);
        if (td < 6)
        {
            INPUT.tapTarget = null;
        }
        else
        {
            dx = tdx / td;
            dy = tdy / td;
        }
    }

    var mag = Math.sqrt(dx * dx + dy * dy);
    if (mag > 1)
    {
        dx /= mag;
        dy /= mag;
        mag = 1;
    }
    PLAYER.moving = mag > .05;

    if (PLAYER.moving)
    {
        var speed = 108 * (1 + buffOf('speed') * .12) * (S.riding ? 1.8 : 1);
        if (isRaining() && MAP.outdoor)
        {
            speed *= .96;
        }
        var nx = S.px + dx * speed * dt;
        var ny = S.py + dy * speed * dt;
        if (canStand(nx, S.py))
        {
            S.px = nx;
        }
        if (canStand(S.px, ny))
        {
            S.py = ny;
        }
        if (Math.abs(dx) > Math.abs(dy))
        {
            S.dir = dx < 0 ? 2 : 3;
        }
        else
        {
            S.dir = dy < 0 ? 1 : 0;
        }
        PLAYER.ft += dt;
        if (PLAYER.ft > .13)
        {
            PLAYER.ft = 0;
            PLAYER.frame = (PLAYER.frame + 1) % 4;
        }
    }
    else
    {
        PLAYER.frame = 0;
    }

    checkWarp();
}

// feet collision box is a small rect at the bottom of the sprite
function canStand(px, py)
{
    var half = 8;
    var pts = [[px - half, py], [px + half, py], [px - half, py - 10], [px + half, py - 10]];
    var i;
    for (i = 0; i < pts.length; i++)
    {
        var tx = Math.floor(pts[i][0] / TILE);
        var ty = Math.floor(pts[i][1] / TILE);
        if (festWallAt(tx, ty))
        {
            return false;
        }
        // the forest lake is frozen for the ice festival, so water is ground;
        // and the venue is cleared of trees and brush for the day
        if (isSolid(MAP, tx, ty) && !festIceAt(tx, ty) && !festClearAt(tx, ty))
        {
            return false;
        }
    }
    return true;
}

// Safety net: if the player ends up inside something solid (bad spawn point,
// a building placed on top of them, a map edit) they can get wedged with no way
// out, because movePlayer only ever accepts a *fully* clear destination.
// Spiral out to the nearest standable tile and drop them there.
function ensureStandable()
{
    if (!S || !MAP)
    {
        return false;
    }
    if (canStand(S.px, S.py))
    {
        return false;
    }
    var cx = Math.floor(S.px / TILE), cy = Math.floor(S.py / TILE);
    var r, dx, dy;
    for (r = 0; r <= 12; r++)
    {
        for (dy = -r; dy <= r; dy++)
        {
            for (dx = -r; dx <= r; dx++)
            {
                if (Math.max(Math.abs(dx), Math.abs(dy)) !== r)
                {
                    continue;
                }
                var tx = cx + dx, ty = cy + dy;
                if (tx < 0 || ty < 0 || tx >= MAP.w || ty >= MAP.h)
                {
                    continue;
                }
                var px = tx * TILE + HALF, py = ty * TILE + HALF;
                if (canStand(px, py))
                {
                    S.px = px;
                    S.py = py;
                    return true;
                }
            }
        }
    }
    return false;
}

function facingTile()
{
    var tx = Math.floor(S.px / TILE);
    var ty = Math.floor(S.py / TILE);
    if (S.dir === 0)
    {
        ty += 1;
    }
    else if (S.dir === 1)
    {
        ty -= 1;
    }
    else if (S.dir === 2)
    {
        tx -= 1;
    }
    else
    {
        tx += 1;
    }
    return { x: tx, y: ty };
}

function checkWarp()
{
    var tx = Math.floor(S.px / TILE);
    var ty = Math.floor(S.py / TILE);
    var w = warpAt(MAP, tx, ty);
    if (!w || UI.warping)
    {
        return;
    }
    if (w.locked && !S.flags[w.locked])
    {
        toast('아직 들어갈 수 없어요.');
        return;
    }
    UI.warping = true;
    var target = w;
    fadeOut(function ()
    {
        if (target.mine)
        {
            enterMine(1);
        }
        else
        {
            MAP = loadMap(target.to);
            S.map = target.to;
            if (target.interior)
            {
                var d = INTERIORS[target.to];
                S.px = (d ? d.exit.x : 4) * TILE + HALF;
                S.py = (d ? d.exit.y - 1 : 4) * TILE + HALF;
                S.dir = 1;
            }
            else
            {
                S.px = target.tx * TILE + HALF;
                S.py = target.ty * TILE + HALF;
            }
        }
        ensureStandable();
        rebuildActors();
        UI.lastHudKey = '';
        setTimeout(function ()
        {
            UI.warping = false;
        }, 250);
    });
}

// ---------- actions ----------

function doToolAction()
{
    if (!S || UI.modal || UI.dialogue || UI.warping)
    {
        return;
    }
    var fest = festivalActive();
    if (fest && MAP.id === fest.map)
    {
        return;
    }
    var sl = selSlot();
    if (!sl)
    {
        return;
    }
    var f = facingTile();
    PLAYER.act = 18;
    PLAYER.actKind = sl.id;

    switch (sl.id)
    {
        case 'hoe':
            actHoe(f);
            break;
        case 'can':
            actWater(f);
            break;
        case 'axe':
            actAxe(f);
            break;
        case 'pick':
            actPick(f);
            break;
        case 'scythe':
            actScythe(f);
            break;
        case 'rod':
            if (isWater(MAP, f.x, f.y))
            {
                startFishing(f.x, f.y);
            }
            else
            {
                toast('물가에서 사용하세요.');
            }
            break;
        case 'sword':
            doSwing();
            break;
        default:
            if (CROPS[sl.id])
            {
                actPlant(f, sl.id);
            }
            else if (FRUIT_TREES[sl.id])
            {
                actPlantTree(f, sl.id);
            }
            else if (sl.id.indexOf('sapling_') === 0)
            {
                actPlantWildTree(f, sl.id);
            }
            else if (sl.id === 'crab_pot')
            {
                actPlacePot(f);
            }
            else if (sl.id === 'fert_basic' || sl.id === 'fert_quality' || sl.id === 'speed_gro')
            {
                actFertilize(f, sl.id);
            }
            else if (MACHINES[sl.id] || sl.id === 'chest' || sl.id === 'scarecrow' ||
                sl.id === 'sprinkler' || sl.id === 'sprinkler_q' || sl.id === 'torch')
            {
                actPlace(f, sl.id);
            }
            else if (sl.id === 'bomb')
            {
                actBomb(f);
            }
            else
            {
                doUseAction();
            }
            break;
    }
    UI.lastHudKey = '';
}

function actHoe(f)
{
    var did = false;
    var power = toolPower('hoe');
    var tiles = toolArea(f, power);
    var i;
    for (i = 0; i < tiles.length; i++)
    {
        var t = tiles[i];
        var spot = objAt(MAP, t.x, t.y);
        if (spot && spot.kind === 'artifactspot')
        {
            digArtifact(MAP.id, t.x, t.y);
            removeObj(MAP, spot);
            useEnergy(energyCostFor('hoe'));
            spawnFx(t.x * TILE + HALF, t.y * TILE + HALF, 'dirt');
            checkGoal();
            return;
        }
        if (till(t.x, t.y))
        {
            did = true;
            spawnFx(t.x * TILE + HALF, t.y * TILE + HALF, 'dirt');
            // freshly turned soil sometimes hides an artifact
            if (Math.random() < .035 && ARTIFACT_SPOTS[MAP.id])
            {
                digArtifact(MAP.id, t.x, t.y);
            }
        }
        else
        {
            // digging sand or bare dirt can turn up buried items
            var gt = tileAt(MAP, t.x, t.y);
            if ((gt === T_SAND || gt === T_DIRT) && Math.random() < .1)
            {
                if (Math.random() < .35 && ARTIFACT_SPOTS[MAP.id])
                {
                    digArtifact(MAP.id, t.x, t.y);
                }
                else
                {
                    spawnDrop(MAP, t.x, t.y, Math.random() < .5 ? 'clay' : 'winter_root', 0);
                }
                did = true;
            }
        }
    }
    if (did)
    {
        useEnergy(energyCostFor('hoe'));
        sfx('hoe');
        checkGoal();
    }
}

// bigger tools cover more tiles, like the real upgrades do
function toolArea(f, power)
{
    var out = [{ x: f.x, y: f.y }];
    if (power >= 3)
    {
        if (S.dir === 0 || S.dir === 1)
        {
            out.push({ x: f.x - 1, y: f.y });
            out.push({ x: f.x + 1, y: f.y });
        }
        else
        {
            out.push({ x: f.x, y: f.y - 1 });
            out.push({ x: f.x, y: f.y + 1 });
        }
    }
    if (power >= 5)
    {
        var extra = [];
        var i;
        for (i = 0; i < out.length; i++)
        {
            if (S.dir === 0)
            {
                extra.push({ x: out[i].x, y: out[i].y + 1 });
            }
            else if (S.dir === 1)
            {
                extra.push({ x: out[i].x, y: out[i].y - 1 });
            }
            else if (S.dir === 2)
            {
                extra.push({ x: out[i].x - 1, y: out[i].y });
            }
            else
            {
                extra.push({ x: out[i].x + 1, y: out[i].y });
            }
        }
        out = out.concat(extra);
    }
    return out;
}

function actWater(f)
{
    if (isWater(MAP, f.x, f.y))
    {
        S.water = S.waterCap;
        sfx('water');
        toast('물을 채웠어요.');
        return;
    }
    if (S.water <= 0)
    {
        toast('물이 없어요. 물가에서 채우세요.');
        return;
    }
    var power = toolPower('can');
    var tiles = toolArea(f, power);
    var did = false;
    var i;
    for (i = 0; i < tiles.length && S.water > 0; i++)
    {
        var t = tiles[i];
        var s = soilAt(MAP.id, t.x, t.y);
        if (s && !s.w)
        {
            s.w = 1;
            S.water--;
            did = true;
            spawnFx(t.x * TILE + HALF, t.y * TILE + 12, 'water');
        }
    }
    if (did)
    {
        useEnergy(energyCostFor('can'));
        sfx('water');
    }
}

function actAxe(f)
{
    var o = objAt(MAP, f.x, f.y);
    if (!o)
    {
        return;
    }
    if (o.kind === 'tree')
    {
        if (o.stage < 4)
        {
            removeObj(MAP, o);
            give('wood', 1);
            return;
        }
        o.hp -= toolPower('axe');
        useEnergy(energyCostFor('axe'));
        sfx('chop');
        spawnFx(f.x * TILE + HALF, f.y * TILE, 'leaf');
        if (o.hp <= 0)
        {
            S.stats.treesChopped++;
            checkGoal();
            var amount = 8 + Math.floor(Math.random() * 5);
            if (hasProf('forester'))
            {
                amount = Math.round(amount * 1.25);
            }
            var i;
            for (i = 0; i < amount; i++)
            {
                spawnDrop(MAP, f.x, f.y, 'wood', 0);
            }
            if (hasProf('lumberjack') || Math.random() < .1)
            {
                spawnDrop(MAP, f.x, f.y, 'hardwood', 0);
            }
            if (Math.random() < .5)
            {
                spawnDrop(MAP, f.x, f.y, 'sap', 0);
            }
            if (Math.random() < .3)
            {
                spawnDrop(MAP, f.x, f.y, o.tk === 'maple' ? 'sapling_maple' : (o.tk === 'pine' ? 'sapling_pine' : 'sapling_oak'), 0);
            }
            removeObj(MAP, o);
            addObj(MAP, { kind: 'stump', x: f.x, y: f.y, hp: 2 });
            addXp('foraging', 12);
        }
    }
    else if (o.kind === 'stump')
    {
        o.hp -= toolPower('axe');
        useEnergy(energyCostFor('axe'));
        sfx('chop');
        if (o.hp <= 0)
        {
            var n;
            for (n = 0; n < 3; n++)
            {
                spawnDrop(MAP, f.x, f.y, 'hardwood', 0);
            }
            removeObj(MAP, o);
            addXp('foraging', 6);
        }
    }
    else if (o.kind === 'branch')
    {
        give('wood', 2);
        removeObj(MAP, o);
        addXp('foraging', 3);
        sfx('chop');
    }
    else if (o.kind === 'bush' || o.kind === 'weed')
    {
        removeObj(MAP, o);
        give('fiber', 1);
        sfx('chop');
    }
    else if (o.kind === 'cactus')
    {
        o.hp = (o.hp === undefined ? 2 : o.hp) - toolPower('axe');
        useEnergy(energyCostFor('axe'));
        sfx('chop');
        if (o.hp <= 0)
        {
            spawnDrop(MAP, f.x, f.y, 'cactus_fruit', 0);
            spawnDrop(MAP, f.x, f.y, 'fiber', 0);
            removeObj(MAP, o);
            addXp('foraging', 6);
        }
    }
    else if (o.kind === 'fruittree')
    {
        o.hp = (o.hp === undefined ? 6 : o.hp) - toolPower('axe');
        useEnergy(energyCostFor('axe'));
        sfx('chop');
        if (o.hp <= 0)
        {
            var w;
            for (w = 0; w < 6; w++)
            {
                spawnDrop(MAP, f.x, f.y, 'hardwood', 0);
            }
            removeObj(MAP, o);
            addXp('foraging', 10);
        }
    }
}

function actPick(f)
{
    var o = objAt(MAP, f.x, f.y);
    if (o && o.kind === 'rock')
    {
        o.hp -= toolPower('pick');
        useEnergy(energyCostFor('pick'));
        sfx('mine');
        spawnFx(f.x * TILE + HALF, f.y * TILE + HALF, 'spark');
        if (o.hp <= 0)
        {
            S.stats.rocksBroken++;
            checkGoal();
            if (MAP.id === 'mine')
            {
                rockLoot(o);
            }
            else
            {
                spawnDrop(MAP, f.x, f.y, 'stone', 0);
                if (Math.random() < .12)
                {
                    spawnDrop(MAP, f.x, f.y, 'copper_ore', 0);
                }
                if (Math.random() < .05)
                {
                    spawnDrop(MAP, f.x, f.y, 'coal', 0);
                }
                addXp('mining', 3);
            }
            removeObj(MAP, o);
        }
        return;
    }
    if (o && o.kind === 'stump')
    {
        toast('도끼가 필요해요.');
        return;
    }
    // clear tilled soil
    var s = soilAt(MAP.id, f.x, f.y);
    if (s && !cropAt(MAP.id, f.x, f.y))
    {
        delete soilMap(MAP.id)[K(f.x, f.y)];
        useEnergy(energyCostFor('pick'));
        sfx('hoe');
        return;
    }
    if (o && (o.kind === 'machine' || o.kind === 'chest' || o.kind === 'sprinkler' || o.kind === 'scarecrow'))
    {
        give(o.mk || o.kind, 1);
        removeObj(MAP, o);
        toast('회수했어요.');
    }
}

function actScythe(f)
{
    var did = false;
    var dx, dy;
    for (dy = -1; dy <= 1; dy++)
    {
        for (dx = -1; dx <= 1; dx++)
        {
            var o = objAt(MAP, f.x + dx, f.y + dy);
            if (o && (o.kind === 'weed' || o.kind === 'grass'))
            {
                removeObj(MAP, o);
                if (Math.random() < .5)
                {
                    spawnDrop(MAP, f.x + dx, f.y + dy, 'fiber', 0);
                }
                if (o.kind === 'grass' && Math.random() < .35 && S.flags.hasSilo)
                {
                    spawnDrop(MAP, f.x + dx, f.y + dy, 'hay', 0);
                }
                did = true;
            }
            var c = cropAt(MAP.id, f.x + dx, f.y + dy);
            if (c && cropReady(c) && CROPS[c.seed].scythe)
            {
                harvestCrop(f.x + dx, f.y + dy);
                did = true;
            }
        }
    }
    if (did)
    {
        sfx('chop');
    }
}

function actPlant(f, seedId)
{
    var did = false;
    var i;
    var tiles = [{ x: f.x, y: f.y }];
    for (i = 0; i < tiles.length; i++)
    {
        var t = tiles[i];
        if (plantSeed(t.x, t.y, seedId))
        {
            consumeSel(1);
            did = true;
        }
        else if (!soilAt(MAP.id, t.x, t.y))
        {
            toast('먼저 괭이로 밭을 갈아주세요.');
            return;
        }
    }
    if (did)
    {
        sfx('plant');
        checkGoal();
    }
}

// fruit trees need a clear 3x3 around them, like the real game
function actPlantTree(f, sapId)
{

function actPlantWildTree(f, sapId)
{

function actPlacePot(f)
{

function actFertilize(f, fid)

function actPlace(f, id)
{

    {
        toast('여기엔 놓을 수 없어요.');
        return;
    }

    }

        o = { kind: 'sprinkler', mk: id, x: f.x, y: f.y };

    {

    {

    }

function actBomb(f)
{
    consumeSel(1);
    var cx = f.x, cy = f.y;
    var dx, dy;
    for (dy = -2; dy <= 2; dy++)
    {
        for (dx = -2; dx <= 2; dx++)
        {
            if (dx * dx + dy * dy > 6)
            {
                continue;
            }
            var o = objAt(MAP, cx + dx, cy + dy);
            if (o && o.kind === 'rock')
            {
                if (MAP.id === 'mine')
                {
                    rockLoot(o);
                }
                else
                {
                    spawnDrop(MAP, o.x, o.y, 'stone', 0);
                }
                removeObj(MAP, o);
            }
            spawnFx((cx + dx) * TILE + HALF, (cy + dy) * TILE + HALF, 'spark');
        }
    }
    var i;
    for (i = 0; i < MINE.mobs.length; i++)
    {
        var mob = MINE.mobs[i];
        var mdx = mob.x - (cx * TILE + HALF), mdy = mob.y - (cy * TILE + HALF);
        if (mdx * mdx + mdy * mdy < 88 * 88)
        {
            mob.hp -= 60;
            if (mob.hp <= 0)
            {
                killMob(mob);
            }
        }
    }
    sfx('hurt');
}

// interaction button
function doUseAction()
{
    if (!S || UI.warping)
    {
        return;
    }
    if (UI.dialogue)
    {
        document.getElementById('dialogueBox').style.display = 'none';
        UI.dialogue = null;
        return;
    }
    if (UI.modal)
    {
        return;
    }
    if (FISHING.on)
    {
        if (FISHING.phase === 'bite')
        {
            hookFish();
        }
        else if (FISHING.phase === 'wait' || FISHING.phase === 'cast')
        {
            endFishing();
        }
        return;
    }
    // festival activities happen on the map and take priority over tools
    if (festivalUse())
    {
        return;
    }
    var fest = festivalActive();
    if (fest && MAP.id === fest.map && !S.flags['fest_' + seasonId() + '_' + S.day + '_' + S.year])
    {
        // nothing to interact with here, so offer the festival menu
        var near = actorNear(S.px, S.py, 46);
        if (!near)
        {
            runFestival(fest);
            return;
        }
    }

    // nearby villager first
    var a = actorNear(S.px, S.py, 46);
    if (a)
    {
        var sl = selSlot();
        if (sl && !isTool(sl.id))
        {
            modalChoice(a.def.name, '무엇을 할까요?', [
                { t: '💬 말 걸기', cb: function ()
                {
                    closeModal();
                    talkTo(a);
                } },
                { t: '🎁 ' + ITEMS[sl.id].name + ' 선물', cls: 'blue', cb: function ()
                {
                    closeModal();
                    giveGift(a.id, S.sel);
                    UI.lastHudKey = '';
                } },
                { t: '취소', cls: 'gray', cb: closeModal }
            ]);
        }
        else
        {
            talkTo(a);
        }
        return;
    }

    var f = facingTile();
    var here = { x: Math.floor(S.px / TILE), y: Math.floor(S.py / TILE) };

    // pick up drops / forage under and around the player
    if (pickupNear())
    {
        return;
    }

    // crop harvest
    var c = cropAt(MAP.id, f.x, f.y) || cropAt(MAP.id, here.x, here.y);
    if (c && cropReady(c))
    {
        var cx = cropAt(MAP.id, f.x, f.y) ? f.x : here.x;
        var cy = cropAt(MAP.id, f.x, f.y) ? f.y : here.y;
        harvestCrop(cx, cy);
        UI.lastHudKey = '';
        return;
    }

    var o = objAt(MAP, f.x, f.y) || objAt(MAP, here.x, here.y);
    if (o)
    {
        if (interactObject(o))
        {
            return;
        }
    }

    // fishing from the shore
    if (isWater(MAP, f.x, f.y))
    {
        var sl2 = selSlot();
        if (sl2 && sl2.id === 'rod')
        {
            startFishing(f.x, f.y);
        }
        else if (S.rod >= 0)
        {
            toast('낚싯대를 손에 드세요.');
        }
        return;
    }

    // interior specials
    if (!MAP.outdoor && MAP.interior)
    {
        if (MAP.interior.shop && nearFurniture('counter', f))
        {
            openShop(MAP.interior.shop);
            return;
        }
        if (MAP.interior.bundleRoom)
        {
            openBundles();
            return;
        }
        if (MAP.interior.museum)
        {
            openMuseum();
            return;
        }
        if (MAP.interior.heal)
        {
            modalChoice('해비 병원', '치료를 받을까요? (100G)', [
                { t: '치료 받기', cb: function ()
                {
                    if (S.gold < 100)
                    {
                        toast('골드가 부족해요.');
                        return;
                    }
                    S.gold -= 100;
                    S.health = S.maxHealth;
                    S.energy = Math.min(S.maxEnergy, S.energy + 80);
                    closeModal();
                    toast('몸이 가벼워졌어요!');
                    UI.lastHudKey = '';
                } },
                { t: '아니요', cls: 'gray', cb: closeModal }
            ]);
            return;
        }
        if (MAP.interior.guild)
        {
            openShop('clint');
            return;
        }
    }
}

function nearFurniture(kind, f)
{
    var i;
    for (i = 0; i < MAP.objects.length; i++)
    {
        var o = MAP.objects[i];
        if (o.kind === 'furn' && o.fk === kind)
        {
            if (Math.abs(o.x - f.x) <= 5 && Math.abs(o.y - f.y) <= 3)
            {
                return true;
            }
        }
    }
    return false;
}

function pickupNear()
{
    var here = { x: Math.floor(S.px / TILE), y: Math.floor(S.py / TILE) };
    var f = facingTile();
    var spots = [here, f,
        { x: here.x + 1, y: here.y }, { x: here.x - 1, y: here.y },
        { x: here.x, y: here.y + 1 }, { x: here.x, y: here.y - 1 }];
    var i;
    for (i = 0; i < spots.length; i++)
    {
        var o = objAt(MAP, spots[i].x, spots[i].y);
        if (!o)
        {
            continue;
        }
        if (o.kind === 'drop')
        {
            give(o.item, 1, o.q);
            removeObj(MAP, o);
            sfx('pickup');
            UI.lastHudKey = '';
            return true;
        }
        if (o.kind === 'forage')
        {
            var q = hasProf('botanist') ? 3 : (Math.random() < skillLvl('foraging') * .05 ? 1 : 0);
            var n = hasProf('gatherer') && Math.random() < .2 ? 2 : 1;
            give(o.item, n, q);
            addXp('foraging', 7);
            S.stats.foraged += n;
            checkGoal();
            removeObj(MAP, o);
            sfx('pickup');
            UI.lastHudKey = '';
            return true;
        }
        if (o.kind === 'branch')
        {
            give('wood', 2);
            removeObj(MAP, o);
            sfx('pickup');
            UI.lastHudKey = '';
            return true;
        }
    }
    return false;
}

function interactObject(o)
{
    if (o.kind === 'bin')
    {
        openShipBin();
        return true;
    }
    if (o.kind === 'board')
    {
        openRequests();
        return true;
    }
    if (o.kind === 'pet')
    {
        if (S.petPet)
        {
            toast((S.pet ? S.pet.name : '반려동물') + '이 기분 좋아 보여요.');
        }
        else
        {
            S.petPet = true;
            if (S.pet)
            {
                S.pet.love = Math.min(1000, (S.pet.love || 0) + 15);
            }
            toast('🐾 ' + (S.pet ? S.pet.name : '반려동물') + '을 쓰다듬었어요!');
            sfx('pickup');
        }
        return true;
    }
    if (o.kind === 'horse')
    {
        S.riding = !S.riding;
        toast(S.riding ? '🐴 말에 탔어요! (이동 속도 +80%)' : '말에서 내렸어요.');
        sfx('menu');
        return true;
    }
    if (o.kind === 'skull_entrance')
    {
        modalChoice('💀 해골 동굴', '아주 위험한 곳입니다. 바닥이 보이지 않아요.\n' +
            '최고 기록: ' + (S.skullDeep || 0) + '층\n\n내려갈까요?', [
            { t: '내려간다', cls: 'red', cb: function ()
            {
                closeModal();
                fadeOut(function ()
                {
                    enterSkull(1);
                });
            } },
            { t: '그만두기', cls: 'gray', cb: closeModal }
        ]);
        return true;
    }
    if (o.kind === 'minecart')
    {
        if (!S.flags.minecart)
        {
            toast('광산차가 고장 나 있어요. (보일러실 번들 완성 필요)');
            return true;
        }
        openMinecart();
        return true;
    }
    if (o.kind === 'sign')
    {
        toast(o.text || '표지판');
        return true;
    }
    if (o.kind === 'machine')
    {
        openMachine(o);
        return true;
    }
    if (o.kind === 'fruittree')
    {
        if (!o.fruit)
        {
            var def = FRUIT_TREES[o.sap];
            toast(o.stage >= 4 ? (SEASON_KR[def.season] + '에 열매가 열려요.')
                : ('자라는 중... ' + Math.max(1, 28 - (o.age || 0)) + '일 남음'));
            return true;
        }
        var q = Math.random() < skillLvl('farming') * .04 ? 1 : 0;
        give(FRUIT_TREES[o.sap].fruit, o.fruit, q);
        addXp('foraging', o.fruit * 5);
        o.fruit = 0;
        sfx('harvest');
        UI.lastHudKey = '';
        return true;
    }
    if (o.kind === 'crabpot')
    {
        if (o.out)
        {
            give(o.out, 1);
            addXp('fishing', 5);
            toast(ITEMS[o.out].name + '을(를) 건졌어요!');
            o.out = null;
            sfx('pickup');
            UI.lastHudKey = '';
        }
        else if (!o.baited)
        {
            if (invCount('bait') < 1)
            {
                toast('미끼가 필요해요. (윌리 가게)');
                return true;
            }
            removeItem('bait', 1);
            o.baited = true;
            toast('미끼를 넣었어요. 내일 확인해 보세요.');
            UI.lastHudKey = '';
        }
        else
        {
            toast('미끼를 넣어뒀어요. 내일 확인해 보세요.');
        }
        return true;
    }
    if (o.kind === 'chest')
    {
        openChest(o);
        return true;
    }
    if (o.kind === 'animalbuilding')
    {
        openAnimalHouse(o.bid);
        return true;
    }
    if (o.kind === 'mine_down')
    {
        mineDescend();
        return true;
    }
    if (o.kind === 'mine_up')
    {
        mineAscend();
        return true;
    }
    if (o.kind === 'elevator')
    {
        openElevator();
        return true;
    }
    if (o.kind === 'minechest')
    {
        openMineChest(o);
        return true;
    }
    if (o.kind === 'mine_entrance')
    {
        fadeOut(function ()
        {
            enterMine(1);
        });
        return true;
    }
    if (o.kind === 'furn')
    {
        if (o.fk === 'bed')
        {
            askSleep();
            return true;
        }
        if (o.fk === 'kitchen')
        {
            openCraft('cook');
            return true;
        }
        if (o.fk === 'tv')
        {
            watchTv();
            return true;
        }
        if (o.fk === 'mirror')
        {
            openMirror();
            return true;
        }
        if (o.fk === 'calendar')
        {
            showCalendar();
            return true;
        }
        if (o.fk === 'chest')
        {
            openCraft('craft');
            return true;
        }
        if (o.fk === 'counter' && MAP.interior && MAP.interior.shop)
        {
            openShop(MAP.interior.shop);
            return true;
        }
        if (o.fk === 'forge')
        {
            openShop('clint');
            return true;
        }
    }
    return false;
}

function luckText()
{
    if (S.luck > .5)
    {
        return '별들이 활짝 웃고 있어요! 아주 운이 좋은 날입니다.';
    }
    if (S.luck > .1)
    {
        return '기분 좋은 하루가 될 것 같아요.';
    }
    if (S.luck > -.3)
    {
        return '평범한 하루예요.';
    }
    return '별들이 흐릿해요. 광산은 조심하세요.';
}
