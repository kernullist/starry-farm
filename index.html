function drawBuilding(g, d, kind)
{
    var W = d.w, H = d.h;
    var roofH = Math.round(H * .42);
    var wallY = roofH - 8;
    var wall = d.wall, roof = d.roof, trim = d.trim;

    // cast shadow along the base, thrown to the right by the top-left light
    var si;
    for (si = 0; si < 4; si++)
    {
        pr(g, 10 + si * 5, H - 8 + si * 2, W - 12 + si * 6, 4, 'rgba(24,18,10,' + (.17 - si * .035) + ')');
    }
    contactShadow(g, W / 2, H - 4, W * .44, 5);

    // ---- wall ----
    pr(g, 6, wallY, W - 12, H - wallY - 4, wall);
    // plank / plaster texture
    var i;
    for (i = wallY + 4; i < H - 6; i += 9)
    {
        pr(g, 7, i, W - 14, 1, tone(wall, -.55));
        pr(g, 7, i + 1, W - 14, 1, tone(wall, .5));
    }
    // corner posts
    pr(g, 6, wallY, 7, H - wallY - 4, tone(wall, -1.1));
    pr(g, W - 13, wallY, 7, H - wallY - 4, tone(wall, -1.5));
    pr(g, 6, wallY, 3, H - wallY - 4, tone(wall, .9));
    // eave shadow cast by the roof
    pr(g, 6, wallY, W - 12, 5, tone(wall, -1.6));
    pr(g, 6, wallY + 5, W - 12, 2, tone(wall, -.9));
    // foundation
    pr(g, 4, H - 10, W - 8, 6, '#8a8078');
    pr(g, 4, H - 10, W - 8, 2, '#a29a90');
    pr(g, 4, H - 5, W - 8, 2, '#5f5850');
    for (i = 6; i < W - 8; i += 12)
    {
        pr(g, i, H - 8, 1, 4, '#6f675f');
    }

    // ---- roof: stepped gable with shingle rows ----
    var rowH = 7;
    var y;
    for (y = 0; y < roofH; y++)
    {
        var t = y / roofH;
        var inset = Math.round((1 - t) * (W / 2 - 10));
        var x0 = inset, w0 = W - inset * 2;
        var row = Math.floor(y / rowH);
        var c = (row % 2 === 0) ? roof : tone(roof, -.5);
        pr(g, x0, roofH - y, w0, 1, c);
        if (y % rowH === 0)
        {
            pr(g, x0, roofH - y, w0, 1, tone(roof, -1.8));
        }
        if (y % rowH === 1)
        {
            pr(g, x0, roofH - y, w0, 1, tone(roof, 1.4));
        }
        if (y % rowH === 2)
        {
            pr(g, x0, roofH - y, w0, 1, tone(roof, .5));
        }
        if (y % rowH === rowH - 1)
        {
            pr(g, x0, roofH - y, w0, 1, tone(roof, -1.1));
        }
    }
    // shingle tabs
    var r2;
    for (r2 = 0; r2 * rowH < roofH - 4; r2++)
    {
        var yy = roofH - r2 * rowH - 3;
        var tt = (r2 * rowH) / roofH;
        var ins = Math.round((1 - tt) * (W / 2 - 10));
        var xx;
        for (xx = ins + 5 + (r2 % 2) * 7; xx < W - ins - 4; xx += 14)
        {
            pr(g, xx, yy - 1, 2, 5, tone(roof, -2.2));
            pr(g, xx + 2, yy - 1, 1, 5, tone(roof, .9));
        }
    }
    // ridge cap
    pr(g, W / 2 - 9, 0, 18, 4, tone(roof, 1.3));
    pr(g, W / 2 - 9, 3, 18, 1, tone(roof, -1.4));
    // eave board with a visible underside: this is what gives the roof depth
    pr(g, -2, roofH, W + 4, 4, tone(roof, .7));
    pr(g, -2, roofH, W + 4, 1, tone(roof, 1.6));
    pr(g, -2, roofH + 4, W + 4, 4, tone(roof, -2.1));       // shaded underside
    pr(g, -2, roofH + 8, W + 4, 2, 'rgba(24,18,10,.42)');   // shadow onto the wall
    // rafter tails poking out below the eave
    for (i = 4; i < W - 4; i += 16)
    {
        pr(g, i, roofH + 4, 3, 5, tone(roof, -2.4));
    }
    // chimney (skip the tiny buildings)
    if (W >= 120 && kind !== 'greenhouse' && kind !== 'silo' && kind !== 'well')
    {
        var chx = Math.round(W * .74);
        var chTop = Math.round(roofH * .34);
        pr(g, chx, chTop, 18, roofH - chTop + 6, '#8a6a5a');
        pr(g, chx, chTop, 6, roofH - chTop + 6, '#a08272');
        pr(g, chx + 14, chTop, 4, roofH - chTop + 6, '#6a4e40');
        var cr;
        for (cr = chTop + 4; cr < roofH; cr += 6)
        {
            pr(g, chx, cr, 18, 1, '#6a4e40');
        }
        pr(g, chx - 3, chTop - 5, 24, 6, '#7a5e4e');
        pr(g, chx - 3, chTop - 5, 24, 2, '#9c8070');
        pr(g, chx + 3, chTop - 8, 12, 3, '#2e2620');
    }

    // ---- door ----
    var dw = Math.max(26, Math.round(W * .16));
    var dh = Math.min(H - wallY - 14, 46);
    var dx = Math.round(W / 2 - dw / 2);
    var dy = H - 10 - dh;
    pr(g, dx - 4, dy - 4, dw + 8, dh + 4, trim);
    pr(g, dx - 4, dy - 4, dw + 8, 3, tone(trim, 1.3));
    pr(g, dx, dy, dw, dh, tone(trim, -1.4));
    pr(g, dx, dy, dw, 2, tone(trim, -2.2));
    pr(g, dx + 1, dy + 1, 3, dh - 2, tone(trim, -.7));
    // door panels
    pr(g, dx + 5, dy + 6, dw - 10, Math.round(dh * .35), tone(trim, -2));
    pr(g, dx + 6, dy + 7, dw - 12, Math.round(dh * .35) - 2, tone(trim, -1));
    pr(g, dx + 5, dy + Math.round(dh * .5), dw - 10, Math.round(dh * .35), tone(trim, -2));
    pr(g, dx + 6, dy + Math.round(dh * .5) + 1, dw - 12, Math.round(dh * .35) - 2, tone(trim, -1));
    // knob
    pr(g, dx + dw - 8, dy + Math.round(dh * .5) - 2, 3, 3, '#efc95c');
    pr(g, dx + dw - 8, dy + Math.round(dh * .5) - 2, 1, 1, '#fff0b8');
    // porch step
    pr(g, dx - 8, H - 10, dw + 16, 5, '#a09585');
    pr(g, dx - 8, H - 10, dw + 16, 2, '#bcb2a2');
    pr(g, dx - 11, H - 6, dw + 22, 5, '#948a7c');
    pr(g, dx - 11, H - 6, dw + 22, 2, '#aca294');
    pr(g, dx - 11, H - 2, dw + 22, 2, '#6e675d');

    // ---- windows ----
    function win(wx, wy, ww, wh)
    {
        pr(g, wx - 3, wy - 3, ww + 6, wh + 6, trim);
        pr(g, wx - 3, wy - 3, ww + 6, 2, tone(trim, 1.3));
        pr(g, wx, wy, ww, wh, '#5c4a2c');
        pr(g, wx + 1, wy + 1, ww - 2, wh - 2, '#8fc6e2');
        // glass gradient + highlight
        pr(g, wx + 1, wy + 1, ww - 2, Math.round(wh * .4), '#aadcf2');
        var gi;
        for (gi = 0; gi < 4; gi++)
        {
            pr(g, wx + 2 + gi * 2, wy + 2 + gi * 2, 4, 2, '#dff2fb');
        }
        // mullions
        pr(g, wx + Math.round(ww / 2) - 1, wy + 1, 2, wh - 2, '#5c4a2c');
        pr(g, wx + 1, wy + Math.round(wh / 2) - 1, ww - 2, 2, '#5c4a2c');
        // sill
        pr(g, wx - 5, wy + wh + 3, ww + 10, 4, trim);
        pr(g, wx - 5, wy + wh + 3, ww + 10, 1, tone(trim, 1.4));
        pr(g, wx - 5, wy + wh + 6, ww + 10, 1, tone(trim, -2));
    }
    var wy2 = wallY + 16;
    var wh2 = Math.min(28, H - wallY - 34);
    if (wh2 > 10)
    {
        if (W >= 176)
        {
            win(24, wy2, 26, wh2);
            win(W - 50, wy2, 26, wh2);
        }
        else if (W >= 120)
        {
            win(Math.round(W * .18), wy2, 24, wh2);
            win(Math.round(W * .66), wy2, 24, wh2);
        }
        else if (W >= 88)
        {
            win(Math.round(W / 2) - 12, wy2, 24, wh2);
        }
    }

    // ---- per-kind extras ----
    if (kind === 'silo')
    {
        pr(g, 8, 18, W - 16, H - 26, wall);
        for (i = 18; i < H - 10; i += 11)
        {
            pr(g, 8, i, W - 16, 1, tone(wall, -1.4));
            pr(g, 8, i + 1, W - 16, 1, tone(wall, .8));
        }
        pr(g, 8, 18, 8, H - 26, tone(wall, 1));
        pr(g, W - 18, 18, 10, H - 26, tone(wall, -1.2));
        pe(g, W / 2, 18, W / 2 - 8, 12, tone(roof, .7));
        pe(g, W / 2 - 6, 14, W / 4, 6, tone(roof, 1.6));
        pr(g, W / 2 - 14, H - 38, 28, 30, '#6a5a4a');
        pr(g, W / 2 - 14, H - 38, 28, 3, '#8a7a68');
    }
    if (kind === 'well')
    {
        pr(g, 10, 44, W - 20, H - 52, '#9a958c');
        pr(g, 10, 44, W - 20, 4, '#b5b0a6');
        pr(g, 10, H - 12, W - 20, 4, '#6d6860');
        for (i = 12; i < W - 20; i += 14)
        {
            pr(g, i, 48, 1, H - 60, '#7d786f');
        }
        pe(g, W / 2, 50, W / 2 - 12, 7, '#2a3a4a');
        pe(g, W / 2, 50, W / 2 - 16, 4, '#3d5a72');
        pr(g, 16, 10, 6, 36, trim);
        pr(g, W - 22, 10, 6, 36, trim);
        pr(g, 8, 2, W - 16, 12, roof);
        pr(g, 8, 2, W - 16, 3, tone(roof, 1.3));
        pr(g, W / 2 - 12, 14, 24, 8, '#6d4a2c');
    }
    if (kind === 'greenhouse')
    {
        pr(g, 12, wallY, W - 24, H - wallY - 12, '#bfe4dc');
        for (i = 20; i < W - 16; i += 22)
        {
            pr(g, i, wallY, 3, H - wallY - 12, '#7f9a8c');
            pr(g, i + 3, wallY, 1, H - wallY - 12, '#9fb8ac');
        }
        for (i = wallY + 10; i < H - 16; i += 22)
        {
            pr(g, 12, i, W - 24, 3, '#7f9a8c');
        }
        var gg;
        for (gg = 0; gg < 6; gg++)
        {
            pr(g, 18 + gg * 22, wallY + 6, 8, 4, 'rgba(255,255,255,.5)');
        }
    }
    if (kind === 'center')
    {
        pr(g, W / 2 - 20, roofH - 40, 40, 38, tone(roof, -.6));
        pr(g, W / 2 - 20, roofH - 40, 40, 3, tone(roof, 1));
        pr(g, W / 2 - 5, roofH - 62, 10, 24, '#8a7a5a');
        pe(g, W / 2, roofH - 66, 8, 8, '#e8c860');
        pe(g, W / 2 - 2, roofH - 68, 4, 3, '#f8e8a0');
        pr(g, W / 2 - 14, roofH - 30, 28, 22, '#6d5a48');
        pr(g, W / 2 - 12, roofH - 28, 24, 18, '#9fc4d8');
    }
    if (kind === 'barn' || kind === 'barn_big' || kind === 'barn_deluxe')
    {
        // white cross-brace doors, the classic barn read
        var bx = Math.round(W / 2 - 34), by = H - 10 - 54;
        pr(g, bx, by, 68, 54, tone(wall, -1.6));
        pr(g, bx + 2, by + 2, 64, 50, tone(wall, -.8));
        pr(g, bx + 32, by, 4, 54, trim);
        pr(g, bx, by, 68, 4, trim);
        pr(g, bx, by + 50, 68, 4, trim);
        var bi;
        for (bi = 0; bi < 26; bi++)
        {
            pr(g, bx + 4 + bi, by + 6 + bi * 1.7, 3, 2, trim);
            pr(g, bx + 62 - bi, by + 6 + bi * 1.7, 3, 2, trim);
        }
        pr(g, W / 2 - 12, roofH - 22, 24, 20, tone(roof, -1));
        pr(g, W / 2 - 9, roofH - 19, 18, 14, '#3a2a1a');
    }
    if (kind === 'saloon')
    {
        pr(g, 14, wallY + 4, W - 28, 14, '#6d4a2c');
        pr(g, 14, wallY + 4, W - 28, 2, '#8a5f38');
        pr(g, 22, wallY + 8, W - 44, 6, '#e8d8a8');
    }
}

function sprShippingBin()
{
    return bake('bin', TILE * 2, TILE + 24, function (g)
    {
        var w = '#8a5a2a';
        contactShadow(g, 32, 52, 26, 5);
        // body
        pr(g, 4, 20, 56, 30, w);
        pr(g, 4, 20, 56, 3, tone(w, 1.3));
        pr(g, 4, 46, 56, 4, tone(w, -2));
        pr(g, 4, 20, 5, 30, tone(w, 1));
        pr(g, 55, 20, 5, 30, tone(w, -1.4));
        var i;
        for (i = 0; i < 5; i++)
        {
            pr(g, 10 + i * 10, 22, 1, 26, tone(w, -1.6));
            pr(g, 11 + i * 10, 22, 1, 26, tone(w, .8));
        }
        // metal bands
        pr(g, 4, 28, 56, 3, '#6a6a72');
        pr(g, 4, 28, 56, 1, '#8f8f98');
        pr(g, 4, 40, 56, 3, '#6a6a72');
        pr(g, 4, 40, 56, 1, '#8f8f98');
        // open lid + dark interior
        pr(g, 0, 12, 64, 10, tone(w, -.4));
        pr(g, 0, 12, 64, 3, tone(w, 1.4));
        pr(g, 0, 20, 64, 2, tone(w, -2.2));
        pr(g, 8, 4, 48, 10, '#241a10');
        pr(g, 8, 4, 48, 2, '#3a2a18');
        pr(g, 6, 2, 52, 4, tone(w, -1));
        pr(g, 6, 2, 52, 1, tone(w, .9));

}

function sprFence(kind)

// ---------- monsters (32 x 32) ----------

function sprMonster(kind, col, frame)
{
    return bake('mon:' + kind + ':' + frame, TILE, TILE, function (g)
    {
        var a = col[0];
        var bob = frame % 2;
        contactShadow(g, 16, 29, 9, 3);

        if (kind === 'slime')
        {
            var sy = 20 + bob;
            pe(g, 16, sy, 12, 9, tone(a, -1.4));
            pe(g, 16, sy - 1, 11, 8, a);
            pr(g, 4, sy, 24, 8, a);
            pr(g, 4, sy + 6, 24, 2, tone(a, -1.6));
            pe(g, 10, sy - 5, 5, 3, tone(a, 1.6));
            pe(g, 9, sy - 6, 2, 1, tone(a, 2.4));
            pr(g, 9, sy - 3 + bob, 4, 5, '#ffffff');
            pr(g, 18, sy - 3 + bob, 4, 5, '#ffffff');
            pr(g, 10, sy - 1 + bob, 3, 3, '#161620');
            pr(g, 19, sy - 1 + bob, 3, 3, '#161620');
            pr(g, 10, sy - 1 + bob, 1, 1, '#ffffff');
            pr(g, 13, sy + 4 + bob, 6, 1, tone(a, -2));
        }
        else if (kind === 'bat')
        {
            var by = 14 + bob;
            pr(g, 1, by - 2, 12, 5, tone(a, -.8));
            pr(g, 19, by - 2, 12, 5, tone(a, -.8));
            pr(g, 2, by - 4, 10, 4, a);
            pr(g, 20, by - 4, 10, 4, a);
            pr(g, 1, by + 2, 12, 2, tone(a, -1.8));
            pr(g, 19, by + 2, 12, 2, tone(a, -1.8));
            orb(g, 16, by + 2, 6, 6, a, 1.4);
            pr(g, 11, by - 6, 3, 5, tone(a, -.6));
            pr(g, 18, by - 6, 3, 5, tone(a, -.6));
            pr(g, 13, by, 3, 3, '#ff5050');
            pr(g, 17, by, 3, 3, '#ff5050');
            pr(g, 13, by, 1, 1, '#ffd0d0');
            pr(g, 14, by + 5, 4, 2, '#ffffff');
        }
        else if (kind === 'bug' || kind === 'grub')
        {
            var gy = 18 + bob;
            pe(g, 16, gy, 10, 6, tone(a, -1.2));
            pe(g, 16, gy - 1, 9, 5, a);
            pe(g, 12, gy - 3, 4, 2, tone(a, 1.5));
            var seg;
            for (seg = 0; seg < 3; seg++)
            {
                pr(g, 9 + seg * 5, gy - 4, 1, 8, tone(a, -1.4));
            }
            orb(g, 24, gy - 2, 5, 4, a, 1.3);
            pr(g, 26, gy - 4, 2, 2, '#161620');
            pr(g, 22, gy - 4, 2, 2, '#161620');
            pr(g, 27, gy - 7, 1, 3, tone(a, -1.6));
            pr(g, 23, gy - 7, 1, 3, tone(a, -1.6));
            pr(g, 8, gy + 3, 3, 2, tone(a, -1.6));
        }
        else if (kind === 'fly')
        {
            var fy = 15 + bob;
            pr(g, 2, fy - 4 - bob, 11, 4, 'rgba(215,228,255,.55)');
            pr(g, 19, fy - 4 - bob, 11, 4, 'rgba(215,228,255,.55)');
            pr(g, 3, fy - 4 - bob, 9, 1, 'rgba(255,255,255,.75)');
            orb(g, 16, fy + 2, 7, 6, a, 1.4);
            pr(g, 11, fy, 4, 4, '#ff5050');
            pr(g, 17, fy, 4, 4, '#ff5050');
            pr(g, 11, fy, 2, 2, '#ffc0c0');
            pr(g, 13, fy + 7, 6, 2, tone(a, -1.8));
        }
        else if (kind === 'skeleton')
        {
            var ky = 4 + bob;
            pr(g, 10, ky, 12, 11, a);
            pr(g, 10, ky, 5, 11, tone(a, 1));
            pr(g, 19, ky + 1, 3, 10, tone(a, -1.2));
            pr(g, 12, ky + 4, 4, 4, '#161620');
            pr(g, 17, ky + 4, 4, 4, '#161620');
            pr(g, 13, ky + 5, 2, 2, '#ff6a3a');
            pr(g, 18, ky + 5, 2, 2, '#ff6a3a');
            pr(g, 12, ky + 10, 9, 2, tone(a, -1.4));
            pr(g, 13, ky + 10, 1, 2, a);
            pr(g, 16, ky + 10, 1, 2, a);
            pr(g, 19, ky + 10, 1, 2, a);
            pr(g, 14, ky + 12, 5, 5, a);
            var rb;
            for (rb = 0; rb < 3; rb++)
            {
                pr(g, 8, ky + 14 + rb * 4, 17, 2, a);
                pr(g, 8, ky + 15 + rb * 4, 17, 1, tone(a, -1.4));
            }
            pr(g, 10, ky + 26 + bob, 4, 5, a);
            pr(g, 18, ky + 26 - bob, 4, 5, a);
        }
        else if (kind === 'dust')
        {
            var dy = 18 + bob;
            orb(g, 16, dy, 10, 9, a, 1.2);
            pe(g, 6, dy - 8 + bob, 5, 4, tone(a, -.6));
            pe(g, 26, dy - 8 - bob, 5, 4, tone(a, -.6));
            pe(g, 10, dy - 11 + bob, 3, 3, tone(a, .8));
            pr(g, 10, dy - 3, 5, 5, '#f2e070');
            pr(g, 17, dy - 3, 5, 5, '#f2e070');
            pr(g, 11, dy - 2, 3, 3, '#fff8b8');
            pr(g, 18, dy - 2, 3, 3, '#fff8b8');
        }
        else if (kind === 'shadow')
        {
            var hy = 16 + bob;
            pe(g, 16, hy + 8, 11, 8, tone(a, -1.2));
            pr(g, 5, hy + 4, 22, 10, a);
            pr(g, 5, hy + 12, 22, 3, tone(a, -1.8));
            pr(g, 8, hy - 8, 16, 13, a);
            pr(g, 8, hy - 8, 6, 13, tone(a, .9));
            pr(g, 6, hy - 5, 3, 8, a);
            pr(g, 23, hy - 5, 3, 8, a);
            pr(g, 11, hy - 4, 4, 4, '#e04040');
            pr(g, 17, hy - 4, 4, 4, '#e04040');
            pr(g, 11, hy - 4, 2, 2, '#ff9090');
            pr(g, 12, hy + 2, 8, 1, tone(a, -2));
        }
        else if (kind === 'serpent')
        {
            var vy = 12 + bob;
            orb(g, 9, vy, 7, 6, a, 1.4);
            pr(g, 12, vy + 2, 9, 7, a);
            pr(g, 18, vy + 6, 9, 7, tone(a, -.6));
            pr(g, 24, vy + 10 - bob, 7, 5, tone(a, -1.2));
            pr(g, 12, vy + 7, 9, 2, tone(a, -1.6));
            pr(g, 18, vy + 11, 9, 2, tone(a, -1.6));
            pr(g, 6, vy - 3, 3, 3, '#f2e050');
            pr(g, 11, vy - 3, 3, 3, '#f2e050');
            pr(g, 6, vy - 3, 1, 1, '#ffffff');
            pr(g, 2, vy + 2, 5, 2, tone(a, -1.4));
            pr(g, 1, vy + 3, 3, 1, '#e04040');
        }
        else
        {
            orb(g, 16, 18, 9, 9, a, 1.4);
            pr(g, 11, 15, 4, 4, '#161620');
            pr(g, 18, 15, 4, 4, '#161620');
        }
    }, { outline: true });
}

// ---------- animals ----------

function sprAnimal(kind, frame, baby)
{
    var s = baby ? .68 : 1;
    var W = Math.round(48 * s), H = Math.round(40 * s);
    return bake('ani:' + kind + ':' + frame + ':' + (baby ? 1 : 0), W, H, function (g)
    {
        var bob = frame % 2;
        var body = { chicken: '#f4f4ec', duck: '#f2f2fa', rabbit: '#f0e8da',
            cow: '#f6f2ea', goat: '#eae0d2', sheep: '#f6f2e6', pig: '#f2b2ba' }[kind] || '#eee';
        var spot = { chicken: '#dedecc', duck: '#c8d8e8', rabbit: '#d2c6b2',
            cow: '#3d2c1c', goat: '#a89880', sheep: '#e2ded2', pig: '#da8a9a' }[kind];
        var q = function (v) { return Math.round(v * s); };

        contactShadow(g, W / 2, H - 3, q(17), q(4));

        if (kind === 'chicken' || kind === 'duck')
        {
            orb(g, q(22), q(24) + bob, q(13), q(10), body, 1.5);
            pe(g, q(14), q(26) + bob, q(7), q(6), spot);
            orb(g, q(33), q(13) + bob, q(8), q(8), body, 1.6);
            pr(g, q(39), q(13) + bob, q(7), q(4), '#eaa02a');
            pr(g, q(39), q(15) + bob, q(6), q(2), '#c07a10');
            pr(g, q(33), q(10) + bob, q(3), q(3), '#1d1710');
            pr(g, q(33), q(10) + bob, q(1), q(1), '#ffffff');
            if (kind === 'chicken')
            {
                pe(g, q(31), q(5) + bob, q(4), q(3), '#d84040');
                pe(g, q(35), q(4) + bob, q(3), q(2), '#e85858');
                pe(g, q(37), q(19) + bob, q(2), q(2), '#d84040');
            }
            else
            {
                pe(g, q(31), q(6) + bob, q(4), q(3), tone(body, -1));
            }
            pr(g, q(16), q(32), q(3), q(6), '#eaa02a');
            pr(g, q(25), q(32), q(3), q(6), '#eaa02a');
            pr(g, q(14), q(37), q(6), q(2), '#c07a10');
            pr(g, q(23), q(37), q(6), q(2), '#c07a10');
            pe(g, q(11), q(22) + bob, q(4), q(5), tone(body, -.8));
        }
        else if (kind === 'rabbit')
        {
            orb(g, q(21), q(26) + bob, q(13), q(10), body, 1.5);
            orb(g, q(34), q(18) + bob, q(8), q(8), body, 1.6);
            pe(g, q(32), q(6) + bob, q(3), q(8), body);
            pe(g, q(38), q(6) + bob, q(3), q(8), body);
            pe(g, q(32), q(7) + bob, q(2), q(5), '#e8b0b8');
            pe(g, q(38), q(7) + bob, q(2), q(5), '#e8b0b8');
            pr(g, q(37), q(16) + bob, q(3), q(3), '#1d1710');
            pr(g, q(37), q(16) + bob, q(1), q(1), '#ffffff');
            pr(g, q(41), q(20) + bob, q(3), q(2), '#e8a0a8');
            orb(g, q(9), q(26), q(5), q(5), '#ffffff', 1.6);
            pr(g, q(16), q(34), q(4), q(4), tone(body, -1.4));
            pr(g, q(24), q(34), q(4), q(4), tone(body, -1.4));
        }
        else
        {
            // quadrupeds
            pr(g, q(9), q(28), q(6), q(11), tone(body, -1.6));
            pr(g, q(29), q(28), q(6), q(11), tone(body, -1.6));
            pr(g, q(9), q(36), q(6), q(3), '#584838');
            pr(g, q(29), q(36), q(6), q(3), '#584838');
            orb(g, q(22), q(22) + bob, q(17), q(11), body, 1.4);
            pr(g, q(6), q(16) + bob, q(32), q(14), body);
            pr(g, q(6), q(26) + bob, q(32), q(4), tone(body, -1.2));
            pr(g, q(6), q(16) + bob, q(32), q(3), tone(body, 1.2));
            orb(g, q(39), q(15) + bob, q(9), q(9), body, 1.5);
            pr(g, q(43), q(13) + bob, q(3), q(3), '#1d1710');
            pr(g, q(43), q(13) + bob, q(1), q(1), '#ffffff');
            pr(g, q(45), q(18) + bob, q(4), q(3), tone(body, -1.4));
            pr(g, q(2), q(18) + bob, q(6), q(3), tone(body, -1));
            if (kind === 'cow')
            {
                pe(g, q(16), q(20), q(6), q(4), spot);
                pe(g, q(30), q(24), q(4), q(3), spot);
                pe(g, q(10), q(25), q(3), q(2), spot);
                pr(g, q(36), q(7) + bob, q(3), q(6), '#e8e0d0');
                pr(g, q(44), q(7) + bob, q(3), q(6), '#e8e0d0');
                pe(g, q(22), q(31), q(4), q(3), '#e8b0b8');
            }
            else if (kind === 'sheep')
            {
                orb(g, q(13), q(15), q(7), q(6), spot, 1.6);
                orb(g, q(23), q(13), q(8), q(7), spot, 1.7);
                orb(g, q(32), q(16), q(6), q(6), spot, 1.5);
                orb(g, q(18), q(22), q(6), q(5), spot, 1.3);
                orb(g, q(28), q(23), q(5), q(5), spot, 1.2);
            }
            else if (kind === 'goat')
            {
                pr(g, q(36), q(4) + bob, q(3), q(7), '#8a7a60');
                pr(g, q(43), q(4) + bob, q(3), q(7), '#8a7a60');
                pr(g, q(35), q(3) + bob, q(3), q(3), '#6a5a44');
                pr(g, q(44), q(3) + bob, q(3), q(3), '#6a5a44');
                pr(g, q(41), q(22) + bob, q(4), q(6), '#d8ccb8');
                pe(g, q(12), q(20), q(5), q(4), spot);
            }
            else if (kind === 'pig')
            {
                pe(g, q(46), q(17) + bob, q(4), q(3), spot);
                pr(g, q(45), q(16) + bob, q(1), q(1), '#8a4a58');
                pr(g, q(47), q(16) + bob, q(1), q(1), '#8a4a58');
                pe(g, q(37), q(7) + bob, q(4), q(4), spot);
                pe(g, q(44), q(7) + bob, q(4), q(4), spot);
                pe(g, q(12), q(22), q(5), q(4), spot);
                pr(g, q(3), q(16) + bob, q(4), q(2), spot);
            }
        }
    }, { outline: true });
}

// ---------- effects ----------

function sprParticle(kind)
{
    return bake('fx:' + kind, 12, 12, function (g)
    {
        if (kind === 'water')
        {
            pe(g, 6, 6, 3, 3, 'rgba(150,210,255,.85)');
            pr(g, 4, 4, 2, 1, 'rgba(230,248,255,.9)');
        }
        else if (kind === 'dirt')
        {
            pe(g, 5, 6, 3, 2, '#7a5430');
            pr(g, 4, 5, 2, 1, '#96683c');
        }
        else if (kind === 'leaf')
        {
            pe(g, 6, 6, 4, 2, '#59a83c');
            pr(g, 4, 5, 2, 1, '#7cc45a');
        }
        else if (kind === 'spark')
        {
            pr(g, 5, 1, 2, 10, '#fff4b0');
            pr(g, 1, 5, 10, 2, '#fff4b0');
            pr(g, 4, 4, 4, 4, '#ffffff');
            pr(g, 3, 3, 2, 2, 'rgba(255,240,150,.7)');
        }
        else if (kind === 'puff')
        {
            pe(g, 6, 6, 5, 5, 'rgba(220,220,235,.5)');
            pe(g, 4, 4, 3, 3, 'rgba(255,255,255,.6)');
        }
        else if (kind === 'snow')
        {
            pe(g, 6, 6, 2, 2, 'rgba(255,255,255,.92)');
            pr(g, 5, 5, 1, 1, '#ffffff');
        }
        else if (kind === 'rain')
        {
            pr(g, 5, 0, 1, 9, 'rgba(175,210,240,.75)');
            pr(g, 5, 7, 2, 2, 'rgba(200,228,250,.55)');

        else
        {
            pe(g, 6, 6, 3, 3, '#ffffff');
        }
    });
}

function drawHeartIcon(g, x, y, s, filled)
{

        '.aa.aa.',

// ---------- title art ----------

function drawTitleArt(g, W, H, t)
{
    g.clearRect(0, 0, W, H);
    var sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#15224a');
    sky.addColorStop(.45, '#3d3468');
    sky.addColorStop(.78, '#8a5570');
    sky.addColorStop(1, '#d08a66');
    g.fillStyle = sky;
    g.fillRect(0, 0, W, H);

    var i;
    for (i = 0; i < 60; i++)
    {
        var sx = Math.floor(hash2(i, 1, 5) * W);
        var sy = Math.floor(hash2(1, i, 9) * H * .62);
        var tw = .5 + .5 * Math.sin(t * .003 + i);
        g.fillStyle = 'rgba(255,255,235,' + (tw * .95) + ')';
        g.fillRect(sx, sy, 1, 1);
        if (i % 9 === 0)
        {
            g.fillStyle = 'rgba(255,255,235,' + (tw * .5) + ')';
            g.fillRect(sx - 1, sy, 3, 1);
            g.fillRect(sx, sy - 1, 1, 3);
        }
    }
    // moon with craters
    pe(g, W - 46, 30, 13, 13, '#f6f0cc');
    pe(g, W - 49, 27, 9, 9, '#fffbe4');
    pe(g, W - 43, 34, 3, 2, '#e2dcb8');
    pe(g, W - 50, 33, 2, 2, '#e2dcb8');

    // layered hills
    g.fillStyle = '#22402c';
    pe(g, W * .22, H - 26, 84, 34, '#22402c');
    pe(g, W * .78, H - 30, 96, 40, '#1c3626');
    g.fillStyle = '#2c4d34';
    g.fillRect(0, H - 30, W, 30);
    g.fillStyle = '#37603d';
    g.fillRect(0, H - 26, W, 26);
    for (i = 0; i < W; i += 5)
    {
        var hgt = 2 + Math.floor(hash2(i, 7, 3) * 3);
        g.fillStyle = '#3f6e45';
        g.fillRect(i, H - 26 - hgt, 2, hgt);
    }
    // fence
    for (i = 6; i < W; i += 18)
    {
        g.fillStyle = '#5a3f22';
        g.fillRect(i, H - 40, 4, 16);
        g.fillStyle = '#78552f';
        g.fillRect(i, H - 40, 2, 16);
    }
    g.fillStyle = '#5a3f22';
    g.fillRect(0, H - 36, W, 3);
    g.fillRect(0, H - 30, W, 3);
    g.fillStyle = '#78552f';
    g.fillRect(0, H - 36, W, 1);
    g.fillRect(0, H - 30, W, 1);

    // barn + tree, scaled down from the real sprites
    var barn = sprBuilding('barn');
    g.drawImage(barn, 0, 0, barn.width, barn.height, Math.round(W * .08), H - 96, 76, 54);
    var tree = sprTree('oak', 4, 'summer');
    g.drawImage(tree, 0, 0, tree.width, tree.height, Math.round(W * .68), H - 110, 66, 88);
    // crop row
    var crop = sprCrop('pumpkin_seeds', 4);
    for (i = 0; i < 8; i++)
    {
        g.drawImage(crop, 0, 0, crop.width, crop.height, 18 + i * 17, H - 40, 16, 22);
    }
}

// ---------- map building ----------

var MAP_CACHE = {};

function fillRect(m, x, y, w, h, t)
{
    var i, j;
    for (j = y; j < y + h; j++)
    {
        for (i = x; i < x + w; i++)
        {
            if (i >= 0 && i < m.w && j >= 0 && j < m.h)
            {
                m.tiles[j * m.w + i] = t;
            }
        }
    }
}

function inAny(rects, x, y)
{
    var i;
    for (i = 0; i < rects.length; i++)
    {
        var r = rects[i];
        if (x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h)
        {
            return true;
        }
    }
    return false;
}

// build the static structure of a map. dynamic objects (crops, dropped items,
// placed machines) live in the save and are merged at draw time.
function buildMap(id)
{
    if (MAP_CACHE[id])
    {
        return MAP_CACHE[id];
    }
    var def = MAPS[id];
    var m;
    if (def)
    {
        m = { id: id, name: def.name, w: def.w, h: def.h, outdoor: true, fish: def.fish,
            tiles: new Uint8Array(def.w * def.h), objects: [], warps: [], solidMask: null, till: def.till || [] };
        var i;
        for (i = 0; i < m.tiles.length; i++)
        {
            m.tiles[i] = def.ground;
        }
        for (i = 0; i < (def.r || []).length; i++)
        {
            var r = def.r[i];
            fillRect(m, r.x, r.y, r.w, r.h, r.t);
        }
        // buildings: footprint is solid, door tile is a warp
        for (i = 0; i < (def.b || []).length; i++)
        {
            var b = def.b[i];
            fillRect(m, b.x, b.y, b.tw, b.th, T_CLIFF);
            var dx = b.x + b.door;
            var dy = b.y + b.th;
            m.tiles[(dy - 1) * m.w + dx] = T_WOOD;
            m.objects.push({ kind: 'building', bkind: b.kind, x: b.x, y: b.y, tw: b.tw, th: b.th, sign: b.sign || '' });
            m.warps.push({ x: dx, y: dy - 1, w: 1, h: 1, to: b.warp, interior: true, locked: b.locked || null });
        }
        for (i = 0; i < (def.obj || []).length; i++)
        {
            var o = def.obj[i];
            var oo = { kind: o.kind, x: o.x, y: o.y, text: o.text || '' };
            m.objects.push(oo);
            if (o.kind === 'fountain')
            {
                fillRect(m, o.x, o.y, 4, 3, T_WATER);
            }
            if (o.kind === 'bin' || o.kind === 'board')
            {
                m.tiles[o.y * m.w + o.x] = m.tiles[o.y * m.w + o.x];
            }
        }
        for (i = 0; i < (def.wp || []).length; i++)
        {
            var w2 = def.wp[i];
            m.warps.push({ x: w2.x, y: w2.y, w: w2.w, h: w2.h, to: w2.to, tx: w2.tx, ty: w2.ty, mine: w2.mine });
        }
        scatterMap(m, def);
    }
    else
    {
        m = buildInterior(id);
    }
    rebuildSolid(m);
    MAP_CACHE[id] = m;
    return m;
}

function buildInterior(id)
{
    var d = INTERIORS[id];
    if (!d)
    {
        d = INTERIORS.farmhouse;
    }
    var m = { id: id, name: d.name, w: d.w, h: d.h, outdoor: false, interior: d,
        tiles: new Uint8Array(d.w * d.h), objects: [], warps: [], till: d.till ? [d.till] : [] };
    var i;
    for (i = 0; i < m.tiles.length; i++)
    {
        m.tiles[i] = d.floor;
    }
    fillRect(m, 0, 0, d.w, 2, T_WALL);
    fillRect(m, 0, 0, 1, d.h, T_WALL);
    fillRect(m, d.w - 1, 0, 1, d.h, T_WALL);
    fillRect(m, 0, d.h - 1, d.w, 1, T_WALL);
    if (d.till)
    {
        fillRect(m, d.till.x, d.till.y, d.till.w, d.till.h, T_DIRT);
    }
    for (i = 0; i < (d.f || []).length; i++)
    {
        var f = d.f[i];
        m.objects.push({ kind: 'furn', fk: f.k, x: f.x, y: f.y });
        var fw = { bed: 2, table: 3, counter: 5, shelf: 3, kitchen: 3, tv: 2, chest: 1,
            forge: 2, hay: 2, barrel: 1, orb: 1, calendar: 2 }[f.k] || 1;
        var fh = { bed: 3, table: 2, counter: 2, shelf: 2, kitchen: 2, tv: 2, chest: 1,
            forge: 2, hay: 2, barrel: 1, orb: 1, calendar: 1 }[f.k] || 1;
        if (f.k !== 'chest' && f.k !== 'calendar')
        {
            fillRect(m, f.x, f.y, fw, fh, T_WALL);
        }
    }
    // exit tile
    var ex = d.exit;
    m.tiles[ex.y * m.w + ex.x] = d.floor;
    m.tiles[ex.y * m.w + ex.x + 1] = d.floor;
    m.warps.push({ x: ex.x, y: ex.y, w: 2, h: 1, to: ex.to, tx: ex.tx, ty: ex.ty });
    m.exitDoor = { x: ex.x, y: ex.y };
    if (d.npc)
    {
        m.staticNpc = d.npc;
    }
    return m;
}

// seeded scatter so a fresh save always looks the same before the player edits it
function scatterMap(m, def)
{
    var seedBase = 0;
    var s;
    for (s = 0; s < m.id.length; s++)
    {
        seedBase = (seedBase * 31 + m.id.charCodeAt(s)) | 0;
    }
    var gi, k;
    for (gi = 0; gi < (def.sc || []).length; gi++)
    {
        var grp = def.sc[gi];
        var placed = 0, tries = 0;
        while (placed < grp.n && tries < grp.n * 40)
        {
            tries++;
            var rx = Math.floor(hash2(tries, gi, seedBase) * m.w);
            var ry = Math.floor(hash2(gi, tries, seedBase + 7) * m.h);
            if (rx < 2 || ry < 2 || rx >= m.w - 2 || ry >= m.h - 2)
            {
                continue;
            }
            if (m.tiles[ry * m.w + rx] !== T_GRASS && m.tiles[ry * m.w + rx] !== T_SAND)
            {
                continue;
            }
            if (grp.avoid && inAny(grp.avoid, rx, ry))
            {
                continue;
            }
            var occupied = false;
            for (k = 0; k < m.objects.length; k++)
            {
                var ob = m.objects[k];
                if (Math.abs(ob.x - rx) < 2 && Math.abs(ob.y - ry) < 2)
                {
                    occupied = true;
                    break;
                }
            }
            if (occupied)
            {
                continue;
            }
            var o = makeScatterObject(grp.kind, rx, ry, tries + gi * 997 + seedBase);
            if (o)
            {
                m.objects.push(o);
                placed++;
            }
        }
    }
}

function makeScatterObject(kind, x, y, seed)
{
    var r = hash2(x, y, seed);
    if (kind === 'tree')
    {
        var tk = r < .45 ? 'oak' : (r < .8 ? 'maple' : 'pine');
        return { kind: 'tree', tk: tk, stage: 4, x: x, y: y, hp: 5 };
    }
    if (kind === 'stone')
    {
        return { kind: 'rock', rk: 'stone', x: x, y: y, hp: 1 };
    }
    if (kind === 'weed')
    {
        return { kind: 'weed', x: x, y: y };
    }
    if (kind === 'wood')
    {
        return { kind: 'branch', x: x, y: y };
    }
    if (kind === 'grass')
    {
        return { kind: 'grass', x: x, y: y };
    }
    if (kind === 'bush')
    {
        return { kind: 'bush', x: x, y: y };
    }
    if (kind === 'flower')
    {
        var cols = ['#e85888', '#f0d040', '#7a88e8', '#e87038', '#d878e8'];
        return { kind: 'flowerdeco', col: cols[Math.floor(r * cols.length)], x: x, y: y };
    }
    if (kind === 'beachforage')
    {
        return { kind: 'forage', item: BEACH_FORAGE[Math.floor(r * BEACH_FORAGE.length)], x: x, y: y };
    }
    return null;
}

// object footprints used for collision
var OBJ_SOLID = { tree: 1, rock: 1, building: 1, bin: 1, furn: 1, board: 1, sign: 1,
    machine: 1, chest: 1, bush: 1, stump: 1, mine_entrance: 1, fountain: 1,
    animalbuilding: 1, fruittree: 1, scarecrow: 0, crop: 0, weed: 0, grass: 0,
    branch: 0, forage: 0, flowerdeco: 0, drop: 0, sprinkler: 0, crabpot: 0 };

function rebuildSolid(m)
{
    m.solidMask = new Uint8Array(m.w * m.h);
    var i, j;
    for (i = 0; i < m.tiles.length; i++)
    {
        m.solidMask[i] = SOLID_TILES[m.tiles[i]] ? 1 : 0;
    }
    for (i = 0; i < m.objects.length; i++)
    {
        var o = m.objects[i];
        if (!OBJ_SOLID[o.kind])
        {
            continue;
        }
        var w = 1, h = 1;
        if (o.kind === 'building')
        {
            continue;   // already filled as cliff
        }
        if (o.kind === 'bin')
        {
            w = 2;
        }
        if (o.kind === 'bush')
        {
            w = 2;
        }
        if (o.kind === 'mine_entrance')
        {
            continue;
        }
        if (o.kind === 'fountain')
        {
            continue;
        }
        if (o.kind === 'animalbuilding')
        {
            w = o.tw;
            h = o.th;
        }
        for (j = 0; j < h; j++)
        {
            var k2;
            for (k2 = 0; k2 < w; k2++)
            {
                var idx = (o.y + j) * m.w + (o.x + k2);
                if (idx >= 0 && idx < m.solidMask.length)
                {
                    m.solidMask[idx] = 1;
                }
            }
        }
    }
    // doors punch back through
    for (i = 0; i < m.warps.length; i++)
    {
        var wp = m.warps[i];
        var a, b;
        for (b = 0; b < (wp.h || 1); b++)
        {
            for (a = 0; a < (wp.w || 1); a++)
            {
                var ii = (wp.y + b) * m.w + (wp.x + a);
                if (ii >= 0 && ii < m.solidMask.length)
                {
                    m.solidMask[ii] = 0;
                }
            }
        }
    }
    m.groundDirty = true;
}

function tileAt(m, tx, ty)
{
    if (tx < 0 || ty < 0 || tx >= m.w || ty >= m.h)
    {
        return T_VOID;
    }
    return m.tiles[ty * m.w + tx];
}

function isSolid(m, tx, ty)
{
    if (tx < 0 || ty < 0 || tx >= m.w || ty >= m.h)
    {
        return true;
    }
    return m.solidMask[ty * m.w + tx] === 1;
}

function isWater(m, tx, ty)
{
    return WATER_TILES[tileAt(m, tx, ty)] === 1;
}

function isTillable(m, tx, ty)
{
    var t = tileAt(m, tx, ty);
    if (t === T_DIRT)
    {
        return true;
    }
    if (t !== T_GRASS)
    {
        return false;
    }
    var i;
    for (i = 0; i < (m.till || []).length; i++)
    {
        var r = m.till[i];
        if (tx >= r.x && tx < r.x + r.w && ty >= r.y && ty < r.y + r.h)
        {
            return true;
        }
    }
    return false;
}

function objAt(m, tx, ty)
{
    var i;
    for (i = m.objects.length - 1; i >= 0; i--)
    {
        var o = m.objects[i];
        var w = 1, h = 1;
        if (o.kind === 'bin' || o.kind === 'bush')
        {
            w = 2;
        }
        if (o.kind === 'building')
        {
            w = o.tw;
            h = o.th;
        }
        if (o.kind === 'animalbuilding')
        {
            w = o.tw;
            h = o.th;
        }
        if (tx >= o.x && tx < o.x + w && ty >= o.y && ty < o.y + h)
        {
            return o;
        }
    }
    return null;
}

function removeObj(m, o)
{
    var i = m.objects.indexOf(o);
    if (i >= 0)
    {
        m.objects.splice(i, 1);
        rebuildSolid(m);
    }
}

function addObj(m, o)
{
    m.objects.push(o);
    rebuildSolid(m);
}

function warpAt(m, tx, ty)
{
    var i;
    for (i = 0; i < m.warps.length; i++)
    {
        var w = m.warps[i];
        if (tx >= w.x && tx < w.x + (w.w || 1) && ty >= w.y && ty < w.y + (w.h || 1))
        {
            return w;
        }
    }
    return null;
}

// ---------- static ground layer ----------

function groundCanvas(m, season, waterFrame)
{
    var key = 'g:' + m.id + ':' + season;
    if (!m._gc || m._gcKey !== key || m.groundDirty)
    {
        m._gc = makeCv(m.w * TILE, m.h * TILE);
        m._gcKey = key;
        m.groundDirty = false;
        var g = m._gc.getContext('2d');
        g.imageSmoothingEnabled = false;
        var x, y;
        for (y = 0; y < m.h; y++)
        {
            for (x = 0; x < m.w; x++)
            {
                var t = m.tiles[y * m.w + x];
                var img = null;
                if (t === T_GRASS)
                {
                    img = tileGrass(season, Math.floor(hash2(x, y, 3) * 4));
                }
                else if (t === T_DIRT)
                {
                    img = tileDirt(season);
                }
                else if (t === T_SAND)
                {
                    img = tileSand(Math.floor(hash2(x, y, 29) * 4));
                }
                else if (t === T_STONE)
                {
                    img = tileStoneFloor(Math.floor(hash2(x, y, 53) * 4));
                }
                else if (t === T_WOOD || t === T_BRIDGE)
                {
                    img = tileWoodFloor();
                }
                else if (t === T_PATH)
                {
                    img = tilePath();
                }
                else if (t === T_ICE)
                {
                    img = tileSnowIce();
                }
                else if (t === T_CAVE)
                {
                    img = tileCave(m.floor || 1, Math.floor(hash2(x, y, 43) * 4));
                }
                else if (t === T_CAVEWALL)
                {
                    img = tileCaveWall(m.floor || 1, Math.floor(hash2(x, y, 47) * 4));
                }
                else if (t === T_CARPET)
                {
                    img = null;
                    g.fillStyle = '#6a4a7a';
                    g.fillRect(x * TILE, y * TILE, TILE, TILE);
                }
                else if (t === T_CLIFF)
                {
                    img = null;
                    drawCliffTile(g, m, x, y, season);
                }
                else if (t === T_WALL)
                {
                    img = null;
                    var wc = (m.interior && m.interior.wall) || '#c8a878';
                    g.fillStyle = wc;
                    g.fillRect(x * TILE, y * TILE, TILE, TILE);
                    g.fillStyle = shade(wc, -30);
                    g.fillRect(x * TILE, y * TILE + TILE - 3, TILE, 3);
                    g.fillStyle = shade(wc, 18);
                    g.fillRect(x * TILE, y * TILE, TILE, 2);
                }
                if (img)
                {
                    g.drawImage(img, x * TILE, y * TILE);
                }
            }
        }
        // second pass: let higher-priority ground grow over its neighbours so no
        // two materials ever meet in a straight line
        for (y = 0; y < m.h; y++)
        {
            for (x = 0; x < m.w; x++)
            {
                var me = m.tiles[y * m.w + x];
                var myPri = EDGE_PRI[me];
                if (myPri === undefined)
                {
                    continue;
                }
                var nx = [0, 1, 0, -1], ny = [-1, 0, 1, 0];
                var s;
                for (s = 0; s < 4; s++)
                {
                    var nt = tileAt(m, x + nx[s], y + ny[s]);
                    var np = EDGE_PRI[nt];
                    if (np === undefined || np <= myPri)
                    {
                        continue;
                    }
                    var col = edgeColorOf(nt, season);
                    if (!col)
                    {
                        continue;
                    }
                    drawFringe(g, x * TILE, y * TILE, s, col, nt, season, (x * 31 + y * 17 + s) | 0);
                }
            }
        }
    }
    return m._gc;
}

function drawCliffTile(g, m, x, y, season)
{
    var top = season === 'winter' ? '#d4e2ee' : '#5f8a45';
    var rock = '#7d6c58';
    var ox = x * TILE, oy = y * TILE;
    var open = tileAt(m, x, y - 1) !== T_CLIFF;

    // blocky rock strata, lit from the top-left
    pr(g, ox, oy, TILE, TILE, rock);
    var row, i;
    for (row = 0; row < 3; row++)
    {
        var ry = oy + row * 11;
        var shift = (row + x) % 2 ? 7 : 0;
        for (i = -1; i < 3; i++)
        {
            var bx = ox + i * 15 + shift;
            var c = tone(rock, ((i + row + x) % 3 === 0) ? .8 : -.5);
            pr(g, Math.max(ox, bx) + 1, ry + 1, Math.min(13, ox + TILE - bx - 1), 9, c);
            pr(g, Math.max(ox, bx) + 1, ry + 1, Math.min(13, ox + TILE - bx - 1), 1, tone(c, 1.3));
            pr(g, Math.max(ox, bx) + 1, ry + 8, Math.min(13, ox + TILE - bx - 1), 2, tone(c, -1.7));
        }
    }
    // moss / grit
    crumbs(g, ox + 2, oy + 4, TILE - 4, TILE - 8, [tone(rock, -1.9), tone(rock, 1.1)], 7, x * 31 + y);

    if (open)
    {
        // grass cap with an overhanging lip
        pr(g, ox, oy, TILE, 9, top);
        pr(g, ox, oy, TILE, 2, tone(top, 1.2));
        pr(g, ox, oy + 9, TILE, 3, tone(top, -1.6));
        pr(g, ox, oy + 12, TILE, 2, 'rgba(20,14,8,.32)');
        for (i = 0; i < 4; i++)
        {
            var gx = ox + 3 + Math.floor(hash2(x, i, 17) * (TILE - 6));
            tuft(g, gx, oy + 9, 4, top, x * 7 + i);
        }
        if (season === 'winter')
        {
            pr(g, ox, oy + 8, TILE, 3, '#eef6fc');
        }
    }
}

// water is animated so it is drawn on top of the static layer per frame
function drawWaterOverlay(g, m, cam, frame, vw, vh)
{
    var x0 = Math.max(0, Math.floor(cam.x / TILE));
    var y0 = Math.max(0, Math.floor(cam.y / TILE));
    var x1 = Math.min(m.w, Math.ceil((cam.x + vw) / TILE) + 1);
    var y1 = Math.min(m.h, Math.ceil((cam.y + vh) / TILE) + 1);
    var x, y;
    for (y = y0; y < y1; y++)
    {
        for (x = x0; x < x1; x++)
        {
            var t = m.tiles[y * m.w + x];
            if (t !== T_WATER && t !== T_DEEP)
            {
                continue;
            }
            var sx = x * TILE - cam.x, sy = y * TILE - cam.y;
            g.drawImage(tileWater(frame, t === T_DEEP), sx, sy);
            // foam where water meets land: the single cheapest thing that stops
            // a lake looking like a blue rectangle
            var ph = (frame % 2) ? 1 : 0;
            if (!WATER_TILES[tileAt(m, x, y - 1)])
            {
                pr(g, sx, sy, TILE, 2, 'rgba(240,250,255,.75)');
                pr(g, sx + ph * 4, sy + 2, TILE - 8, 1, 'rgba(220,240,255,.45)');
            }
            if (!WATER_TILES[tileAt(m, x, y + 1)])
            {
                pr(g, sx, sy + TILE - 2, TILE, 2, 'rgba(230,245,255,.6)');
            }
            if (!WATER_TILES[tileAt(m, x - 1, y)])
            {
                pr(g, sx, sy, 2, TILE, 'rgba(240,250,255,.6)');
            }
            if (!WATER_TILES[tileAt(m, x + 1, y)])
            {
                pr(g, sx + TILE - 2, sy, 2, TILE, 'rgba(240,250,255,.6)');
            }
        }
    }
}

// ---------- camera ----------

function makeCamera()
{
    return { x: 0, y: 0, vw: 320, vh: 200 };
}

function camFollow(cam, px, py, m)
{
    var tx = px - cam.vw / 2;
    var ty = py - cam.vh / 2;
    var maxX = Math.max(0, m.w * TILE - cam.vw);
    var maxY = Math.max(0, m.h * TILE - cam.vh);
    cam.x = Math.max(0, Math.min(maxX, tx));
    cam.y = Math.max(0, Math.min(maxY, ty));
    if (m.w * TILE < cam.vw)
    {
        cam.x = (m.w * TILE - cam.vw) / 2;
    }
    if (m.h * TILE < cam.vh)
    {
        cam.y = (m.h * TILE - cam.vh) / 2;
    }
}

// ---------- object drawing ----------

// big props are anchored by their ground line, not their top-left corner
var TREE_DX = -(96 - TILE) / 2;     // centre a 96px wide tree on the tile
var TREE_DY = TILE - 122;           // 122 = ground line inside the tree sprite

function drawObject(g, o, cam, season, tick)
{
    var x = o.x * TILE - cam.x;
    var y = o.y * TILE - cam.y;
    switch (o.kind)
    {
        case 'tree':
            g.drawImage(sprTree(o.tk, o.stage, season), x + TREE_DX, y + TREE_DY);
            break;
        case 'fruittree':
            g.drawImage(sprFruitTree(o.sap, o.stage, o.fruit || 0, season), x + TREE_DX, y + TREE_DY);
            if (o.fruit > 0)
            {
                drawSparkle(g, x + HALF, y - 40, tick);
            }
            break;
        case 'crabpot':
            g.drawImage(itemIcon('crab_pot', TILE), x, y - 4);
            if (o.out)
            {
                drawSparkle(g, x + HALF, y - 14, tick);
            }
            else if (o.baited)
            {
                pr(g, x + 13, y - 10, 6, 4, '#e8c878');
                pr(g, x + 13, y - 10, 6, 1, '#f8e8b0');
            }
            break;
        case 'stump':
            g.drawImage(sprStump(), x, y);
            break;
        case 'rock':
            g.drawImage(sprRock(o.rk), x, y);
            break;
        case 'weed':
            g.drawImage(sprWeed(season), x, y);
            break;
        case 'grass':
            g.drawImage(sprGrassTuft(season), x, y);
            break;
        case 'bush':
            g.drawImage(sprBush(season), x, y - 16);
            break;
        case 'flowerdeco':
            g.drawImage(sprFlowerTile(o.col), x, y);
            break;
        case 'branch':
            g.drawImage(itemIcon('wood', 24), x + 4, y + 8);
            break;
        case 'forage':
            g.drawImage(itemIcon(o.item, 28), x + 2, y + 3);
            drawSparkle(g, x + HALF, y + HALF, tick);
            break;
        case 'drop':
            var by = Math.sin((tick + o.x * 7) * .12) * 2.5;
            g.drawImage(itemIcon(o.item, 24), x + 4, y + 6 + by);
            break;
        case 'building':
            g.drawImage(sprBuilding(o.bkind), x, y + o.th * TILE - sprBuilding(o.bkind).height);
            break;
        case 'animalbuilding':
            g.drawImage(sprBuilding(o.bkind), x, y + o.th * TILE - sprBuilding(o.bkind).height);
            break;
        case 'bin':
            g.drawImage(sprShippingBin(), x, y + TILE - 56);
            break;
        case 'sign':
            drawSign(g, x, y, o.text);
            break;
        case 'board':
            drawBoard(g, x, y);
            break;
        case 'fountain':
            drawFountain(g, x, y, tick);
            break;
        case 'mine_entrance':
            drawMineEntrance(g, x, y);
            break;
        case 'furn':
            drawFurniture(g, o.fk, x, y);
            break;
        case 'machine':
            g.drawImage(itemIcon(o.mk, TILE), x, y - 4);
            if (o.out)
            {
                drawSparkle(g, x + HALF, y - 12, tick);
            }
            break;
        case 'chest':
            g.drawImage(itemIcon('chest', TILE), x, y);
            break;
        case 'scarecrow':
            g.drawImage(itemIcon('scarecrow', TILE), x, y - 12);
            break;
        case 'sprinkler':
            g.drawImage(itemIcon(o.mk || 'sprinkler', 28), x + 2, y + 4);
            break;
        default:
            break;
    }
}

function drawSparkle(g, x, y, tick)
{
    var a = .35 + .35 * Math.sin(tick * .12);
    g.globalAlpha = a;
    g.drawImage(sprParticle('spark'), x - 6, y - 16);
    g.globalAlpha = 1;
}

function drawSign(g, x, y, text)
{
    var w = '#8a5f38';
    pr(g, x + 7, y + 14, 5, 18, tone(w, -1.4));
    pr(g, x + 21, y + 14, 5, 18, tone(w, -1.4));
    pr(g, x + 7, y + 14, 2, 18, tone(w, .6));
    pr(g, x, y + 2, TILE, 15, w);
    pr(g, x, y + 2, TILE, 3, tone(w, 1.4));
    pr(g, x, y + 14, TILE, 3, tone(w, -1.9));
    pr(g, x + 2, y + 5, TILE - 4, 8, tone(w, -.7));
    if (text)
    {
        pr(g, x + 5, y + 7, 20, 2, '#4f351a');
        pr(g, x + 5, y + 11, 14, 2, '#4f351a');
    }
}

function drawBoard(g, x, y)
{
    var w = '#8a5a2a';
    pr(g, x + 4, y + 22, 4, 12, tone(w, -1.4));
    pr(g, x + 24, y + 22, 4, 12, tone(w, -1.4));
    pr(g, x - 4, y, 40, 26, w);
    pr(g, x - 4, y, 40, 3, tone(w, 1.3));
    pr(g, x - 4, y + 23, 40, 3, tone(w, -2));
    pr(g, x - 1, y + 3, 34, 20, '#ded0a8');
    pr(g, x - 1, y + 3, 34, 2, '#efe4c4');
    pr(g, x + 2, y + 7, 14, 2, '#8a7a58');
    pr(g, x + 2, y + 12, 17, 2, '#8a7a58');
    pr(g, x + 2, y + 17, 11, 2, '#8a7a58');
    pr(g, x + 20, y + 7, 11, 11, '#f4ecd4');
    pr(g, x + 20, y + 7, 11, 1, '#ffffff');
    pr(g, x + 22, y + 10, 7, 2, '#b6a684');
    pr(g, x + 22, y + 14, 5, 2, '#b6a684');
}

function drawFountain(g, x, y, tick)
{
    var s = '#a3998c';
    var W = TILE * 4, H = TILE * 3;
    // outer rim with a bevel
    pr(g, x, y + 4, W, H - 4, tone(s, -1.4));
    pr(g, x + 2, y + 2, W - 4, H - 6, s);
    pr(g, x + 2, y + 2, W - 4, 4, tone(s, 1.4));
    pr(g, x + 2, y + H - 10, W - 4, 4, tone(s, -1.8));
    var i;
    for (i = 0; i < 8; i++)
    {
        pr(g, x + 4 + i * 15, y + 2, 1, H - 8, tone(s, -1));
    }
    // water basin
    var bx = x + 12, by = y + 14, bw = W - 24, bh = H - 34;
    pr(g, bx - 3, by - 3, bw + 6, bh + 6, tone(s, -2));
    pr(g, bx, by, bw, bh, '#2f74b2');
    pr(g, bx, by, bw, 3, '#1e4a76');
    for (i = 0; i < 4; i++)
    {
        var wy = by + 5 + i * 7;
        var wx = bx + 3 + ((tick * .5 + i * 19) % (bw - 20));
        pr(g, wx, wy, 14, 1, '#63a6dc');
        pr(g, wx + 2, wy + 1, 10, 1, '#3f85c2');
    }
