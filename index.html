/* ===== game.js ===== */

// Starry Farm - game state, clock, farming, inventory, economy, skills, save.
// All comments ASCII only.

var S = null;              // save state
var MAP = null;            // current map object
var CAM = makeCamera();
var TICK = 0;              // render tick, used for animation phases

// ---------- new game ----------

function newGame(name, farmName)
{
    S = {
        ver: GAME_VER,
        name: name || '농부',
        farmName: farmName || '별밤',
        look: { skin: '#f0c8a0', hair: '#5a3a1a', hairStyle: 'bowl', shirt: '#4a7ac8', pants: '#3a4a6a', shoe: '#4a2a12' },
        year: 1, season: 0, day: 1, time: DAY_START,
        gold: 500,
        energy: BASE_ENERGY, maxEnergy: BASE_ENERGY,
        health: BASE_HEALTH, maxHealth: BASE_HEALTH,
        map: 'farmhouse', px: 6 * TILE + HALF, py: 9 * TILE + HALF, dir: 0,
        inv: [
            { id: 'hoe', n: 1 }, { id: 'can', n: 1 }, { id: 'axe', n: 1 },
            { id: 'pick', n: 1 }, { id: 'scythe', n: 1 },
            { id: 'parsnip_seeds', n: 15 }
        ],
        invSize: 12,
        sel: 0,
        tools: { hoe: 0, can: 0, axe: 0, pick: 0 },
        rod: -1, sword: -1,
        water: 40, waterCap: 40,
        upgrade: null,             // {tool, tier, daysLeft}
        skills: { farming: 0, fishing: 0, foraging: 0, mining: 0, combat: 0 },
        xp: { farming: 0, fishing: 0, foraging: 0, mining: 0, combat: 0 },
        prof: {},
        pendingLevels: [],
        soil: {},                  // map -> "x,y" -> {w:0/1, f:fertId|null}
        crops: {},                 // map -> "x,y" -> {seed, grown, regrow, dead}
        mapObjs: {},               // map -> serialized dynamic objects
        npc: {},
        spouse: null, engaged: 0, married: 0,
        bundles: {},
        animals: [], farmBuildings: [],
        pendingBuild: null,
        shipBin: [], shipped: {},
        recipes: ['fried_egg', 'salad', 'bread'],
        crafts: ['chest', 'torch'],
        museum: {},
        mineDeep: 0, mineFloor: 0,
        weather: 'sun', tomorrow: 'sun',
        luck: 0,
        flags: {},
        stats: { earned: 0, cropsHarvested: 0, fishCaught: 0, monstersKilled: 0, daysPlayed: 0, giftsGiven: 0 },
        caughtFish: {}, seenNpc: {}
    };
    initBundles();
    initNpcState();
    rollWeather();
    MAP_CACHE = {};
    MAP = buildMap('farmhouse');
    S.px = 6 * TILE + HALF;
    S.py = 9 * TILE + HALF;
    return S;
}

function initBundles()
{
    var i, j;
    for (i = 0; i < BUNDLES.length; i++)
    {
        var room = BUNDLES[i];
        for (j = 0; j < room.list.length; j++)
        {
            S.bundles[room.room + ':' + j] = { done: false, have: [] };
        }
        S.bundles['room:' + room.room] = false;
    }
}

function initNpcState()
{
    var i;
    for (i = 0; i < NPCS.length; i++)
    {
        S.npc[NPCS[i].id] = { pts: 0, met: false, giftDay: -1, giftWeek: 0, weekNo: -1, events: {} };
    }
}

// ---------- clock / calendar ----------

function seasonId()
{
    return SEASONS[S.season];
}

function dayOfWeek()
{
    return (S.day - 1) % 7;
}

function dateLabel()
{
    return SEASON_KR[seasonId()] + ' ' + S.day + '일';
}

function timeLabel()
{
    var t = S.time % (24 * 60);
    var h = Math.floor(t / 60);
    var mm = t % 60;
    var ampm = h < 12 ? '오전' : '오후';
    var hh = h % 12;
    if (hh === 0)
    {
        hh = 12;
    }
    return ampm + ' ' + hh + ':' + (mm < 10 ? '0' : '') + mm;
}

function isNight()
{
    return S.time >= 18 * 60;
}

// darkness overlay strength 0..1
function darkness()
{
    var t = S.time;
    if (t < 6 * 60)
    {
        return .55;
    }
    if (t < 7 * 60)
    {
        return .25 * (1 - (t - 6 * 60) / 60);
    }
    if (t < 17 * 60)
    {
        return 0;
    }
    if (t < 20 * 60)
    {
        return .5 * ((t - 17 * 60) / (3 * 60));
    }
    if (t < 22 * 60)
    {
        return .5 + .18 * ((t - 20 * 60) / (2 * 60));
    }
    return .68;
}

function advanceClock(mins)
{
    if (UI.blockTime)
    {
        return;
    }
    S.time += mins;
    if (S.time >= DAY_END)
    {
        S.time = DAY_END;
        collapse();
    }
}

// ---------- inventory ----------

function invCount(id)
{
    var n = 0, i;
    for (i = 0; i < S.inv.length; i++)
    {
        if (S.inv[i] && S.inv[i].id === id)
        {
            n += S.inv[i].n;
        }
    }
    return n;
}

function isTool(id)
{
    return ITEMS[id] && ITEMS[id].kind === 'tool';
}

function stackMax(id)
{
    return isTool(id) ? 1 : 999;
}

function addItem(id, n, q)
{
    n = n || 1;
    q = q || 0;
    if (!ITEMS[id])
    {
        return 0;
    }
    var left = n, i;
    if (!isTool(id))
    {
        for (i = 0; i < S.inv.length; i++)
        {
            var sl = S.inv[i];
            if (sl && sl.id === id && (sl.q || 0) === q && sl.n < stackMax(id))
            {
                var can = Math.min(left, stackMax(id) - sl.n);
                sl.n += can;
                left -= can;
                if (left <= 0)
                {
                    return n;
                }
            }
        }
    }
    while (left > 0)
    {
        var slot = -1;
        for (i = 0; i < S.invSize; i++)
        {
            if (!S.inv[i])
            {
                slot = i;
                break;
            }
        }
        if (slot < 0)
        {
            break;
        }
        var take = Math.min(left, stackMax(id));
        S.inv[slot] = { id: id, n: take, q: q };
        left -= take;
    }
    return n - left;
}

function removeItem(id, n, q)
{
    n = n || 1;
    var left = n, i;
    for (i = 0; i < S.inv.length && left > 0; i++)
    {
        var sl = S.inv[i];
        if (!sl || sl.id !== id)
        {
            continue;
        }
        if (q !== undefined && q !== null && (sl.q || 0) !== q)
        {
            continue;
        }
        var take = Math.min(left, sl.n);
        sl.n -= take;
        left -= take;
        if (sl.n <= 0)
        {
            S.inv[i] = null;
        }
    }
    return n - left;
}

function selSlot()
{
    return S.inv[S.sel] || null;
}

function consumeSel(n)
{
    var sl = selSlot();
    if (!sl)
    {
        return;
    }
    sl.n -= (n || 1);
    if (sl.n <= 0)
    {
        S.inv[S.sel] = null;
    }
}

function invFull()
{
    var i;
    for (i = 0; i < S.invSize; i++)
    {
        if (!S.inv[i])
        {
            return false;
        }
    }
    return true;
}

// give an item to the player; drops on the ground when the bag is full
function give(id, n, q)
{
    n = n || 1;
    var got = addItem(id, n, q);
    if (got < n)
    {
        var i;
        for (i = 0; i < n - got; i++)
        {
            spawnDrop(MAP, Math.floor(S.px / TILE), Math.floor(S.py / TILE), id, q);
        }
        toast('가방이 가득 찼어요!');
    }
    return got;
}

function spawnDrop(m, tx, ty, id, q)
{
    var best = null, r = 0;
    for (r = 0; r < 4 && !best; r++)
    {
        var dx, dy;
        for (dy = -r; dy <= r && !best; dy++)
        {
            for (dx = -r; dx <= r && !best; dx++)
            {
                var x = tx + dx, y = ty + dy;
                if (x < 0 || y < 0 || x >= m.w || y >= m.h)
                {
                    continue;
                }
                if (!isSolid(m, x, y))
                {
                    best = { x: x, y: y };
                }
            }
        }
    }
    if (!best)
    {
        best = { x: tx, y: ty };
    }
    m.objects.push({ kind: 'drop', x: best.x, y: best.y, item: id, q: q || 0, life: 0 });
}

// ---------- energy / health ----------

function useEnergy(n)
{
    S.energy -= n;
    if (S.energy <= 0)
    {
        S.energy = 0;
        if (!UI.collapsing)
        {
            collapse();
        }
    }
}

function eatItem(id, slotIdx)
{
    var it = ITEMS[id];
    if (!it || !it.energy)
    {
        toast('먹을 수 없어요.');
        return false;
    }
    if (id === 'stardrop')
    {
        S.maxEnergy += 34;
        S.energy = S.maxEnergy;
        removeItem(id, 1);
        modalMsg('스타드롭', '말할 수 없이 달콤한 맛...\n최대 기력이 영원히 늘어났어요!');
        return true;
    }
    var sl = S.inv[slotIdx];
    var q = sl ? (sl.q || 0) : 0;
    var gain = Math.round(it.energy * (1 + q * .2));
    S.energy = Math.min(S.maxEnergy, S.energy + gain);
    S.health = Math.min(S.maxHealth, S.health + Math.round(gain * .45));
    removeItem(id, 1, q);
    toast('기력 +' + gain);
    if (it.buff)
    {
        applyBuff(it.buff);
    }
    return true;
}

var BUFF = { list: null, until: 0 };

function applyBuff(b)
{
    BUFF.list = b;
    BUFF.until = S.time + 7 * 60;
    var parts = [];
    var k;
    for (k in b)
    {
        if (b.hasOwnProperty(k))
        {
            parts.push((SKILL_KR[k] || k) + ' +' + b[k]);
        }
    }
    toast('버프: ' + parts.join(', '));
}

function buffOf(k)
{
    if (!BUFF.list || S.time > BUFF.until)
    {
        return 0;
    }
    return BUFF.list[k] || 0;
}

function collapse()
{
    if (UI.collapsing)
    {
        return;
    }
    UI.collapsing = true;
    var lost = Math.min(1000, Math.floor(S.gold * .1));
    S.gold -= lost;
    fadeOut(function ()
    {
        endDay(true, lost);
    });
}

// ---------- skills ----------

function addXp(skill, n)
{
    S.xp[skill] += n;
    var lvl = S.skills[skill];
    while (lvl < 10 && S.xp[skill] >= SKILL_XP[lvl + 1])
    {
        lvl++;
        S.pendingLevels.push({ skill: skill, lvl: lvl });
    }
}

function skillLvl(k)
{
    return S.skills[k] + buffOf(k);
}

function hasProf(id)
{
    var k;
    for (k in S.prof)
    {
        if (S.prof.hasOwnProperty(k) && (S.prof[k][5] === id || S.prof[k][10] === id))
        {
            return true;
        }
    }
    return false;
}

// ---------- selling ----------

function sellPrice(id, q)
{
    var it = ITEMS[id];
    if (!it)
    {
        return 0;
    }
    var base = it.price;
    if (it.derived)
    {
        base = 0;   // resolved by the machine at creation time
    }
    var p = Math.floor(base * QUALITY_MULT[q || 0]);
    if (it.kind === 'crop' && hasProf('tiller'))
    {
        p = Math.floor(p * 1.1);
    }
    if (it.kind === 'animal' && hasProf('rancher'))
    {
        p = Math.floor(p * 1.2);
    }
    if (it.kind === 'artisan' && hasProf('artisan'))
    {
        p = Math.floor(p * 1.4);
    }
    if (it.kind === 'fish')
    {
        if (hasProf('angler'))
        {
            p = Math.floor(p * 1.5);
        }
        else if (hasProf('fisher'))
        {
            p = Math.floor(p * 1.25);
        }
    }
    if (it.kind === 'mineral' && hasProf('blacksmith') && id.indexOf('_bar') > 0)
    {
        p = Math.floor(p * 1.5);
    }
    return Math.max(1, p);
}

function itemPrice(sl)
{
    if (!sl)
    {
        return 0;
    }
    if (sl.px !== undefined)
    {
        return Math.floor(sl.px * QUALITY_MULT[sl.q || 0]);
    }
    return sellPrice(sl.id, sl.q || 0);
}

function shipItem(slotIdx)
{
    var sl = S.inv[slotIdx];
    if (!sl)
    {
        return;
    }
    if (isTool(sl.id))
    {
        toast('도구는 팔 수 없어요.');
        return;
    }
    S.shipBin.push({ id: sl.id, n: sl.n, q: sl.q || 0, px: sl.px });
    S.inv[slotIdx] = null;
    toast(ITEMS[sl.id].name + ' ×' + sl.n + ' 출하함');
}

// ---------- soil / crops ----------

function K(x, y)
{
    return x + ',' + y;
}

function soilMap(mid)
{
    if (!S.soil[mid])
    {
        S.soil[mid] = {};
    }
    return S.soil[mid];
}

function cropMap(mid)
{
    if (!S.crops[mid])
    {
        S.crops[mid] = {};
    }
    return S.crops[mid];
}

function soilAt(mid, x, y)
{
    return soilMap(mid)[K(x, y)] || null;
}

function cropAt(mid, x, y)
{
    return cropMap(mid)[K(x, y)] || null;
}

function till(x, y)
{
    var mid = MAP.id;
    if (!isTillable(MAP, x, y))
    {
        return false;
    }
    if (soilAt(mid, x, y))
    {
        return false;
    }
    if (objAt(MAP, x, y))
    {
        return false;
    }
    soilMap(mid)[K(x, y)] = { w: 0, f: null };
    return true;
}

function plantSeed(x, y, seedId)
{
    var mid = MAP.id;
    var s = soilAt(mid, x, y);
    if (!s || cropAt(mid, x, y))
    {
        return false;
    }
    var cd = CROPS[seedId];
    if (!cd)
    {
        return false;
    }
    var indoor = !MAP.outdoor;
    if (!indoor && cd.season.indexOf(seasonId()) < 0)
    {
        toast('이 계절에는 자라지 않아요.');
        return false;
    }
    cropMap(mid)[K(x, y)] = { seed: seedId, grown: 0, regrow: 0, dead: false };
    return true;
}

function cropStage(c)
{
    var cd = CROPS[c.seed];
    if (!cd)
    {
        return 0;
    }
    if (c.regrow > 0)
    {
        return c.regrow >= 999 ? 4 : 3;
    }
    if (c.grown >= cd.days)
    {
        return 4;
    }
    return Math.min(3, Math.floor((c.grown / cd.days) * 4));
}

function cropReady(c)
{
    var cd = CROPS[c.seed];
    if (!cd || c.dead)
    {
        return false;
    }
    if (cd.regrow)
    {
        return c.grown >= cd.days && c.regrow === 0;
    }
    return c.grown >= cd.days;
}

function rollQuality()
{
    var lvl = skillLvl('farming');
    var fert = 0;
    var chanceGold = .01 + .2 * (lvl / 10) + fert * .05;
    var chanceSilver = Math.min(.75, chanceGold * 2);
    var r = Math.random();
    if (r < chanceGold * .1)
    {
        return 3;
    }
    if (r < chanceGold)
    {
        return 2;
    }
    if (r < chanceSilver)
    {
        return 1;
    }
    return 0;
}

function qualityFor(x, y)
{
    var s = soilAt(MAP.id, x, y);
    var bonus = 0;
    if (s && s.f === 'fert_quality')
    {
        bonus = 2;
    }
    else if (s && s.f === 'fert_basic')
    {
        bonus = 1;
    }
    var q = rollQuality();
    if (bonus > 0 && Math.random() < bonus * .25)
    {
        q = Math.min(3, q + 1);
    }
    return q;
}

function harvestCrop(x, y)
{
    var mid = MAP.id;
    var c = cropAt(mid, x, y);
    if (!c || !cropReady(c))
    {
        return false;
    }
    var cd = CROPS[c.seed];
    var q = cd.flower ? rollQuality() : qualityFor(x, y);
    if (hasProf('botanist') && ITEMS[cd.crop].kind === 'forage')
    {
        q = 3;
    }
    var count = cd.yield || 1;
    if (cd.extraChance && Math.random() < cd.extraChance)
    {
        count++;
    }
    give(cd.crop, count, q);
    addXp('farming', Math.round(6 + ITEMS[cd.crop].price * .08));
    S.stats.cropsHarvested += count;
    if (cd.regrow)
    {
        c.regrow = cd.regrow;
    }
    else
    {
        delete cropMap(mid)[K(x, y)];
    }
    sfx('harvest');
    return true;
}

// ---------- weather / luck ----------

function rollWeather()
{
    var s = seasonId();
    var r = Math.random();
    var w = 'sun';
    if (s === 'winter')
    {
        w = r < .45 ? 'snow' : 'sun';
    }
    else if (s === 'spring')
    {
        w = r < .28 ? 'rain' : (r < .34 ? 'storm' : 'sun');
    }
    else if (s === 'summer')
    {
        w = r < .14 ? 'rain' : (r < .2 ? 'storm' : 'sun');
    }
    else
    {
        w = r < .3 ? 'rain' : (r < .38 ? 'wind' : 'sun');
    }
    if (S.year === 1 && S.season === 0 && S.day <= 3)
    {
        w = 'sun';
    }
    S.tomorrow = w;
}

function isRaining()
{
    return S.weather === 'rain' || S.weather === 'storm';
}

// ---------- end of day ----------

function endDay(fainted, lostGold)
{
    var summary = { sold: 0, items: [], levels: [], msgs: [] };

    // 1) shipping bin
    var i;
    for (i = 0; i < S.shipBin.length; i++)
    {
        var e = S.shipBin[i];
        var unit = e.px !== undefined ? Math.floor(e.px * QUALITY_MULT[e.q || 0]) : sellPrice(e.id, e.q);
        summary.sold += unit * e.n;
        summary.items.push({ id: e.id, n: e.n, q: e.q, g: unit * e.n });
        S.shipped[e.id] = (S.shipped[e.id] || 0) + e.n;
    }
    S.gold += summary.sold;
    S.stats.earned += summary.sold;
    S.shipBin = [];

    // 2) skill levels
    for (i = 0; i < S.pendingLevels.length; i++)
    {
        var pl = S.pendingLevels[i];
        S.skills[pl.skill] = pl.lvl;
        summary.levels.push(pl);
        if (pl.skill === 'combat')
        {
            S.maxHealth = BASE_HEALTH + pl.lvl * 5;
        }
    }
    S.pendingLevels = [];

    // 3) advance the calendar
    S.day++;
    S.stats.daysPlayed++;
    if (S.day > DAYS_PER_SEASON)
    {
        S.day = 1;
        S.season++;
        if (S.season > 3)
        {
            S.season = 0;
            S.year++;
        }
        seasonChange();
    }
    S.time = DAY_START;
    S.weather = S.tomorrow;
    rollWeather();
    S.luck = Math.random() * 2 - 1;
    BUFF.list = null;

    // 4) world tick
    growCrops();
    growFruitTrees();
    tickCrabPots();
    tickMachines();
    tickAnimals();
    respawnWorld();
    tickBuilds();
    resetGifts();

    // 5) restore the farmer
    var restore = fainted ? .5 : (S.time <= DAY_START ? 1 : 1);
    S.energy = Math.round(S.maxEnergy * (fainted ? .5 : 1));
    S.health = S.maxHealth;
    S.water = S.waterCap;
    S.map = 'farmhouse';
    S.px = 6 * TILE + HALF;
    S.py = 9 * TILE + HALF;
    S.dir = 0;
    UI.collapsing = false;

    MAP = loadMap('farmhouse');
    saveGame();
    showDaySummary(summary, fainted, lostGold);
}

function seasonChange()
{
    // kill out-of-season crops, refresh forage and grass
    var mid, k;
    for (mid in S.crops)
    {
        if (!S.crops.hasOwnProperty(mid))
        {
            continue;
        }
        if (mid === 'greenhouse')
        {
            continue;
        }
        var cm = S.crops[mid];
        for (k in cm)
        {
            if (!cm.hasOwnProperty(k))
            {
                continue;
            }
            var cd = CROPS[cm[k].seed];
            if (cd && cd.season.indexOf(seasonId()) < 0)
            {
                delete cm[k];
            }
        }
    }
    // clear watered flags
    for (mid in S.soil)
    {
        if (!S.soil.hasOwnProperty(mid))
        {
            continue;
        }
        for (k in S.soil[mid])
        {
            if (S.soil[mid].hasOwnProperty(k))
            {
                S.soil[mid][k].w = 0;
            }
        }
    }
    // wipe seasonal forage from every loaded map
    for (mid in MAP_CACHE)
    {
        if (!MAP_CACHE.hasOwnProperty(mid))
        {
            continue;
        }
        var m = MAP_CACHE[mid];
        var i;
        for (i = m.objects.length - 1; i >= 0; i--)
        {
            if (m.objects[i].kind === 'forage')
            {
                m.objects.splice(i, 1);
            }
        }
        rebuildSolid(m);
    }
}

function growCrops()
{
    var mid, k;
    var speedBonus = hasProf('agriculturist') ? .1 : 0;
    for (mid in S.crops)
    {
        if (!S.crops.hasOwnProperty(mid))
        {
            continue;
        }
        var cm = S.crops[mid];
        var sm = soilMap(mid);
        var indoor = (mid === 'greenhouse');
        for (k in cm)
        {
            if (!cm.hasOwnProperty(k))
            {
                continue;
            }
            var c = cm[k];
            var soil = sm[k];
            var watered = (soil && soil.w) || (isRaining() && mid !== 'greenhouse');
            if (!watered)
            {
                continue;
            }
            var cd = CROPS[c.seed];
            if (!cd)
            {
                continue;
            }
            var step = 1;
            if (soil && soil.f === 'speed_gro')
            {
                step += Math.random() < .25 ? 1 : 0;
            }
            if (speedBonus > 0 && Math.random() < speedBonus)
            {
                step++;
            }
            if (c.regrow > 0)
            {
                c.regrow = Math.max(0, c.regrow - step);
            }
            else if (c.grown < cd.days)
            {
                c.grown = Math.min(cd.days, c.grown + step);
            }
        }
        // reset watering
        for (k in sm)
        {
            if (sm.hasOwnProperty(k))
            {
                sm[k].w = 0;
                if (sm[k].f === 'speed_gro' && Math.random() < .2)
                {
                    sm[k].f = null;
                }
            }
        }
    }
}

// fruit trees need 28 days to mature, then bear one fruit per day in season
function growFruitTrees()
{
    var season = seasonId();
    var mid;
    for (mid in MAP_CACHE)
    {
        if (!MAP_CACHE.hasOwnProperty(mid))
        {
            continue;
        }
        var m = MAP_CACHE[mid];
        var i;
        for (i = 0; i < m.objects.length; i++)
        {
            var o = m.objects[i];
            if (o.kind !== 'fruittree')
            {
                continue;
            }
            var def = FRUIT_TREES[o.sap];
            if (!def)
            {
                continue;
            }
            if (o.age === undefined)
            {
                o.age = 0;
            }
            o.age++;
            o.stage = Math.min(4, Math.floor(o.age / 7));
            if (o.stage >= 4 && (def.season === season || mid === 'greenhouse'))
            {
                o.fruit = Math.min(3, (o.fruit || 0) + 1);
            }
            else if (def.season !== season && mid !== 'greenhouse')
            {
                o.fruit = 0;
            }
        }
    }
}

function tickCrabPots()
{
    var mid;
    for (mid in MAP_CACHE)
    {
        if (!MAP_CACHE.hasOwnProperty(mid))
        {
            continue;
        }
        var m = MAP_CACHE[mid];
        var i;
        for (i = 0; i < m.objects.length; i++)
        {
            var o = m.objects[i];
            if (o.kind !== 'crabpot' || o.out || !o.baited)
            {
                continue;
            }
            var pool = (m.fish === 'ocean') ? CRAB_POT_POOL.ocean : CRAB_POT_POOL.fresh;
            o.out = pool[Math.floor(Math.random() * pool.length)];
            o.baited = false;
        }
    }
}

function respawnWorld()
{
    var season = seasonId();
    var mid;
    for (mid in MAP_CACHE)
    {
        if (!MAP_CACHE.hasOwnProperty(mid))
        {
            continue;
        }
        var m = MAP_CACHE[mid];
        if (!m.outdoor)
        {
            continue;
        }
        var i;
        // clear yesterday's drops
        for (i = m.objects.length - 1; i >= 0; i--)
        {
            var o = m.objects[i];
            if (o.kind === 'drop')
            {
                o.life = (o.life || 0) + 1;
                if (o.life > 1)
                {
                    m.objects.splice(i, 1);
                }
            }
        }
        // forage respawn on nature maps
        var forageCap = { forest: 8, mountain: 5, town: 3, beach: 6, farm: 2 }[mid] || 0;
        var have = 0;
        for (i = 0; i < m.objects.length; i++)
        {
            if (m.objects[i].kind === 'forage')
            {
                have++;
            }
        }
        var want = forageCap - have;
        var tries = 0;
        while (want > 0 && tries < 200)
        {
            tries++;
            var x = 2 + Math.floor(Math.random() * (m.w - 4));
            var y = 2 + Math.floor(Math.random() * (m.h - 4));
            if (isSolid(m, x, y) || objAt(m, x, y))
            {
                continue;
            }
            var t = tileAt(m, x, y);
            if (mid === 'beach')
            {
                if (t !== T_SAND)
                {
                    continue;
                }
                m.objects.push({ kind: 'forage', x: x, y: y, item: BEACH_FORAGE[Math.floor(Math.random() * BEACH_FORAGE.length)] });
            }
            else
            {
                if (t !== T_GRASS)
                {
                    continue;
                }
                var pool = FORAGE[season];
                m.objects.push({ kind: 'forage', x: x, y: y, item: pool[Math.floor(Math.random() * pool.length)] });
            }
            want--;
        }
        // weeds creep back onto the farm, but the total is capped so an
        // untended farm never fills up (and never tanks the frame rate)
        var weedCount = 0;
        for (i = 0; i < m.objects.length; i++)
        {
            if (m.objects[i].kind === 'weed')
            {
                weedCount++;
            }
        }
        if (mid === 'farm' && weedCount < 60 && Math.random() < .7)
        {
            var n = Math.min(1 + Math.floor(Math.random() * 3), 60 - weedCount);
            var t2 = 0;
            while (n > 0 && t2 < 120)
            {
                t2++;
                var wx = 3 + Math.floor(Math.random() * (m.w - 6));
                var wy = 3 + Math.floor(Math.random() * (m.h - 6));
                if (isSolid(m, wx, wy) || objAt(m, wx, wy))
                {
                    continue;
                }
                if (tileAt(m, wx, wy) !== T_GRASS)
                {
                    continue;
                }
                if (soilAt(mid, wx, wy))
                {
                    continue;
                }
                m.objects.push({ kind: 'weed', x: wx, y: wy });
                n--;
            }
        }
        // trees grow
        for (i = 0; i < m.objects.length; i++)
        {
            var tr = m.objects[i];
            if (tr.kind === 'tree' && tr.stage < 4 && Math.random() < .2)
            {
                tr.stage++;
            }
        }
        rebuildSolid(m);
    }
}

function tickBuilds()
{
    if (S.upgrade)
    {
        S.upgrade.days--;
        if (S.upgrade.days <= 0)
        {
            var u = S.upgrade;
            if (u.tool === 'rod')
            {
                S.rod = u.tier;
            }
            else
            {
                S.tools[u.tool] = u.tier;
                if (u.tool === 'can')
                {
                    S.waterCap = 40 + u.tier * 15;
                    S.water = S.waterCap;
                }
            }
            S.upgrade = null;
            S.flags.toolReady = true;
        }
    }
    if (S.pendingBuild)
    {
        S.pendingBuild.days--;
        if (S.pendingBuild.days <= 0)
        {
            var b = S.pendingBuild;
            var farm = loadMap('farm');
            var bd = BUILDINGS[b.kind];
            if (b.upgradeOf)
            {
                var i;
                for (i = 0; i < S.farmBuildings.length; i++)
                {
                    if (S.farmBuildings[i].id === b.upgradeOf)
                    {
                        S.farmBuildings[i].kind = b.kind;
                        S.farmBuildings[i].cap = bd.cap || 0;
                    }
                }
            }
            else
            {
                S.farmBuildings.push({ id: 'b' + Date.now(), kind: b.kind, x: b.x, y: b.y, cap: bd.cap || 0, animals: [] });
            }
            syncFarmBuildings();
            S.pendingBuild = null;
            S.flags.buildReady = true;
        }
    }
}

function syncFarmBuildings()
{
    var farm = loadMap('farm');
    var i;
    for (i = farm.objects.length - 1; i >= 0; i--)
    {
        if (farm.objects[i].kind === 'animalbuilding')
        {
            farm.objects.splice(i, 1);
        }
    }
    for (i = 0; i < S.farmBuildings.length; i++)
    {
        var b = S.farmBuildings[i];
        var bd = BUILDINGS[b.kind];
        farm.objects.push({ kind: 'animalbuilding', bkind: b.kind, bid: b.id, x: b.x, y: b.y, tw: bd.w, th: bd.h });
    }
    rebuildSolid(farm);
}

function resetGifts()
{
    var weekNo = (S.year - 1) * 112 + S.season * 28 + Math.floor((S.day - 1) / 7);
    var k;
    for (k in S.npc)
    {
        if (!S.npc.hasOwnProperty(k))
        {
            continue;
        }
        var n = S.npc[k];
        n.giftDay = -1;
        if (n.weekNo !== weekNo)
        {
            n.weekNo = weekNo;
            n.giftWeek = 0;
        }
    }
}

// ---------- machines ----------

// absolute game time in hours since year 1 spring 1, 00:00.
// machines store readyAt in this unit so no per-day/per-tick drift is possible.
function nowHours()
{
    var days = ((S.year - 1) * 4 + S.season) * DAYS_PER_SEASON + (S.day - 1);
    return days * 24 + S.time / 60;
}

function tickMachines()
{
    var now = nowHours();
    var mid;
    for (mid in MAP_CACHE)
    {
        if (!MAP_CACHE.hasOwnProperty(mid))
        {
            continue;
        }
        var m = MAP_CACHE[mid];
        var i;
        for (i = 0; i < m.objects.length; i++)
        {
            var o = m.objects[i];
            if (o.kind !== 'machine')
            {
                continue;
            }
            if (o.busy)
            {
                if (o.readyAt === undefined)
                {
                    o.readyAt = now;   // save written before readyAt existed
                }
                if (now >= o.readyAt)
                {
                    o.busy = false;
                    o.out = o.pending;
                    o.pending = null;
                }
            }
            else if (!o.out && (o.mk === 'beehouse' || o.mk === 'tapper'))
            {
                if (o.mk === 'beehouse' && seasonId() === 'winter')
                {
                    continue;
                }
                o.cool = (o.cool || 0) + 1;
                var need = o.mk === 'beehouse' ? 4 : 4;
                if (o.cool >= need)
                {
                    o.cool = 0;
                    o.out = { id: o.mk === 'beehouse' ? 'honey' : 'sap', n: 1, q: 0 };
                }
            }
        }
    }
}

// machine input: returns true when accepted
function machineInsert(o, slotIdx)
{
    var sl = S.inv[slotIdx];
    if (!sl || o.busy || o.out)
    {
        return false;
    }
    var def = MACHINES[o.mk];
    if (!def)
    {
        return false;
    }
    var i;
    for (i = 0; i < def.rules.length; i++)
    {
        var r = def.rules[i];
        if (r.from && r.from !== sl.id)
        {
            continue;
        }
        if (!r.from && r.kind)
        {
            var isFruit = FRUITS.indexOf(sl.id) >= 0;
            var isVeg = VEGGIES.indexOf(sl.id) >= 0;
            if (r.kind === 'fruit' && !isFruit)
            {
                continue;
            }
            if (r.kind === 'veg' && !isVeg)
            {
                continue;
            }
            if (r.kind === 'anycrop' && !CROP_TO_SEED[sl.id])
            {
                continue;
            }
        }
        else if (!r.from)
        {
            continue;
        }
        var need = r.need || 1;
        if (sl.n < need)
        {
            toast(need + '개가 필요해요.');
            return false;
        }
        if (def.fuel && invCount(def.fuel) < 1)
        {
            toast(ITEMS[def.fuel].name + '이 필요해요.');
            return false;
        }
        // resolve derived product price from the source item
        var outId = r.to;
        var outN = 1;
        var px;
        if (r.kind === 'anycrop')
        {
            outId = CROP_TO_SEED[sl.id];
            outN = 1 + Math.floor(Math.random() * 3);
        }
        else if (ITEMS[outId] && ITEMS[outId].derived)
        {
            var base = ITEMS[sl.id].price;
            px = Math.floor(base * (r.mult || 2) + (r.add || 0));
        }
        var outQ = r.quality || 0;
        removeItem(sl.id, need, sl.q);
        if (def.fuel)
        {
            removeItem(def.fuel, 1);
        }
        o.busy = true;
        o.readyAt = nowHours() + (r.hours || def.hours);
        o.pending = { id: outId, n: outN, q: outQ, px: px, srcName: ITEMS[sl.id].name };
        sfx('machine');
        return true;
    }
    toast('여기엔 넣을 수 없어요.');
    return false;
}

function machineCollect(o)
{
    if (!o.out)
    {
        return false;
    }
    var out = o.out;
    var name = ITEMS[out.id].name;
    if (out.px !== undefined && out.srcName)
    {
        name = out.srcName + ' ' + name;
    }
    var slotOk = addItemWithPrice(out);
    if (!slotOk)
    {
        toast('가방이 가득 찼어요!');
        return false;
    }
    o.out = null;
    toast(name + ' 획득!');
    sfx('pickup');
    return true;
}

// artisan goods carry their own price, so they need a dedicated add path
function addItemWithPrice(out)
{
    var i;
    if (out.px === undefined)
    {
        return addItem(out.id, out.n, out.q) > 0;
    }
    for (i = 0; i < S.inv.length; i++)
    {
        var sl = S.inv[i];
        if (sl && sl.id === out.id && sl.px === out.px && (sl.q || 0) === (out.q || 0) && sl.n < 999)
        {
            sl.n += out.n;
            return true;
        }
    }
    for (i = 0; i < S.invSize; i++)
    {
        if (!S.inv[i])
        {
            S.inv[i] = { id: out.id, n: out.n, q: out.q || 0, px: out.px, nm: out.srcName };
            return true;
        }
    }
    return false;
}

// ---------- animals ----------

function tickAnimals()
{
    var i;
    for (i = 0; i < S.animals.length; i++)
    {
        var a = S.animals[i];
        a.age++;
        if (a.age >= ANIMALS[a.kind].matureDays)
        {
            a.mature = true;
        }
        var fed = a.fed || S.flags.autoFeed;
        if (!fed)
        {
            a.love = Math.max(0, a.love - 20);
            a.hungry = true;
        }
        else
        {
            a.hungry = false;
            if (a.pet)
            {
                a.love = Math.min(1000, a.love + 15);
            }
            else
            {
                a.love = Math.max(0, a.love - 5);
            }
        }
        a.pet = false;
        a.fed = false;
        // produce
        var def = ANIMALS[a.kind];
        if (a.mature && !a.hungry)
        {
            a.since = (a.since || 0) + 1;
            if (a.since >= def.prodDays)
            {
                a.since = 0;
                var q = 0;
                if (a.love > 800)
                {
                    q = 2;
                }
                else if (a.love > 500)
                {
                    q = 1;
                }
                var pid = def.prod;
                if (a.kind === 'chicken' && a.love > 700 && Math.random() < .4)
                {
                    pid = 'large_egg';
                }
                if (a.kind === 'cow' && a.love > 700 && Math.random() < .4)
                {
                    pid = 'large_milk';
                }
                if (a.kind === 'goat' && a.love > 700 && Math.random() < .4)
                {
                    pid = 'large_goat_milk';
                }
                a.product = { id: pid, q: q };
            }
        }
    }
    // hay drain from silo
    var need = S.animals.length;
    if (S.flags.hasSilo && S.hay === undefined)
    {
        S.hay = 0;
    }
}

// ---------- save / load ----------

function serializeMaps()
{
    var out = {};
    var mid;
    for (mid in MAP_CACHE)
    {
        if (!MAP_CACHE.hasOwnProperty(mid))
        {
            continue;
        }
        var m = MAP_CACHE[mid];
        var keep = [];
        var i;
        for (i = 0; i < m.objects.length; i++)
        {
            var o = m.objects[i];
            if (o.kind === 'building' || o.kind === 'furn' || o.kind === 'sign' ||
                o.kind === 'board' || o.kind === 'fountain' || o.kind === 'mine_entrance' ||
                o.kind === 'bin' || o.kind === 'animalbuilding')
            {
                continue;   // rebuilt from the map definition
            }
            keep.push(o);
        }
        out[mid] = keep;
    }
    return out;
}

function loadMap(id)
{
    var m = MAP_CACHE[id];
    if (m)
    {
        return m;
    }
    m = buildMap(id);
    if (S && S.mapObjs && S.mapObjs[id])
    {
        // drop the procedural scatter and use the saved object list
        var keep = [];
        var i;
        for (i = 0; i < m.objects.length; i++)
        {
            var o = m.objects[i];
            if (o.kind === 'building' || o.kind === 'furn' || o.kind === 'sign' ||
                o.kind === 'board' || o.kind === 'fountain' || o.kind === 'mine_entrance' ||
                o.kind === 'bin')
            {
                keep.push(o);
            }
        }
        m.objects = keep.concat(JSON.parse(JSON.stringify(S.mapObjs[id])));
        rebuildSolid(m);
    }
    if (id === 'farm')
    {
        syncFarmBuildings();
    }
    return m;
}

function saveGame(silent)
{

        S.mapObjs = serializeMaps();

        localStorage.setItem(SAVE_KEY, JSON.stringify(S));

function hasSave()

function loadGame()

// ---------- save code (device transfer) ----------

function makeSaveCode()
{
    S.mapObjs = serializeMaps();
    var json = JSON.stringify(S);
    var bytes = utf8Bytes(json);
    var b64 = bytesToB64(rle(bytes));
    return SAVE_PREFIX + b64;
}

function applySaveCode(code)
{
    var ok = false;
    do
    {
        code = (code || '').trim();
        if (code.indexOf(SAVE_PREFIX) !== 0)
        {
            toast('별밤 농장 코드가 아니에요.');
            break;
        }
        var body = code.slice(SAVE_PREFIX.length).replace(/\s+/g, '');
        var data;
        try
        {
            var bytes = unrle(b64ToBytes(body));
            data = JSON.parse(bytesToUtf8(bytes));
        }
        catch (e)
        {
            toast('코드를 읽을 수 없어요.');
            break;
        }
        if (!data || !data.inv)
        {
            toast('코드가 손상됐어요.');
            break;
        }
        S = migrateSave(data);
        MAP_CACHE = {};
        MAP = loadMap(S.map);
        saveGame(true);
        ok = true;
    }
    while (false);
    return ok;
}

function utf8Bytes(str)
{
    var out = [], i;
    for (i = 0; i < str.length; i++)
    {
        var c = str.charCodeAt(i);
        if (c < 0x80)
        {
            out.push(c);
        }
        else if (c < 0x800)
        {
            out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
        }
        else
        {
            out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
        }
    }
    return out;
}

function bytesToUtf8(b)
{
    var s = '', i = 0;
    while (i < b.length)
    {
        var c = b[i++];
        if (c < 0x80)
        {
            s += String.fromCharCode(c);
        }
        else if (c < 0xe0)
        {
            s += String.fromCharCode(((c & 31) << 6) | (b[i++] & 63));
        }
        else
        {
            s += String.fromCharCode(((c & 15) << 12) | ((b[i++] & 63) << 6) | (b[i++] & 63));
        }
    }
    return s;
}

// simple run-length pass; save JSON has long runs of repeated punctuation
function rle(bytes)
{
    var out = [], i = 0;
    while (i < bytes.length)
    {
        var v = bytes[i];
        var run = 1;
        while (i + run < bytes.length && bytes[i + run] === v && run < 255)
        {
            run++;
        }
        if (run >= 4)
        {
            out.push(0, run, v);
            i += run;
        }
        else
        {
            var k;
            for (k = 0; k < run; k++)
            {
                out.push(v === 0 ? 1 : v);
            }
            i += run;
        }
    }
    return out;
}

function unrle(bytes)
{
    var out = [], i = 0;
    while (i < bytes.length)
    {
        if (bytes[i] === 0)
        {
            var run = bytes[i + 1], v = bytes[i + 2], k;
            for (k = 0; k < run; k++)
            {
                out.push(v);
            }
            i += 3;
        }
        else
        {
            out.push(bytes[i]);
            i++;
        }
    }
    return out;
}

var B64C = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';

function bytesToB64(b)
{
    var s = '', i;
    for (i = 0; i < b.length; i += 3)
    {
        var n = (b[i] << 16) | ((b[i + 1] || 0) << 8) | (b[i + 2] || 0);
        s += B64C[(n >> 18) & 63] + B64C[(n >> 12) & 63];
        s += (i + 1 < b.length) ? B64C[(n >> 6) & 63] : '=';
        s += (i + 2 < b.length) ? B64C[n & 63] : '=';
    }
    return s;
}

function b64ToBytes(s)
{
    var out = [], i;
    s = s.replace(/=+$/, '');
    for (i = 0; i < s.length; i += 4)
    {
        var n = (B64C.indexOf(s[i]) << 18) | (B64C.indexOf(s[i + 1]) << 12) |
            ((B64C.indexOf(s[i + 2]) & 63) << 6) | (B64C.indexOf(s[i + 3]) & 63);
        out.push((n >> 16) & 255);
        if (i + 2 < s.length)
        {
            out.push((n >> 8) & 255);
        }
        if (i + 3 < s.length)
        {
            out.push(n & 255);
        }
    }
    return out;
}

// ---------- bundles ----------

function bundleItemMatch(spec, sl)
{
    // spec forms: "id", "id:count", "id@quality"
    var id = spec, minQ = 0, cnt = 1;
    var at = spec.indexOf('@');
    if (at > 0)
    {
        minQ = parseInt(spec.slice(at + 1), 10);
        id = spec.slice(0, at);
    }
    var col = id.indexOf(':');
    if (col > 0)
    {
        cnt = parseInt(id.slice(col + 1), 10);
        id = id.slice(0, col);
    }
    // "a_or_b" specs accept either item; resolve to whichever actually exists
    var orIdx = id.indexOf('_or_');
    if (orIdx > 0 && !ITEMS[id])
    {
        var a = id.slice(0, orIdx);
        var b = id.slice(orIdx + 4);
        if (sl && (sl.id === a || sl.id === b))
        {
            id = sl.id;
        }
        else
        {
            id = ITEMS[a] ? a : b;
        }
    }
    if (!sl)
    {
        return { id: id, cnt: cnt, minQ: minQ };
    }
    return sl.id === id && (sl.q || 0) >= minQ && sl.n >= cnt;
}

function bundleDonate(roomIdx, bIdx, slotIdx, specIdx)
{
    var room = BUNDLES[roomIdx];
    var bd = room.list[bIdx];
    var st = S.bundles[room.room + ':' + bIdx];
    var sl = S.inv[slotIdx];
    if (!sl || st.done)
    {
        return false;
    }
    if (st.have.indexOf(specIdx) >= 0)
    {
        return false;
    }
    var spec = bd.items[specIdx];
    if (!bundleItemMatch(spec, sl))
    {
        return false;
    }
    var m = bundleItemMatch(spec, null);
    removeItem(sl.id, m.cnt, sl.q);
    st.have.push(specIdx);
    sfx('bundle');
    if (st.have.length >= bd.need)
    {
        st.done = true;
        var k;
        for (k in bd.give)
        {
            if (!bd.give.hasOwnProperty(k))
            {
                continue;
            }
            if (k === 'g')
            {
                S.gold += bd.give[k];
            }
            else if (ITEMS[k])
            {
                give(k, bd.give[k]);
            }
        }
        checkRoomComplete(roomIdx);
    }
    return true;
}

function checkRoomComplete(roomIdx)
{
    var room = BUNDLES[roomIdx];
    var all = true, j;
    for (j = 0; j < room.list.length; j++)
    {
        if (!S.bundles[room.room + ':' + j].done)
        {
            all = false;
            break;
        }
    }
    if (!all || S.bundles['room:' + room.room])
    {
        return;
    }
    S.bundles['room:' + room.room] = true;
    applyRoomReward(room.reward);
    modalMsg('✨ ' + room.roomName + ' 완성!', room.rewardName + '\n\n마을이 조금 더 되살아났어요.');
    checkCenterComplete();
}

function applyRoomReward(r)
{
    if (r === 'greenhouse')
    {
        S.flags.greenhouse = true;
    }
    else if (r === 'minecart')
    {
        S.flags.minecart = true;
    }
    else if (r === 'bus')
    {
        S.flags.bus = true;
    }
    else if (r === 'bridge')
    {
        S.flags.quarry = true;
    }
    else if (r === 'friend')
    {
        var k;
        for (k in S.npc)
        {
            if (S.npc.hasOwnProperty(k))
            {
                S.npc[k].pts += 500;
            }
        }
    }
    else if (r === 'glittering')
    {
        S.flags.glittering = true;
    }
}

function checkCenterComplete()
{
    var i;
    for (i = 0; i < BUNDLES.length; i++)
    {
        if (!S.bundles['room:' + BUNDLES[i].room])
        {
            return;
        }
    }
    if (S.flags.centerDone)
    {
        return;
    }
    S.flags.centerDone = true;
    give('stardrop', 1);
    modalMsg('🌟 커뮤니티 센터 복구 완료!', '별빛 정령들이 마을을 되살렸어요.\n계곡 전체가 다시 활기를 되찾았습니다.\n\n정말 잘했어요!\n(스타드롭을 받았습니다)');
}

// Starry Farm - fishing: cast, bite, and the vertical bar minigame.
// All comments ASCII only.

var FISHING = {
    on: false,
    phase: 'idle',      // cast wait bite play result
    t: 0,
    tx: 0, ty: 0,       // bobber tile
    biteAt: 0,
    fish: null,
    treasure: false,
    // minigame state
    barY: .5,           // 0 = top, 1 = bottom (centre of the green bar)
    barV: 0,
    barH: .22,
    fishY: .5,
    fishV: 0,
    fishTarget: .5,
    fishTimer: 0,
    prog: .3,
    hold: false,
    result: null
};

function canFishAt(m, tx, ty)
{
    return isWater(m, tx, ty);
}

// pick a fish for the current spot/season/time/weather
function rollFish(locKind)
{
    var pool = [];
    var i;
    var hour = Math.floor(S.time / 60);
    var season = seasonId();
    for (i = 0; i < FISH.length; i++)
    {
        var f = FISH[i];
        if (f.loc.indexOf(locKind) < 0)
        {
            continue;
        }
        if (f.seasons !== 'all' && f.seasons.indexOf(season) < 0)
        {
            continue;
        }
        if (hour < f.time[0] || hour > f.time[1])
        {
            continue;
        }
        if (f.w === 'rain' && !isRaining())
        {
            continue;
        }
        if (f.w === 'sun' && isRaining())
        {
            continue;
        }
        if (f.rare)
        {
            var chance = .01 + Math.max(0, S.luck) * .02 + skillLvl('fishing') * .002;
            if (skillLvl('fishing') < 10 || Math.random() > chance)
            {
                continue;
            }
        }
        pool.push(f);
    }
    if (pool.length === 0)
    {
        return null;
    }
    // bias toward easier fish at low skill
    var lvl = skillLvl('fishing');
    var weighted = [];
    for (i = 0; i < pool.length; i++)
    {
        var f2 = pool[i];
        var w = f2.diff <= 30 + lvl * 7 ? 3 : 1;
        var k;
        for (k = 0; k < w; k++)
        {
            weighted.push(f2);
        }
    }
    return weighted[Math.floor(Math.random() * weighted.length)];
}

function startFishing(tx, ty)
{
    if (S.rod < 0)
    {
        toast('낚싯대가 없어요.');
        return false;
    }
    if (S.energy < 8)
    {
        toast('너무 지쳤어요.');
        return false;
    }
    FISHING.on = true;
    FISHING.phase = 'cast';
    FISHING.t = 0;
    FISHING.tx = tx;
    FISHING.ty = ty;
    FISHING.result = null;
    useEnergy(8);
    sfx('cast');
    return true;
}

function endFishing()
{
    FISHING.on = false;
    FISHING.phase = 'idle';
    FISHING.result = null;
    UI.blockTime = false;
    var box = document.getElementById('fishBox');
    if (box)
    {
        box.style.display = 'none';
    }
}

function fishingHold(on)
{
    FISHING.hold = on;
    if (FISHING.phase === 'bite' && on)
    {
        hookFish();
    }
    else if (FISHING.phase === 'wait' && on)
    {
        // reeling in early just cancels
        endFishing();
    }
}

function hookFish()
{
    var locKind = MAP.fish || 'lake';
    if (MAP.id === 'mine')
    {
        locKind = 'mine';
    }
    var f = rollFish(locKind);
    FISHING.treasure = Math.random() < (hasProf('pirate') ? .12 : .06) + Math.max(0, S.luck) * .05;
    if (!f)
    {
        // nothing biting here right now: junk
        FISHING.phase = 'result';
        FISHING.result = { junk: true, id: Math.random() < .5 ? 'trash' : 'seaweed' };
        finishFishing();
        return;
    }
    FISHING.fish = f;
    FISHING.phase = 'play';
    FISHING.barY = .5;
    FISHING.barV = 0;
    FISHING.barH = .18 + skillLvl('fishing') * .012 + (S.rod >= 2 ? .03 : 0);
    FISHING.fishY = .5;
    FISHING.fishV = 0;
    FISHING.fishTarget = .5;
    FISHING.fishTimer = 0;
    FISHING.prog = .3;
    UI.blockTime = true;
    var box = document.getElementById('fishBox');
    if (box)
    {
        box.style.display = 'block';
    }
    sfx('hook');
}

function updateFishing(dt)
{
    if (!FISHING.on)
    {
        return;
    }
    FISHING.t += dt;

    if (FISHING.phase === 'cast')
    {
        if (FISHING.t > .5)
        {
            FISHING.phase = 'wait';
            FISHING.t = 0;
            var base = 1.2 + Math.random() * 9;
            base *= (1 - Math.min(.5, skillLvl('fishing') * .04));
            if (invCount('bait') > 0)
            {
                base *= .55;
            }
            FISHING.biteAt = base;
        }
        return;
    }

    if (FISHING.phase === 'wait')
    {
        if (FISHING.t >= FISHING.biteAt)
        {
            FISHING.phase = 'bite';
            FISHING.t = 0;
            if (invCount('bait') > 0)
            {
                removeItem('bait', 1);
            }
            sfx('bite');
        }
        return;
    }

    if (FISHING.phase === 'bite')
    {
        if (FISHING.t > 1.1)
        {
            toast('놓쳤어요...');
            endFishing();
        }
        return;
    }

    if (FISHING.phase === 'play')
    {
        stepMinigame(dt);
        return;
    }
}

function stepMinigame(dt)
{
    var f = FISHING.fish;
    var diff = f.diff / 100;

    // player bar: hold to rise, gravity pulls down
    var acc = FISHING.hold ? -1.7 : 1.7;
    FISHING.barV += acc * dt;
    FISHING.barV *= .88;
    FISHING.barY += FISHING.barV * dt * 2.2;
    var half = FISHING.barH / 2;
    if (FISHING.barY < half)
    {
        FISHING.barY = half;
        FISHING.barV = Math.max(0, FISHING.barV);
    }
    if (FISHING.barY > 1 - half)
    {
        FISHING.barY = 1 - half;
        FISHING.barV = Math.min(0, FISHING.barV);
    }

    // fish motion
    FISHING.fishTimer -= dt;
    if (FISHING.fishTimer <= 0)
    {
        var span = .25 + diff * .55;
        var mid = FISHING.fishY;
        var t2 = mid + (Math.random() * 2 - 1) * span;
        if (f.mv === 'sink')
        {
            t2 = mid + Math.random() * span;
        }
        if (f.mv === 'float')
        {
            t2 = mid - Math.random() * span;
        }
        FISHING.fishTarget = Math.max(.04, Math.min(.96, t2));
        FISHING.fishTimer = f.mv === 'dart' ? (.18 + Math.random() * .4) : (.5 + Math.random() * 1.1 * (1 - diff * .5));
    }
    var speed = f.mv === 'dart' ? 3.2 : (f.mv === 'smooth' ? 1.0 : 1.8);
    var dy = FISHING.fishTarget - FISHING.fishY;
    FISHING.fishV += dy * speed * dt * 6;
    FISHING.fishV *= f.mv === 'smooth' ? .82 : .74;
    FISHING.fishY += FISHING.fishV * dt;
    FISHING.fishY = Math.max(.03, Math.min(.97, FISHING.fishY));

    // progress
    var inside = Math.abs(FISHING.fishY - FISHING.barY) <= half;
    if (inside)
    {
        FISHING.prog += dt * (.42 - diff * .16);
    }
    else
    {
        FISHING.prog -= dt * (.22 + diff * .3);
    }
    FISHING.prog = Math.max(0, Math.min(1, FISHING.prog));

    if (FISHING.prog >= 1)
    {
        FISHING.phase = 'result';
        FISHING.result = { fish: f };
        finishFishing();
    }
    else if (FISHING.prog <= 0)
    {
        FISHING.phase = 'result';
        FISHING.result = { lost: true };
        finishFishing();
    }
}

function finishFishing()
{
    var r = FISHING.result;
    var box = document.getElementById('fishBox');
    if (box)
    {
        box.style.display = 'none';
    }
    UI.blockTime = false;
    if (r.lost)
    {
        toast('물고기가 도망쳤어요...');
        endFishing();
        return;
    }
    if (r.junk)
    {
        give(r.id, 1);
        addXp('fishing', 3);
        toast(ITEMS[r.id].name + '을 건졌어요.');
        endFishing();
        return;
    }
    var f = r.fish;
    var q = 0;
    var perfect = FISHING.prog >= .99;
    var roll = Math.random() + skillLvl('fishing') * .02 + (perfect ? .2 : 0);
    if (roll > 1.15)
    {
        q = 3;
    }
    else if (roll > .95)
    {
        q = 2;
    }
    else if (roll > .7)
    {
        q = 1;
    }
    give(f.id, 1, q);
    S.caughtFish[f.id] = (S.caughtFish[f.id] || 0) + 1;
    S.stats.fishCaught++;
    addXp('fishing', Math.round(8 + f.diff * .4));
    var msg = f.name + '을(를) 낚았어요!';
    if (q > 0)
    {
        msg += ' (' + QUALITY_KR[q] + ')';
    }
    toast(msg);
    sfx('catch');
    if (FISHING.treasure)
    {
        var loot = ['quartz', 'coal', 'copper_ore', 'iron_ore', 'geode', 'bait', 'wood', 'stone'];
        var got = loot[Math.floor(Math.random() * loot.length)];
        give(got, 1 + Math.floor(Math.random() * 3));
        toast('보물 상자! ' + ITEMS[got].name);
    }
    endFishing();
}

// ---------- rendering ----------

function drawFishingWorld(g, cam)
{
    if (!FISHING.on)
    {
        return;
    }
    var bx = FISHING.tx * TILE + HALF - cam.x;
    var by = FISHING.ty * TILE + HALF - cam.y;
    // line
    var px = S.px - cam.x;
    var py = S.py - cam.y - 30;
    g.strokeStyle = 'rgba(240,240,255,.85)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(px, py);
    g.lineTo(bx, by);
    g.stroke();
    // bobber
    var bob = FISHING.phase === 'bite' ? Math.sin(TICK * .8) * 2 : Math.sin(TICK * .12) * 1;
    pr(g, bx - 4, by - 4 + bob, 8, 4, '#e04040');
    pr(g, bx - 4, by + bob, 8, 4, '#f8f8f8');
    if (FISHING.phase === 'bite')
    {
        pr(g, bx - 2, by - 26, 4, 12, '#ffe040');
        pr(g, bx - 2, by - 10, 4, 4, '#ffe040');
        var i;
        for (i = 0; i < 3; i++)
        {
            var a = (TICK * .3 + i * 2) % 6;
            g.globalAlpha = 1 - a / 6;
            g.strokeStyle = '#cfe8ff';
            g.beginPath();
            g.arc(bx, by + bob, 6 + a * 4, 0, Math.PI * 2);
            g.stroke();
            g.globalAlpha = 1;
        }
    }
}

function drawFishingBar()
{
    if (!FISHING.on || FISHING.phase !== 'play')
    {
        return;
    }
    var cv = document.getElementById('fishCv');
    if (!cv)
    {
        return;
    }
    var g = cv.getContext('2d');
    g.imageSmoothingEnabled = false;
    var W = cv.width, H = cv.height;
    g.clearRect(0, 0, W, H);

    var trackX = 18, trackY = 14, trackW = 26, trackH = H - 28;

    // frame
    g.fillStyle = '#4a2c14';
    g.fillRect(6, 4, 52, H - 8);
    g.fillStyle = '#7a4a22';
    g.fillRect(9, 7, 46, H - 14);
    g.fillStyle = '#2a1a0c';
    g.fillRect(trackX - 2, trackY - 2, trackW + 4, trackH + 4);
    g.fillStyle = '#1a2a3a';
    g.fillRect(trackX, trackY, trackW, trackH);

    // green catch bar
    var half = FISHING.barH / 2;
    var by = trackY + (FISHING.barY - half) * trackH;
    var bh = FISHING.barH * trackH;
    g.fillStyle = '#3aa83a';
    g.fillRect(trackX, by, trackW, bh);
    g.fillStyle = '#6ad86a';
    g.fillRect(trackX, by, trackW, 2);
    g.fillStyle = '#2a7a2a';
    g.fillRect(trackX, by + bh - 2, trackW, 2);

    // fish icon
    var fy = trackY + FISHING.fishY * trackH;
    var ic = itemIcon(FISHING.fish.id, 18);
    g.drawImage(ic, trackX + 4, Math.round(fy - 9));

    // progress bar on the right
    var pX = 48, pY = trackY, pW = 7, pH = trackH;
    g.fillStyle = '#2a1a0c';
    g.fillRect(pX - 1, pY - 1, pW + 2, pH + 2);
    g.fillStyle = '#3a2a1a';
    g.fillRect(pX, pY, pW, pH);
    var fh = FISHING.prog * pH;
    var col = FISHING.prog > .66 ? '#5ad85a' : (FISHING.prog > .33 ? '#e8c838' : '#e05838');
    g.fillStyle = col;
    g.fillRect(pX, pY + pH - fh, pW, fh);

    // treasure marker
    if (FISHING.treasure)
    {
        g.drawImage(itemIcon('chest', 12), trackX + 7, trackY + 6);
    }
}


/* ===== mine.js ===== */

// Starry Farm - the mine: procedural floors, monsters, melee combat.
// All comments ASCII only.

var MINE = {
    floor: 0,
    mobs: [],
    swing: 0,          // frames left in a sword swing
    swingDir: 0,
    hurtCd: 0,
    ladderFound: false
};

var MINE_W = 34, MINE_H = 26;

// ---------- floor generation ----------

function genMineFloor(floor)
{
    var m = {
        id: 'mine', name: '광산 ' + floor + '층', w: MINE_W, h: MINE_H, outdoor: false,
        fish: 'mine', floor: floor, tiles: new Uint8Array(MINE_W * MINE_H),
        objects: [], warps: [], till: []
    };
    var i, j;
    for (i = 0; i < m.tiles.length; i++)
    {
        m.tiles[i] = T_CAVEWALL;
    }

    // carve rooms
    var rooms = [];
    var count = 5 + Math.floor(Math.random() * 4);
    var tries = 0;
    while (rooms.length < count && tries < 200)
    {
        tries++;
        var rw = 4 + Math.floor(Math.random() * 7);
        var rh = 4 + Math.floor(Math.random() * 5);
        var rx = 2 + Math.floor(Math.random() * (MINE_W - rw - 4));
        var ry = 2 + Math.floor(Math.random() * (MINE_H - rh - 4));
        var clash = false;
        for (i = 0; i < rooms.length; i++)
        {
            var o = rooms[i];
            if (rx < o.x + o.w + 1 && rx + rw + 1 > o.x && ry < o.y + o.h + 1 && ry + rh + 1 > o.y)
            {
                clash = true;
                break;
            }
        }
        if (clash)
        {
            continue;
        }
        rooms.push({ x: rx, y: ry, w: rw, h: rh });
        fillRect(m, rx, ry, rw, rh, T_CAVE);
    }

    // corridors between consecutive rooms
    for (i = 1; i < rooms.length; i++)
    {
        var a = rooms[i - 1], b = rooms[i];
        var ax = Math.floor(a.x + a.w / 2), ay = Math.floor(a.y + a.h / 2);
        var bx = Math.floor(b.x + b.w / 2), by = Math.floor(b.y + b.h / 2);
        var x = ax, y = ay;
        while (x !== bx)
        {
            fillRect(m, x, y, 1, 2, T_CAVE);
            x += (bx > x) ? 1 : -1;
        }
        while (y !== by)
        {
            fillRect(m, x, y, 2, 1, T_CAVE);
            y += (by > y) ? 1 : -1;
        }
    }

    // small water pools on some floors (fishable)
    if (floor % 7 === 3 && rooms.length > 2)
    {
        var pr2 = rooms[2];
        fillRect(m, pr2.x + 1, pr2.y + 1, Math.max(2, pr2.w - 2), Math.max(2, pr2.h - 2), T_WATER);
    }

    // entrance: first room
    var start = rooms[0] || { x: 3, y: 3, w: 4, h: 4 };
    m.entry = { x: start.x + 1, y: start.y + 1 };
    fillRect(m, m.entry.x - 1, m.entry.y - 1, 3, 3, T_CAVE);
    m.objects.push({ kind: 'mine_up', x: m.entry.x, y: m.entry.y });

    // elevator on every 5th floor
    if (floor % 5 === 0 && floor > 0)
    {
        m.objects.push({ kind: 'elevator', x: m.entry.x + 2, y: m.entry.y });
    }

    // rocks with ore
    var oreTable = mineOreTable(floor);
    var rockCount = 22 + Math.floor(Math.random() * 18);
    var placed = 0;
    tries = 0;
    while (placed < rockCount && tries < 900)
    {
        tries++;
        var px = 1 + Math.floor(Math.random() * (MINE_W - 2));
        var py = 1 + Math.floor(Math.random() * (MINE_H - 2));
        if (m.tiles[py * MINE_W + px] !== T_CAVE)
        {
            continue;
        }
        if (Math.abs(px - m.entry.x) < 3 && Math.abs(py - m.entry.y) < 3)
        {
            continue;
        }
        if (objAt(m, px, py))
        {
            continue;
        }
        var rk = pickWeighted(oreTable);
        m.objects.push({ kind: 'rock', rk: rk, x: px, y: py, hp: rk === 'stone' ? 1 : 2, mine: true });
        placed++;
    }

    // the ladder is hidden inside one of the rocks
    var rocks = [];
    for (i = 0; i < m.objects.length; i++)
    {
        if (m.objects[i].kind === 'rock')
        {
            rocks.push(m.objects[i]);
        }
    }
    if (rocks.length > 0)
    {
        rocks[Math.floor(Math.random() * rocks.length)].ladder = true;
    }
    else
    {
        m.objects.push({ kind: 'mine_down', x: m.entry.x + 3, y: m.entry.y + 2 });
    }

    // treasure chest every 10 floors
    if (floor % 10 === 0 && floor > 0 && rooms.length > 1)
    {
        var cr = rooms[rooms.length - 1];
        m.objects.push({ kind: 'minechest', x: cr.x + 1, y: cr.y + 1, floor: floor });
    }

    // forage / barrels
    var extra = 2 + Math.floor(Math.random() * 3);
    tries = 0;
    while (extra > 0 && tries < 300)
    {
        tries++;
        var ex = 1 + Math.floor(Math.random() * (MINE_W - 2));
        var ey = 1 + Math.floor(Math.random() * (MINE_H - 2));
        if (m.tiles[ey * MINE_W + ex] !== T_CAVE || objAt(m, ex, ey))
        {
            continue;
        }
        m.objects.push({ kind: 'forage', x: ex, y: ey, item: Math.random() < .6 ? 'cave_carrot' : 'quartz' });
        extra--;
    }

    rebuildSolid(m);

    // monsters
    MINE.mobs = [];
    var mobCount = Math.min(10, 2 + Math.floor(floor / 8) + Math.floor(Math.random() * 3));
    var mobPool = mineMobPool(floor);
    var spawned = 0;
    tries = 0;
    while (spawned < mobCount && tries < 400)
    {
        tries++;
        var mx = 1 + Math.floor(Math.random() * (MINE_W - 2));
        var my = 1 + Math.floor(Math.random() * (MINE_H - 2));
        if (isSolid(m, mx, my))
        {
            continue;
        }
        if (Math.abs(mx - m.entry.x) < 5 && Math.abs(my - m.entry.y) < 5)
        {
            continue;
        }
        var kind = mobPool[Math.floor(Math.random() * mobPool.length)];
        var def = MONSTERS[kind];
        MINE.mobs.push({
            kind: kind, x: mx * TILE + HALF, y: my * TILE + HALF,
            hp: def.hp, maxHp: def.hp, cd: 0, frame: 0, ft: 0, hurt: 0, dead: false
        });
        spawned++;
    }

    MINE.ladderFound = false;
    return m;
}

function mineOreTable(floor)
{
    var t = [['stone', 55], ['coal', 8]];
    if (floor < 40)
    {
        t.push(['copper', 22]);
        t.push(['gem', 3]);
    }
    else if (floor < 80)
    {
        t.push(['copper', 8]);
        t.push(['iron', 22]);
        t.push(['gem', 5]);
    }
    else
    {
        t.push(['iron', 10]);
        t.push(['gold', 20]);
        t.push(['gem', 7]);
        if (floor >= 110)
        {
            t.push(['iridium', 3]);
        }
    }
    return t;
}

function pickWeighted(table)
{
    var total = 0, i;
    for (i = 0; i < table.length; i++)
    {
        total += table[i][1];
    }
    var r = Math.random() * total;
    for (i = 0; i < table.length; i++)
    {
        r -= table[i][1];
        if (r <= 0)
        {
            return table[i][0];
        }
    }
    return table[0][0];
}

function mineMobPool(floor)
{
    var pool = [];
    var k;
    for (k in MONSTERS)
    {
        if (!MONSTERS.hasOwnProperty(k))
        {
            continue;
        }
        var d = MONSTERS[k];
        if (floor >= d.minFloor && floor <= d.maxFloor)
        {
            pool.push(k);
        }
    }
    if (pool.length === 0)
    {
        pool.push('slime_green');
    }
    return pool;
}

// ---------- entering / leaving ----------

function enterMine(floor)
{
    MINE.floor = floor;
    var m = genMineFloor(floor);
    MAP_CACHE.mine = m;
    MAP = m;
    S.map = 'mine';
    S.mineFloor = floor;
    if (floor > S.mineDeep)
    {
        S.mineDeep = floor;
    }
    S.px = m.entry.x * TILE + HALF;
    S.py = m.entry.y * TILE + HALF;
    if (floor > 0)
    {
        toast(floor + '층');
    }
}

function leaveMine()
{
    MINE.mobs = [];
    delete MAP_CACHE.mine;
    MAP = loadMap('mountain');
    S.map = 'mountain';
    S.px = 14 * TILE + HALF;
    S.py = 11 * TILE + HALF;
}

function mineDescend()
{
    fadeOut(function ()
    {
        enterMine(MINE.floor + 1);
        addXp('mining', 3);
    });
}

function mineAscend()
{
    if (MINE.floor <= 1)
    {
        fadeOut(function ()
        {
            leaveMine();
        });
        return;
    }
    fadeOut(function ()
    {
        enterMine(MINE.floor - 1);
    });
}

// ---------- combat ----------

function swordDamage()
{
    var t = Math.max(0, S.sword);
    var d = SWORD_TIERS[t].dmg;
    if (hasProf('fighter'))
    {
        d = Math.round(d * 1.1);
    }
    if (hasProf('brute'))
    {
        d = Math.round(d * 1.15);
    }
    return d;
}

function doSwing()
{
    if (S.sword < 0)
    {
        toast('무기가 없어요.');
        return;
    }
    MINE.swing = 12;
    MINE.swingDir = S.dir;
    sfx('swing');
    var reach = 50;
    var cx = S.px, cy = S.py - 14;
    if (S.dir === 0)
    {
        cy += 28;
    }
    else if (S.dir === 1)
    {
        cy -= 28;
    }
    else if (S.dir === 2)
    {
        cx -= 28;
    }
    else
    {
        cx += 28;
    }
    var dmg = swordDamage();
    var crit = Math.random() < (hasProf('scout') ? .15 : .05);
    var i;
    for (i = 0; i < MINE.mobs.length; i++)
    {
        var mob = MINE.mobs[i];
        if (mob.dead)
        {
            continue;
        }
        var dx = mob.x - cx, dy = mob.y - cy;
        if (dx * dx + dy * dy > reach * reach)
        {
            continue;
        }
        var d = crit ? Math.round(dmg * 2) : dmg;
        d = Math.max(1, d + Math.floor(Math.random() * 3) - 1);
        mob.hp -= d;
        mob.hurt = 8;
        mob.kx = (dx > 0 ? 1 : -1) * 4.6;
        mob.ky = (dy > 0 ? 1 : -1) * 4.6;
        spawnFx(mob.x, mob.y - 16, 'spark');
        if (mob.hp <= 0)
        {
            killMob(mob);
        }
    }
}

function killMob(mob)
{
    mob.dead = true;
    var def = MONSTERS[mob.kind];
    addXp('combat', def.xp);
    S.stats.monstersKilled++;
    var tx = Math.floor(mob.x / TILE), ty = Math.floor(mob.y / TILE);
    var i;
    for (i = 0; i < def.drops.length; i++)
    {
        if (Math.random() < .55)
        {
            var did = def.drops[i];
            if (!ITEMS[did])
            {
                continue;
            }
            spawnDrop(MAP, tx, ty, did, 0);
        }
    }
    if (Math.random() < .12)
    {
        spawnDrop(MAP, tx, ty, 'coal', 0);
    }
    spawnFx(mob.x, mob.y - 12, 'puff');
}

function hurtPlayer(n)
{
    if (MINE.hurtCd > 0)
    {
        return;
    }
    MINE.hurtCd = 60;
    var def = 0;
    S.health -= Math.max(1, n - def);
    sfx('hurt');
    if (S.health <= 0)
    {
        S.health = 0;
        playerDown();
    }
}

function playerDown()
{
    if (UI.collapsing)
    {
        return;
    }
    UI.collapsing = true;
    var lost = Math.min(2000, Math.floor(S.gold * .15));
    S.gold -= lost;
    // drop a couple of random items
    var lostItems = 0, i;
    for (i = 0; i < S.inv.length && lostItems < 2; i++)
    {
        var sl = S.inv[i];
        if (sl && !isTool(sl.id) && Math.random() < .35)
        {
            S.inv[i] = null;

function updateMine(dt)
{
    if (MINE.swing > 0)
    {
        MINE.swing--;
    }
    if (MINE.hurtCd > 0)
    {
        MINE.hurtCd--;
    }
    if (MAP.id !== 'mine')
    {
        return;
    }
    var i;
    for (i = MINE.mobs.length - 1; i >= 0; i--)
    {
        var mob = MINE.mobs[i];
        if (mob.dead)
        {
            MINE.mobs.splice(i, 1);
            continue;
        }
        updateMob(mob, dt);
    }
}

function updateMob(mob, dt)
{
    var def = MONSTERS[mob.kind];
    if (mob.hurt > 0)
    {
        mob.hurt--;
    }
    mob.ft += dt;
    if (mob.ft > .18)
    {
        mob.ft = 0;
        mob.frame = (mob.frame + 1) % 2;
    }

    // knockback
    if (mob.kx || mob.ky)
    {
        moveMob(mob, mob.kx, mob.ky);
        mob.kx *= .8;
        mob.ky *= .8;
        if (Math.abs(mob.kx) < .1)
        {
            mob.kx = 0;
        }
        if (Math.abs(mob.ky) < .1)
        {
            mob.ky = 0;
        }
    }

    var dx = S.px - mob.x;
    var dy = S.py - mob.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 250)
    {
        var sp = def.speed * 84 * dt;
        if (dist > 1)
        {
            moveMob(mob, (dx / dist) * sp, (dy / dist) * sp);
        }
    }
    else
    {
        mob.wt = (mob.wt || 0) - dt;
        if (mob.wt <= 0)
        {
            mob.wt = .8 + Math.random();
            mob.wx = (Math.random() * 2 - 1);
            mob.wy = (Math.random() * 2 - 1);
        }
        moveMob(mob, mob.wx * def.speed * 32 * dt, mob.wy * def.speed * 32 * dt);
    }

    if (dist < 24)
    {
        hurtPlayer(def.dmg);
    }
}

function moveMob(mob, dx, dy)
{
    var nx = mob.x + dx;
    var ny = mob.y + dy;
    if (!isSolid(MAP, Math.floor(nx / TILE), Math.floor(mob.y / TILE)))
    {
        mob.x = nx;
    }
    if (!isSolid(MAP, Math.floor(mob.x / TILE), Math.floor(ny / TILE)))
    {
        mob.y = ny;
    }
}

// ---------- mine interactions ----------

function openMineChest(o)
{
    var floor = o.floor;
    var loot = null;
    if (floor === 10)
    {
        loot = { id: 'sword', tier: 1, msg: '단검을 찾았어요!' };
    }
    else if (floor === 20)
    {
        loot = { id: 'sword', tier: 2, msg: '강철 검을 찾았어요!' };
    }
    else if (floor === 60)
    {
        loot = { id: 'sword', tier: 3, msg: '용사의 검을 찾았어요!' };
    }
    else if (floor === 110)
    {
        loot = { id: 'sword', tier: 4, msg: '은하수 검을 찾았어요!' };
    }
    if (loot)
    {
        S.sword = Math.max(S.sword, loot.tier);
        modalMsg('보물 상자', loot.msg);
    }
    else
    {
        var pool = ['gold_bar', 'iron_bar', 'diamond', 'ruby', 'emerald', 'geode', 'bomb'];
        var pick = pool[Math.floor(Math.random() * pool.length)];
        give(pick, 1 + Math.floor(Math.random() * 3));
        modalMsg('보물 상자', ITEMS[pick].name + '을(를) 찾았어요!');
    }
    removeObj(MAP, o);
}

// mining rewards from a broken rock
function rockLoot(o)
{
    var floor = MINE.floor;
    var lvl = skillLvl('mining');
    var bonus = hasProf('miner') ? 1 : 0;
    var tx = o.x, ty = o.y;
    var n, i;
    if (o.rk === 'stone')
    {
        n = 1 + (Math.random() < .3 ? 1 : 0);
        for (i = 0; i < n; i++)
        {
            spawnDrop(MAP, tx, ty, 'stone', 0);
        }
        if (Math.random() < (hasProf('prospector') ? .06 : .03))
        {
            spawnDrop(MAP, tx, ty, 'coal', 0);
        }
    }
    else if (o.rk === 'coal')
    {
        spawnDrop(MAP, tx, ty, 'coal', 0);
        if (hasProf('prospector') && Math.random() < .5)
        {
            spawnDrop(MAP, tx, ty, 'coal', 0);
        }
    }
    else if (o.rk === 'gem')
    {
        var gems = ['quartz', 'amethyst', 'topaz', 'aquamarine', 'jade', 'emerald', 'ruby'];
        if (floor > 80)
        {
            gems.push('diamond');
        }
        if (Math.random() < .04)
        {
            gems = ['prismatic_shard'];
        }
        var gem = gems[Math.floor(Math.random() * gems.length)];
        spawnDrop(MAP, tx, ty, gem, 0);
        if (hasProf('geologist') && Math.random() < .5)
        {
            spawnDrop(MAP, tx, ty, gem, 0);
        }
    }
    else
    {
        var oreId = { copper: 'copper_ore', iron: 'iron_ore', gold: 'gold_ore', iridium: 'iridium_ore' }[o.rk];
        n = 1 + bonus + (Math.random() < lvl * .04 ? 1 : 0);
        for (i = 0; i < n; i++)
        {
            spawnDrop(MAP, tx, ty, oreId, 0);
        }
        if (Math.random() < .1)
        {
            spawnDrop(MAP, tx, ty, 'geode', 0);
        }
    }
    addXp('mining', o.rk === 'stone' ? 2 : 6);
    if (o.ladder)
    {
        MAP.objects.push({ kind: 'mine_down', x: tx, y: ty });
        MINE.ladderFound = true;
        sfx('ladder');
    }
}

// ---------- geode processing (blacksmith) ----------

function crackGeode(id)
{
    var pools = {
        geode: ['quartz', 'earth_crystal', 'amethyst', 'topaz', 'copper_ore', 'iron_ore', 'coal', 'clay'],
        frozen_geode: ['frozen_tear', 'aquamarine', 'jade', 'iron_ore', 'gold_ore', 'coal', 'clay'],
        magma_geode: ['fire_quartz', 'ruby', 'emerald', 'gold_ore', 'iridium_ore', 'diamond']
    };
    var pool = pools[id] || pools.geode;
    var out = pool[Math.floor(Math.random() * pool.length)];
    var n = (out.indexOf('_ore') > 0 || out === 'coal' || out === 'clay') ? (1 + Math.floor(Math.random() * 3)) : 1;
    return { id: out, n: n };
}

// ---------- rendering ----------

function drawMobs(g, cam)
{
    var i;
    for (i = 0; i < MINE.mobs.length; i++)
    {
        var mob = MINE.mobs[i];
        var def = MONSTERS[mob.kind];
        var x = Math.round(mob.x - HALF - cam.x);
        var y = Math.round(mob.y - 26 - cam.y);
        if (x < -40 || y < -40 || x > cam.vw + 40 || y > cam.vh + 40)
        {
            continue;
        }
        if (mob.hurt > 0 && mob.hurt % 4 < 2)
        {
            g.globalAlpha = .55;
        }
        g.drawImage(sprMonster(def.sprite, def.col, mob.frame), x, y);
        g.globalAlpha = 1;
        if (mob.hp < mob.maxHp)
        {
            var w = 28;
            pr(g, x + 2, y - 7, w, 4, 'rgba(0,0,0,.6)');
            pr(g, x + 2, y - 7, Math.max(1, Math.round(w * mob.hp / mob.maxHp)), 4, '#e05050');
        }
    }
}

function drawSwing(g, cam)
{
    if (MINE.swing <= 0 || S.sword < 0)
    {
        return;
    }
    var p = 1 - MINE.swing / 12;
    var x = S.px - cam.x;
    var y = S.py - cam.y - 18;
    var base = [Math.PI * .5, -Math.PI * .5, Math.PI, 0][MINE.swingDir];
    var a = base - .9 + p * 1.8;
    g.save();
    g.translate(x, y);
    g.rotate(a);
    g.globalAlpha = .85;
    pr(g, 12, -4, 32, 6, '#eceaf4');
    pr(g, 12, 1, 32, 2, '#a8a8c0');
    g.globalAlpha = .3;
    pr(g, 8, -10, 40, 18, 'rgba(255,255,255,.4)');
    g.restore();
    g.globalAlpha = 1;
}

function drawMineHud(g)
{
    if (MAP.id !== 'mine')
    {
        return;
    }
    var el = document.getElementById('weatherChip');
    if (el)
    {
        el.textContent = '⛏ ' + MINE.floor + '층' + (MINE.ladderFound ? '  · 사다리 발견!' : '');
    }
}

// ---------- friendship ----------

function hearts(id)
{
    var n = S.npc[id];
    if (!n)
    {
        return 0;
    }
    return Math.min(maxHearts(id), Math.floor(n.pts / 250));
}

function maxHearts(id)
{
    var d = NPC_BY_ID[id];
    if (!d)
    {
        return 10;
    }
    if (S.spouse === id)
    {
        return 12;
    }
    if (d.wed && !(S.npc[id] && S.npc[id].dating))
    {
        return 8;
    }
    return 10;
}

function addFriend(id, pts)
{
    var n = S.npc[id];
    if (!n)
    {
        return;
    }
    var before = hearts(id);
    n.pts = Math.max(0, Math.min(maxHearts(id) * 250, n.pts + pts));
    var after = hearts(id);
    if (after > before)
    {
        toast(NPC_BY_ID[id].name + ' 호감도 ' + after + '♥');
        checkHeartEvent(id, after);
    }
}

function checkHeartEvent(id, h)
{
    var n = S.npc[id];
    if (n.events[h])
    {
        return;
    }
    var d = NPC_BY_ID[id];
    if (!d.wed)
    {
        return;
    }
    if (h !== 2 && h !== 4 && h !== 6 && h !== 8 && h !== 10)
    {
        return;
    }
    n.events[h] = true;
    var lines = { 2: d.lines, 4: d.lines4 || d.lines, 6: d.lines4 || d.lines, 8: d.lines8 || d.lines, 10: d.lines8 || d.lines }[h];
    var msg = lines[Math.floor(Math.random() * lines.length)];
    setTimeout(function ()
    {
        modalMsg('💗 ' + d.name + ' ' + h + '하트', msg);
    }, 400);
}

// ---------- gifts ----------

function giftTaste(npcId, itemId)
{
    var d = NPC_BY_ID[npcId];
    if (!d)
    {
        return 'neutral';
    }
    if (d.loves && d.loves.indexOf(itemId) >= 0)
    {
        return 'love';
    }
    if (GIFT_TASTE_UNIVERSAL.love.indexOf(itemId) >= 0)
    {
        return 'love';
    }
    if (d.likes && d.likes.indexOf(itemId) >= 0)
    {
        return 'like';
    }
    if (GIFT_TASTE_UNIVERSAL.hate.indexOf(itemId) >= 0)
    {
        return 'hate';
    }
    if (GIFT_TASTE_UNIVERSAL.dislike.indexOf(itemId) >= 0)
    {
        return 'dislike';
    }
    if (GIFT_TASTE_UNIVERSAL.like.indexOf(itemId) >= 0)
    {
        return 'like';
    }
    var it = ITEMS[itemId];
    if (it && (it.kind === 'cook' || it.kind === 'artisan'))
    {
        return 'like';
    }
    if (it && it.kind === 'flower')
    {
        return 'like';
    }
    return 'neutral';
}

function isBirthday(npcId)
{
    var d = NPC_BY_ID[npcId];
    return d.bd && d.bd.s === seasonId() && d.bd.d === S.day;
}

function giveGift(npcId, slotIdx)
{
    var n = S.npc[npcId];
    var d = NPC_BY_ID[npcId];
    var sl = S.inv[slotIdx];
    if (!sl)
    {
        return false;
    }
    if (isTool(sl.id))
    {
        toast('도구는 선물할 수 없어요.');
        return false;
    }
    if (n.giftDay === S.day)
    {
        toast('오늘은 이미 선물했어요.');
        return false;
    }
    if (n.giftWeek >= 2 && !isBirthday(npcId))
    {
        toast('이번 주엔 이미 두 번 선물했어요.');
        return false;
    }
    // bouquet starts dating
    if (sl.id === 'bouquet')
    {
        if (!d.wed)
        {
            toast('받을 수 없다고 하네요.');
            return false;
        }
        if (hearts(npcId) < 8)
        {
            toast('아직 마음의 준비가 안 된 것 같아요.');
            return false;
        }
        n.dating = true;
        removeItem('bouquet', 1);
        n.giftDay = S.day;
        modalMsg(d.name, '"...정말? 나도 좋아."\n\n' + d.name + '와(과) 연인이 되었어요!');
        addFriend(npcId, 250);
        return true;
    }
    // mermaid pendant proposes
    if (sl.id === 'pendant')
    {
        if (!d.wed || !n.dating)
        {
            toast('먼저 꽃다발을 건네야 해요.');
            return false;
        }
        if (hearts(npcId) < 10)
        {
            toast('아직 10하트가 아니에요.');
            return false;
        }
        if (S.spouse)
        {
            toast('이미 결혼했어요.');
            return false;
        }
        removeItem('pendant', 1);
        S.spouse = npcId;
        S.engaged = 3;
        modalMsg('💍 청혼', '"...응! 나랑 결혼해줘."\n\n3일 뒤 결혼식이 열립니다!');
        return true;
    }

    var taste = giftTaste(npcId, sl.id);
    var q = sl.q || 0;
    var base = { love: 80, like: 45, neutral: 20, dislike: -20, hate: -40 }[taste];
    var mult = isBirthday(npcId) ? 8 : 1;
    var qb = taste === 'love' || taste === 'like' ? Math.round(base * q * .15) : 0;
    var pts = Math.round((base + qb) * mult);
    removeItem(sl.id, 1, q);
    n.giftDay = S.day;
    n.giftWeek++;
    S.stats.giftsGiven++;
    addFriend(npcId, pts);

    var react = {
        love: ['정말? 내가 제일 좋아하는 거야!', '어떻게 알았어? 고마워!', '와... 이건 정말 특별해.'],
        like: ['고마워, 마음에 들어.', '좋은 걸 줬네. 잘 쓸게.', '이거 괜찮은데?'],
        neutral: ['...고마워.', '음, 잘 받을게.', '그래, 고마워.'],
        dislike: ['어... 이걸 나한테?', '음... 고맙긴 한데.'],
        hate: ['이건 좀 아니지 않아?', '...진심이야?']
    }[taste];
    var msg = react[Math.floor(Math.random() * react.length)];
    if (isBirthday(npcId))
    {
        msg = '오늘 내 생일인데 기억해줬구나! ' + msg;
    }
    showDialogue(d, msg);
    sfx('gift');
    return true;
}

function talkTo(actor)
{
    var d = NPC_BY_ID[actor.id];
    var n = S.npc[actor.id];
    if (!n.met)
    {
        n.met = true;
        S.seenNpc[actor.id] = true;
        showDialogue(d, '안녕! 네가 새로 온 농부구나. 나는 ' + d.name + '이야.\n앞으로 잘 지내보자!');
        addFriend(actor.id, 20);
        return;
    }
    if (n.talkedDay === S.day)
    {
        var idle = ['오늘도 좋은 하루 보내!', '또 보네!', '나중에 봐.'];
        showDialogue(d, idle[Math.floor(Math.random() * idle.length)]);
        return;
    }
    n.talkedDay = S.day;
    addFriend(actor.id, 20);

    var h = hearts(actor.id);
    var pool = d.lines;
    if (h >= 8 && d.lines8)
    {
        pool = d.lines8.concat(d.lines);
    }
    else if (h >= 4 && d.lines4)
    {
        pool = d.lines4.concat(d.lines);
    }
    var line = pool[Math.floor(Math.random() * pool.length)];
