// ---------- pets, horse, cactus, dig spot ----------

function sprPet(kind, frame)
{
    return bake('pet:' + kind + ':' + frame, TILE, TILE, function (g)
    {
        var bob = frame % 2;
        var body = kind === 'dog' ? '#c08a4a' : '#8a8a94';
        var spot = kind === 'dog' ? '#8a5a28' : '#5a5a64';
        contactShadow(g, 16, 28, 9, 3);
        // hind body
        orb(g, 11, 20 + bob, 7, 6, body, 1.4);
        pr(g, 6, 15 + bob, 16, 8, body);
        pr(g, 6, 21 + bob, 16, 2, tone(body, -1.4));
        // head
        orb(g, 23, 14 + bob, 6, 6, body, 1.5);
        pr(g, 27, 16 + bob, 4, 3, tone(body, -.6));
        pr(g, 29, 17 + bob, 2, 2, '#2a2018');
        pr(g, 21, 12 + bob, 2, 2, '#1d1710');
        pr(g, 25, 12 + bob, 2, 2, '#1d1710');
        // ears
        if (kind === 'dog')
        {
            pr(g, 19, 8 + bob, 4, 6, spot);
            pr(g, 26, 8 + bob, 3, 5, spot);
        }
        else
        {
            pr(g, 19, 7 + bob, 3, 5, body);
            pr(g, 26, 7 + bob, 3, 5, body);
            pr(g, 20, 9 + bob, 1, 2, '#e8a0a8');
            pr(g, 27, 9 + bob, 1, 2, '#e8a0a8');
        }
        // legs + tail
        pr(g, 8, 23 + bob, 3, 5, tone(body, -1.6));
        pr(g, 17, 23 + bob, 3, 5, tone(body, -1.6));
        if (kind === 'dog')
        {
            pr(g, 3, 11 - bob, 4, 6, body);
        }
        else
        {
            pr(g, 2, 8 - bob, 3, 10, body);
            pr(g, 2, 8 - bob, 3, 3, spot);
        }
        pe(g, 12, 17, 3, 2, spot);
    }, { outline: true });
}

function sprHorse(frame)
{
    return bake('horse:' + frame, TILE * 2, TILE + 12, function (g)
    {
        // the first pass read as a brown blob. built from a clear silhouette now:
        // barrel body, sloped neck, wedge head, four legs in two pairs.
        var bob = frame % 2;
        var body = '#8f5c30', mane = '#33220f';
        var H = TILE + 12;
        var gy = H - 2;
        contactShadow(g, 30, gy - 1, 20, 4);

        // far legs first so the near pair overlaps them
        pr(g, 20, gy - 14, 5, 14, tone(body, -1.7));
        pr(g, 40, gy - 14, 5, 14, tone(body, -1.7));
        pr(g, 20, gy - 3, 5, 3, '#241a12');
        pr(g, 40, gy - 3, 5, 3, '#241a12');

        // barrel
        var ty = gy - 30 + bob;
        pe(g, 30, ty + 8, 17, 9, tone(body, -1.1));
        pr(g, 13, ty, 34, 15, body);
        pe(g, 14, ty + 7, 5, 7, body);
        pe(g, 46, ty + 6, 6, 7, body);
        pr(g, 13, ty, 34, 3, tone(body, 1.3));
        pr(g, 13, ty + 12, 34, 4, tone(body, -1.5));
        pr(g, 13, ty + 15, 34, 1, tone(body, -2.2));
        // belly shading
        pe(g, 30, ty + 14, 14, 3, tone(body, -1.8));

        // near legs, offset for the walk
        pr(g, 17, gy - 15 + bob, 6, 15, body);
        pr(g, 36, gy - 15 - bob, 6, 15, body);
        pr(g, 17, gy - 15 + bob, 2, 15, tone(body, 1));
        pr(g, 36, gy - 15 - bob, 2, 15, tone(body, 1));
        pr(g, 17, gy - 5 + bob, 6, 3, tone(body, -1.4));
        pr(g, 36, gy - 5 - bob, 6, 3, tone(body, -1.4));
        pr(g, 16, gy - 2 + bob, 8, 2, '#241a12');
        pr(g, 35, gy - 2 - bob, 8, 2, '#241a12');

        // neck rising to the right, then a wedge head
        var nx = 44, ny = ty - 10;
        pr(g, nx, ny + 4, 9, 14, body);
        pr(g, nx + 2, ny, 9, 10, body);
        pr(g, nx + 2, ny, 3, 12, tone(body, 1.2));
        pr(g, nx + 8, ny + 2, 3, 14, tone(body, -1.4));
        // head: cheek block + tapering muzzle
        pr(g, nx + 3, ny - 8, 10, 9, body);
        pr(g, nx + 3, ny - 8, 4, 9, tone(body, 1.1));
        pr(g, nx + 11, ny - 5, 6, 6, body);
        pr(g, nx + 15, ny - 3, 4, 4, tone(body, -.8));
        pr(g, nx + 17, ny - 2, 2, 2, tone(body, -1.8));
        // eye + nostril
        pr(g, nx + 9, ny - 5, 2, 2, '#150f0a');
        pr(g, nx + 9, ny - 5, 1, 1, '#8a7a68');
        pr(g, nx + 17, ny - 1, 1, 1, '#150f0a');
        // ears
        pr(g, nx + 4, ny - 12, 2, 5, body);
        pr(g, nx + 8, ny - 12, 2, 5, body);
        pr(g, nx + 4, ny - 12, 1, 3, tone(body, 1.2));
        // mane down the neck and a forelock
        pr(g, nx - 1, ny - 6, 5, 20, mane);
        pr(g, nx - 1, ny - 6, 2, 20, tone(mane, .9));
        pr(g, nx + 5, ny - 11, 4, 4, mane);
        // tail
        pr(g, 8, ty + 1 - bob, 6, 20, mane);
        pr(g, 6, ty + 6 - bob, 5, 16, tone(mane, -.6));
        pr(g, 9, ty + 2 - bob, 2, 14, tone(mane, 1));
        // saddle + blanket
        pr(g, 24, ty - 1, 14, 6, '#7a2f2a');
        pr(g, 24, ty - 1, 14, 1, '#a04a40');
        pr(g, 26, ty + 4, 10, 3, '#4a3018');
        pr(g, 26, ty + 4, 10, 1, '#6a4a28');
        pr(g, 30, ty + 6, 2, 6, '#3a2612');
    }, { outline: true });
}

function sprCactus(big)
{
    return bake('cactus:' + (big ? 1 : 0), TILE, TILE + (big ? 16 : 0), function (g)
    {
        var H = TILE + (big ? 16 : 0);
        var c = '#4a8a44';
        contactShadow(g, 16, H - 3, 8, 3);
        var h = big ? 34 : 20;
        if (big)
        {
            pr(g, 12, H - 5 - h, 8, h, c);
            pr(g, 12, H - 5 - h, 3, h, tone(c, 1.1));
            pr(g, 18, H - 5 - h, 2, h, tone(c, -1.3));
            pe(g, 16, H - 5 - h, 4, 3, tone(c, 1.3));
        }
        else
        {
            // barrel cactus: squat and ribbed, so it does not read as a pill
            pe(g, 16, H - 5 - h / 2, 8, h / 2 + 1, c);
            pe(g, 14, H - 6 - h / 2, 5, h / 2 - 1, tone(c, 1));
            pe(g, 19, H - 4 - h / 2, 3, h / 2 - 2, tone(c, -1.2));
            var rib;
            for (rib = 0; rib < 4; rib++)
            {
                var rx2 = 10 + rib * 4;
                pr(g, rx2, H - 4 - h + 3 + Math.abs(rib - 1), 1,
                    h - 5 - Math.abs(rib - 1) * 2, tone(c, rib < 2 ? 1.4 : -1.5));
            }
            pe(g, 16, H - 4 - h, 5, 2, tone(c, 1.5));
            pe(g, 16, H - 6, 7, 2, tone(c, -1.6));
        }
        if (big)
        {
            pr(g, 5, H - 26, 8, 5, c);
            pr(g, 5, H - 34, 5, 10, c);
            pr(g, 5, H - 34, 2, 10, tone(c, 1.1));
            pr(g, 20, H - 32, 8, 5, c);
            pr(g, 24, H - 40, 5, 10, c);
            pr(g, 24, H - 40, 2, 10, tone(c, 1.1));
        }
        // spines
        var i;
        for (i = 0; i < h; i += 4)
        {
            pr(g, 11, H - 6 - i, 1, 1, '#e8e0c0');
            pr(g, 20, H - 8 - i, 1, 1, '#e8e0c0');
            pr(g, 15, H - 7 - i, 1, 1, tone(c, -1.8));
        }
        if (big)
        {
            pe(g, 16, H - 8 - h, 3, 2, '#e05878');
        }
    }, { outline: true });
}

function sprDigSpot()
{
    return bake('digspot', TILE, TILE, function (g)
    {
        var c = '#8a6a48';
        pe(g, 16, 20, 11, 6, tone(c, -1.2));
        pe(g, 16, 19, 10, 5, c);
        pe(g, 15, 17, 5, 2, tone(c, 1.2));
        crumbs(g, 7, 14, 18, 10, [tone(c, -1.8), tone(c, 1.4)], 10, 3);
        // worms of light so the player notices it
        pr(g, 14, 12, 2, 2, '#f0e070');
        pr(g, 20, 15, 2, 2, '#f0e070');
        pr(g, 11, 17, 1, 1, '#fff8b0');
    }, { outline: true });
}

// ---------- title art ----------

function drawTitleArt(g, W, H, t)
{
    g.clearRect(0, 0, W, H);
    var sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#15224a');
    sky.addColorStop(.45, '#3d3468');
    sky.addColorStop(.78, '#8a5570');
    sky.addColorStop(1, '#d08a66');
    g.fillStyle = sky;
    g.fillRect(0, 0, W, H);

    var i;
    for (i = 0; i < 60; i++)
    {
        var sx = Math.floor(hash2(i, 1, 5) * W);
        var sy = Math.floor(hash2(1, i, 9) * H * .62);
        var tw = .5 + .5 * Math.sin(t * .003 + i);
        g.fillStyle = 'rgba(255,255,235,' + (tw * .95) + ')';
        g.fillRect(sx, sy, 1, 1);
        if (i % 9 === 0)
        {
            g.fillStyle = 'rgba(255,255,235,' + (tw * .5) + ')';
            g.fillRect(sx - 1, sy, 3, 1);
            g.fillRect(sx, sy - 1, 1, 3);
        }
    }
    // moon with craters
    pe(g, W - 46, 30, 13, 13, '#f6f0cc');
    pe(g, W - 49, 27, 9, 9, '#fffbe4');
    pe(g, W - 43, 34, 3, 2, '#e2dcb8');
    pe(g, W - 50, 33, 2, 2, '#e2dcb8');

    // layered hills
    g.fillStyle = '#22402c';
    pe(g, W * .22, H - 26, 84, 34, '#22402c');
    pe(g, W * .78, H - 30, 96, 40, '#1c3626');
    g.fillStyle = '#2c4d34';
    g.fillRect(0, H - 30, W, 30);
    g.fillStyle = '#37603d';
    g.fillRect(0, H - 26, W, 26);
    for (i = 0; i < W; i += 5)
    {
        var hgt = 2 + Math.floor(hash2(i, 7, 3) * 3);
        g.fillStyle = '#3f6e45';
        g.fillRect(i, H - 26 - hgt, 2, hgt);
    }
    // fence
    for (i = 6; i < W; i += 18)
    {
        g.fillStyle = '#5a3f22';
        g.fillRect(i, H - 40, 4, 16);
        g.fillStyle = '#78552f';
        g.fillRect(i, H - 40, 2, 16);
    }
    g.fillStyle = '#5a3f22';
    g.fillRect(0, H - 36, W, 3);
    g.fillRect(0, H - 30, W, 3);
    g.fillStyle = '#78552f';
    g.fillRect(0, H - 36, W, 1);
    g.fillRect(0, H - 30, W, 1);

    // barn + tree, scaled down from the real sprites
    var barn = sprBuilding('barn');
    g.drawImage(barn, 0, 0, barn.width, barn.height, Math.round(W * .08), H - 96, 76, 54);
    var tree = sprTree('oak', 4, 'summer');
    g.drawImage(tree, 0, 0, tree.width, tree.height, Math.round(W * .68), H - 110, 66, 88);
    // crop row
    var crop = sprCrop('pumpkin_seeds', 4);
    for (i = 0; i < 8; i++)
    {
        g.drawImage(crop, 0, 0, crop.width, crop.height, 18 + i * 17, H - 40, 16, 22);
    }
}

// ---------- town square props ----------
// The plaza is 16x12 of bare flagstone. These give it edges and landmarks, and
// the lamp is the only light source in the game besides the player.

function sprLamp(lit)
{
    return bake('lamp:' + (lit ? 1 : 0), 24, 64, function (g)
    {
        var iron = '#3e4450';
        contactShadow(g, 12, 61, 8, 3);
        // base
        pr(g, 8, 55, 8, 6, iron);
        pr(g, 8, 55, 2, 6, tone(iron, 1.1));
        pr(g, 14, 55, 2, 6, tone(iron, -1.3));
        pr(g, 7, 60, 10, 2, tone(iron, -1.7));
        // post with a slight taper
        var y;
        for (y = 18; y < 56; y++)
        {
            var w = y > 48 ? 6 : 4;
            pr(g, 12 - w / 2, y, w, 1, iron);
            pr(g, 12 - w / 2, y, 1, 1, tone(iron, 1.2));
            pr(g, 12 + w / 2 - 1, y, 1, 1, tone(iron, -1.4));
        }
        // scroll bracket
        pr(g, 8, 24, 3, 1, tone(iron, .8));
        pr(g, 13, 24, 3, 1, tone(iron, .8));
        // lantern housing
        pr(g, 6, 8, 12, 12, tone(iron, -.6));
        pr(g, 7, 9, 10, 10, lit ? '#ffdf9a' : '#5d6470');
        pr(g, 8, 10, 8, 8, lit ? '#fff3cf' : '#6d7480');
        if (lit)
        {
            pr(g, 9, 11, 6, 6, '#fffbe8');
            pr(g, 10, 12, 4, 4, '#ffffff');
        }
        // glazing bars
        pr(g, 11, 8, 2, 12, tone(iron, -.3));
        pr(g, 6, 13, 12, 1, tone(iron, -.3));
        // cap
        pr(g, 4, 4, 16, 4, iron);
        pr(g, 4, 4, 16, 1, tone(iron, 1.3));
        pr(g, 6, 1, 12, 3, iron);
        pr(g, 10, 0, 4, 1, tone(iron, 1.4));
        pr(g, 4, 20, 16, 2, iron);
        pr(g, 4, 21, 16, 1, tone(iron, -1.8));
    }, { outline: true });
}

function sprBench()
{
    return bake('bench', 48, 36, function (g)
    {
        var wood = '#8a5f34', iron = '#454b58';
        contactShadow(g, 24, 34, 20, 4);
        // legs
        pr(g, 5, 22, 4, 11, iron);
        pr(g, 39, 22, 4, 11, iron);
        pr(g, 3, 32, 8, 2, tone(iron, -1.5));
        pr(g, 37, 32, 8, 2, tone(iron, -1.5));
        // seat slats
        var i;
        for (i = 0; i < 3; i++)
        {
            var y = 20 + i * 4;
            pr(g, 3, y, 42, 3, wood);
            pr(g, 3, y, 42, 1, tone(wood, 1.1));
            pr(g, 3, y + 2, 42, 1, tone(wood, -1.5));
        }
        // back rest
        pr(g, 5, 6, 4, 15, iron);
        pr(g, 39, 6, 4, 15, iron);
        for (i = 0; i < 3; i++)
        {
            var by = 6 + i * 5;
            pr(g, 4, by, 40, 4, wood);
            pr(g, 4, by, 40, 1, tone(wood, 1.2));
            pr(g, 4, by + 3, 40, 1, tone(wood, -1.6));
        }
        // arm rests: without them the horizontal slats read as a fence
        pr(g, 2, 17, 9, 4, wood);
        pr(g, 2, 17, 9, 1, tone(wood, 1.3));
        pr(g, 2, 20, 9, 1, tone(wood, -1.7));
        pr(g, 37, 17, 9, 4, wood);
        pr(g, 37, 17, 9, 1, tone(wood, 1.3));
        pr(g, 37, 20, 9, 1, tone(wood, -1.7));
        pr(g, 2, 20, 3, 5, iron);
        pr(g, 43, 20, 3, 5, iron);
        // grain
        for (i = 0; i < 10; i++)
        {
            var gx = 5 + Math.floor(hash2(i, 3, 41) * 38);
            var gy = 7 + Math.floor(hash2(3, i, 43) * 20);
            pr(g, gx, gy, 3, 1, tone(wood, -.8));
        }
    }, { outline: true });
}

function sprPlanter(season)
{
    return bake('planter:' + season, 32, 40, function (g)
    {
        var clay = '#a8683c';
        contactShadow(g, 16, 38, 12, 4);
        // pot, wider at the rim
        pr(g, 6, 20, 20, 4, tone(clay, .9));
        pr(g, 7, 24, 18, 13, clay);
        pr(g, 7, 24, 3, 13, tone(clay, 1));
        pr(g, 21, 24, 4, 13, tone(clay, -1.2));
        pr(g, 9, 36, 14, 2, tone(clay, -1.9));
        pr(g, 6, 20, 20, 1, tone(clay, 1.5));
        // soil
        pr(g, 9, 22, 14, 3, '#4a3520');
        var i;
        if (season === 'winter')
        {
            // bare twigs under a cap of snow
            for (i = 0; i < 4; i++)
            {
                var tx = 11 + i * 3;
                pr(g, tx, 14 + (i % 2) * 3, 1, 8, '#6d5334');
            }
            pr(g, 8, 20, 16, 3, '#eef4fb');
            pr(g, 9, 19, 13, 1, '#ffffff');
            return;
        }
        var leaf = season === 'fall' ? '#b8742c' : '#4f9a3a';
        leafClump(g, 12, 15, 7, leaf, true);
        leafClump(g, 21, 16, 6, leaf, false);
        leafClump(g, 16, 10, 7, leaf, true);
        var bloom = season === 'fall' ? ['#e0a040', '#c85838'] : ['#e86a94', '#f0d24a', '#8a6ad8'];
        for (i = 0; i < 5; i++)
        {
            var fx = 9 + Math.floor(hash2(i, 5, 51) * 15);
            var fy = 6 + Math.floor(hash2(5, i, 53) * 13);
            var c = bloom[i % bloom.length];
            pe(g, fx, fy, 2, 2, c);
            pr(g, fx, fy, 1, 1, tone(c, 1.4));
        }
    }, { outline: true });
}

function sprBarrel()
{
    return bake('barrel', 28, 34, function (g)
    {
        var wood = '#9a6b3a', band = '#5a5f6a';
        contactShadow(g, 14, 32, 11, 4);
        pe(g, 14, 30, 10, 3, tone(wood, -1.4));
        pr(g, 5, 8, 18, 23, wood);
        // staves
        var i;
        for (i = 0; i < 5; i++)
        {
            pr(g, 6 + i * 4, 8, 1, 23, tone(wood, -1.1));
        }
        pr(g, 5, 8, 3, 23, tone(wood, 1));
        pr(g, 20, 8, 3, 23, tone(wood, -1.3));
        // bulge: pull the middle out a pixel each side
        pr(g, 4, 15, 1, 9, wood);
        pr(g, 23, 15, 1, 9, tone(wood, -1.3));
        // hoops
        pr(g, 4, 12, 20, 2, band);
        pr(g, 4, 24, 20, 2, band);
        pr(g, 4, 12, 20, 1, tone(band, 1.2));
        pr(g, 4, 25, 20, 1, tone(band, -1.6));
        // lid
        pe(g, 14, 8, 9, 3, tone(wood, .8));
        pe(g, 14, 7, 7, 2, tone(wood, 1.4));
    }, { outline: true });
}

function sprCrate()
{
    return bake('crate', 28, 28, function (g)
    {
        var wood = '#a87a44';
        contactShadow(g, 14, 26, 11, 3);
        pr(g, 3, 5, 22, 21, wood);
        pr(g, 3, 5, 22, 2, tone(wood, 1.3));
        pr(g, 3, 5, 2, 21, tone(wood, 1));
        pr(g, 22, 5, 3, 21, tone(wood, -1.3));
        pr(g, 3, 24, 22, 2, tone(wood, -1.8));
        // planks and a diagonal brace
        pr(g, 3, 12, 22, 1, tone(wood, -1.5));
        pr(g, 3, 19, 22, 1, tone(wood, -1.5));
        var i;
        for (i = 0; i < 16; i++)
        {
            pr(g, 5 + i, 23 - i, 2, 1, tone(wood, -1.1));
        }
        for (i = 0; i < 8; i++)
        {
            var gx = 5 + Math.floor(hash2(i, 7, 61) * 18);
            var gy = 7 + Math.floor(hash2(7, i, 63) * 16);
            pr(g, gx, gy, 3, 1, tone(wood, -.7));
        }
    }, { outline: true });
}

// ---------- water trim ----------
// The depth dither and the shoreline foam used to be drawn pixel by pixel every
// frame: a 32x8 dither band is 256 fillRect calls, and a beach screen has ~50
// boundary tiles, so the overlay was costing several milliseconds. Bake each
// edge once and blit it. side: 0 top, 1 right, 2 bottom, 3 left.

function waterDepthEdge(side, toDeep, variant)
{
    return bake('wde:' + side + ':' + (toDeep ? 1 : 0) + ':' + variant, TILE, TILE, function (g)
    {
        var a = toDeep ? '#2e77b2' : '#1c4a76';
        var b = toDeep ? '#1c4a76' : '#2e77b2';
        var d = toDeep ? (5 + variant) : (3 + variant);
        var t = toDeep ? .5 : .42;
        if (side === 0)
        {
            dither(g, 0, 0, TILE, d, a, b, t);
        }
        else if (side === 2)
        {
            dither(g, 0, TILE - d, TILE, d, a, b, t);
        }
        else if (side === 3)
        {
            dither(g, 0, 0, d, TILE, a, b, t);
        }
        else
        {
            dither(g, TILE - d, 0, d, TILE, a, b, t);
        }
    });
}

function waterFoam(side, frame, variant)
{
    // 3px of wet ground outside the waterline is included, so the sprite is
    // drawn offset by 3 in each direction and is TILE+6 square.
    var S6 = TILE + 6;
    return bake('foam:' + side + ':' + frame + ':' + variant, S6, S6, function (g)
    {
        var c, up, d, o = 3;
        for (c = 0; c < TILE; c += 2)
        {
            up = Math.floor(hash2(variant * 31 + c, frame, 105) * 3);
            d = 2 + Math.floor(hash2(variant * 31 + c, frame, 101) * 3);
            var tail = hash2(c, variant + frame, 103) > .58;
            if (side === 0)
            {
                pr(g, o + c, o - up - 3, 2, 3, 'rgba(74,56,34,.20)');
                pr(g, o + c, o - up, 2, up + d, 'rgba(240,250,255,.72)');
                if (tail)
                {
                    pr(g, o + c, o + d, 2, 1, 'rgba(214,238,255,.42)');
                }
            }
            else if (side === 2)
            {
                pr(g, o + c, o + TILE + up, 2, 3, 'rgba(74,56,34,.20)');
                pr(g, o + c, o + TILE - d, 2, up + d, 'rgba(232,246,255,.62)');
                if (tail)
                {
                    pr(g, o + c, o + TILE - d - 1, 2, 1, 'rgba(214,238,255,.36)');
                }
            }
            else if (side === 3)
            {
                pr(g, o - up - 3, o + c, 3, 2, 'rgba(74,56,34,.20)');
                pr(g, o - up, o + c, up + d, 2, 'rgba(240,250,255,.68)');
                if (tail)
                {
                    pr(g, o + d, o + c, 1, 2, 'rgba(214,238,255,.4)');
                }
            }
            else
            {
                pr(g, o + TILE + up, o + c, 3, 2, 'rgba(74,56,34,.20)');
                pr(g, o + TILE - d, o + c, up + d, 2, 'rgba(240,250,255,.68)');
                if (tail)
                {
                    pr(g, o + TILE - d - 1, o + c, 1, 2, 'rgba(214,238,255,.4)');
                }
            }
        }
    });
}

// ---------- outdoor set dressing ----------
// The beach and the mountain were as bare as the plaza was: sand, water, and
// nothing that says a person works here.

function sprCampfire(tick)
{
    var f = (tick >> 3) % 3;
    return bake('campfire:' + f, 40, 34, function (g)
    {
        var st = '#7d7268';
        contactShadow(g, 20, 31, 15, 4);
        var i;
        for (i = 0; i < 7; i++)
        {
            var a = i / 7 * Math.PI * 2;
            var sx = 20 + Math.cos(a) * 14;
            var sy = 25 + Math.sin(a) * 6;
            var c = tone(st, (i % 3) === 0 ? .7 : -.5);
            pe(g, sx, sy, 4, 3, c);
            pr(g, sx - 3, sy - 3, 6, 1, tone(c, 1.2));
            pr(g, sx - 3, sy + 2, 6, 1, tone(c, -1.6));
        }
        drawLimb(g, 11, 26, 28, 19, 5, 4, '#6d4726');
        drawLimb(g, 29, 26, 12, 19, 5, 4, '#5a3a1e');
        pe(g, 20, 16 - f, 8, 10, '#e8621e');
        pe(g, 20, 18 - f, 6, 7, '#f4a12a');
        pe(g, 20, 20 - f, 3, 4, '#ffe07a');
        pr(g, 19, 8 - f, 2, 3, 'rgba(255,190,110,.5)');
    }, { outline: true });
}

function sprBuoy(tick)
{
    var bobY = Math.round(Math.sin(tick * .05) * 2);
    return bake('buoy:' + bobY, 24, 34, function (g)
    {
        var r = '#c8443a', w = '#e8e4dc';
        pr(g, 5, 28 + bobY, 14, 2, 'rgba(255,255,255,.28)');
        pr(g, 7, 31 + bobY, 10, 1, 'rgba(255,255,255,.18)');
        pe(g, 12, 22 + bobY, 8, 6, r);
        pr(g, 5, 18 + bobY, 14, 5, w);
        pr(g, 5, 18 + bobY, 14, 1, tone(w, 1.3));
        pr(g, 5, 22 + bobY, 14, 1, tone(w, -1.5));
        pr(g, 6, 12 + bobY, 12, 6, r);
        pr(g, 6, 12 + bobY, 3, 6, tone(r, 1.2));
        pr(g, 15, 12 + bobY, 3, 6, tone(r, -1.3));
        pr(g, 10, 5 + bobY, 4, 8, '#5a5f68');
        pe(g, 12, 4 + bobY, 3, 3, '#f0d24a');
    }, { outline: true });
}

function sprNet()
{
    // The first version was a mesh stretched between two poles, which read as a
    // lobster trap. A drying net hangs and sags: a slack top rope, long strands
    // falling from it, and floats along the line.
    return bake('net', 44, 40, function (g)
    {
        var p = '#6d5030', n = '#d8cba4';
        contactShadow(g, 22, 37, 16, 4);
        // two leaning poles
        drawLimb(g, 7, 36, 5, 6, 5, 3, p);
        drawLimb(g, 37, 36, 39, 6, 5, 3, p);
        // the rope between them sags
        var i, j;
        for (i = 5; i <= 39; i++)
        {
            var t = (i - 5) / 34;
            var sag = Math.round(Math.sin(t * Math.PI) * 4);
            pr(g, i, 6 + sag, 1, 2, p);
        }
        // strands hanging off it, each a different length
        for (i = 0; i < 12; i++)
        {
            var sx = 6 + i * 3;
            var t2 = (sx - 5) / 34;
            var top = 8 + Math.round(Math.sin(t2 * Math.PI) * 4);
            var len = 12 + Math.floor(hash2(i, 3, 431) * 12);
            for (j = 0; j < len; j++)
            {
                // a slight waver so it hangs like rope, not wire
                var wob = Math.round(Math.sin(j * .5 + i) * .8);
                pr(g, sx + wob, top + j, 1, 1, (j % 4 === 0) ? tone(n, -1) : n);
            }
        }
        // horizontal knots tie the strands into a mesh
        for (j = 0; j < 3; j++)
        {
            var ky = 13 + j * 7;
            for (i = 6; i < 40; i += 3)
            {
                pr(g, i, ky + Math.round(Math.sin((i - 5) / 34 * Math.PI) * 3), 2, 1, tone(n, -.7));
            }
        }
        // cork floats along the top
        for (i = 0; i < 4; i++)
        {
            var fx = 9 + i * 9;
            var ft = (fx - 5) / 34;
            pe(g, fx, 7 + Math.round(Math.sin(ft * Math.PI) * 4), 3, 2, '#c86a3a');
            pr(g, fx - 1, 6 + Math.round(Math.sin(ft * Math.PI) * 4), 1, 1, '#e08a54');
        }
    }, { outline: true });
}
function sprSignpost(dirs)
{
    return bake('signpost:' + dirs, 34, 46, function (g)
    {
        var p = '#7d5a34';
        contactShadow(g, 17, 43, 8, 3);
        pr(g, 15, 10, 5, 33, p);
        pr(g, 15, 10, 2, 33, tone(p, 1.1));
        pr(g, 19, 10, 1, 33, tone(p, -1.5));
        var i;
        for (i = 0; i < dirs; i++)
        {
            var y = 12 + i * 10;
            var left = (i % 2) === 0;
            var bx = left ? 2 : 17;
            pr(g, bx, y, 16, 7, tone(p, .8));
            pr(g, bx, y, 16, 1, tone(p, 1.6));
            pr(g, bx, y + 6, 16, 1, tone(p, -1.8));
            var t;
            for (t = 0; t < 4; t++)
            {
                var tx = left ? bx - 1 - t : bx + 16 + t;
                pr(g, tx, y + 1 + t, 1, 7 - t * 2, tone(p, .8));
            }
            pr(g, bx + 3, y + 2, 9, 1, tone(p, -1.4));
            pr(g, bx + 3, y + 4, 7, 1, tone(p, -1.4));
        }
        pr(g, 13, 6, 9, 5, tone(p, .5));
        pr(g, 13, 6, 9, 1, tone(p, 1.5));
    }, { outline: true });
}

function sprDriftwood()
{
    return bake('driftwood', 44, 24, function (g)
    {
        var w = '#b0a086';
        contactShadow(g, 22, 21, 18, 4);
        drawLimb(g, 4, 15, 40, 12, 7, 5, w);
        drawLimb(g, 26, 13, 36, 4, 4, 2, w);
        drawLimb(g, 14, 14, 8, 6, 4, 2, w);
        var i;
        for (i = 0; i < 7; i++)
        {
            pr(g, 7 + i * 5, 13 + (i % 2), 4, 1, tone(w, -1.2));
        }
        pe(g, 6, 15, 3, 3, tone(w, -1.8));
        pe(g, 39, 12, 3, 3, tone(w, -1.8));
    }, { outline: true });
}

// ---------- festival props ----------
// Only drawn while a festival is running. See src/festival.js.

function sprBanner(text)
{
    return bake('banner:' + text, 128, 44, function (g)
    {
        var cl = '#c8443a';
        // rope
        pr(g, 0, 3, 128, 2, '#8a6a44');
        // cloth with a scalloped hem
        pr(g, 4, 5, 120, 28, cl);
        pr(g, 4, 5, 120, 3, tone(cl, 1.3));
        pr(g, 4, 30, 120, 3, tone(cl, -1.6));
        var i;
        for (i = 4; i < 124; i += 8)
        {
            pe(g, i + 4, 33, 4, 3, tone(cl, -1.2));
        }
        // gold trim
        pr(g, 8, 9, 112, 1, '#f0d24a');
        pr(g, 8, 28, 112, 1, '#d8a838');
        // lettering blocks: readable as writing at this size, not as text
        var n = Math.min(9, Math.max(4, (text || '').length));
        var w = n * 10;
        var sx = 64 - w / 2;
        for (i = 0; i < n; i++)
        {
            var bx = sx + i * 10;
            pr(g, bx, 14, 7, 10, '#f4ecd8');
            pr(g, bx + 1, 16, 5, 1, tone(cl, -1));
            pr(g, bx + 1, 19, 5, 1, tone(cl, -1));
            pr(g, bx + 2, 14, 1, 10, tone(cl, -.6));
        }
    }, { outline: true });
}

function sprBunting(alt)
{
    return bake('bunting:' + alt, 128, 30, function (g)
    {
        pr(g, 0, 2, 128, 2, '#8a6a44');
        var cols = ['#d8564a', '#f0c24a', '#5aa8d8', '#6ab86a', '#b06ad8'];
        var i;
        for (i = 0; i < 8; i++)
        {
            var fx = i * 16 + 2;
            var dip = Math.round(Math.sin(i * .9) * 2);
            var c = cols[(i + alt) % cols.length];
            var t;
            for (t = 0; t < 12; t++)
            {
                var w = 12 - t;
                pr(g, fx + t / 2, 4 + t + dip, w, 1, t < 3 ? tone(c, 1.2) : c);
            }
            pr(g, fx, 4 + dip, 12, 1, tone(c, 1.5));
        }
    }, { outline: true });
}

function sprLanternString(phase)
{
    return bake('lstring:' + phase, 96, 34, function (g)
    {
        pr(g, 0, 2, 96, 2, '#6a5238');
        var cols = ['#f0a848', '#f4d060', '#e87a58'];
        var i;
        for (i = 0; i < 4; i++)
        {
            var lx = 10 + i * 24;
            var dip = Math.round(Math.sin(i * 1.1) * 2);
            var c = cols[(i + phase) % cols.length];
            pr(g, lx + 5, 4 + dip, 2, 4, '#6a5238');
            pe(g, lx + 6, 14 + dip, 7, 8, c);
            pe(g, lx + 4, 12 + dip, 4, 4, tone(c, 1.4));
            pr(g, lx + 2, 8 + dip, 9, 2, tone(c, -1.2));
            pr(g, lx + 2, 19 + dip, 9, 2, tone(c, -1.2));
            pr(g, lx + 5, 22 + dip, 3, 3, '#8a6a44');
        }
    }, { outline: true });
}

function sprStall(col)
{
    return bake('stall:' + col, 80, 64, function (g)
    {
        var wd = '#8a6238';
        contactShadow(g, 40, 61, 30, 5);
        // posts
        pr(g, 5, 26, 5, 34, wd);
        pr(g, 70, 26, 5, 34, wd);
        pr(g, 5, 26, 2, 34, tone(wd, 1.1));
        // counter
        pr(g, 6, 42, 68, 7, wd);
        pr(g, 6, 42, 68, 2, tone(wd, 1.3));
        pr(g, 6, 47, 68, 2, tone(wd, -1.7));
        pr(g, 10, 49, 60, 11, tone(wd, -.8));
        // striped awning
        var i;
        for (i = 0; i < 9; i++)
        {
            var c = (i % 2) ? col : '#f2ead8';
            var t;
            for (t = 0; t < 18; t++)
            {
                pr(g, 2 + i * 8 + Math.round(t * .1), 8 + t, 8, 1, t < 3 ? tone(c, 1.2) : c);
            }
        }
        pr(g, 0, 6, 80, 4, wd);
        pr(g, 0, 6, 80, 1, tone(wd, 1.4));
        // scalloped hem
        for (i = 0; i < 10; i++)
        {
            pe(g, 4 + i * 8, 26, 4, 3, (i % 2) ? col : '#f2ead8');
        }
        // goods on the counter
        for (i = 0; i < 5; i++)
        {
            var gx = 12 + i * 12;
            var gc = ['#d85a4a', '#f0c24a', '#6ab86a', '#5aa8d8', '#b06ad8'][i];
            pe(g, gx + 3, 39, 4, 4, gc);
            pe(g, gx + 2, 38, 2, 2, tone(gc, 1.4));
        }
    }, { outline: true });
}

function sprFeastTable()
{
    return bake('feasttable', 80, 44, function (g)
    {
        var wd = '#8a6238', cloth = '#e8dcc0';
        contactShadow(g, 40, 41, 30, 5);

function sprFlowerArch()
{

    {

        pr(g, 16, 22, 7, 54, wd);
        pr(g, 73, 22, 7, 54, wd);
        pr(g, 16, 22, 2, 54, tone(wd, 1.1));
        // arch top
        var i;
        for (i = 0; i < 60; i++)
        {
            var a = Math.PI * (i / 59);
            var ax = 48 - Math.cos(a) * 32;
            var ay = 24 - Math.sin(a) * 18;
            pr(g, Math.round(ax) - 3, Math.round(ay), 6, 5, wd);
        }
        // flowers all over it
        var cols = ['#e86a94', '#f0d24a', '#8a6ad8', '#f2a0c8', '#f6f0e0'];
        for (i = 0; i < 34; i++)
        {
            var t = i / 33;
            var an = Math.PI * t;
            var fx = 48 - Math.cos(an) * (32 + (i % 3 - 1) * 4);
            var fy = 24 - Math.sin(an) * (18 + (i % 3 - 1) * 4);
            if (i % 5 === 0)
            {
                fx = (i % 10 < 5) ? 19 : 76;
                fy = 30 + (i * 7) % 44;
            }
            var c = cols[i % cols.length];
            pe(g, fx, fy, 4, 4, c);

        var py = cy + Math.sin(a) * r * .45;
        var c = ['#f2a0c8', '#f6d8e4', '#e86a94', '#f6f0e0'][i % 4];

function sprStarTree(tick)
{
    var f = (tick >> 4) % 3;
    return bake('startree:' + f, 96, 108, function (g)
    {
        var col = '#2f6a3f';
        contactShadow(g, 48, 104, 26, 6);
        // trunk
        pr(g, 43, 90, 10, 14, '#5a3c22');
        pr(g, 43, 90, 3, 14, '#6d4a2c');
        // cone
        var y, t, w, ax;
        var top = 12, bottom = 92, span = bottom - top;
        for (y = top; y <= bottom; y++)
        {
            t = (y - top) / span;
            w = Math.max(1, Math.round(30 * Math.pow(t, .8) + (hash2(y, 2, 307) - .5) * 2.6));
            ax = 48;
            pr(g, ax - w, y, w * 2, 1, col);
            pr(g, ax - w, y, Math.max(1, Math.round(w * .42)), 1, tone(col, .85));
            pr(g, ax + Math.round(w * .5), y, Math.max(1, w - Math.round(w * .5)), 1, tone(col, -1.05));
        }
        var i;
        for (i = 1; i <= 5; i++)
        {
            var ly = Math.round(top + span * (i / 5.4));
            var lw = Math.max(2, Math.round(30 * Math.pow((ly - top) / span, .8)));
            pr(g, 48 - lw, ly, lw * 2, 1, tone(col, -2));
            pr(g, 48 - lw + 2, ly - 3, Math.round(lw * .85), 1, tone(col, 1.1));
        }
        // baubles and lights
        var cols = ['#e04a4a', '#f0c24a', '#5aa8d8', '#f2f0e6', '#c86ad8'];
        for (i = 0; i < 22; i++)
        {
            var by = 20 + Math.floor(hash2(i, 5, 911) * 68);
            var bw = Math.round(30 * Math.pow((by - top) / span, .8));
            var bx = 48 + Math.round((hash2(5, i, 913) - .5) * bw * 1.7);
            var c = cols[i % cols.length];
            pe(g, bx, by, 3, 3, c);
            pe(g, bx - 1, by - 1, 1, 1, tone(c, 1.5));
            if ((i + f) % 3 === 0)
            {
                pe(g, bx, by, 4, 4, 'rgba(255,240,190,.35)');
            }
        }
        // star on top
        var sc = f === 1 ? '#fff6c8' : '#f6e08a';
        pr(g, 46, 4, 4, 12, sc);
        pr(g, 42, 8, 12, 4, sc);
        pr(g, 44, 6, 8, 8, sc);
        pe(g, 48, 10, 7, 7, 'rgba(255,244,200,.35)');
    }, { outline: true });
}

// A clinic and a museum should not have the same flagstones as the town square.
// Big square tiles laid on the diagonal, with a grout line and a soft sheen.
function drawCheckerFloor(g, col, variant)
{
    var a = tone(col, .5), b = tone(col, -.9);
    pr(g, 0, 0, TILE, TILE, a);
    var i, j;
    for (j = 0; j < 2; j++)
    {
        for (i = 0; i < 2; i++)
        {
            if ((i + j) % 2 === 0)
            {
                continue;
            }
            pr(g, i * 16, j * 16, 16, 16, b);
        }
    }
    // grout
    pr(g, 0, 15, TILE, 2, tone(col, -2));
    pr(g, 15, 0, 2, TILE, tone(col, -2));
    // a lit edge on each tile so they read as laid, not painted
    for (j = 0; j < 2; j++)
    {
        for (i = 0; i < 2; i++)
        {
            var c = ((i + j) % 2 === 0) ? a : b;
            pr(g, i * 16, j * 16, 15, 1, tone(c, 1.2));
            pr(g, i * 16, j * 16, 1, 15, tone(c, .8));
            pr(g, i * 16, j * 16 + 14, 15, 1, tone(c, -1.3));
        }
    }
    // faint wear, different per tile position
    for (i = 0; i < 5; i++)
    {
        var wx = Math.floor(hash2(i, variant, 421) * TILE);
        var wy = Math.floor(hash2(variant, i, 423) * TILE);
        pr(g, wx, wy, 2, 1, tone(col, -.5));
    }
}

// ---------- map building ----------

var INTERIOR_WALL_ROWS = 2;

var MAP_CACHE = {};

function fillRect(m, x, y, w, h, t)
{
    var i, j;
    for (j = y; j < y + h; j++)
    {
        for (i = x; i < x + w; i++)
        {
            if (i >= 0 && i < m.w && j >= 0 && j < m.h)
            {
                m.tiles[j * m.w + i] = t;
            }
        }
    }
}

function inAny(rects, x, y)
{
    var i;
    for (i = 0; i < rects.length; i++)
    {
        var r = rects[i];
        if (x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h)
        {
            return true;
        }
    }
    return false;
}

// build the static structure of a map. dynamic objects (crops, dropped items,
// placed machines) live in the save and are merged at draw time.
// Deep water is authored as a rectangle inside a shallow rectangle, so the
// depth change was a perfectly straight line no matter how it was shaded.
// Dithering the pixels was not enough -- the straightness lives in the tile
// grid. Scatter the tiles themselves, but in 2x2 lobes and then smooth, because
// a per-tile coin flip leaves single dark squares that read as holes.
function roughenWaterDepth(m)
{
    var x, y, i, pass;
    var flips = [];
    for (y = 0; y < m.h; y++)
    {
        for (x = 0; x < m.w; x++)
        {
            var t = m.tiles[y * m.w + x];
            if (t !== T_DEEP && t !== T_WATER)
            {
                continue;
            }
            var want = (t === T_DEEP) ? T_WATER : T_DEEP;
            var touches = false;
            var dx = [0, 1, 0, -1], dy = [-1, 0, 1, 0], d;
            for (d = 0; d < 4; d++)
            {
                if (tileAt(m, x + dx[d], y + dy[d]) === want)
                {
                    touches = true;
                }
            }
            if (!touches)
            {
                continue;
            }
            // hash on a 2x2 block so flips arrive as lobes, not as speckle
            var p = (t === T_DEEP) ? .52 : .3;
            if (hash2(Math.floor(x / 3), Math.floor(y / 3), 149) < p)
            {
                flips.push(y * m.w + x, want);
            }
        }
    }
    for (i = 0; i < flips.length; i += 2)
    {
        m.tiles[flips[i]] = flips[i + 1];
    }
    // smooth: a water tile outnumbered by the other depth joins it, which
    // removes single-tile islands and leaves a wandering edge
    for (pass = 0; pass < 2; pass++)
    {
        var fix = [];
        for (y = 0; y < m.h; y++)
        {
            for (x = 0; x < m.w; x++)
            {
                var t2 = m.tiles[y * m.w + x];
                if (t2 !== T_DEEP && t2 !== T_WATER)
                {
                    continue;
                }
                var other = (t2 === T_DEEP) ? T_WATER : T_DEEP;
                var n = 0, ddx = [0, 1, 0, -1], ddy = [-1, 0, 1, 0], k;
                for (k = 0; k < 4; k++)
                {
                    if (tileAt(m, x + ddx[k], y + ddy[k]) === other)
                    {
                        n++;
                    }
                }
                // only true islands: n >= 3 also swallowed every lobe and put
                // the straight line back
                if (n >= 4)
                {
                    fix.push(y * m.w + x, other);
                }
            }
        }
        for (i = 0; i < fix.length; i += 2)
        {
            m.tiles[fix[i]] = fix[i + 1];
        }
    }
}

function buildMap(id)
{
    if (MAP_CACHE[id])
    {
        return MAP_CACHE[id];
    }
    var def = MAPS[id];
    var m;
    if (def)
    {
        m = { id: id, name: def.name, w: def.w, h: def.h, outdoor: true, fish: def.fish,
            tiles: new Uint8Array(def.w * def.h), objects: [], warps: [], solidMask: null, till: def.till || [] };
        var i;
        for (i = 0; i < m.tiles.length; i++)
        {
            m.tiles[i] = def.ground;
        }
        for (i = 0; i < (def.r || []).length; i++)
        {
            var r = def.r[i];
            fillRect(m, r.x, r.y, r.w, r.h, r.t);
        }
        // buildings: footprint is solid, door tile is a warp
        for (i = 0; i < (def.b || []).length; i++)
        {
            var b = def.b[i];
            fillRect(m, b.x, b.y, b.tw, b.th, T_CLIFF);
            var dx = b.x + b.door;
            var dy = b.y + b.th;
            m.tiles[(dy - 1) * m.w + dx] = T_WOOD;
            m.objects.push({ kind: 'building', bkind: b.kind, x: b.x, y: b.y, tw: b.tw, th: b.th, sign: b.sign || '' });
            m.warps.push({ x: dx, y: dy - 1, w: 1, h: 1, to: b.warp, interior: true, locked: b.locked || null });
        }
        roughenWaterDepth(m);
        for (i = 0; i < (def.obj || []).length; i++)
        {
            var o = def.obj[i];
            var oo = { kind: o.kind, x: o.x, y: o.y, text: o.text || '' };
            m.objects.push(oo);
            if (o.kind === 'fountain')
            {
                fillRect(m, o.x, o.y, 4, 3, T_WATER);
            }
            if (o.kind === 'bin' || o.kind === 'board')
            {
                m.tiles[o.y * m.w + o.x] = m.tiles[o.y * m.w + o.x];
            }
        }
        for (i = 0; i < (def.wp || []).length; i++)
        {
            var w2 = def.wp[i];
            m.warps.push({ x: w2.x, y: w2.y, w: w2.w, h: w2.h, to: w2.to, tx: w2.tx, ty: w2.ty, mine: w2.mine });
        }
        scatterMap(m, def);
    }
    else
    {
        m = buildInterior(id);
    }
    rebuildSolid(m);
    MAP_CACHE[id] = m;
    return m;
}

function buildInterior(id)
{
    var d = INTERIORS[id];
    if (!d)
    {
        d = INTERIORS.farmhouse;
    }
    var m = { id: id, name: d.name, w: d.w, h: d.h, outdoor: false, interior: d,
        tiles: new Uint8Array(d.w * d.h), objects: [], warps: [], till: d.till ? [d.till] : [] };
    var i;
    for (i = 0; i < m.tiles.length; i++)
    {
        m.tiles[i] = d.floor;
    }
    // The top wall is two rows. Window sills and wall-hung props are drawn
    // against that, so it is a constant rather than a magic number.
    fillRect(m, 0, 0, d.w, INTERIOR_WALL_ROWS, T_WALL);
    fillRect(m, 0, 0, 1, d.h, T_WALL);
    fillRect(m, d.w - 1, 0, 1, d.h, T_WALL);
    fillRect(m, 0, d.h - 1, d.w, 1, T_WALL);
    if (d.till)
    {
        fillRect(m, d.till.x, d.till.y, d.till.w, d.till.h, T_DIRT);
    }
    for (i = 0; i < (d.rugs || []).length; i++)
    {
        m.objects.push({ kind: 'rug', rk: d.rugs[i].c, x: d.rugs[i].x, y: d.rugs[i].y });
    }
    for (i = 0; i < (d.f || []).length; i++)
    {
        var f = d.f[i];
        m.objects.push({ kind: 'furn', fk: f.k, x: f.x, y: f.y });
        var fw = { bed: 2, table: 3, counter: 5, shelf: 3, kitchen: 3, tv: 2, chest: 1,
            forge: 2, hay: 2, barrel: 1, orb: 1, calendar: 2, plant: 1, painting: 2,
            lamp: 1, stool: 1, crate: 1, books: 2, goods: 2,
            window: 2, anvil: 1, bottles: 2, fireplace: 2, pedestal: 1, lumber: 1,
            milkcan: 1, dartboard: 1, clock: 1, sawhorse: 1 }[f.k] || 1;
        var fh = { bed: 3, table: 2, counter: 2, shelf: 2, kitchen: 2, tv: 2, chest: 1,
            forge: 2, hay: 2, barrel: 1, orb: 1, calendar: 1, plant: 1, painting: 1,
            lamp: 1, stool: 1, crate: 1, books: 1, goods: 1,
            window: 2, anvil: 1, bottles: 2, fireplace: 2, pedestal: 1, lumber: 1,
            milkcan: 1, dartboard: 1, clock: 1, sawhorse: 1 }[f.k] || 1;
        // wall hangings and small props do not block movement
        var passable = { chest: 1, calendar: 1, painting: 1, goods: 1,
            window: 1, dartboard: 1, bottles: 1 };
        if (!passable[f.k])
        {
            fillRect(m, f.x, f.y, fw, fh, T_WALL);
        }
    }
    // exit tile
    var ex = d.exit;
    m.tiles[ex.y * m.w + ex.x] = d.floor;
    m.tiles[ex.y * m.w + ex.x + 1] = d.floor;
    m.warps.push({ x: ex.x, y: ex.y, w: 2, h: 1, to: ex.to, tx: ex.tx, ty: ex.ty });
    m.exitDoor = { x: ex.x, y: ex.y };
    if (d.npc)
    {
        m.staticNpc = d.npc;
    }
    return m;
}

// seeded scatter so a fresh save always looks the same before the player edits it
// A warp tile, or any tile touching one, is off limits to scatter.
function nearWarp(m, x, y)
{
    var i;
    for (i = 0; i < m.warps.length; i++)
    {
        var w = m.warps[i];
        if (x >= w.x - 1 && x <= w.x + (w.w || 1) &&
            y >= w.y - 1 && y <= w.y + (w.h || 1))
        {
            return true;
        }
    }
    return false;
}

function scatterMap(m, def)
{
    var seedBase = 0;
    var s;
    for (s = 0; s < m.id.length; s++)
    {
        seedBase = (seedBase * 31 + m.id.charCodeAt(s)) | 0;
    }
    var gi, k;
    for (gi = 0; gi < (def.sc || []).length; gi++)
    {
        var grp = def.sc[gi];
        var placed = 0, tries = 0;
        while (placed < grp.n && tries < grp.n * 40)
        {
            tries++;
            var rx = Math.floor(hash2(tries, gi, seedBase) * m.w);
            var ry = Math.floor(hash2(gi, tries, seedBase + 7) * m.h);
            if (rx < 2 || ry < 2 || rx >= m.w - 2 || ry >= m.h - 2)
            {
                continue;
            }
            var gt = m.tiles[ry * m.w + rx];
            if (gt !== T_GRASS && gt !== T_SAND && gt !== T_DIRT)
            {
                continue;
            }
            if (grp.avoid && inAny(grp.avoid, rx, ry))
            {
                continue;
            }
            // never drop scatter on or beside a warp: a bush on the forest exit
            // or a rock on the skull cavern entrance quietly blocks the way out
            if (nearWarp(m, rx, ry))
            {
                continue;
            }
            var occupied = false;
            for (k = 0; k < m.objects.length; k++)
            {
                var ob = m.objects[k];
                if (Math.abs(ob.x - rx) < 2 && Math.abs(ob.y - ry) < 2)
                {
                    occupied = true;
                    break;
                }
            }
            if (occupied)
            {
                continue;
            }
            var o = makeScatterObject(grp.kind, rx, ry, tries + gi * 997 + seedBase);
            if (o)
            {
                m.objects.push(o);
                placed++;
            }
        }
    }
}

function makeScatterObject(kind, x, y, seed)
{
    var r = hash2(x, y, seed);
    if (kind === 'tree')
    {
        var tk = r < .45 ? 'oak' : (r < .8 ? 'maple' : 'pine');
        return { kind: 'tree', tk: tk, stage: 4, x: x, y: y, hp: 5 };
    }
    if (kind === 'stone')
    {
        return { kind: 'rock', rk: 'stone', x: x, y: y, hp: 1 };
    }
    if (kind === 'weed')
    {
        return { kind: 'weed', x: x, y: y };
    }
    if (kind === 'wood')
    {
        return { kind: 'branch', x: x, y: y };
    }
    if (kind === 'grass')
    {
        return { kind: 'grass', x: x, y: y };
    }
    if (kind === 'bush')
    {
        return { kind: 'bush', x: x, y: y };
    }
    if (kind === 'flower')
    {
        var cols = ['#e85888', '#f0d040', '#7a88e8', '#e87038', '#d878e8'];
        return { kind: 'flowerdeco', col: cols[Math.floor(r * cols.length)], x: x, y: y };
    }
    if (kind === 'beachforage')
    {
        return { kind: 'forage', item: BEACH_FORAGE[Math.floor(r * BEACH_FORAGE.length)], x: x, y: y };
    }
    if (kind === 'desertforage')
    {
        return { kind: 'forage', item: DESERT_FORAGE[Math.floor(r * DESERT_FORAGE.length)], x: x, y: y };
    }
    if (kind === 'cactus')
    {
        return { kind: 'cactus', big: r > .55, x: x, y: y, hp: 2 };
    }
    if (kind === 'artifactspot')
    {
        return { kind: 'artifactspot', x: x, y: y };
    }
    if (kind === 'quarryore')
    {
        var ores = ['copper', 'iron', 'gold', 'gem', 'coal'];
        return { kind: 'rock', rk: ores[Math.floor(r * ores.length)], x: x, y: y, hp: 2, mine: true };
    }
    return null;
}

// object footprints used for collision
// lamps switch on at dusk. one predicate so the sprite and the light agree.
function lampsLit()
{
    var h = S ? S.time / 60 : 12;
    return (h >= 18.2 || h < 6.4);
}

var OBJ_SOLID = { tree: 1, rock: 1, building: 1, bin: 1, furn: 1, board: 1, sign: 1,
    lamp: 1, bench: 1, planter: 1, barrel: 1, crate: 1,
    campfire: 1, net: 1, signpost: 1, driftwood: 1, buoy: 0, lumber: 1, sawhorse: 1,
    machine: 1, chest: 1, bush: 1, stump: 1, mine_entrance: 1, fountain: 1,
    animalbuilding: 1, fruittree: 1, cactus: 1, scarecrow: 0, crop: 0, weed: 0, grass: 0,
    branch: 0, forage: 0, flowerdeco: 0, drop: 0, sprinkler: 0, crabpot: 0,
    artifactspot: 0, pet: 0, horse: 0, skull_entrance: 0, minecart: 0, rug: 0 };

function rebuildSolid(m)
{
    m.solidMask = new Uint8Array(m.w * m.h);
    var i, j;
    for (i = 0; i < m.tiles.length; i++)
    {
        m.solidMask[i] = SOLID_TILES[m.tiles[i]] ? 1 : 0;
    }
    for (i = 0; i < m.objects.length; i++)
    {
        var o = m.objects[i];
        if (!OBJ_SOLID[o.kind])
        {
            continue;
        }
        var w = 1, h = 1;
        if (o.kind === 'building')
        {
            continue;   // already filled as cliff
        }
        if (o.kind === 'bin')
        {
            w = 2;
        }
        if (o.kind === 'bush' || o.kind === 'bench')
        {
            w = 2;
        }
        if (o.kind === 'mine_entrance')
        {
            continue;
        }
        if (o.kind === 'fountain')
        {
            continue;
        }
        if (o.kind === 'animalbuilding')
        {
            w = o.tw;
            h = o.th;
        }
        for (j = 0; j < h; j++)
        {
            var k2;
            for (k2 = 0; k2 < w; k2++)
            {
                var idx = (o.y + j) * m.w + (o.x + k2);
                if (idx >= 0 && idx < m.solidMask.length)
                {
                    m.solidMask[idx] = 1;
                }
            }
        }
    }
    // doors punch back through
    for (i = 0; i < m.warps.length; i++)
    {
        var wp = m.warps[i];
        var a, b;
        for (b = 0; b < (wp.h || 1); b++)
        {
            for (a = 0; a < (wp.w || 1); a++)
            {
                var ii = (wp.y + b) * m.w + (wp.x + a);
                if (ii >= 0 && ii < m.solidMask.length)
                {
                    m.solidMask[ii] = 0;
                }
            }
        }
    }
    // Edge warps sit inside a 2-tile border cliff, so clearing only the strip
    // left it walled off from the interior: the farm was a sealed box and its
    // town and forest exits could not be walked to at all. Open a gap from each
    // edge warp back to the ground the player can actually stand on.
    for (i = 0; i < m.warps.length; i++)
    {
        var wq = m.warps[i];
        if (wq.interior || wq.mine)
        {
            continue;
        }
        var c, d;
        for (d = 0; d < (wq.h || 1); d++)
        {
            for (c = 0; c < (wq.w || 1); c++)
            {
                carveEdgeGap(m, wq.x + c, wq.y + d);
            }
        }
    }
    m.groundDirty = true;
}

// Walk from an edge warp tile toward the middle of the map, opening solid tiles
// until standable ground is reached. Capped at 3 tiles so a badly placed warp
// cannot bore a tunnel across the map. The tile type changes too, otherwise the
// player would be walking through what still looks like a solid cliff face.
function carveEdgeGap(m, x, y)
{
    var dl = x, dr = m.w - 1 - x, dt = y, db = m.h - 1 - y;
    var near = Math.min(dl, dr, dt, db);
    if (near > 3)
    {
        return;         // not an edge warp; leave the map alone
    }
    var dx = 0, dy = 0;
    if (near === dl)
    {
        dx = 1;
    }
    else if (near === dr)
    {
        dx = -1;
    }
    else if (near === dt)
    {
        dy = 1;
    }
    else
    {
        dy = -1;
    }
    var open = m.outdoor ? T_PATH : T_STONE;
    var i, cx = x, cy = y;
    var idx0 = y * m.w + x;
    if (SOLID_TILES[m.tiles[idx0]])
    {
        m.tiles[idx0] = open;
    }
    for (i = 0; i < 3; i++)
    {
        cx += dx;
        cy += dy;
        if (cx < 0 || cy < 0 || cx >= m.w || cy >= m.h)
        {
            return;
        }
        var idx = cy * m.w + cx;
        if (m.solidMask[idx] === 0)
        {
            return;     // reached ground the player can stand on
        }
        m.solidMask[idx] = 0;
        m.tiles[idx] = open;
    }
}

function tileAt(m, tx, ty)
{
    if (tx < 0 || ty < 0 || tx >= m.w || ty >= m.h)
    {
        return T_VOID;
    }
    return m.tiles[ty * m.w + tx];
}

function isSolid(m, tx, ty)
{
    if (tx < 0 || ty < 0 || tx >= m.w || ty >= m.h)
    {
        return true;
    }
    return m.solidMask[ty * m.w + tx] === 1;
}

function isWater(m, tx, ty)
{
    return WATER_TILES[tileAt(m, tx, ty)] === 1;
}

function isTillable(m, tx, ty)
{
    var t = tileAt(m, tx, ty);
    if (t === T_DIRT)
    {
        return true;
    }
    if (t !== T_GRASS)
    {
        return false;
    }
    var i;
    for (i = 0; i < (m.till || []).length; i++)
    {
        var r = m.till[i];
        if (tx >= r.x && tx < r.x + r.w && ty >= r.y && ty < r.y + r.h)
        {
            return true;
        }
    }
    return false;
}

function objAt(m, tx, ty)
{
    var i;
    for (i = m.objects.length - 1; i >= 0; i--)
    {
        var o = m.objects[i];
        var w = 1, h = 1;
        if (o.kind === 'bin' || o.kind === 'bush')
        {
            w = 2;
        }
        if (o.kind === 'building')
        {
            w = o.tw;
            h = o.th;
        }
        if (o.kind === 'animalbuilding')
        {
            w = o.tw;
            h = o.th;
        }
        if (tx >= o.x && tx < o.x + w && ty >= o.y && ty < o.y + h)
        {
            return o;
        }
    }
    return null;
}

function removeObj(m, o)
{
    var i = m.objects.indexOf(o);
    if (i >= 0)
    {
        m.objects.splice(i, 1);
        rebuildSolid(m);
    }
}

function addObj(m, o)
{
    m.objects.push(o);
    rebuildSolid(m);
}

function warpAt(m, tx, ty)
{
    var i;
    for (i = 0; i < m.warps.length; i++)
    {
        var w = m.warps[i];
        if (tx >= w.x && tx < w.x + (w.w || 1) && ty >= w.y && ty < w.y + (w.h || 1))
        {
            return w;
        }
    }
    return null;
}

// ---------- static ground layer ----------

// Baked ground layers are big (the farm alone is 1664x1408). Keeping one per
// visited map crept past 30MB, which is enough for iOS Safari to reap the tab.
// Hold on to the few most recently drawn and release the rest.
var GROUND_LRU = [];
var GROUND_KEEP = 3;

function releaseOldGround(current)
{
    var i = GROUND_LRU.indexOf(current);
    if (i >= 0)
    {
        GROUND_LRU.splice(i, 1);
    }
    GROUND_LRU.push(current);
    while (GROUND_LRU.length > GROUND_KEEP)
    {
        var m = GROUND_LRU.shift();
        if (m && m !== current && m._gc)
        {
            m._gc.width = 0;
            m._gc.height = 0;
            m._gc = null;
            m._gcKey = null;
        }
    }
}

function groundCanvas(m, season, waterFrame)
{
    var key = 'g:' + m.id + ':' + season;
    if (!m._gc || m._gcKey !== key || m.groundDirty)
    {
        m._gc = makeCv(m.w * TILE, m.h * TILE);
        m._gcKey = key;
        m.groundDirty = false;
        releaseOldGround(m);
        var g = m._gc.getContext('2d');
        g.imageSmoothingEnabled = false;
        var x, y;
        for (y = 0; y < m.h; y++)
        {
            for (x = 0; x < m.w; x++)
            {
                var t = m.tiles[y * m.w + x];
                var img = null;
                if (t === T_GRASS)
                {
                    img = tileGrass(season, Math.floor(hash2(x, y, 3) * 8));
                }
                else if (t === T_DIRT)
                {
                    img = tileDirt(season, Math.floor(hash2(x, y, 37) * 8));
                }
                else if (t === T_SAND)
                {
                    img = tileSand(Math.floor(hash2(x, y, 29) * 8));
                }
                else if (t === T_STONE)
                {
                    img = tileStoneFloor(Math.floor(hash2(x, y, 53) * 8),
                        m.interior && m.interior.floorCol,
                        m.interior && m.interior.floorStyle);
                }
                else if (t === T_WOOD || t === T_BRIDGE)
                {
                    img = tileWoodFloor(Math.floor(hash2(x, y, 59) * 4),
                        m.interior && m.interior.floorCol);
                }
                else if (t === T_PATH)
                {
                    img = tilePath(Math.floor(hash2(x, y, 61) * 8));
                }
                else if (t === T_ICE)
                {
                    img = tileSnowIce();
                }
                else if (t === T_CAVE)
                {
                    img = tileCave(m.floor || 1, Math.floor(hash2(x, y, 43) * 4));
                }
                else if (t === T_CAVEWALL)
                {
                    img = tileCaveWall(m.floor || 1, Math.floor(hash2(x, y, 47) * 4));
                }
                else if (t === T_CARPET)
                {
                    img = tileCarpet(Math.floor(hash2(x, y, 67) * 3),
                        m.interior && m.interior.floorCol);
                }
                else if (t === T_CLIFF)
                {
                    img = null;
                    drawCliffTile(g, m, x, y, season);
                }
                else if (t === T_WALL)
                {
                    var wc = (m.interior && m.interior.wall) || '#c8a878';
                    var wp = (m.interior && m.interior.paper) || 'plain';
                    var below = tileAt(m, x, y + 1);
                    img = tileWall(wc, wp, Math.floor(hash2(x, y, 71) * 4),
                        below !== T_WALL && below !== T_VOID);
                }
                if (img)
                {
                    g.drawImage(img, x * TILE, y * TILE);
                }
            }
        }
        // second pass: let higher-priority ground grow over its neighbours so no
        // two materials ever meet in a straight line
        for (y = 0; y < m.h; y++)
        {
            for (x = 0; x < m.w; x++)
            {
                var me = m.tiles[y * m.w + x];
                var myPri = EDGE_PRI[me];
                if (myPri === undefined)
                {
                    continue;
                }
                var nx = [0, 1, 0, -1], ny = [-1, 0, 1, 0];
                var s;
                for (s = 0; s < 4; s++)
                {
                    var nt = tileAt(m, x + nx[s], y + ny[s]);
                    var np = EDGE_PRI[nt];
                    if (np === undefined || np <= myPri)
                    {
                        continue;
                    }
                    var col = edgeColorOf(nt, season);
                    if (!col)
                    {
                        continue;
                    }
                    drawFringe(g, x * TILE, y * TILE, s, col, nt, season, (x * 31 + y * 17 + s) | 0);
                }
            }
        }
        groundMacro(g, m, season);
        interiorShading(g, m);
    }
    return m._gc;
}

// Indoors, wall and floor were the same brightness with no seam, so a room read
// as one flat texture. Drop a shadow from every wall onto the floor below it and
// darken the room's edges. Baked with the ground layer, so it costs nothing.
function interiorShading(g, m)
{
    if (m.outdoor || m.id === 'mine')
    {
        return;
    }
    var x, y, i;
    for (y = 0; y < m.h; y++)
    {
        for (x = 0; x < m.w; x++)
        {
            if (m.tiles[y * m.w + x] === T_WALL)
            {
                continue;
            }
            var px = x * TILE, py = y * TILE;
            if (tileAt(m, x, y - 1) === T_WALL)
            {
                for (i = 0; i < 9; i++)
                {
                    g.fillStyle = 'rgba(26,22,48,' + (.30 - i * .033) + ')';
                    g.fillRect(px, py + i, TILE, 1);
                }
            }
            // side walls throw a narrower shadow
            if (tileAt(m, x - 1, y) === T_WALL)
            {
                for (i = 0; i < 5; i++)
                {
                    g.fillStyle = 'rgba(26,22,48,' + (.18 - i * .034) + ')';
                    g.fillRect(px + i, py, 1, TILE);
                }
            }
            if (tileAt(m, x + 1, y) === T_WALL)
            {
                for (i = 0; i < 5; i++)
                {
                    g.fillStyle = 'rgba(26,22,48,' + (.12 - i * .022) + ')';
                    g.fillRect(px + TILE - 1 - i, py, 1, TILE);
                }
            }
            if (tileAt(m, x, y + 1) === T_WALL)
            {
                for (i = 0; i < 4; i++)
                {
                    g.fillStyle = 'rgba(26,22,48,' + (.14 - i * .03) + ')';
                    g.fillRect(px, py + TILE - 1 - i, TILE, 1);
                }
            }
        }
    }
    // the middle of the room is the brightest part of it
    var W = m.w * TILE, H = m.h * TILE;
    var vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .18,
        W / 2, H / 2, Math.max(W, H) * .62);
    vg.addColorStop(0, 'rgba(255,246,224,.05)');
    vg.addColorStop(.55, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(24,20,44,.20)');
    g.fillStyle = vg;
    g.fillRect(0, 0, W, H);
}

// Tiles repeat every 32px, and the eye locks onto that period long before it
// notices the pixels inside a tile -- which is why a desert screen read as
// brickwork no matter how good one sand tile looked. This paints broad, soft
// light and dark swells across the whole map so the dominant frequency is
// terrain-sized, not tile-sized. It runs once per ground bake, so it is free.
function groundMacro(g, m, season)
{
    if (!m.outdoor && m.id !== 'mine')
    {
        // Interiors need it too -- a 32px floor tile repeated across a room
        // rhymes exactly like a desert does -- but much quieter, since a room
        // has no weather or terrain to justify big swells.
        interiorMacro(g, m);
        return;
    }
    var W = m.w * TILE, H = m.h * TILE;
    var seed = 0, i;
    for (i = 0; i < m.id.length; i++)
    {
        seed = (seed * 31 + m.id.charCodeAt(i)) | 0;
    }
    seed = Math.abs(seed) + (season === 'winter' ? 7 : 0);
    var rnd = function (n)
    {
        return hash2(seed % 977, n, 157);
    };

    // Snow is near-white, and soft-light barely moves pixels that are already
    // at the top of the range -- the winter pass with soft-light was invisible.
    // Winter therefore paints a translucent blue directly instead, which is
    // also physically what a snow shadow is: sky light, not grey.
    var wint = (season === 'winter');

    g.save();
    if (wint)
    {
        g.globalCompositeOperation = 'source-over';
    }
    else
    {
        // soft-light keeps the hue and only moves lightness. plain alpha fills
        // would grey the colour out, which is what a flat overlay looked like.
        g.globalCompositeOperation = 'soft-light';
        if (g.globalCompositeOperation !== 'soft-light')
        {
            g.globalCompositeOperation = 'source-over';
        }
    }
    var soft = (g.globalCompositeOperation === 'soft-light');

    var lit = wint ? '255,255,255' : '255,252,236';
    var shd = wint ? '108,140,200' : '22,18,40';

    // broad swells first
    var big = (wint ? 7 : 4) + Math.round(W * H / 900000);
    var n, cx, cy, r, grd, up, a;
    for (n = 0; n < big; n++)
    {
        cx = rnd(n * 4 + 1) * W;
        cy = rnd(n * 4 + 2) * H;
        r = 190 + rnd(n * 4 + 3) * 300;
        up = rnd(n * 4 + 4) > (wint ? .62 : .5);
        a = wint ? (up ? .10 : .13) : (soft ? .30 : .05);
        grd = g.createRadialGradient(cx, cy, 0, cx, cy, r);
        grd.addColorStop(0, wint ? ('rgba(' + (up ? lit : shd) + ',' + a + ')')
            : ((up ? 'rgba(255,255,255,' : 'rgba(0,0,0,') + a + ')'));
        grd.addColorStop(1, wint ? ('rgba(' + (up ? lit : shd) + ',0)')
            : (up ? 'rgba(255,255,255,0)' : 'rgba(0,0,0,0)'));
        g.fillStyle = grd;
        g.fillRect(cx - r, cy - r, r * 2, r * 2);
    }

    // then medium patches at a scale that straddles several tiles
    var mid = (wint ? 30 : 14) + Math.round(W * H / 130000);
    if (mid > 130)
    {
        mid = 130;
    }
    for (n = 0; n < mid; n++)
    {
        cx = rnd(n * 5 + 501) * W;
        cy = rnd(n * 5 + 502) * H;
        r = 46 + rnd(n * 5 + 503) * 96;
        up = rnd(n * 5 + 504) > (wint ? .66 : .48);
        a = wint ? (up ? .09 : (.09 + rnd(n * 5 + 505) * .09))
            : ((soft ? (.16 + rnd(n * 5 + 505) * .16) : .035));
        grd = g.createRadialGradient(cx, cy, 0, cx, cy, r);
        grd.addColorStop(0, 'rgba(' + (up ? lit : shd) + ',' + a + ')');
        grd.addColorStop(.62, 'rgba(' + (up ? lit : shd) + ',' + (a * .45) + ')');
        grd.addColorStop(1, 'rgba(' + (up ? lit : shd) + ',0)');
        g.fillStyle = grd;
        g.fillRect(cx - r, cy - r, r * 2, r * 2);
    }
    g.restore();

    // long features that must cross tile borders. drawn here rather than inside
    // the tile, because anything wide baked into a 32px tile becomes a motif.
    if (season === 'winter')
    {
        // wind-carved drift lines: a lit crest with a blue lee side
        macroStreaks(g, m, T_GRASS, 'rgba(255,255,255,.85)', 'rgba(122,152,208,.40)', 3.4, seed + 61);
        macroStreaks(g, m, T_DIRT, 'rgba(255,255,255,.7)', 'rgba(122,152,208,.32)', 2.2, seed + 67);
    }
    macroStreaks(g, m, T_SAND, 'rgba(255,246,214,.5)', 'rgba(150,116,60,.24)', 1.6, seed + 11);
    macroStreaks(g, m, T_DIRT, 'rgba(255,238,206,.26)', 'rgba(58,36,18,.22)', 1.1, seed + 29);
    macroStreaks(g, m, T_CAVE, 'rgba(220,226,255,.16)', 'rgba(10,8,20,.30)', .9, seed + 47);
}

function interiorMacro(g, m)
{
    var W = m.w * TILE, H = m.h * TILE;
    var seed = 0, i;
    for (i = 0; i < m.id.length; i++)
    {
        seed = (seed * 31 + m.id.charCodeAt(i)) | 0;
    }
    seed = Math.abs(seed);
    g.save();
    g.globalCompositeOperation = 'soft-light';
    var soft = (g.globalCompositeOperation === 'soft-light');
    if (!soft)
    {
        g.globalCompositeOperation = 'source-over';
    }
    var n = 10 + Math.round(W * H / 90000);
    for (i = 0; i < n; i++)
    {
        var cx = hash2(seed % 991, i * 3 + 1, 163) * W;
        var cy = hash2(seed % 991, i * 3 + 2, 167) * H;
        var r = 40 + hash2(seed % 991, i * 3 + 3, 173) * 90;
        var up = hash2(seed % 991, i * 3 + 4, 179) > .5;
        var a = soft ? .13 : .03;
        var grd = g.createRadialGradient(cx, cy, 0, cx, cy, r);
        grd.addColorStop(0, (up ? 'rgba(255,255,255,' : 'rgba(0,0,0,') + a + ')');
        grd.addColorStop(1, up ? 'rgba(255,255,255,0)' : 'rgba(0,0,0,0)');
        g.fillStyle = grd;
        g.fillRect(cx - r, cy - r, r * 2, r * 2);
    }
    g.restore();
}

// Sweeping 1px ripple lines restricted to one ground material. Each streak is
// drawn segment by segment and skips tiles of any other type, so it never
// bleeds onto grass or water.
function macroStreaks(g, m, want, lit, shade, density, seed)
{
    var total = 0, i, x, y;
    for (i = 0; i < m.tiles.length; i++)
    {
        if (m.tiles[i] === want)
        {
            total++;
        }
    }
    if (total < 24)
    {
        return;
    }
    var n = Math.min(240, Math.round(total * density / 10));
    var rnd = function (k)
    {
        return hash2(seed % 1013, k, 173);
    };
    var s, seg;
    for (s = 0; s < n; s++)
    {
        var sx = rnd(s * 6 + 1) * m.w * TILE;
        var sy = rnd(s * 6 + 2) * m.h * TILE;
        var len = 34 + rnd(s * 6 + 3) * 116;
        var slope = (rnd(s * 6 + 4) - .5) * .34;
        var dark = rnd(s * 6 + 5) > .55;
        g.fillStyle = dark ? shade : lit;
        for (seg = 0; seg < len; seg++)
        {
            x = sx + seg;
            y = sy + seg * slope;
            var tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
            if (tx < 0 || ty < 0 || tx >= m.w || ty >= m.h)
            {
                break;
            }
            if (m.tiles[ty * m.w + tx] !== want)
            {
                continue;
            }
            g.fillRect(Math.floor(x), Math.floor(y), 1, 1);
            if (!dark)
            {
                g.fillRect(Math.floor(x), Math.floor(y) + 1, 1, 1);
            }
        }
    }
}

function drawCliffTile(g, m, x, y, season)
{
    var top = season === 'winter' ? '#d4e2ee' : '#5f8a45';
    var rock = '#7d6c58';
    var ox = x * TILE, oy = y * TILE;
    var open = tileAt(m, x, y - 1) !== T_CLIFF;

    // blocky rock strata, lit from the top-left
    pr(g, ox, oy, TILE, TILE, rock);
    var row, i;
    for (row = 0; row < 3; row++)
    {
        var ry = oy + row * 11;
        var shift = (row + x) % 2 ? 7 : 0;
        for (i = -1; i < 3; i++)
        {
            var bx = ox + i * 15 + shift;
            var c = tone(rock, ((i + row + x) % 3 === 0) ? .8 : -.5);
            pr(g, Math.max(ox, bx) + 1, ry + 1, Math.min(13, ox + TILE - bx - 1), 9, c);
            pr(g, Math.max(ox, bx) + 1, ry + 1, Math.min(13, ox + TILE - bx - 1), 1, tone(c, 1.3));
            pr(g, Math.max(ox, bx) + 1, ry + 8, Math.min(13, ox + TILE - bx - 1), 2, tone(c, -1.7));
        }
    }
    // moss / grit
    crumbs(g, ox + 2, oy + 4, TILE - 4, TILE - 8, [tone(rock, -1.9), tone(rock, 1.1)], 7, x * 31 + y);

    if (open)
    {
        // grass cap with an overhanging lip
        pr(g, ox, oy, TILE, 9, top);
        pr(g, ox, oy, TILE, 2, tone(top, 1.2));
        pr(g, ox, oy + 9, TILE, 3, tone(top, -1.6));
        pr(g, ox, oy + 12, TILE, 2, 'rgba(20,14,8,.32)');
        for (i = 0; i < 4; i++)
        {
            var gx = ox + 3 + Math.floor(hash2(x, i, 17) * (TILE - 6));
            tuft(g, gx, oy + 9, 4, top, x * 7 + i);
        }
        if (season === 'winter')
        {
            pr(g, ox, oy + 8, TILE, 3, '#eef6fc');
        }
    }
}

// water is animated so it is drawn on top of the static layer per frame
function drawWaterOverlay(g, m, cam, frame, vw, vh)
{
    var x0 = Math.max(0, Math.floor(cam.x / TILE));
    var y0 = Math.max(0, Math.floor(cam.y / TILE));
    var x1 = Math.min(m.w, Math.ceil((cam.x + vw) / TILE) + 1);
    var y1 = Math.min(m.h, Math.ceil((cam.y + vh) / TILE) + 1);
    var x, y;
    var NX = [0, 1, 0, -1], NY = [-1, 0, 1, 0];
    for (y = y0; y < y1; y++)
    {
        for (x = x0; x < x1; x++)
        {
            var t = m.tiles[y * m.w + x];
            if (t !== T_WATER && t !== T_DEEP)
            {
                continue;
            }
            var sx = x * TILE - cam.x, sy = y * TILE - cam.y;
            g.drawImage(tileWater(frame, t === T_DEEP,
                Math.floor(hash2(x, y, 83) * 8)), sx, sy);

            // large-scale tone lives here, not in the tile: a per-tile tone shift
            // turns a lake into a checkerboard of blue squares. hashing on x/4,y/4
            // gives ~128px patches that read as depth instead.
            var pt = hash2(Math.floor(x / 4), Math.floor(y / 4), 89);
            if (pt > .62)
            {
                g.fillStyle = 'rgba(180,220,255,.055)';
                g.fillRect(sx, sy, TILE, TILE);
            }
            else if (pt < .34)
            {
                g.fillStyle = 'rgba(4,24,56,.075)';
                g.fillRect(sx, sy, TILE, TILE);
            }

            // Depth transition and foam are baked per edge; blitting four
            // sprites beats redrawing a few hundred one-pixel rects a frame.
            var ev = Math.floor(hash2(x, y, 97) * 4);
            var toDeep = (t === T_DEEP);
            var want = toDeep ? T_WATER : T_DEEP;
            var q, nt2;
            for (q = 0; q < 4; q++)
            {
                nt2 = tileAt(m, x + NX[q], y + NY[q]);
                if (nt2 === want)
                {
                    g.drawImage(waterDepthEdge(q, toDeep, ev), sx, sy);
                }
                else if (!WATER_TILES[nt2])
                {
                    g.drawImage(waterFoam(q, frame & 3, ev), sx - 3, sy - 3);
                }
            }
        }
    }
}

// ---------- camera ----------

function makeCamera()
{
    return { x: 0, y: 0, vw: 320, vh: 200 };
}

function camFollow(cam, px, py, m)
{
    var tx = px - cam.vw / 2;
    var ty = py - cam.vh / 2;
    var maxX = Math.max(0, m.w * TILE - cam.vw);
    var maxY = Math.max(0, m.h * TILE - cam.vh);
    cam.x = Math.max(0, Math.min(maxX, tx));
    cam.y = Math.max(0, Math.min(maxY, ty));
    if (m.w * TILE < cam.vw)
    {
        cam.x = (m.w * TILE - cam.vw) / 2;
    }
    if (m.h * TILE < cam.vh)
    {
        cam.y = (m.h * TILE - cam.vh) / 2;
    }
}

// ---------- object drawing ----------

// big props are anchored by their ground line, not their top-left corner
var TREE_DX = -(96 - TILE) / 2;     // centre a 96px wide tree on the tile
var TREE_DY = TILE - 122;           // 122 = ground line inside the tree sprite

function drawObject(g, o, cam, season, tick)
{
    var x = o.x * TILE - cam.x;
    var y = o.y * TILE - cam.y;
    switch (o.kind)
    {
        case 'tree':
            g.drawImage(sprTree(o.tk, o.stage, season, (o.x * 7 + o.y * 13) & 3),
                x + TREE_DX, y + TREE_DY);
            break;
        case 'fruittree':
            g.drawImage(sprFruitTree(o.sap, o.stage, o.fruit || 0, season), x + TREE_DX, y + TREE_DY);
            if (o.fruit > 0)
            {
                drawSparkle(g, x + HALF, y - 40, tick);
            }
            break;
        case 'crabpot':
            g.drawImage(itemIcon('crab_pot', TILE), x, y - 4);
            if (o.out)
            {
                drawSparkle(g, x + HALF, y - 14, tick);
            }
            else if (o.baited)
            {
                pr(g, x + 13, y - 10, 6, 4, '#e8c878');
                pr(g, x + 13, y - 10, 6, 1, '#f8e8b0');
            }
            break;
        case 'cactus':
            g.drawImage(sprCactus(o.big), x, y - (o.big ? 16 : 0));
            break;
        case 'artifactspot':
            g.drawImage(sprDigSpot(), x, y);
            drawSparkle(g, x + HALF, y + 6, tick);
            break;
        case 'pet':
            g.drawImage(sprPet(o.pk, Math.floor(tick / 22) % 2), x, y);
            break;
        case 'horse':
            g.drawImage(sprHorse(Math.floor(tick / 18) % 2), x - HALF, y - 8);
            break;
        case 'skull_entrance':
            drawSkullEntrance(g, x, y, tick);
            break;
        case 'minecart':
            drawMinecart(g, x, y);
            break;
        case 'stump':
            g.drawImage(sprStump(), x, y);
            break;
        case 'lamp':
            g.drawImage(sprLamp(lampsLit()), x + 4, y + TILE - 64);
            break;
        case 'campfire':
            g.drawImage(sprCampfire(tick), x - 4, y + TILE - 34);
            break;
        case 'buoy':
            g.drawImage(sprBuoy(tick), x + 4, y + TILE - 34);
            break;
        case 'net':
            g.drawImage(sprNet(), x - 6, y + TILE - 40);
            break;
        case 'signpost':
            g.drawImage(sprSignpost(o.dirs || 2), x - 1, y + TILE - 46);
            break;
        case 'driftwood':
            g.drawImage(sprDriftwood(), x - 6, y + TILE - 24);
            break;
        case 'bench':
            g.drawImage(sprBench(), x - 8, y + TILE - 36);
            break;
        case 'planter':
            g.drawImage(sprPlanter(season), x, y + TILE - 40);
            break;
        case 'barrel':
            g.drawImage(sprBarrel(), x + 2, y + TILE - 34);
            break;
        case 'crate':
            g.drawImage(sprCrate(), x + 2, y + TILE - 28);
            break;
        case 'lumber':
        case 'sawhorse':
            drawFurniture(g, o.kind, x, y);
            break;
        case 'rock':
            g.drawImage(sprRock(o.rk), x, y);
            break;
        case 'weed':
            g.drawImage(sprWeed(season), x, y);
            break;
        case 'grass':
            g.drawImage(sprGrassTuft(season), x, y);
            break;
        case 'bush':
            g.drawImage(sprBush(season), x, y - 16);
            break;
        case 'flowerdeco':
            // nothing is in bloom on snow
            if (season !== 'winter')
            {
                g.drawImage(sprFlowerTile(o.col), x, y);
            }
            break;
        case 'branch':
            g.drawImage(itemIcon('wood', 24), x + 4, y + 8);
            break;
        case 'forage':
            g.drawImage(itemIcon(o.item, 28), x + 2, y + 3);
            drawSparkle(g, x + HALF, y + HALF, tick);
            break;
        case 'drop':
            var by = Math.sin((tick + o.x * 7) * .12) * 2.5;
            g.drawImage(itemIcon(o.item, 24), x + 4, y + 6 + by);
            break;
        case 'building':
            g.drawImage(sprBuilding(o.bkind), x, y + o.th * TILE - sprBuilding(o.bkind).height);
            break;
        case 'animalbuilding':
            g.drawImage(sprBuilding(o.bkind), x, y + o.th * TILE - sprBuilding(o.bkind).height);
            break;
        case 'bin':
            g.drawImage(sprShippingBin(), x, y + TILE - 56);
            break;
        case 'sign':
            drawSign(g, x, y, o.text);
            break;
        case 'board':
            drawBoard(g, x, y);
            break;
        case 'fountain':
            drawFountain(g, x, y, tick);
            break;
        case 'mine_entrance':
            drawMineEntrance(g, x, y);
            break;
        case 'rug':
            g.drawImage(sprRug(o.rk), x, y);
            break;
        case 'furn':
            drawFurniture(g, o.fk, x, y);
            break;
        case 'machine':
            g.drawImage(itemIcon(o.mk, TILE), x, y - 4);
            if (o.out)
            {
                drawSparkle(g, x + HALF, y - 12, tick);
            }
            break;
        case 'chest':
            g.drawImage(itemIcon('chest', TILE), x, y);
            break;
        case 'scarecrow':
            g.drawImage(itemIcon('scarecrow', TILE), x, y - 12);
            break;
        case 'sprinkler':
            g.drawImage(itemIcon(o.mk || 'sprinkler', 28), x + 2, y + 4);
            break;
        default:
            break;
    }
}

function drawSparkle(g, x, y, tick)
{
    var a = .35 + .35 * Math.sin(tick * .12);
    g.globalAlpha = a;
    g.drawImage(sprParticle('spark'), x - 6, y - 16);
    g.globalAlpha = 1;
}

function drawSign(g, x, y, text)
{
    var w = '#8a5f38';
    pr(g, x + 7, y + 14, 5, 18, tone(w, -1.4));
    pr(g, x + 21, y + 14, 5, 18, tone(w, -1.4));
    pr(g, x + 7, y + 14, 2, 18, tone(w, .6));
    pr(g, x, y + 2, TILE, 15, w);
    pr(g, x, y + 2, TILE, 3, tone(w, 1.4));
    pr(g, x, y + 14, TILE, 3, tone(w, -1.9));
    pr(g, x + 2, y + 5, TILE - 4, 8, tone(w, -.7));
    if (text)
    {
        pr(g, x + 5, y + 7, 20, 2, '#4f351a');
        pr(g, x + 5, y + 11, 14, 2, '#4f351a');
    }
}

function drawBoard(g, x, y)
{
    var w = '#8a5a2a';
    pr(g, x + 4, y + 22, 4, 12, tone(w, -1.4));

function drawFountain(g, x, y, tick)
{
    var s = '#a3998c';
    var W = TILE * 4, H = TILE * 3;
    // outer rim with a bevel
    pr(g, x, y + 4, W, H - 4, tone(s, -1.4));
    pr(g, x + 2, y + 2, W - 4, H - 6, s);
    pr(g, x + 2, y + 2, W - 4, 4, tone(s, 1.4));
    pr(g, x + 2, y + H - 10, W - 4, 4, tone(s, -1.8));
    var i;
    for (i = 0; i < 8; i++)
    {
        pr(g, x + 4 + i * 15, y + 2, 1, H - 8, tone(s, -1));
    }
    // water basin
    var bx = x + 12, by = y + 14, bw = W - 24, bh = H - 34;
    pr(g, bx - 3, by - 3, bw + 6, bh + 6, tone(s, -2));
    pr(g, bx, by, bw, bh, '#2f74b2');
    pr(g, bx, by, bw, 3, '#1e4a76');
    for (i = 0; i < 4; i++)
    {
        var wy = by + 5 + i * 7;
        var wx = bx + 3 + ((tick * .5 + i * 19) % (bw - 20));
        pr(g, wx, wy, 14, 1, '#63a6dc');
        pr(g, wx + 2, wy + 1, 10, 1, '#3f85c2');
    }
    pr(g, bx, by + bh - 2, bw, 2, '#255f92');
    // centre pillar + bowl
    pr(g, x + 52, y + 20, 24, 40, s);
    pr(g, x + 52, y + 20, 8, 40, tone(s, 1.1));
    pr(g, x + 70, y + 20, 6, 40, tone(s, -1.5));
    pe(g, x + 64, y + 18, 17, 6, tone(s, 1.3));
    pe(g, x + 64, y + 17, 13, 4, '#3f85c2');
    pr(g, x + 60, y - 6, 8, 26, tone(s, .6));
    pr(g, x + 60, y - 6, 3, 26, tone(s, 1.5));
    pe(g, x + 64, y - 8, 8, 4, tone(s, 1.4));
    // spout arcs
    for (i = 0; i < 14; i++)
    {
        var a = (tick * .12 + i * .55) % 7;
        var side = (i % 2) ? 1 : -1;
        var px = x + 64 + Math.round(side * a * 3.4);
        var py = y - 10 + Math.round(a * a * .9);
        pr(g, px, py, 2, 3, 'rgba(190,228,255,.9)');
        if (i % 3 === 0)
        {
            pr(g, px, py + 3, 1, 2, 'rgba(255,255,255,.6)');
        }
    }
    // splash ring
    pe(g, x + 64, y + 16, 10 + (tick % 20) * .2, 3, 'rgba(255,255,255,.14)');
}
