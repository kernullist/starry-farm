// ---------- sprinklers ----------

function runSprinklers()
{
    var mid;
    for (mid in MAP_CACHE)
    {
        if (!MAP_CACHE.hasOwnProperty(mid))
        {
            continue;
        }
        var m = MAP_CACHE[mid];
        var i;
        for (i = 0; i < m.objects.length; i++)
        {
            var o = m.objects[i];
            if (o.kind !== 'sprinkler')
            {
                continue;
            }
            var r = o.mk === 'sprinkler_q' ? 1 : 0;
            var dx, dy;
            for (dy = -1 - r; dy <= 1 + r; dy++)
            {
                for (dx = -1 - r; dx <= 1 + r; dx++)
                {
                    if (r === 0 && Math.abs(dx) + Math.abs(dy) !== 1)
                    {
                        continue;
                    }
                    if (dx === 0 && dy === 0)
                    {
                        continue;
                    }
                    var s = soilAt(mid, o.x + dx, o.y + dy);
                    if (s)
                    {
                        s.w = 1;
                    }
                }
            }
        }
    }
}

// ---------- particles ----------

function spawnFx(x, y, kind)
{
    var i;
    var n = kind === 'spark' ? 4 : 5;
    for (i = 0; i < n; i++)
    {
        FX.push({
            x: x, y: y, kind: kind,
            vx: (Math.random() * 2 - 1) * 46,
            vy: -34 - Math.random() * 42,
            life: .45 + Math.random() * .3
        });
    }
}

function updateFx(dt)
{
    var i;
    for (i = FX.length - 1; i >= 0; i--)
    {
        var p = FX[i];
        p.life -= dt;
        if (p.life <= 0)
        {
            FX.splice(i, 1);
            continue;
        }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 175 * dt;
    }
}

// ---------- weather particles ----------

var WEATHER_P = [];

function updateWeather(dt)
{
    if (!MAP || !MAP.outdoor)
    {
        WEATHER_P.length = 0;
        return;
    }
    var want = 0;
    if (S.weather === 'rain')
    {
        want = 70;
    }
    else if (S.weather === 'storm')
    {
        want = 110;
    }
    else if (S.weather === 'snow')
    {
        want = 55;
    }
    else if (S.weather === 'wind')
    {
        want = 26;
    }
    while (WEATHER_P.length < want)
    {
        WEATHER_P.push({
            x: Math.random() * (VIEW.w + 60) - 30,
            y: Math.random() * VIEW.h,
            v: S.weather === 'snow' ? 26 + Math.random() * 18
                : (S.weather === 'wind' ? 40 + Math.random() * 50 : 200 + Math.random() * 120),
            sway: Math.random() * 6.28
        });
    }
    while (WEATHER_P.length > want)
    {
        WEATHER_P.pop();
    }
    var i;
    for (i = 0; i < WEATHER_P.length; i++)
    {
        var p = WEATHER_P[i];
        p.y += p.v * dt * (S.weather === 'wind' ? .35 : 1);
        p.x += (S.weather === 'snow' ? Math.sin(p.sway + TICK * .02) * 8
            : (S.weather === 'wind' ? -130 + Math.sin(p.sway + TICK * .03) * 30 : -30)) * dt;
        if (p.y > VIEW.h)
        {
            p.y = -6;
            p.x = Math.random() * (VIEW.w + 60) - 30;
        }
        if (p.x < -30)
        {
            p.x = VIEW.w + 20;
        }
    }
}

// ---------- render ----------

function render()
{
    if (!S || !MAP)
    {
        return;
    }
    var g = G;
    g.setTransform(VIEW.scale, 0, 0, VIEW.scale, 0, 0);
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, VIEW.w, VIEW.h);

    var season = seasonId();
    camFollow(CAM, S.px, S.py - 16, MAP);
    var cx = Math.round(CAM.x), cy = Math.round(CAM.y);
    CAM.x = cx;
    CAM.y = cy;

    // ground
    var gc = groundCanvas(MAP, season);
    g.drawImage(gc, cx, cy, VIEW.w, VIEW.h, 0, 0, VIEW.w, VIEW.h);
    drawWaterOverlay(g, MAP, CAM, WATER_FRAME, VIEW.w, VIEW.h);
    var fnow0 = festivalActive();

    if (fnow0 && MAP.id === fnow0.map)
    {
        drawFestivalExtras(g, fnow0, CAM, TICK);
    }

    // tilled soil + crops
    drawSoil(g, season);

    // y-sorted entities
    var list = [];
    var i;
    var x0 = cx - 80, y0 = cy - 130, x1 = cx + VIEW.w + 80, y1 = cy + VIEW.h + 80;
    for (i = 0; i < MAP.objects.length; i++)
    {
        var o = MAP.objects[i];
        var ox = o.x * TILE, oy = o.y * TILE;
        if (ox < x0 || oy < y0 || ox > x1 || oy > y1)
        {
            continue;
        }
        if (festHides(o))
        {
            continue;
        }
        list.push({ y: oy + (o.kind === 'building' || o.kind === 'animalbuilding' ? o.th * TILE : TILE), o: o });
    }
    for (i = 0; i < ACTORS.length; i++)
    {
        list.push({ y: ACTORS[i].y, a: ACTORS[i] });
    }
    for (i = 0; i < MINE.mobs.length; i++)
    {
        list.push({ y: MINE.mobs[i].y, m: MINE.mobs[i] });
    }
    // festival decorations join the same sort, so people walk in front of and
    // behind them instead of the scenery floating over the crowd
    var fnow = festivalActive();
    if (fnow && MAP.id === fnow.map)
    {
        var fl = festivalRenderList(fnow);
        for (i = 0; i < fl.length; i++)
        {
            list.push(fl[i]);
        }
    }
    list.push({ y: S.py, p: true });
    list.sort(function (a, b) { return a.y - b.y; });

    for (i = 0; i < list.length; i++)
    {
        var e = list[i];
        if (e.o)
        {
            drawObject(g, e.o, CAM, season, TICK);
        }
        else if (e.a)
        {
            drawOneActor(g, e.a);
        }
        else if (e.m)
        {
            drawOneMob(g, e.m);
        }
        else if (e.fx)
        {
            drawFestProp(g, e.fx, CAM, TICK);
        }
        else
        {
            drawPlayer(g);
        }
    }

    drawSwing(g, CAM);
    drawFishingWorld(g, CAM);

    // particles
    for (i = 0; i < FX.length; i++)
    {
        var p = FX[i];
        g.globalAlpha = Math.min(1, p.life * 2.5);
        g.drawImage(sprParticle(p.kind), Math.round(p.x - cx - 6), Math.round(p.y - cy - 6));
    }
    g.globalAlpha = 1;

    // weather
    if (MAP.outdoor && WEATHER_P.length)
    {
        var wk = S.weather === 'snow' ? 'snow'
            : (S.weather === 'wind' ? (seasonId() === 'fall' ? 'leaf_fall' : 'leaf') : 'rain');
        var img = sprParticle(wk);
        for (i = 0; i < WEATHER_P.length; i++)
        {
            var wp = WEATHER_P[i];
            if (wk === 'leaf')
            {
                // tumbling leaves read as wind far better than falling streaks
                g.save();
                g.translate(Math.round(wp.x) + 6, Math.round(wp.y) + 6);
                g.rotate(wp.sway + TICK * .06);
                g.drawImage(img, -6, -6);
                g.restore();
            }
            else
            {
                g.drawImage(img, Math.round(wp.x), Math.round(wp.y));
            }
        }
        // rain leaves a wet sheen on the ground
        if (S.weather === 'storm')
        {
            g.fillStyle = 'rgba(150,180,220,.05)';
            g.fillRect(0, 0, VIEW.w, VIEW.h);
        }
    }

    applyAmbient(g);
    drawFestOverlay(g);

    // interaction hint
    drawHint(g);
}

function drawSoil(g, season)
{
    var mid = MAP.id;
    var sm = S.soil[mid];
    if (!sm)
    {
        return;
    }
    var cx = CAM.x, cy = CAM.y;
    var k;
    for (k in sm)
    {
        if (!sm.hasOwnProperty(k))
        {
            continue;
        }
        var parts = k.split(',');
        var x = parseInt(parts[0], 10) * TILE - cx;
        var y = parseInt(parts[1], 10) * TILE - cy;
        if (x < -TILE || y < -TILE || x > VIEW.w || y > VIEW.h)
        {
            continue;
        }
        var s = sm[k];
        g.drawImage(tileTilled(s.w || (isRaining() && MAP.outdoor)), x, y);
        if (s.f)
        {
            g.globalAlpha = .5;
            g.fillStyle = s.f === 'fert_quality' ? '#4a9a6a' : (s.f === 'speed_gro' ? '#5a8ad0' : '#8a6a3a');
            g.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);
            g.globalAlpha = 1;
        }
    }
    var cm = S.crops[mid];
    if (!cm)
    {
        return;
    }
    for (k in cm)
    {
        if (!cm.hasOwnProperty(k))
        {
            continue;
        }
        var p2 = k.split(',');
        var tx = parseInt(p2[0], 10), ty = parseInt(p2[1], 10);
        var sx = tx * TILE - cx, sy = ty * TILE - cy;
        if (sx < -TILE * 2 || sy < -TILE * 2 || sx > VIEW.w + TILE || sy > VIEW.h + TILE)
        {
            continue;
        }
        var c = cm[k];
        var st = cropStage(c);
        g.drawImage(sprCrop(c.seed, st), sx, sy - 12);
        if (cropReady(c))
        {
            drawSparkle(g, sx + HALF, sy - 4, TICK);
        }
    }
}

// the sprite's contact shadow sits at y=50, so anchor the feet to S.py
var PLAYER_DX = -PW / 2;
var PLAYER_DY = -50;

function drawPlayer(g)
{
    var x = Math.round(S.px + PLAYER_DX - CAM.x);
    var y = Math.round(S.py + PLAYER_DY - CAM.y);
    var dir = S.dir === 0 ? 0 : (S.dir === 1 ? 1 : 2);
    var flip = S.dir === 3;
    var frame = PLAYER.moving ? PLAYER.frame : 0;
    if (PLAYER.act > 0)
    {
        // 4 = wind up, 5 = strike, 6 = recover
        frame = PLAYER.act > 12 ? 4 : (PLAYER.act > 6 ? 5 : 6);
    }
    if (MINE.hurtCd > 40 && MINE.hurtCd % 6 < 3)
    {
        g.globalAlpha = .5;
    }
    // S.look is the saved appearance; the hat is worn state, so it rides
    // along for the draw without being stored in the look itself
    var hl = hatLook();
    var me = S.look;
    if (hl)
    {
        me = {};
        var lk;
        for (lk in S.look)
        {
            if (S.look.hasOwnProperty(lk))
            {
                me[lk] = S.look[lk];
            }
        }
        me.hat = hl;
    }
    var spr = personSprite('me', me, dir, frame);
    if (flip)
    {
        g.save();
        g.translate(x + PW, y);
        g.scale(-1, 1);
        g.drawImage(spr, 0, 0);
        g.restore();
    }
    else
    {
        g.drawImage(spr, x, y);
    }
    g.globalAlpha = 1;

    // the held tool follows the same arc as the pose
    if (PLAYER.act > 0)
    {
        PLAYER.act--;
        var p = 1 - PLAYER.act / 18;
        var ico = itemIcon(PLAYER.actKind, 28);
        // arc: starts overhead behind the farmer, ends on the target tile
        var a0 = -2.3, a1 = .5;
        var ang = a0 + (a1 - a0) * Math.min(1, p * 1.35);
        var reach = 16 + Math.sin(Math.min(1, p * 1.35) * Math.PI) * 8;
        var fx = 0, fy = 0;
        if (S.dir === 0) { fy = 1; }
        else if (S.dir === 1) { fy = -1; }
        else if (S.dir === 2) { fx = -1; }
        else { fx = 1; }
        var px2 = x + PW / 2 + fx * reach;
        var py2 = y + 26 + fy * reach - Math.cos(Math.min(1, p * 1.35) * Math.PI) * 8;
        g.save();
        g.translate(px2, py2);
        g.rotate((S.dir === 2 ? -1 : 1) * ang);
        g.drawImage(ico, -14, -14);
        g.restore();
        // motion arc so the swing reads even at one frame
        if (p > .2 && p < .8)
        {
            g.globalAlpha = .3;
            g.strokeStyle = 'rgba(255,255,255,.8)';
            g.lineWidth = 2;
            g.beginPath();
            g.arc(x + PW / 2 + fx * 6, y + 26 + fy * 6, reach + 4,
                (S.dir === 2 ? Math.PI : 0) - 1.9, (S.dir === 2 ? Math.PI : 0) + .2);
            g.stroke();
            g.globalAlpha = 1;
        }
    }
}

function drawOneActor(g, a)
{
    var x = Math.round(a.x + (a.sway || 0) - PW / 2 - CAM.x);
    var y = Math.round(a.y - 50 - CAM.y);
    var spr = personSprite(a.id, a.def.look, a.dir, a.frame);
    if (a.dir === 2 && a.flip)
    {
        g.save();
        g.translate(x + PW, y);
        g.scale(-1, 1);
        g.drawImage(spr, 0, 0);
        g.restore();
    }
    else
    {
        g.drawImage(spr, x, y);
    }
    if (isBirthday(a.id))
    {
        drawSparkle(g, x + PW / 2, y - 4, TICK);
    }
}

function drawOneMob(g, mob)
{
    var def = MONSTERS[mob.kind];
    var x = Math.round(mob.x - HALF - CAM.x);
    var y = Math.round(mob.y - 26 - CAM.y);
    if (mob.hurt > 0 && mob.hurt % 4 < 2)
    {
        g.globalAlpha = .55;
    }
    g.drawImage(sprMonster(def.sprite, def.col, mob.frame), x, y);
    g.globalAlpha = 1;
    if (mob.hp < mob.maxHp)
    {
        pr(g, x + 2, y - 7, 28, 4, 'rgba(0,0,0,.6)');
        pr(g, x + 2, y - 7, Math.max(1, Math.round(28 * mob.hp / mob.maxHp)), 4, '#e05050');
    }
}

// small marker on the tile the tool would hit
function drawHint(g)
{
    if (FISHING.on || UI.modal)
    {
        return;
    }
    var f = facingTile();
    var sl = selSlot();
    if (!sl)
    {
        return;
    }
    var show = false;
    if (sl.id === 'hoe')
    {
        show = isTillable(MAP, f.x, f.y) && !soilAt(MAP.id, f.x, f.y);
    }
    else if (sl.id === 'can')
    {
        var s = soilAt(MAP.id, f.x, f.y);
        show = (s && !s.w) || isWater(MAP, f.x, f.y);
    }
    else if (CROPS[sl.id])
    {
        show = !!soilAt(MAP.id, f.x, f.y) && !cropAt(MAP.id, f.x, f.y);
    }
    if (!show)
    {
        return;
    }
    var x = f.x * TILE - CAM.x, y = f.y * TILE - CAM.y;
    g.strokeStyle = 'rgba(255,245,190,.8)';
    g.lineWidth = 1;
    g.strokeRect(x + .5, y + .5, TILE - 1, TILE - 1);
}

// ---------- title animation ----------

function animateTitle()
{
    var cv = document.getElementById('titleArt');
    if (!cv)
    {
        return;
    }
    var g = cv.getContext('2d');
    g.imageSmoothingEnabled = false;
    function step(t)
    {
        if (!document.getElementById('title').classList.contains('off'))
        {
            drawTitleArt(g, cv.width, cv.height, t);
        }
        requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
}

// ---------- main loop ----------

var CLOCK_ACC = 0;
var SAVE_ACC = 0;

function loop(ts)
{
    requestAnimationFrame(loop);
    if (!LAST)
    {
        LAST = ts;
    }
    var dt = Math.min(.05, (ts - LAST) / 1000);
    LAST = ts;
    TICK += dt * 60;

    if (!S || !document.getElementById('title').classList.contains('off'))
    {
        return;
    }

    var busy = UI.modal || UI.dialogue || UI.warping;

    if (!busy)
    {
        movePlayer(dt);
        updateActors(dt);
        updateMine(dt);
        updateFishing(dt);
        // Ground can stop being ground: the ice festival freezes the forest lake
        // and then thaws it at 14:00. Never leave her standing inside solid.
        if (!canStand(S.px, S.py))
        {
            ensureStandable();
        }
        checkMazeGoal();
        festIceTick(dt);
        festShotTick(dt);
        festJellyTick(dt);
    }
    updateFx(dt);
    updateWeather(dt);

    WATER_T += dt;
    if (WATER_T > .22)
    {
        WATER_T = 0;
        WATER_FRAME = (WATER_FRAME + 1) % 4;
    }

    // game clock
    if (!busy && !UI.blockTime && !UI.collapsing)
    {
        CLOCK_ACC += dt;
        if (CLOCK_ACC >= SEC_PER_TICK)
        {
            CLOCK_ACC -= SEC_PER_TICK;
            var before = S.time;
            advanceClock(MIN_PER_TICK);
            onClockTick(before);
        }
    }

    // periodic autosave
    SAVE_ACC += dt;
    if (SAVE_ACC > 60)
    {
        SAVE_ACC = 0;
        saveGame(true);
    }

    render();
    drawFishingBar();
    updateHud();
}

function onClockTick(before)
{
    // sprinklers fire at 6:10 each morning
    if (before < DAY_START + MIN_PER_TICK && S.time >= DAY_START + MIN_PER_TICK)
    {
        runSprinklers();
    }
    // short recipes (furnace, cheese, mayo) should finish within the same day
    tickMachines();
    // villagers change position on the hour
    if (Math.floor(S.time / 60) !== Math.floor(before / 60))
    {
        rebuildActors();
    }
    if (S.time === 25 * 60)
    {
        toast('벌써 새벽 1시예요! 곧 쓰러져요.');
    }
    else if (S.time === 24 * 60)
    {
        toast('자정이에요. 슬슬 자러 가요.');
    }
}

// ---------- minecart fast travel ----------

function openMinecart()
{
    var stops = [
        { id: 'town', n: '펠리컨 마을', x: 30, y: 26 },
        { id: 'mountain', n: '산 (광산)', x: 22, y: 18 }
    ];
    if (S.flags.quarry)
    {
        stops.push({ id: 'quarry', n: '채석장', x: 13, y: 22 });
    }
    if (S.flags.bus)
    {
        stops.push({ id: 'desert', n: '칼리코 사막', x: 21, y: 30 });
    }
    var m = modalShell('🚃 광산차');
    m.body.appendChild(el('div', 'hint', '가고 싶은 곳을 고르세요.'));
    var i;
    for (i = 0; i < stops.length; i++)
    {
        (function (st)
        {
            var b = el('button', 'btn' + (st.id === MAP.id ? ' gray' : ' green'), st.n);
            b.style.cssText = 'width:100%;margin-top:6px;';
            b.disabled = st.id === MAP.id;
            b.onclick = function ()
            {
                closeModal();
                fadeOut(function ()
                {
                    MAP = loadMap(st.id);
                    S.map = st.id;
                    S.px = st.x * TILE + HALF;
                    S.py = st.y * TILE + HALF;
                    ensureStandable();
                    rebuildActors();
                    UI.lastHudKey = '';
                });
            };
            m.body.appendChild(b);
        })(stops[i]);
    }
    openModal(m);
}

// ---------- ambient grading ----------
// A flat navy rectangle at night was the only lighting cue in the game.
// This washes the whole scene with a time-of-day colour plus a seasonal cast,
// which is the cheapest thing that makes a pixel scene feel like a place.
// [hour, tintRGB, tintAlpha, darkAlpha]
// Interpolating straight from amber (18h) to purple (20h) crossed through a
// muddy mauve at 19h -- exactly the hour that should look best. Keep the warm
// key held until sunset, then move to purple quickly.
var AMBIENT_KEYS = [
    [6, [255, 148, 88], .30, .24],     // sunrise
    [8, [255, 214, 168], .14, .05],    // morning
    [11, [255, 255, 255], .00, .00],   // midday, neutral
    [15, [255, 248, 222], .05, .00],
    [17.5, [255, 176, 96], .20, .04],  // golden hour begins
    [19.3, [255, 142, 74], .32, .14],  // golden hour, still warm
    [20.4, [176, 112, 158], .28, .28], // sunset rolls into dusk
    [21.5, [120, 96, 190], .26, .38],  // dusk
    [23, [70, 85, 176], .22, .50],
    [26, [38, 52, 138], .20, .60]      // deep night
];

var SEASON_CAST = {
    spring: [[210, 255, 215], .05],
    summer: [[255, 245, 200], .06],
    fall: [[255, 210, 150], .10],
    winter: [[200, 225, 255], .13]
};

function lerp(a, b, t)
{
    return a + (b - a) * t;
}

function ambientGrade()
{
    var h = S.time / 60;
    var i, k0 = AMBIENT_KEYS[0], k1 = AMBIENT_KEYS[AMBIENT_KEYS.length - 1];
    for (i = 0; i < AMBIENT_KEYS.length - 1; i++)
    {
        if (h >= AMBIENT_KEYS[i][0] && h <= AMBIENT_KEYS[i + 1][0])
        {
            k0 = AMBIENT_KEYS[i];
            k1 = AMBIENT_KEYS[i + 1];
            break;
        }
    }
    var span = k1[0] - k0[0];
    var t = span > 0 ? Math.max(0, Math.min(1, (h - k0[0]) / span)) : 0;
    var tint = [
        Math.round(lerp(k0[1][0], k1[1][0], t)),
        Math.round(lerp(k0[1][1], k1[1][1], t)),
        Math.round(lerp(k0[1][2], k1[1][2], t))
    ];
    var ta = lerp(k0[2], k1[2], t);
    var dark = lerp(k0[3], k1[3], t);
    return { tint: tint, ta: ta, dark: dark };
}

function applyAmbient(g)
{
    var W = VIEW.w, H = VIEW.h;
    if (MAP.id === 'mine')
    {
        // caves have their own fixed mood: cold up top, ember-lit down deep
        var deep = (MINE.skull || MINE.floor >= 80);
        g.fillStyle = deep ? 'rgba(60,18,12,.30)' : 'rgba(20,26,44,.34)';
        g.fillRect(0, 0, W, H);
        g.fillStyle = 'rgba(8,8,18,.30)';
        g.fillRect(0, 0, W, H);
        lightPool(g, .55);
        return;
    }
    if (!MAP.outdoor)
    {
        // indoors: no sunrise/sunset, just a warm lamp at night
        var ih = S.time / 60;
        if (ih >= 18 || ih < 7)
        {
            g.fillStyle = 'rgba(255,186,96,.10)';
            g.fillRect(0, 0, W, H);
            g.fillStyle = 'rgba(24,22,50,.22)';
            g.fillRect(0, 0, W, H);
        }
        else
        {
            g.fillStyle = 'rgba(255,240,210,.06)';
            g.fillRect(0, 0, W, H);
        }
        return;
    }

    var a = ambientGrade();
    var cast = SEASON_CAST[seasonId()] || SEASON_CAST.spring;

    // seasonal cast first, then the time-of-day wash
    g.fillStyle = 'rgba(' + cast[0][0] + ',' + cast[0][1] + ',' + cast[0][2] + ',' + cast[1] + ')';
    g.fillRect(0, 0, W, H);
    if (a.ta > .005)
    {
        g.fillStyle = 'rgba(' + a.tint[0] + ',' + a.tint[1] + ',' + a.tint[2] + ',' + a.ta + ')';
        g.fillRect(0, 0, W, H);
    }
    // rain drains the colour and cools it
    if (isRaining())
    {
        g.fillStyle = 'rgba(96,112,140,.20)';
        g.fillRect(0, 0, W, H);
    }
    if (a.dark > .005)
    {
        // ease off the night wash during the jelly dance so the sea can glow
        var jf = festivalActive();
        var dk = (jf && jf.kind === 'jelly' && MAP.id === jf.map) ? a.dark * .72 : a.dark;
        g.fillStyle = 'rgba(16,20,52,' + dk + ')';
        g.fillRect(0, 0, W, H);
    }
    // vignette grows with darkness so night feels enclosed
    var vig = a.dark * .7 + (isRaining() ? .12 : 0);
    if (vig > .04)
    {
        var vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .32,
            W / 2, H / 2, Math.max(W, H) * .72);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, 'rgba(6,8,24,' + vig + ')');
        g.fillStyle = vg;
        g.fillRect(0, 0, W, H);
    }
    if (a.dark > .12)
    {
        lampLights(g, a.dark);
        festLights(g, a.dark);
        lightPool(g, a.dark);
    }
    if (S.weather === 'storm' && Math.random() < .005)
    {
        g.fillStyle = 'rgba(226,238,255,.45)';
        g.fillRect(0, 0, W, H);
    }
}

// Street lamps cast their own pool. Only the ones on screen are considered,
// and the whole thing runs after the darkness wash so it reads as light rather
// than as a lighter patch of ground.
function lampLights(g, strength)
{
    if (!MAP || !MAP.objects)
    {
        return;
    }
    var lit = lampsLit();
    var i, n = MAP.objects.length;
    for (i = 0; i < n; i++)
    {
        var o = MAP.objects[i];
        var fire = (o.kind === 'campfire');
        if (!fire && !(o.kind === 'lamp' && lit))
        {
            continue;
        }
        // a campfire burns at ground level; a lamp hangs on a post
        var px = o.x * TILE + HALF + (fire ? -4 : 4) - CAM.x;
        var py = o.y * TILE + TILE - (fire ? 16 : 50) - CAM.y;
        if (px < -140 || py < -140 || px > VIEW.w + 140 || py > VIEW.h + 140)
        {
            continue;
        }
        // A wide soft pool just lifts the whole plaza a little and reads as
        // fog. Keep it tight and strong so it reads as a lamp.
        // the fire flickers, the lamp does not
        var s2 = Math.min(1, strength * (fire ? 1.7 + Math.sin(TICK * .18) * .12 : 1.9));
        var r = fire ? 70 : 86;
        var lg = g.createRadialGradient(px, py, 2, px, py, r);
        lg.addColorStop(0, 'rgba(255,240,196,' + (s2 * .78) + ')');
        lg.addColorStop(.22, 'rgba(255,226,152,' + (s2 * .40) + ')');
        lg.addColorStop(.55, 'rgba(255,214,132,' + (s2 * .14) + ')');
        lg.addColorStop(1, 'rgba(255,214,132,0)');
        g.fillStyle = lg;
        g.fillRect(px - r, py - r, r * 2, r * 2);
        // the glass itself blooms
        var bg = g.createRadialGradient(px, py, 0, px, py, 13);
        bg.addColorStop(0, 'rgba(255,252,232,' + (s2 * .85) + ')');
        bg.addColorStop(1, 'rgba(255,244,200,0)');
        g.fillStyle = bg;
        g.fillRect(px - 13, py - 13, 26, 26);
        // and a pool of light on the ground at the foot of the post
        var gr = g.createRadialGradient(px, py + 46, 2, px, py + 46, 44);
        gr.addColorStop(0, 'rgba(255,230,166,' + (s2 * .34) + ')');
        gr.addColorStop(.5, 'rgba(255,226,158,' + (s2 * .15) + ')');
        gr.addColorStop(1, 'rgba(255,226,158,0)');
        g.fillStyle = gr;
        g.fillRect(px - 44, py + 2, 88, 88);
    }
}

// Festival props that glow: pumpkin lanterns, the star tree, hung lanterns.
// Same pass as the street lamps, so the two agree about how light behaves.
function festLights(g, strength)
{
    var f = festivalActive();
    if (!f || !MAP || MAP.id !== f.map)
    {
        return;
    }
    if (f.kind === 'jelly')
    {
        festJellyGlow(g, CAM, TICK);
    }
    var d = FEST_DECOR[f.kind] || [];
    var glow = { pumpkinlamp: [56, .9], startree: [92, 1.0], lanternrow: [70, .7],
        souppot: [56, .8], campfire: [70, .9] };
    var i;
    for (i = 0; i < d.length; i++)
    {
        var o = d[i];
        var gd = glow[o.k];
        if (!gd)
        {
            continue;
        }
        var px = o.x * TILE + HALF - CAM.x;
        var py = o.y * TILE + TILE - 22 - CAM.y;
        if (o.k === 'startree')
        {
            py -= 46;
        }
        if (o.k === 'lanternrow')
        {
            px += ((o.w || 8) * TILE) / 2;
            py -= 8;
        }
        var r = gd[0];
        if (px < -r || py < -r || px > VIEW.w + r || py > VIEW.h + r)
        {
            continue;
        }
        var s2 = Math.min(1, strength * 1.9 * gd[1]);
        var lg = g.createRadialGradient(px, py, 2, px, py, r);
        lg.addColorStop(0, 'rgba(255,238,192,' + (s2 * .7) + ')');
        lg.addColorStop(.3, 'rgba(255,220,150,' + (s2 * .32) + ')');
        lg.addColorStop(1, 'rgba(255,214,132,0)');
        g.fillStyle = lg;
        g.fillRect(px - r, py - r, r * 2, r * 2);
    }
}

function lightPool(g, strength)
{
    var px = S.px - CAM.x, py = S.py - CAM.y - 18;
    var lg = g.createRadialGradient(px, py, 8, px, py, 130);
    lg.addColorStop(0, 'rgba(255,228,158,' + (strength * .5) + ')');
    lg.addColorStop(.55, 'rgba(255,214,140,' + (strength * .18) + ')');
    lg.addColorStop(1, 'rgba(255,214,140,0)');
    g.fillStyle = lg;
    g.fillRect(px - 132, py - 132, 264, 264);
}

// ---------- the mirror ----------
// Appearance used to be a one-time choice at the start; a farmer who wanted a
// different haircut had to start over. Name, farm name and pet stay put - those
// are identity, not appearance.
function openMirror()
{
    var m = modalShell('\ud83e\ude9e \uac70\uc6b8');
    m.body.appendChild(el('div', 'hint',
        '\uac70\uc6b8\uc744 \ubcf4\uba70 \ubaa8\uc2b5\uc744 \ub2e4\uc2dc \uace0\ub97c \uc218 \uc788\uc5b4\uc694.\n\uc774\ub984\uacfc \ub18d\uc7a5 \uc774\ub984\uc740 \ubc14\ub00c\uc9c0 \uc54a\uc544\uc694.'));

    var draft = {}, k;
    for (k in S.look)
    {
        if (S.look.hasOwnProperty(k))
        {
            draft[k] = S.look[k];
        }
    }
    buildLookEditor(m.body, draft, 'mirror');

    var foot = el('div', 'modalFoot');
    var cancel = el('button', 'btn gray', '\uadf8\ub9cc\ub450\uae30');
    cancel.onclick = closeModal;
    var ok = el('button', 'btn green', '\uc774\uac78\ub85c \ud560\ub798\uc694');
    ok.onclick = function ()
    {
        S.look = draft;
        // The player's frames live under 'p:me:...' and colours are not part of
        // the bake key, so they have to be dropped by hand or the farmer on
        // screen keeps the old face.
        var ck;
        for (ck in SPR_CACHE)
        {
            if (SPR_CACHE.hasOwnProperty(ck) && ck.indexOf('p:me:') === 0)
            {
                delete SPR_CACHE[ck];
            }
        }
        closeModal();
        UI.lastHudKey = '';
        toast('\ubaa8\uc2b5\uc744 \ubc14\uafe0\uc5b4\uc694.');
    };
    foot.appendChild(cancel);
    foot.appendChild(ok);
    m.appendChild(foot);
    openModal(m);
}
