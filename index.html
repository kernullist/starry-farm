var NPC_BY_ID = {};

// stable build per villager so the cast is not one body in 29 palettes.
// exported because content.js adds villagers after this file runs.
function assignNpcBuild(npc)
{
    var h = 0, c;
    for (c = 0; c < npc.id.length; c++)
    {
        h = (h * 31 + npc.id.charCodeAt(c)) | 0;
    }
    h = Math.abs(h);
    if (npc.look.tall === undefined)
    {
        npc.look.tall = (h % 5) - 2;
    }
    if (npc.look.wide === undefined)
    {
        npc.look.wide = Math.floor(h / 5) % 3;
    }
    // Every villager has carried a gender field since the first version and
    // nothing ever read it, so all 29 were drawn on the same body. This is the
    // line that makes the field mean something.
    if (npc.look.form === undefined)
    {
        npc.look.form = npc.gender === 'f' ? 'b' : 'a';
    }
    if (npc.look.outfit === undefined)
    {
        // Not every woman in a farming valley wears a skirt. Spread it off the
        // id hash so roughly a third do, and the rest keep their trousers.
        npc.look.outfit = (npc.look.form === 'b' && Math.floor(h / 15) % 3 === 0) ? 'skirt' : 'pants';
    }
    // Faces used to be identical on all 29, right down to a single shared eye
    // colour - o.eye existed and nobody ever set it. Spread them off the same
    // hash, using different divisors so the axes do not move together.
    if (npc.look.face === undefined)
    {
        npc.look.face = FACE_SHAPES[Math.floor(h / 45) % FACE_SHAPES.length];
    }
    if (npc.look.eyes === undefined)
    {
        npc.look.eyes = EYE_SHAPES[Math.floor(h / 135) % EYE_SHAPES.length];
    }
    if (npc.look.eye === undefined)
    {
        npc.look.eye = EYE_COLORS[Math.floor(h / 405) % EYE_COLORS.length];
    }
    if (npc.look.mouth === undefined)
    {
        npc.look.mouth = MOUTHS[Math.floor(h / 2430) % MOUTHS.length];
    }
    if (npc.look.freckles === undefined)
    {
        npc.look.freckles = Math.floor(h / 7290) % 4 === 0;
    }
    // Every other look field was spread across the 29 and this one was not, so
    // the whole town wore the same brown shoes.
    if (npc.look.shoe === undefined)
    {
        npc.look.shoe = SHOE_COLORS[Math.floor(h / 29160) % SHOE_COLORS.length];
    }
    return npc;
}

function registerNpc(npc)
{
    NPC_BY_ID[npc.id] = assignNpcBuild(npc);
    return npc;
}

(function ()
{
    var i;
    for (i = 0; i < NPCS.length; i++)

// ---------- friendship ----------

function hearts(id)
{
    var n = S.npc[id];
    if (!n)
    {
        return 0;
    }
    return Math.min(maxHearts(id), Math.floor(n.pts / 250));
}

function maxHearts(id)
{
    var d = NPC_BY_ID[id];
    if (!d)
    {
        return 10;
    }
    if (S.spouse === id)
    {
        return 12;
    }
    if (d.wed && !(S.npc[id] && S.npc[id].dating))
    {
        return 8;
    }
    return 10;
}

function addFriend(id, pts)
{
    var n = S.npc[id];
    if (!n)
    {
        return;
    }
    var before = hearts(id);
    n.pts = Math.max(0, Math.min(maxHearts(id) * 250, n.pts + pts));
    var after = hearts(id);
    if (after > before)
    {
        toast(NPC_BY_ID[id].name + ' 호감도 ' + after + '♥');
        checkHeartEvent(id, after);
    }
}

function checkHeartEvent(id, h)
{
    var n = S.npc[id];
    if (n.events[h])
    {
        return;
    }
    var d = NPC_BY_ID[id];
    if (!d.wed)
    {
        return;
    }
    if (h !== 2 && h !== 4 && h !== 6 && h !== 8 && h !== 10)
    {
        return;
    }
    n.events[h] = true;
    var lines = { 2: d.lines, 4: d.lines4 || d.lines, 6: d.lines4 || d.lines, 8: d.lines8 || d.lines, 10: d.lines8 || d.lines }[h];
    var msg = lines[Math.floor(Math.random() * lines.length)];
    setTimeout(function ()
    {
        modalMsg('💗 ' + d.name + ' ' + h + '하트', msg);
    }, 400);
}

// ---------- gifts ----------

function giftTaste(npcId, itemId)
{
    var d = NPC_BY_ID[npcId];
    if (!d)
    {
        return 'neutral';
    }
    if (d.loves && d.loves.indexOf(itemId) >= 0)
    {
        return 'love';
    }
    if (GIFT_TASTE_UNIVERSAL.love.indexOf(itemId) >= 0)
    {
        return 'love';
    }
    if (d.likes && d.likes.indexOf(itemId) >= 0)
    {
        return 'like';
    }
    if (GIFT_TASTE_UNIVERSAL.hate.indexOf(itemId) >= 0)
    {
        return 'hate';
    }
    if (GIFT_TASTE_UNIVERSAL.dislike.indexOf(itemId) >= 0)
    {
        return 'dislike';
    }
    if (GIFT_TASTE_UNIVERSAL.like.indexOf(itemId) >= 0)
    {
        return 'like';
    }
    var it = ITEMS[itemId];
    if (it && (it.kind === 'cook' || it.kind === 'artisan'))
    {
        return 'like';
    }
    if (it && it.kind === 'flower')
    {
        return 'like';
    }
    return 'neutral';
}

function isBirthday(npcId)
{
    var d = NPC_BY_ID[npcId];
    return d.bd && d.bd.s === seasonId() && d.bd.d === S.day;
}

function giveGift(npcId, slotIdx)
{
    var n = S.npc[npcId];
    var d = NPC_BY_ID[npcId];
    var sl = S.inv[slotIdx];
    if (!sl)
    {
        return false;
    }
    if (isTool(sl.id))
    {
        toast('도구는 선물할 수 없어요.');
        return false;
    }
    if (n.giftDay === S.day)
    {
        toast('오늘은 이미 선물했어요.');
        return false;
    }
    if (n.giftWeek >= 2 && !isBirthday(npcId))
    {
        toast('이번 주엔 이미 두 번 선물했어요.');
        return false;
    }
    // bouquet starts dating
    if (sl.id === 'bouquet')
    {
        if (!d.wed)
        {
            toast('받을 수 없다고 하네요.');
            return false;
        }
        if (hearts(npcId) < 8)
        {
            toast('아직 마음의 준비가 안 된 것 같아요.');
            return false;
        }
        n.dating = true;
        removeItem('bouquet', 1);
        n.giftDay = S.day;
        modalMsg(d.name, '"...정말? 나도 좋아."\n\n' + d.name + '와(과) 연인이 되었어요!');
        addFriend(npcId, 250);
        return true;
    }
    // mermaid pendant proposes
    if (sl.id === 'pendant')
    {
        if (!d.wed || !n.dating)
        {
            toast('먼저 꽃다발을 건네야 해요.');
            return false;
        }
        if (hearts(npcId) < 10)
        {
            toast('아직 10하트가 아니에요.');
            return false;
        }
        if (S.spouse)
        {
            toast('이미 결혼했어요.');
            return false;
        }
        removeItem('pendant', 1);
        S.spouse = npcId;
        S.engaged = 3;
        modalMsg('💍 청혼', '"...응! 나랑 결혼해줘."\n\n3일 뒤 결혼식이 열립니다!');
        return true;
    }

    var taste = giftTaste(npcId, sl.id);
    var q = sl.q || 0;
    var base = { love: 80, like: 45, neutral: 20, dislike: -20, hate: -40 }[taste];
    var mult = isBirthday(npcId) ? 8 : 1;
    var qb = taste === 'love' || taste === 'like' ? Math.round(base * q * .15) : 0;
    var pts = Math.round((base + qb) * mult);
    removeItem(sl.id, 1, q);
    n.giftDay = S.day;
    n.giftWeek++;
    S.stats.giftsGiven++;
    addFriend(npcId, pts);
    checkGoal();

    var react = {
        love: ['정말? 내가 제일 좋아하는 거야!', '어떻게 알았어? 고마워!', '와... 이건 정말 특별해.'],
        like: ['고마워, 마음에 들어.', '좋은 걸 줬네. 잘 쓸게.', '이거 괜찮은데?'],
        neutral: ['...고마워.', '음, 잘 받을게.', '그래, 고마워.'],
        dislike: ['어... 이걸 나한테?', '음... 고맙긴 한데.'],
        hate: ['이건 좀 아니지 않아?', '...진심이야?']
    }[taste];
    var msg = react[Math.floor(Math.random() * react.length)];
    if (isBirthday(npcId))
    {
        msg = '오늘 내 생일인데 기억해줬구나! ' + msg;
    }
    showDialogue(d, msg);
    sfx('gift');
    return true;
}

function talkTo(actor)
{
    var d = NPC_BY_ID[actor.id];
    var n = S.npc[actor.id];
    if (festivalTalk(actor))
    {
        return;
    }
    var fline = festivalLine(actor.id);
    if (fline && n.met)
    {
        // the festival line replaces the day's chat but still counts as saying
        // hello, so a festival is a good day to make friends
        if (n.talkedDay !== S.day)
        {
            n.talkedDay = S.day;
            addFriend(actor.id, 20);
        }
        showDialogue(d, fline);
        return;
    }
    if (!n.met)
    {
        n.met = true;
        S.seenNpc[actor.id] = true;
        showDialogue(d, '안녕! 네가 새로 온 농부구나. 나는 ' + d.name + '이야.\n앞으로 잘 지내보자!');
        addFriend(actor.id, 20);
        return;
    }
    if (n.talkedDay === S.day)
    {
        var idle = ['오늘도 좋은 하루 보내!', '또 보네!', '나중에 봐.'];
        showDialogue(d, idle[Math.floor(Math.random() * idle.length)]);
        return;
    }
    n.talkedDay = S.day;
    addFriend(actor.id, 20);

    var h = hearts(actor.id);
    var pool = d.lines;
    if (h >= 8 && d.lines8)
    {
        pool = d.lines8.concat(d.lines);
    }
    else if (h >= 4 && d.lines4)
    {
        pool = d.lines4.concat(d.lines);
    }
    var line = pool[Math.floor(Math.random() * pool.length)];
    if (isBirthday(actor.id))
    {
        line = '오늘 내 생일이야! 선물 주면 정말 기쁠 텐데...';
    }
    else if (S.spouse === actor.id)

        var sp = ['오늘도 농장 일 힘내!', '집에 일찍 와.', '당신이랑 사는 게 참 좋아.'];
        line = sp[Math.floor(Math.random() * sp.length)];
    }

}

// ---------- schedules / actors ----------

function rebuildActors()
{
    if (typeof festSyncPet === 'function')
    {
        festSyncPet();
    }
    ACTORS = [];
    var hour = Math.floor(S.time / 60);
    var i;
    for (i = 0; i < NPCS.length; i++)
    {
        var d = NPCS[i];
        var spot = scheduleSpot(d, hour);
        if (!spot || spot.map !== MAP.id)
        {
            continue;
        }
        ACTORS.push({
            id: d.id, def: d,
            x: spot.x * TILE + HALF, y: spot.y * TILE + HALF,
            tx: spot.x, ty: spot.y,
            dir: 0, frame: 0, ft: 0, moving: false
        });
    }
    // shopkeeper always present in their own interior
    if (MAP.staticNpc)
    {
        var found = false;
        for (i = 0; i < ACTORS.length; i++)
        {
            if (ACTORS[i].id === MAP.staticNpc.id)
            {
                found = true;
                break;
            }
        }
        if (!found && NPC_BY_ID[MAP.staticNpc.id])
        {
            ACTORS.push({
                id: MAP.staticNpc.id, def: NPC_BY_ID[MAP.staticNpc.id],
                x: MAP.staticNpc.x * TILE + HALF, y: MAP.staticNpc.y * TILE + HALF,
                tx: MAP.staticNpc.x, ty: MAP.staticNpc.y,
                dir: 0, frame: 0, ft: 0, moving: false
            });
        }
    }
}

function scheduleSpot(d, hour)
{
    // during a festival everyone is at the venue, whatever their usual day says
    var fst = festivalActive();
    if (fst)
    {
        var fs = festivalSpot(d, fst);
        if (fs)
        {
            return fs;
        }
    }
    if (!d.sch || d.sch.length === 0)
    {
        return null;
    }
    var pick = d.sch[0];
    var i;
    for (i = 0; i < d.sch.length; i++)
    {
        if (hour >= d.sch[i][0])
        {
            pick = d.sch[i];
        }
    }
    // nudge each villager by a stable per-id offset so several people scheduled
    // to the same square do not end up stacked on one tile
    var off = npcOffset(d.id);
    var x = pick[2] + off.x;
    var y = pick[3] + off.y;
    var m = MAP_CACHE[pick[1]];
    if (m && isSolid(m, x, y))
    {
        x = pick[2];
        y = pick[3];
    }
    return { map: pick[1], x: x, y: y };
}

var NPC_OFFSET = {};

function npcOffset(id)
{
    if (!NPC_OFFSET[id])
    {
        var h = 0, i;
        for (i = 0; i < id.length; i++)
        {
            h = (h * 31 + id.charCodeAt(i)) | 0;
        }
        h = Math.abs(h);
        NPC_OFFSET[id] = { x: (h % 5) - 2, y: (Math.floor(h / 5) % 5) - 2 };
    }
    return NPC_OFFSET[id];
}

function updateActors(dt)
{
    var hour = Math.floor(S.time / 60);
    var i;
    for (i = 0; i < ACTORS.length; i++)
    {
        var a = ACTORS[i];
        var spot = scheduleSpot(a.def, hour);
        if (spot && spot.map === MAP.id)
        {
            a.tx = spot.x;
            a.ty = spot.y;
        }
        var gx = a.tx * TILE + HALF;
        var gy = a.ty * TILE + HALF;
        var dx = gx - a.x, dy = gy - a.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 2)
        {
            var sp = 56 * dt;
            var nx = a.x + (dx / dist) * sp;
            var ny = a.y + (dy / dist) * sp;
            if (!isSolid(MAP, Math.floor(nx / TILE), Math.floor(a.y / TILE)))
            {
                a.x = nx;
            }
            if (!isSolid(MAP, Math.floor(a.x / TILE), Math.floor(ny / TILE)))
            {
                a.y = ny;
            }
            a.moving = true;
            a.dir = Math.abs(dx) > Math.abs(dy) ? 2 : (dy < 0 ? 1 : 0);
            a.flip = dx > 0;
            a.ft += dt;
            if (a.ft > .16)
            {
                a.ft = 0;
                a.frame = (a.frame + 1) % 4;
            }
        }
        else
        {
            var fst = festivalActive();
            if (fst && MAP.id === fst.map)
            {
                festivalIdle(a, fst, dt);
            }
            else
            {
                a.moving = false;
                a.frame = 0;
                a.sway = 0;
            }
        }
    }
}

function drawActors(g, cam)
{
    var i;
    for (i = 0; i < ACTORS.length; i++)
    {
        var a = ACTORS[i];
        var x = Math.round(a.x + (a.sway || 0) - PW / 2 - cam.x);
        var y = Math.round(a.y - 50 - cam.y);
        if (x < -60 || y < -80 || x > cam.vw + 60 || y > cam.vh + 60)
        {
            continue;
        }
        var spr = personSprite(a.id, a.def.look, a.dir, a.frame);
        if (a.dir === 2 && a.flip)
        {
            g.save();
            g.translate(x + PW, y);
            g.scale(-1, 1);
            g.drawImage(spr, 0, 0);
            g.restore();
        }
        else
        {
            g.drawImage(spr, x, y);
        }
        if (isBirthday(a.id))
        {
            g.drawImage(sprParticle('spark'), x + PW / 2 - 6, y - 12);
        }
    }
}

function actorNear(px, py, range)
{
    var best = null, bd = range * range;
    var i;
    for (i = 0; i < ACTORS.length; i++)
    {
        var a = ACTORS[i];
        var dx = a.x - px, dy = a.y - py;
        var d2 = dx * dx + dy * dy;
        if (d2 < bd)
        {
            bd = d2;
            best = a;
        }
    }
    return best;
}

{

            '찾아가서 말을 걸고 선물을 건네 보세요.';
    }
    if (ob)
    {
        body += '\n\n진행: ' + ob.t + ' (' + ob.have + '/' + ob.need + ')';
    }
    btns.push({ t: '🎪 축제 즐기기', cls: 'green', cb: closeModal });
    btns.push({ t: '집으로 돌아가기', cls: 'gray', cb: endFestival });
    modalChoice('🎪 ' + f.name, body, btns);
}

function endFestival()
{
    closeModal();
    UI.blockTime = false;
    S.flags['fest_' + seasonId() + '_' + S.day + '_' + S.year] = true;
    fadeOut(function ()
    {
        S.time = 22 * 60;
        MAP = loadMap('farmhouse');
        S.map = 'farmhouse';
        S.px = 6 * TILE + HALF;
        S.py = 9 * TILE + HALF;
        ensureStandable();
        rebuildActors();
    });
}

function bestFriend(weddableOnly)
{
    var best = null, bp = -1;
    var k;
    for (k in S.npc)
    {
        if (!S.npc.hasOwnProperty(k))
        {
            continue;
        }
        var d = NPC_BY_ID[k];
        if (weddableOnly && (!d || !d.wed))
        {
            continue;
        }
        if (S.npc[k].pts > bp)
        {
            bp = S.npc[k].pts;
            best = k;
        }
    }
    return best;
}

// The eggs of the egg hunt are laid out here so the plaza actually looks like
// something is hidden in it. Picking them up is still resolved by the modal.
function festEggSpots()
{
    // one egg per tile: two eggs on the same square look like one and can be
    // picked twice from a standstill
    var out = [], used = {}, i = 0, tries = 0;
    while (out.length < FEST_EGG_N && tries < 400)
    {
        var x = 16 + Math.floor(hash2(tries, 3, 811) * 12);
        var y = 20 + Math.floor(hash2(3, tries, 823) * 7);
        tries++;
        var k = x + ',' + y;
        if (used[k])
        {
            continue;
        }
        used[k] = 1;
        out.push({ x: x, y: y, c: ['#f2d0dc', '#d8ecf4', '#f6ecc0', '#dcf0d4', '#e8d8f4'][i % 5] });
        i++;
    }
    return out;
}

function festivalDecor(f)
{
    return FEST_DECOR[f.kind] || [];
}

// Villagers gather at the venue instead of following their usual day.
//
// Hashing each villager to a slot looks fine until you count: with 29 people and
// a handful of slots the birthday problem guarantees pile-ups (measured: 7 to 18
// stacked). So build the list of free tiles once and hand them out by sequential
// index instead. Collisions are then impossible by construction.
var FEST_SLOTS = {};
var FEST_ORDER = null;

function festOrderIndex(id)
{
    if (!FEST_ORDER)
    {
        FEST_ORDER = {};
        var arr = [], i;
        for (i = 0; i < NPCS.length; i++)
        {
            arr.push(NPCS[i].id);
        }
        // stable, but not alphabetical, so the crowd is not sorted by name
        arr.sort(function (a, b)
        {
            return hash2(a.length, a.charCodeAt(0), 601) - hash2(b.length, b.charCodeAt(0), 601)
                || (a < b ? -1 : 1);
        });
        for (i = 0; i < arr.length; i++)
        {
            FEST_ORDER[arr[i]] = i;
        }
    }
    return FEST_ORDER[id] === undefined ? 0 : FEST_ORDER[id];
}

function festSlots(f)
{
    if (FEST_SLOTS[f.kind])
    {
        return FEST_SLOTS[f.kind];
    }
    var v = FEST_VENUE[f.kind];
    var m = MAP_CACHE[v.map] || loadMap(v.map);
    var out = [], x, y;

    function free(tx, ty)
    {
        if (tx < 1 || ty < 1 || tx >= m.w - 1 || ty >= m.h - 1)
        {
            return false;
        }
        if (isSolid(m, tx, ty)
            && !(f.kind === 'icefish' && festIceTile(m, tx, ty))
            && !festClearedSet(f)[tx + ',' + ty])
        {
            return false;
        }
        if (f.kind === 'maze' && mazeCovers(tx, ty))
        {
            return false;       // the maze is for the player to walk, not a stage
        }
        var d = FEST_DECOR[f.kind] || [], i;
        for (i = 0; i < d.length; i++)
        {
            var o = d[i];
            if (o.k === 'bunting' || o.k === 'lanternrow' || o.k === 'egg')
            {
                continue;       // strung overhead or on the ground
            }
            var ow = (o.k === 'maze_wall') ? (o.w || 1) : 2;
            var oh = (o.k === 'maze_wall') ? (o.h || 1) : 2;
            if (tx >= o.x - 1 && tx < o.x + ow && ty >= o.y - 1 && ty < o.y + oh)
            {
                return false;
            }
        }
        return true;
    }

    if (f.kind === 'dance')
    {
        // two rows facing each other across the arch, then an audience behind
        for (x = 0; x < 8; x++)
        {
            if (free(v.x + 2 + x * 2, v.y + 2)) { out.push([v.x + 2 + x * 2, v.y + 2]); }
            if (free(v.x + 2 + x * 2, v.y + 6)) { out.push([v.x + 2 + x * 2, v.y + 6]); }
        }
    }
    // an exact grid of villagers on the ice looked like a parade, so the ice
    // festival uses the same scattered fill as everything else.
    // Fill the rest of the venue. Taking the tiles in scan order packed everyone
    // into two columns against the edges, which read as a queue rather than a
    // crowd, so shuffle deterministically and let them spread out. Villagers do
    // not block movement, so a scattered crowd costs nothing.
    //
    // Grow the rectangle until there is a tile for every villager. Hand-tuned
    // venue sizes silently produced a stack the moment anything else took a
    // tile away -- the haunted maze ate most of the plaza and one villager
    // ended up doubled up.
    var rest = [], grow = 0;
    while (grow < 12)
    {
        rest = [];
        for (y = -grow; y < v.h + grow; y++)
        {
            for (x = -grow; x < v.w + grow; x++)
            {
                var tx = v.x + x, ty = v.y + y;
                if (free(tx, ty))
                {
                    rest.push([tx, ty]);
                }
            }
        }
        if (out.length + rest.length >= NPCS.length + 6)
        {
            break;
        }
        grow += 2;
    }
    rest.sort(function (a, b)
    {
        return hash2(a[0], a[1], 977) - hash2(b[0], b[1], 977);
    });
    out = out.concat(rest);
    // drop duplicates that the per-kind pass may have already added
    var seen = {}, uniq = [], i;
    for (i = 0; i < out.length; i++)
    {
        var k = out[i][0] + ',' + out[i][1];
        if (seen[k])
        {
            continue;
        }
        seen[k] = 1;
        uniq.push(out[i]);
    }
    FEST_SLOTS[f.kind] = { map: v.map, slots: uniq };
    return FEST_SLOTS[f.kind];
}

function festivalSpot(d, f)
{
    var v = FEST_VENUE[f.kind];
    if (!v)
    {
        return null;
    }
    // your dance partner leaves the line and comes to you
    if (f.kind === 'dance' && festGet('danced') === d.id && MAP && MAP.id === f.map)
    {
        return festPartnerSpot();
    }
    var s = festSlots(f);
    if (!s.slots.length)
    {
        return null;
    }
    var idx = festOrderIndex(d.id) % s.slots.length;
    return { map: s.map, x: s.slots[idx][0], y: s.slots[idx][1] };
}



// The flower dance venue sits in dense forest and the luau one sits among beach
// clutter, so the "festival" was a crowd standing between trees. For the day,
// the village clears the ground: scatter objects inside the venue are neither
// drawn nor solid. Terrain is untouched, and nothing is written to the save.
var FEST_CLUTTER = { tree: 1, fruittree: 1, bush: 1, stump: 1, rock: 1, weed: 1,
    grass: 1, branch: 1, forage: 1, cactus: 1, flowerdeco: 1, artifactspot: 1 };

// Street furniture the village would carry aside to make room. Only moved where
// a festival genuinely needs the ground: the hedge maze had its entrance behind
// the plaza signpost and its one through-route behind a bench, which made the
// centre unreachable.
var FEST_MOVABLE = { sign: 1, board: 1, bench: 1, planter: 1, crate: 1, barrel: 1 };

function festMovesFurniture(f)
{
    return f.kind === 'maze';
}

var FEST_CLEARED = {};

function festClearedSet(f)
{
    if (FEST_CLEARED[f.kind])
    {
        return FEST_CLEARED[f.kind];
    }
    var v = FEST_VENUE[f.kind];
    var m = MAP_CACHE[v.map] || loadMap(v.map);
    var set = {}, i;
    var moves = festMovesFurniture(f);
    for (i = 0; i < m.objects.length; i++)
    {
        var o = m.objects[i];
        var clutter = !!FEST_CLUTTER[o.kind];
        var movable = moves && FEST_MOVABLE[o.kind] && mazeCovers(o.x, o.y);
        if (!clutter && !movable)
        {
            continue;
        }
        if (clutter && (o.x < v.x - 1 || o.y < v.y - 1
            || o.x >= v.x + v.w + 1 || o.y >= v.y + v.h + 1))
        {
            continue;
        }
        // only clear what the object itself makes solid; never open up terrain
        var w = (o.kind === 'bush' || o.kind === 'bench' || o.kind === 'bin') ? 2 : 1, a;
        for (a = 0; a < w; a++)
        {
            if (!SOLID_TILES[m.tiles[o.y * m.w + o.x + a]])
            {
                set[(o.x + a) + ',' + o.y] = 1;
            }
        }
    }
    FEST_CLEARED[f.kind] = set;
    return set;
}

// is this tile inside the venue and cleared for the day?
function festClearAt(tx, ty)
{
    var f = (typeof festivalActive === 'function') ? festivalActive() : null;
    if (!f || !MAP || MAP.id !== f.map)
    {
        return false;
    }
    return !!festClearedSet(f)[tx + ',' + ty];
}

// should this object be hidden today?
function festHides(o)
{
    var f = (typeof festivalActive === 'function') ? festivalActive() : null;
    if (!f || !MAP || MAP.id !== f.map)
    {
        return false;
    }
    if (festMovesFurniture(f) && FEST_MOVABLE[o.kind] && mazeCovers(o.x, o.y))
    {
        return true;
    }
    if (!FEST_CLUTTER[o.kind])
    {
        return false;
    }
    var v = FEST_VENUE[f.kind];
    return (o.x >= v.x - 1 && o.y >= v.y - 1 && o.x < v.x + v.w + 1 && o.y < v.y + v.h + 1);
}

// The ice festival is held on the forest lake, so during it the lake is frozen:
// walkable, and drawn as ice. Without this the venue had zero standable tiles
// and nobody could gather (measured: 1 villager, 0 slots).
function festIceAt(tx, ty)
{
    var f = (typeof festivalActive === 'function') ? festivalActive() : null;
    if (!f || f.kind !== 'icefish' || !MAP || MAP.id !== f.map)
    {
        return false;
    }
    return festIceTile(MAP, tx, ty);
}

function festIceTile(m, tx, ty)
{
    var v = FEST_VENUE.icefish;
    if (tx < v.x - 3 || ty < v.y - 2 || tx >= v.x + v.w + 3 || ty >= v.y + v.h + 3)
    {
        return false;
    }
    var t = tileAt(m, tx, ty);
    return (t === T_WATER || t === T_DEEP);
}

function drawFrozenLake(g, m, cam)
{
    var v = FEST_VENUE.icefish;
    var x, y;
    for (y = v.y - 2; y < v.y + v.h + 3; y++)
    {
        for (x = v.x - 3; x < v.x + v.w + 3; x++)
        {
            if (!festIceTile(m, x, y))
            {
                continue;
            }
            var sx = x * TILE - cam.x, sy = y * TILE - cam.y;
            if (sx < -TILE || sy < -TILE || sx > VIEW.w || sy > VIEW.h)
            {
                continue;
            }
            g.drawImage(tileSnowIce(), sx, sy);
            // a soft rim where the ice meets the bank
            if (!festIceTile(m, x, y - 1))
            {
                pr(g, sx, sy, TILE, 2, 'rgba(255,255,255,.5)');
            }
        }
    }
}

// Only the haunted maze blocks movement. Everything else is scenery on purpose:
// a decoration that can wall the player away from a door is a bug waiting to
// happen, and this game has already shipped one of those.
function festWallAt(tx, ty)
{
    var f = (typeof festivalActive === 'function') ? festivalActive() : null;
    if (!f || !MAP || MAP.id !== f.map)
    {
        return false;
    }
    if (f.kind !== 'maze')
    {
        return false;
    }
    return mazeCell(tx, ty) === '#';
}

// Entries to fold into the render's y-sorted list, so decorations occlude and
// are occluded correctly instead of floating over everyone.
function festivalRenderList(f)
{
    var out = [], d = FEST_DECOR[f.kind] || [], i;
    for (i = 0; i < d.length; i++)
    {
        var o = d[i];
        var yy = o.y * TILE + TILE;
        if (o.k === 'bunting' || o.k === 'lanternrow')
        {
            yy = o.y * TILE - 40;      // strung overhead, always behind people
        }
        out.push({ y: yy, fx: o });
    }
    if (f.kind === 'maze')
    {
        var r, c;
        for (r = 0; r < MAZE_ROWS.length; r++)
        {
            for (c = 0; c < MAZE_ROWS[r].length; c++)
            {
                if (MAZE_ROWS[r].charAt(c) !== '#')
                {
                    continue;
                }
                var mx = MAZE_ORIGIN.x + c, my = MAZE_ORIGIN.y + r;
                out.push({ y: my * TILE + TILE, fx: { k: 'hedge', x: mx, y: my } });
            }
        }
        // the candy basket at the centre
        var gl = festMazeGoal();
        out.push({ y: gl.y * TILE + TILE, fx: { k: 'basket', x: gl.x, y: gl.y } });
    }
    if (f.kind === 'egg_hunt')
    {
        var eggs = festEggSpots();
        for (i = 0; i < eggs.length; i++)
        {
            out.push({ y: eggs[i].y * TILE + TILE, fx: { k: 'egg', x: eggs[i].x, y: eggs[i].y, c: eggs[i].c } });
        }
    }
    return out;
}

// Moonlight jellies rise out of the sea. Their position is shared by two
// passes: the bodies are drawn on the water, and the glow is drawn after the
// night wash. Drawing the glow with the bodies meant the darkening erased it
// and the sea stayed empty on the one night it is supposed to light up.
var JELLY_N = 46;

function jellyAt(i, cam, tick)
{
    var tx = 7 + hash2(i, 1, 907) * 42;
    var ty = 18.6 + hash2(1, i, 911) * 7.5;
    return {
        x: tx * TILE - cam.x,
        y: ty * TILE - cam.y + Math.sin(tick * .03 + i * .7) * 5,
        // jellies do not climb onto the pier
        wet: WATER_TILES[tileAt(MAP, Math.floor(tx), Math.floor(ty))]
    };
}

function drawJellies(g, cam, tick)
{
    var i;
    for (i = 0; i < JELLY_N; i++)
    {
        var p = jellyAt(i, cam, tick);
        if (!p.wet || p.x < -30 || p.y < -30 || p.x > VIEW.w + 30 || p.y > VIEW.h + 30)
        {
            continue;
        }
        g.drawImage(sprJelly((i + (tick >> 4)) % 3), Math.round(p.x) - 10, Math.round(p.y) - 10);
    }
}

function festJellyGlow(g, cam, tick)
{
    var i;
    for (i = 0; i < JELLY_N; i++)
    {
        var p = jellyAt(i, cam, tick);
        var r = 40;
        if (!p.wet || p.x < -r || p.y < -r || p.x > VIEW.w + r || p.y > VIEW.h + r)
        {
            continue;
        }
        var pulse = .6 + Math.sin(tick * .05 + i) * .3;
        var gr = g.createRadialGradient(p.x, p.y, 2, p.x, p.y, r);
        gr.addColorStop(0, 'rgba(180,238,255,' + (pulse * .55) + ')');
        gr.addColorStop(.4, 'rgba(140,210,255,' + (pulse * .22) + ')');
        gr.addColorStop(1, 'rgba(120,180,255,0)');
        g.fillStyle = gr;
        g.fillRect(p.x - r, p.y - r, r * 2, r * 2);
    }
}

function drawFestivalExtras(g, f, cam, tick)
{
    if (f.kind === 'jelly')
    {
        drawJellies(g, cam, tick);
    }
    else if (f.kind === 'icefish')
    {
        drawFrozenLake(g, MAP, cam);
    }
}

// ---------- what people do while they are there ----------
// Standing perfectly still in a crowd of 29 reads as a shop display. These are
// small idle motions, all derived from TICK and a per-villager phase so they do
// not need any state of their own.

// Where each festival's attention points. Villagers face it.
var FEST_FOCUS = {
    egg_hunt: [21, 21], dance: [34, 28], soup: [16, 11], jelly: [24, 22],
    fair: [21, 22], maze: [22, 25], icefish: [13, 32], gift: [21, 24]
};

function festivalIdle(a, f, dt)
{
    a.moving = false;
    var ph = festOrderIndex(a.id);
    var t = TICK * .06 + ph * .7;

    if (f.kind === 'dance')
    {
        // your partner faces you and mirrors your side of the step
        if (festGet('danced') === a.id)
        {
            var s3 = Math.sin(t * 1.9);
            a.sway = s3 * 7;
            var ddx = S.px - a.x, ddy = S.py - a.y;
            if (Math.abs(ddx) > Math.abs(ddy))
            {
                a.dir = 2;
                a.flip = ddx > 0;
            }
            else
            {
                a.dir = ddy < 0 ? 1 : 0;
                a.flip = false;
            }
            a.frame = (Math.floor(TICK * .15 + ph) % 4);
            return;
        }
        // step side to side, partners mirroring each other across the arch
        var row = (a.ty <= FEST_FOCUS.dance[1]) ? 0 : 1;
        var s = Math.sin(t * 1.6 + row * Math.PI);
        a.sway = s * 6;
        a.dir = 2;
        a.flip = s > 0;
        a.frame = (Math.floor(TICK * .12 + ph) % 4);
        return;
    }

    a.sway = 0;
    var fc = FEST_FOCUS[f.kind];
    if (fc)
    {
        var dx = fc[0] - a.tx, dy = fc[1] - a.ty;
        if (Math.abs(dx) > Math.abs(dy))
        {
            a.dir = 2;
            a.flip = dx > 0;
        }
        else
        {
            a.dir = dy < 0 ? 1 : 0;
            a.flip = false;
        }
    }
    // shift weight now and then rather than animating constantly
    var beat = Math.sin(t * .45 + ph);
    a.frame = beat > .82 ? 1 : (beat < -.82 ? 3 : 0);
}

function festMazeKey()
{
    return 'maze_done_' + S.year + '_' + S.day;
}

function checkMazeGoal()
{
    var f = festivalActive();
    if (!f || f.kind !== 'maze' || !MAP || MAP.id !== f.map)
    {
        return;
    }
    if (S.flags[festMazeKey()])
    {
        return;
    }
    var g = festMazeGoal();
    if (Math.floor(S.px / TILE) !== g.x || Math.floor(S.py / TILE) !== g.y)
    {
        return;
    }
    S.flags[festMazeKey()] = true;
    give('pumpkin_seeds', 5);
    give('purple_mushroom', 1);
    if (!S.flags.gotPumpkinHat)
    {
        S.flags.gotPumpkinHat = true;
        give('hat_pumpkin', 1);
    }
    festLogAdd('maze', '유령의 밤', '미로를 통과해 사탕 바구니를 찾았다');
    festCheckDone();
    modalMsg('유령의 밤', '미로 한가운데에 도착했어요!\n\n사탕 바구니에서 호박 씨앗과 보라 버섯을 받았습니다.');

function festivalLine(id)
{
    var f = festivalActive();
    if (!f)
    {
        return null;
    }
    var sp = festSpouseLine(id);
    if (sp)
    {
        return sp;
    }
    var rl = festRoleLine(id, f.kind);
    if (rl)
    {
        return rl;
    }
    var pool = FEST_TALK[f.kind];
    if (!pool || !pool.length)
    {
        return null;
    }
    // stable per person per festival, and stepped by a stride coprime with the
    // pool so neighbours in the crowd do not repeat each other
    var h = festOrderIndex(id) * 5 + S.year;
    return pool[h % pool.length];
}

// ---------- the haunted maze ----------
// Hand-listing wall rectangles produced a "maze" that was open along the bottom,
// so the middle was two steps from the entrance. Lay it out as a grid instead --
// it is much harder to get wrong, and easy to see at a glance.
//   #  hedge      .  path      G  the candy basket
// One entrance, one dead end, and a route that has to double back.
var MAZE_ORIGIN = { x: 18, y: 22 };
var MAZE_ROWS = [
    '####.#####',
    '#........#',
    '#.######.#',
    '#.#G...#.#',
    '#.####.#.#',
    '#....#...#',
    '##########'
];

function mazeCell(tx, ty)
{
    var r = ty - MAZE_ORIGIN.y, c = tx - MAZE_ORIGIN.x;
    if (r < 0 || c < 0 || r >= MAZE_ROWS.length || c >= MAZE_ROWS[0].length)
    {
        return null;
    }
    return MAZE_ROWS[r].charAt(c);
}

function festMazeGoal()
{
    var r, c;
    for (r = 0; r < MAZE_ROWS.length; r++)
    {
        c = MAZE_ROWS[r].indexOf('G');
        if (c >= 0)
        {
            return { x: MAZE_ORIGIN.x + c, y: MAZE_ORIGIN.y + r };
        }
    }
    return { x: MAZE_ORIGIN.x + 1, y: MAZE_ORIGIN.y + 1 };
}

function mazeCovers(tx, ty)
{
    return mazeCell(tx, ty) !== null;
}

// ---------- festival activities you actually do ----------
//
// Every festival used to be one button and a dice roll. These put the activity
// on the map: walk to the thing, press the action button. The one exception is
// the fair target, which needs a moment of timing, so it gets a thin gauge.
//
// Progress is keyed by date, so it expires on its own and needs no migration.

function festKey(name)
{
    return 'fx_' + seasonId() + '_' + S.day + '_' + S.year + '_' + name;
}

function festGet(name)
{
    return S.flags[festKey(name)];
}

function festSet(name, v)
{
    S.flags[festKey(name)] = v;
}

// Old date-keyed festival flags pile up in the save forever. Sweep them at the
// end of each day, keeping only today's.
function festSweepFlags()
{
    var keep = 'fx_' + seasonId() + '_' + S.day + '_' + S.year + '_';
    var k, drop = [];
    for (k in S.flags)
    {
        if (S.flags.hasOwnProperty(k) && k.indexOf('fx_') === 0 && k.indexOf(keep) !== 0)
        {
            drop.push(k);
        }
    }
    var i;
    for (i = 0; i < drop.length; i++)
    {
        delete S.flags[drop[i]];
    }
    return drop.length;
}

// What the player should be doing right now, for the HUD chip.
function festObjective()
{
    var f = festivalActive();
    if (!f || !MAP || MAP.id !== f.map)
    {
        return null;
    }
    if (f.kind === 'egg_hunt')
    {
        var got = (festGet('eggs') || []).length;
        return { t: '숨은 달걀 찾기', have: got, need: FEST_EGG_N, hint: '달걀 앞에서 사용 버튼' };
    }
    if (f.kind === 'dance')
    {
        return { t: festGet('danced') ? '춤을 췄어요' : '함께 춤출 사람 찾기',
            have: festGet('danced') ? 1 : 0, need: 1, hint: '4하트 이상인 사람에게 말 걸기' };
    }
    if (f.kind === 'soup')
    {
        return { t: festGet('soup') ? '재료를 넣었어요' : '수프에 재료 넣기',
            have: festGet('soup') ? 1 : 0, need: 1, hint: '큰 솥 앞으로 가기' };
    }
    if (f.kind === 'jelly')
    {
        var w = festGet('watch') || 0;
        return { t: festGet('jellySeen') ? '해파리를 봤어요' : '물가에서 기다리기',
            have: Math.min(w, 100), need: 100, hint: '바닷가에 서서 가만히' };
    }
    if (f.kind === 'fair')
    {
        var g = (festGet('grange') || []).length;
        var sh = festGet('shot');
        return { t: g >= 5 ? (sh ? '축제를 즐기는 중' : '과녁 맞추기') : '출품할 작물 고르기',
            have: g >= 5 ? (sh ? 1 : 0) : g, need: g >= 5 ? 1 : 5,
            hint: g >= 5 ? '과녁 앞에서 사용 버튼' : '좌판 앞에서 사용 버튼' };
    }
    if (f.kind === 'maze')
    {
        return { t: S.flags[festMazeKey()] ? '미로를 통과했어요' : '미로 한가운데 찾기',
            have: S.flags[festMazeKey()] ? 1 : 0, need: 1, hint: '산울타리 사이로 걸어 들어가기' };
    }
    if (f.kind === 'icefish')
    {
        if (festGet('iceDone'))
        {
            return { t: '대회가 끝났어요', have: 1, need: 1, hint: festGet('iceCatch') + '마리를 낚았어요' };
        }
        if (ICEFISH.on)
        {
            return { t: '얼음낚시 대회', have: ICEFISH.caught, need: 10,
                hint: '남은 시간 ' + Math.ceil(ICEFISH.left) + '초' };
        }
        return { t: '얼음낚시 대회', have: 0, need: 10, hint: '얼음 구멍 앞에서 시작' };
    }
    if (f.kind === 'gift')
    {
        var who = festSecretFriend();
        return { t: festGet('gifted') ? '선물을 전했어요' : '비밀 친구에게 선물하기',
            have: festGet('gifted') ? 1 : 0, need: 1,
            hint: festGet('gifted') ? '' : (who ? NPC_BY_ID[who].name + '을(를) 찾아가기' : '') };
    }
    return null;
}

// ---------- the egg hunt ----------
var FEST_EGG_N = 14;

function festEggTaken(i)
{
    var got = festGet('eggs') || [];
    return got.indexOf(i) >= 0;
}

// nearest un-taken egg within reach of the player
function festEggNear()
{
    var eggs = festEggSpots(), i, best = -1, bd = 1e9;
    for (i = 0; i < eggs.length; i++)
    {
        if (festEggTaken(i))
        {
            continue;
        }
        var dx = (eggs[i].x * TILE + HALF) - S.px;
        var dy = (eggs[i].y * TILE + HALF) - S.py;
        var d = dx * dx + dy * dy;
        if (d < 44 * 44 && d < bd)
        {
            bd = d;
            best = i;
        }
    }
    return best;
}

function festTakeEgg(i)
{
    var got = (festGet('eggs') || []).slice();
    got.push(i);
    festSet('eggs', got);
    give('egg', 1);
    sfx('pickup');
    if (got.length >= FEST_EGG_N)
    {
        give('strawberry_seeds', 5);
        festLogAdd('egg_hunt', '달걀 축제', '달걀 ' + FEST_EGG_N + '개를 전부 찾아 1등!');
        modalMsg('달걀 축제', '달걀을 전부 찾았어요!\n\n1등! 딸기 씨앗 5개를 받았습니다.');
        festCheckDone();
    }
    else
    {
        toast('달걀을 찾았어요! (' + got.length + '/' + FEST_EGG_N + ')');
    }
}

// ---------- the ice fishing contest ----------
// The clock is frozen during a festival, so the contest keeps its own timer.
var ICEFISH = { on: false, left: 0, caught: 0 };

function festIceHoleNear()
{
    var f = festivalActive();
    if (!f || f.kind !== 'icefish')
    {
        return null;
    }
    var d = FEST_DECOR.icefish, i;
    for (i = 0; i < d.length; i++)
    {
        if (d[i].k !== 'icehole')
        {
            continue;
        }
        var dx = (d[i].x * TILE + HALF) - S.px;
        var dy = (d[i].y * TILE + HALF) - S.py;
        if (dx * dx + dy * dy < 46 * 46)
        {
            return d[i];
        }
    }
    return null;
}

function festIceStart()
{
    ICEFISH.on = true;
    ICEFISH.left = 90;
    ICEFISH.caught = 0;
    toast('대회 시작! 90초 안에 최대한 많이 낚으세요.');
}

function festIceTick(dt)
{
    if (!ICEFISH.on)
    {
        return;
    }
    var f = festivalActive();
    if (!f || f.kind !== 'icefish' || MAP.id !== f.map)
    {
        ICEFISH.on = false;
        return;
    }
    ICEFISH.left -= dt;
    if (ICEFISH.left > 0)
    {
        return;
    }
    ICEFISH.on = false;
    if (FISHING.on)
    {
        endFishing();
    }
    var n = ICEFISH.caught;
    var rank = n >= 8 ? 1 : (n >= 5 ? 2 : (n >= 2 ? 3 : 4));
    var prize = [0, 800, 400, 150, 50][rank];
    festSet('iceDone', 1);
    festSet('iceCatch', n);
    S.gold += prize;
    festLogAdd('icefish', '얼음 축제', n + '마리를 낚아 ' + (rank < 4 ? rank + '등' : '순위권 밖') +
        ' (상금 ' + prize + 'G)');
    modalMsg('얼음 축제', n + '마리를 낚았어요!\n' + (rank < 4 ? rank + '등!' : '아쉽게 순위권 밖!') +
        '\n\n상금 ' + prize + 'G를 받았어요.');
    festCheckDone();
}

// ---------- the fair target ----------
// A sweeping crosshair the player stops with the action button.
var FAIRSHOT = { on: false, p: 0, v: 1 };

function festTargetNear()
{
    var f = festivalActive();
    if (!f || f.kind !== 'fair')
    {
        return false;
    }
    var d = FEST_DECOR.fair, i;
    for (i = 0; i < d.length; i++)
    {
        if (d[i].k !== 'target')
        {
            continue;
        }
        var dx = (d[i].x * TILE + HALF) - S.px;
        var dy = (d[i].y * TILE + HALF) - S.py;
        if (dx * dx + dy * dy < 52 * 52)
        {
            return true;
        }
    }
    return false;
}

function festShotTick(dt)
{
    if (!FAIRSHOT.on)
    {
        return;
    }
    FAIRSHOT.p += FAIRSHOT.v * dt * 1.35;
    if (FAIRSHOT.p > 1)
    {
        FAIRSHOT.p = 1;
        FAIRSHOT.v = -1;
    }
    if (FAIRSHOT.p < 0)
    {
        FAIRSHOT.p = 0;
        FAIRSHOT.v = 1;
    }
}

function festShotFire()
{
    FAIRSHOT.on = false;
    festSet('shot', 1);
    var off = Math.abs(FAIRSHOT.p - .5) * 2;    // 0 = dead centre
    if (off < .12)
    {
        give('sunflower_seeds', 5);
        give('rainbow_shell', 1);
        festSet('shotHit', '정중앙');
        modalMsg('과녁 맞추기', '한가운데 명중!\n\n해바라기 씨앗 5개와 무지개 조개를 받았어요.');
    }
    else if (off < .35)
    {
        give('sunflower_seeds', 3);
        festSet('shotHit', '명중');
        modalMsg('과녁 맞추기', '명중!\n\n해바라기 씨앗 3개를 받았어요.');
    }
    else
    {
        festSet('shotHit', '빗나감');
        modalMsg('과녁 맞추기', '아깝게 빗나갔어요!\n다음에 또 도전해봐요.');
    }
    festCheckDone();
}

function drawFairShot(g)
{
    if (!FAIRSHOT.on)
    {
        return;
    }
    var w = Math.min(300, VIEW.w - 60), x = (VIEW.w - w) / 2, y = VIEW.h - 46;
    g.fillStyle = 'rgba(24,18,10,.72)';
    g.fillRect(x - 4, y - 4, w + 8, 24);
    // zones: outer, near, bullseye
    g.fillStyle = '#7a5a34';
    g.fillRect(x, y, w, 16);
    g.fillStyle = '#c8843a';
    g.fillRect(x + w * .325, y, w * .35, 16);
    g.fillStyle = '#d8483a';
    g.fillRect(x + w * .44, y, w * .12, 16);
    // the marker
    var mx = x + FAIRSHOT.p * w;
    g.fillStyle = '#fdf6e0';
    g.fillRect(mx - 2, y - 4, 4, 24);
    g.fillStyle = '#2a1e12';
    g.fillRect(mx - 1, y - 2, 2, 20);
}

// ---------- watching the jellies ----------
function festJellyTick(dt)
{
    var f = festivalActive();
    if (!f || f.kind !== 'jelly' || MAP.id !== f.map || festGet('jellySeen'))
    {
        return;
    }
    // must be standing near the water and holding still
    var ty = Math.floor(S.py / TILE), tx = Math.floor(S.px / TILE);
    var nearSea = false, d;
    for (d = 1; d <= 3; d++)
    {
        if (WATER_TILES[tileAt(MAP, tx, ty + d)])
        {
            nearSea = true;
        }
    }
    if (!nearSea || PLAYER.moving)
    {
        return;
    }
    var w = (festGet('watch') || 0) + dt * 34;
    festSet('watch', w);
    if (w >= 100)
    {
        festSet('jellySeen', 1);
        give('nautilus_shell', 1);
        festLogAdd('jelly', '달빛해파리 춤', '바다가 해파리 빛으로 물드는 것을 보았다');
        festCheckDone();
        modalMsg('달빛해파리 춤',
            '수천 마리의 해파리가 바다를 빛으로 물들였어요.\n\n마음이 따뜻해졌습니다.\n(앵무조개 껍데기를 주웠어요)');
    }
}

// The one place every festival input lands. Returns true if it handled the
// press, so the ordinary action button behaviour stays out of the way.
function festivalUse()
{
    var f = festivalActive();
    if (!f || !MAP || MAP.id !== f.map)
    {
        return false;
    }
    if (FAIRSHOT.on)
    {
        festShotFire();
        return true;
    }
    if (f.kind === 'egg_hunt')
    {
        var e = festEggNear();
        if (e >= 0)
        {
            festTakeEgg(e);
            return true;
        }
    }
    if (f.kind === 'soup' && !festGet('soup') && festSoupPotNear())
    {
        festSoupChoose();
        return true;
    }
    if (f.kind === 'fair')
    {
        if (festGrangeNear())
        {
            festGrangeChoose();
            return true;
        }
        if (!festGet('shot') && festTargetNear())
        {
            FAIRSHOT.on = true;
            FAIRSHOT.p = 0;
            FAIRSHOT.v = 1;
            toast('사용 버튼으로 조준선을 멈추세요!');
            return true;
        }
    }
    if (f.kind === 'icefish' && !festGet('iceDone'))
    {
        var hole = festIceHoleNear();
        if (hole)
        {
            if (!ICEFISH.on)
            {
                festIceStart();
            }
            startFishing(hole.x, hole.y);
            return true;
        }
    }
    return false;
}

// ---------- the two activities that still need a list ----------
// Standing at the pot or the stall is the interaction; choosing what to put in
// is a real decision, so it keeps a list. Everything else happens on the map.

function festSoupChoose()
{
    openIngredientPicker(function (slotIdx)
    {
        var sl = S.inv[slotIdx];
        if (!sl)
        {
            return;
        }
        var val = sellPrice(sl.id, sl.q || 0);
        removeItem(sl.id, 1, sl.q);
        festSet('soup', sl.id);
        var good = val >= 160;
        var k;
        for (k in S.npc)
        {
            if (S.npc.hasOwnProperty(k))
            {
                addFriend(k, good ? 60 : 20);
            }
        }
        festLogAdd('soup', '루아우', ITEMS[sl.id].name + '을(를) 넣어 ' +
            (good ? '총독이 감탄' : '무난한 맛'));
        modalMsg('루아우', good
            ? ITEMS[sl.id].name + '을(를) 넣었어요.\n\n총독이 감탄했어요! 마을 전체의 호감도가 크게 올랐습니다.'
            : ITEMS[sl.id].name + '을(를) 넣었어요.\n\n무난한 맛이었어요. 그래도 다들 즐거워했습니다.');
        festCheckDone();
    });
}

// Pick up to five things to show at the stall, then have them judged. The old
// version auto-entered your nine most valuable items, which was not a choice.
function festGrangeChoose()
{
    var chosen = (festGet('grange') || []).slice();
    if (chosen.length >= 5)
    {
        festGrangeJudge();
        return;
    }
    var m = modalShell('🏆 출품대 (' + chosen.length + '/5)');
    m.body.appendChild(el('div', 'hint',
        '작물, 물고기, 광물, 요리를 5개까지 올릴 수 있어요.\n비싸고 품질이 좋을수록 점수가 높아요.'));
    var i, any = false;
    for (i = 0; i < S.inv.length; i++)
    {
        var sl = S.inv[i];
        if (!sl || isTool(sl.id))
        {
            continue;
        }
        var kind = ITEMS[sl.id].kind;
        if (kind !== 'crop' && kind !== 'fish' && kind !== 'mineral' && kind !== 'food'
            && kind !== 'forage' && kind !== 'animal')
        {
            continue;
        }
        any = true;
        (function (slot, idx)
        {
            var row = el('div', 'listRow');
            var ic = el('div', 'ico');
            ic.appendChild(itemIcon(slot.id, 28));
            row.appendChild(ic);
            var tx = el('div', 'tx');
            tx.innerHTML = '<b>' + ITEMS[slot.id].name + (slot.q ? ' (' + QUALITY_KR[slot.q] + ')' : '') + '</b>';
            tx.appendChild(el('small', '', '예상 점수 ' + festGrangeScoreOne(slot)));
            row.appendChild(tx);
            var b = el('button', 'btn green', '올리기');
            b.onclick = function ()
            {
                chosen.push({ id: slot.id, q: slot.q || 0 });
                removeItem(slot.id, 1, slot.q);
                festSet('grange', chosen);
                closeModal();
                if (chosen.length >= 5)
                {
                    festGrangeJudge();
                }
                else
                {
                    toast('출품했어요 (' + chosen.length + '/5)');
                }
            };
            row.appendChild(b);
            m.body.appendChild(row);
        })(sl, i);
    }
    if (!any)
    {
        m.body.appendChild(el('div', 'hint', '출품할 만한 물건이 가방에 없어요.'));
    }
    if (chosen.length > 0)
    {
        var done = el('button', 'btn', '이대로 심사받기 (' + chosen.length + '개)');
        done.style.cssText = 'width:100%;margin-top:8px;';
        done.onclick = function ()
        {
            closeModal();
            festGrangeJudge();
        };
        m.body.appendChild(done);
    }
    openModal(m);
}

function festGrangeScoreOne(sl)
{
    return Math.round(sellPrice(sl.id, sl.q || 0) * (1 + (sl.q || 0) * .35));
}

function festGrangeJudge()
{
    var chosen = festGet('grange') || [];
    if (!chosen.length)
    {
        modalMsg('별밤 축제', '아직 아무것도 출품하지 않았어요.');
        return;
    }
    var score = 0, i;
    for (i = 0; i < chosen.length; i++)
    {
        score += festGrangeScoreOne(chosen[i]);
    }
    // showing fewer than five leaves empty space on the table
    score = Math.round(score * (chosen.length / 5));
    var rank = score >= 2000 ? 1 : (score >= 1000 ? 2 : (score >= 400 ? 3 : 4));
    var prize = [0, 1000, 500, 250, 100][rank];
    S.gold += prize;
    festSet('grangeDone', 1);
    festLogAdd('fair', '별밤 축제', '출품 점수 ' + score + '로 ' +
        (rank < 4 ? rank + '등' : '순위권 밖') + ' (상금 ' + prize + 'G)' +
        (festGet('shotHit') ? ', 과녁 ' + festGet('shotHit') : ''));
    modalMsg('별밤 축제', '출품 ' + chosen.length + '개\n점수 ' + score + '\n' +
        (rank < 4 ? rank + '등!' : '순위권 밖!') + '\n\n상금 ' + prize + 'G를 받았어요.');
    festCheckDone();
}

// ---------- things you do by walking up to a person ----------
// The dance used to pair you with whoever you liked most, automatically, and
// the winter star gift went to a random villager. Both are about a person, so
// both are now done by finding that person.

function festAskDance(actor)
{
    if (festGet('danced'))
    {
        showDialogue(actor.def, '오늘 춤 정말 즐거웠어!');
        return true;
    }
    var h = hearts(actor.id);
    if (h < 4)
    {
        showDialogue(actor.def, '음... 아직은 좀 쑥스러운데.\n(4하트 이상이어야 해요)');
        return true;
    }
    modalChoice('꽃춤', actor.def.name + '에게 춤을 신청할까요?', [
        { t: '💃 신청하기', cls: 'green', cb: function ()
        {
            closeModal();
            festSet('danced', actor.id);
            addFriend(actor.id, 220);
            if (!S.flags.gotWreath)
            {
                S.flags.gotWreath = true;
                give('hat_wreath', 1);
            }
            festLogAdd('dance', '꽃춤', actor.def.name + '와(과) 함께 춤을 췄다');
            showDialogue(actor.def, '좋아, 같이 추자!\n\n(둘이서 꽃 아치 아래에서 춤을 췄어요)');
            toast(actor.def.name + '와(과) 춤을 췄어요! 호감도가 크게 올랐습니다.');
            festCheckDone();
        } },
        { t: '나중에', cls: 'gray', cb: closeModal }
    ]);
    return true;
}

function festGiveGift(actor)
{
    if (festGet('gifted'))
    {
        showDialogue(actor.def, '선물 고마워! 잘 쓸게.');
        return true;
    }
    var who = festSecretFriend();
    if (actor.id !== who)
    {
        showDialogue(actor.def, '내 비밀 친구는 따로 있어. 너는 누구였더라?');
        return true;
    }
    openIngredientPicker(function (slotIdx)
    {
        var sl = S.inv[slotIdx];
        if (!sl)
        {
            return;
        }
        var liked = (actor.def.loves && actor.def.loves.indexOf(sl.id) >= 0) ? 2
            : ((actor.def.likes && actor.def.likes.indexOf(sl.id) >= 0) ? 1 : 0);
        removeItem(sl.id, 1, sl.q);
        festSet('gifted', actor.id);
        addFriend(actor.id, [120, 200, 320][liked]);
        if (!S.flags.gotSantaHat)
        {
            S.flags.gotSantaHat = true;
            give('hat_santa', 1);
        }
        var back = ['pumpkin_soup', 'cheese', 'coffee'][Math.floor(Math.random() * 3)];
        if (!ITEMS[back])
        {
            back = 'coffee';
        }
        give(back, 1);
        festLogAdd('gift', '겨울 별 축제', '비밀 친구 ' + actor.def.name + '에게 ' +
            ITEMS[sl.id].name + '을(를) 선물');
        festCheckDone();
        modalMsg('겨울 별 축제',
            '비밀 친구는 ' + actor.def.name + '이었어요!\n\n' +
            ['고맙게 받았어요.', '마음에 들어 했어요!', '정말 좋아했어요!'][liked] +
            '\n답례로 ' + ITEMS[back].name + '을(를) 받았습니다.');
    });
    return true;
}

function festIceHoleAt(tx, ty)
{
    var f = (typeof festivalActive === 'function') ? festivalActive() : null;
    if (!f || f.kind !== 'icefish' || !MAP || MAP.id !== f.map)
    {

    }
    var d = FEST_DECOR.icefish, i;
    for (i = 0; i < d.length; i++)

// ---------- family at the festival ----------
// The whole village turns out, so the pet should not be left sitting in an
// empty farmyard, and a spouse should say something warmer than the crowd line.

// A festival-day copy of the pet, placed at the venue. Nothing is written to
// the save: it is added to the live map object list only while the festival is
// on, and loadMap rebuilds from S.mapObjs anyway.
function festPetSpot(f)
{
    var v = FEST_VENUE[f.kind];
    var s = festSlots(f);
    // just behind the player's usual arrival side, out of the crowd's grid
    var i;
    for (i = s.slots.length - 1; i >= 0; i--)
    {
        var p = s.slots[i];
        if (p[0] >= v.x && p[0] < v.x + v.w && p[1] >= v.y && p[1] < v.y + v.h)
        {
            return { x: p[0], y: p[1] };
        }
    }
    return { x: v.x + 1, y: v.y + 1 };
}

function festAttachPet(m)
{
    var f = festivalActive();
    if (!f || !S || !S.pet || m.id !== f.map)
    {
        return;
    }
    var i;
    for (i = 0; i < m.objects.length; i++)
    {
        if (m.objects[i].festPet)
        {
            return;         // already there
        }
    }
    var sp = festPetSpot(f);
    m.objects.push({ kind: 'pet', pk: S.pet.kind, x: sp.x, y: sp.y,
        hx: sp.x, hy: sp.y, festPet: true });
}

// and take it away again when the festival is over
function festDetachPet(m)
{
    var out = [], i;
    for (i = 0; i < m.objects.length; i++)
    {
        if (!m.objects[i].festPet)
        {
            out.push(m.objects[i]);
        }
    }
    if (out.length !== m.objects.length)
    {
        m.objects = out;

}

{
    if (!MAP || !S)

function festRoleLine(id, kind)
{
    var r = festRoleOf(id);
    var pool = FEST_ROLE_TALK[r];
    if (!pool || !pool[kind])
    {
        return null;
    }
    // There is only one mayor, so he always speaks in role. Shopkeepers and
    // elders come in bunches, so half of them blend into the shared pool
    // instead of chorusing the same sentence.
    if (r === 'mayor')
    {
        return pool[kind];
    }
    return (festOrderIndex(id) % 2 === 0) ? pool[kind] : null;
}

// ---------- dancing with your partner ----------
// Accepting a dance used to change a flag and nothing else. Now the partner
// comes and stands with you, the two of you step in time, and hearts drift up.

function festDancePartner()
{
    var f = festivalActive();
    if (!f || f.kind !== 'dance')
    {
        return null;
    }
    var id = festGet('danced');
    return (typeof id === 'string') ? id : null;
}

// the tile your partner should be standing on: right in front of you
function festPartnerSpot()
{
    var px = Math.floor(S.px / TILE), py = Math.floor(S.py / TILE);
    var cand = [[px, py - 1], [px + 1, py], [px - 1, py], [px, py + 1]];
    var i;
    for (i = 0; i < cand.length; i++)
    {
        if (!isSolid(MAP, cand[i][0], cand[i][1]))
        {
            return { map: MAP.id, x: cand[i][0], y: cand[i][1] };
        }
    }
    return { map: MAP.id, x: px, y: py - 1 };
}

function drawDanceHearts(g)
{
    var id = festDancePartner();
    if (!id || !MAP)
    {
        return;
    }
    var a = null, i;
    for (i = 0; i < ACTORS.length; i++)
    {
        if (ACTORS[i].id === id)
        {
            a = ACTORS[i];
        }
    }
    if (!a)
    {
        return;
    }
    var cx = ((S.px + a.x) / 2) - CAM.x;
    var cy = ((S.py + a.y) / 2) - CAM.y - 46;
    for (i = 0; i < 5; i++)
    {
        var t = ((TICK * .9 + i * 26) % 130) / 130;
        var hx = cx + Math.sin(t * 6.2 + i * 1.7) * 14;
        var hy = cy - t * 42;
        var s = 1 - t;
        g.globalAlpha = s * .9;
        g.drawImage(sprParticle('heart'), Math.round(hx) - 6, Math.round(hy) - 6);
        g.globalAlpha = 1;
    }
}

// ---------- the ice fishing clock ----------
// The countdown only lived in the corner chip, which is not where your eyes are
// during a timed contest.
function drawIceClock(g)
{
    if (!ICEFISH.on)
    {
        return;
    }
    var w = 150, x = (VIEW.w - w) / 2, y = 10;
    var left = Math.max(0, ICEFISH.left);
    var frac = left / 90;
    g.fillStyle = 'rgba(20,26,44,.74)';
    g.fillRect(x - 4, y - 4, w + 8, 40);
    g.fillStyle = '#2f4a6a';
    g.fillRect(x, y + 22, w, 8);
    g.fillStyle = left <= 15 ? '#e0563a' : '#6ac0e8';
    g.fillRect(x, y + 22, Math.round(w * frac), 8);
    g.fillStyle = '#fdf6e0';
    // clock digits drawn as blocks so no font is needed
    var secs = Math.ceil(left);
    var txt = String(secs);
    var d, dx = x + w / 2 - (txt.length * 11) / 2;
    for (d = 0; d < txt.length; d++)
    {
        drawDigit(g, dx + d * 11, y + 2, +txt.charAt(d), left <= 15 ? '#ffd0c0' : '#fdf6e0');
    }
    // catch count on the right
    var ct = String(ICEFISH.caught);
    g.drawImage(sprParticle('fishmark'), x + w - 30, y + 2);
    for (d = 0; d < ct.length; d++)
    {
        drawDigit(g, x + w - 16 + d * 11, y + 2, +ct.charAt(d), '#cfe8ff');
    }
}

// 3x5 block digits: the canvas has no font stack we control.
var DIGIT_ROWS = [
    ['111', '101', '101', '101', '111'], ['010', '110', '010', '010', '111'],
    ['111', '001', '111', '100', '111'], ['111', '001', '111', '001', '111'],
    ['101', '101', '111', '001', '001'], ['111', '100', '111', '001', '111'],
    ['111', '100', '111', '101', '111'], ['111', '001', '010', '010', '010'],
    ['111', '101', '111', '101', '111'], ['111', '101', '111', '001', '111']
];

function drawDigit(g, x, y, n, col)
{
    var rows = DIGIT_ROWS[n] || DIGIT_ROWS[0];
    var r, c;
    g.fillStyle = col;
    for (r = 0; r < 5; r++)
    {
        for (c = 0; c < 3; c++)
        {
            if (rows[r].charAt(c) === '1')
            {
                g.fillRect(x + c * 3, y + r * 3, 3, 3);
            }
        }
    }
}

// everything that sits on top of the finished frame
function drawFestOverlay(g)
{
    drawFairShot(g);
    drawIceClock(g);
    drawDanceHearts(g);
}

// ---------- the festival record ----------
// Results used to vanish the moment the modal closed. Keeping them means the
// player can look back at last year's ice fishing placing, which is most of
// what makes an annual event feel annual.
function festLogAdd(kind, name, text)
{
    if (!S.festLog)
    {
        S.festLog = [];
    }
    // one entry per festival per year: replay of the same day overwrites
    var i;
    for (i = 0; i < S.festLog.length; i++)
    {
        if (S.festLog[i].y === S.year && S.festLog[i].k === kind)
        {
            S.festLog[i].t = text;
            return;
        }
    }
    S.festLog.push({ y: S.year, k: kind, n: name, t: text });
    // a very long game should not grow this without bound
    while (S.festLog.length > 80)
    {
        S.festLog.shift();
    }
}

function festLogFor(year)
{
    var out = [], i;
    for (i = 0; i < (S.festLog || []).length; i++)
    {
        if (S.festLog[i].y === year)
        {
            out.push(S.festLog[i]);
        }
    }
    return out;
}

// ---------- knowing when you are done ----------
// Finishing an activity used to leave the player standing there with no idea
// the festival was over for them. Offer the way home once, on completion.
function festMainDone()
{
    var f = festivalActive();
    if (!f)
    {
        return false;
    }
    if (f.kind === 'egg_hunt') { return (festGet('eggs') || []).length >= FEST_EGG_N; }
    if (f.kind === 'dance') { return !!festGet('danced'); }
    if (f.kind === 'soup') { return !!festGet('soup'); }
    if (f.kind === 'jelly') { return !!festGet('jellySeen'); }
    if (f.kind === 'fair') { return !!festGet('grangeDone') && !!festGet('shot'); }
    if (f.kind === 'maze') { return !!S.flags[festMazeKey()]; }
    if (f.kind === 'icefish') { return !!festGet('iceDone'); }
    if (f.kind === 'gift') { return !!festGet('gifted'); }
    return false;
}

// Called after every activity resolves. Waits a beat so it never lands on top
// of the reward message.
function festCheckDone()
{
    var f = festivalActive();
    if (!f || festGet('wrapped') || !festMainDone())
    {
        return;
    }
    festSet('wrapped', 1);
    // the reward message is usually still up, so wait for it rather than firing
    // once into a closed door
    var tries = 0;
    var show = function ()
    {
        if (!festivalActive())
        {
            return;
        }
        if (UI.modal || UI.dialogue)
        {
            if (tries++ < 20)
            {
                setTimeout(show, 700);
            }
            return;
        }
        modalChoice('🎪 ' + f.name, '오늘 할 일을 다 했어요!\n\n더 둘러봐도 되고, 이만 돌아가도 돼요.', [
            { t: '🎪 더 둘러보기', cls: 'green', cb: closeModal },
            { t: '집으로 돌아가기', cls: 'gray', cb: endFestival }
        ]);
    };
    setTimeout(show, 700);
}


/* ===== quest.js ===== */

// Starry Farm - goals, help-wanted board, trophies.
// The "what do I do next" engine. All comments ASCII only.
//
// Design notes (docs/plan/2026-07-29-content-pack.md):
//  - goals are {stat, need} pairs, never serialised functions, so progress is
//    just a counter lookup and the save holds one number
//  - endless goal targets are rolled from the CURRENT value when handed out and
//    then stored, otherwise a late-game player instantly clears twenty in a row
//  - trophies live outside the save and merge with max(), so "start over" does
//    not wipe them

// ---------- stat resolution ----------

function countKeys(o)
{
    var n = 0, k;
    for (k in o)
    {
        if (o.hasOwnProperty(k))
        {
            n++;
        }
    }
    return n;
}

function questStat(key)
{
    if (!S)
    {
        return 0;
    }
    var st = S.stats;
    switch (key)
    {
        case 'tilled': return st.tilled || 0;
        case 'planted': return st.planted || 0;
        case 'cropsHarvested': return st.cropsHarvested || 0;
        case 'earned': return st.earned || 0;
        case 'foraged': return st.foraged || 0;
        case 'treesChopped': return st.treesChopped || 0;
        case 'rocksBroken': return st.rocksBroken || 0;
        case 'fishCaught': return st.fishCaught || 0;
        case 'monstersKilled': return st.monstersKilled || 0;
        case 'daysPlayed': return st.daysPlayed || 0;
        case 'giftsGiven': return st.giftsGiven || 0;
        case 'cooked': return st.cooked || 0;
        case 'crafted': return st.crafted || 0;
        case 'artisanMade': return st.artisanMade || 0;
        case 'requestsDone': return st.requestsDone || 0;
        case 'mineDeep': return S.mineDeep || 0;
        case 'skullDeep': return S.skullDeep || 0;
        case 'year': return S.year || 1;
        case 'married': return S.married ? 1 : 0;
        case 'children': return S.children || 0;
        case 'animals': return S.animals ? S.animals.length : 0;
        case 'buildings': return S.farmBuildings ? S.farmBuildings.length : 0;
        case 'npcMet': return countKeys(S.seenNpc || {});
        case 'fishKinds': return countKeys(S.caughtFish || {});
        case 'cropKinds': return countKeys(S.harvestedKinds || {});
        case 'museumDonated': return countKeys(S.museum || {});
        case 'caughtLegend': return (S.caughtFish && S.caughtFish.legend) ? 1 : 0;
        case 'hearts': return totalNpcHearts();
        case 'skillSum':
        {
            var sum = 0, i;
            for (i = 0; i < SKILLS.length; i++)
            {
                sum += S.skills[SKILLS[i]];
            }
            return sum;
        }
        case 'artifactKinds':
        {
            var n = 0, k;
            for (k in (S.artifactsFound || {}))
            {
                if (S.artifactsFound.hasOwnProperty(k))
                {
                    n++;
                }
            }
            return n;
        }
        case 'bundlesDone':
        {
            var done = 0, r, j;
            for (r = 0; r < BUNDLES.length; r++)
            {
                for (j = 0; j < BUNDLES[r].list.length; j++)
                {
                    var b = S.bundles[BUNDLES[r].room + ':' + j];
                    if (b && b.done)
                    {
                        done++;
                    }
                }
            }
            return done;
        }
        default: return 0;
    }
}

// ---------- goal chain ----------

function currentGoal()
{
    if (!S)
    {
        return null;
    }
    if (S.goalIdx < QUEST_CHAIN.length)
    {
        var q = QUEST_CHAIN[S.goalIdx];
        return { t: q.t, d: q.d, stat: q.stat, need: q.need, g: q.g, endless: false };
    }
    // endless: the target was rolled and stored when the goal was handed out
    if (!S.goalTarget)
    {
        rollEndlessGoal();
    }
    var e = QUEST_ENDLESS[(S.goalIdx - QUEST_CHAIN.length) % QUEST_ENDLESS.length];
    return {
        t: e.t, d: e.d.replace('{n}', S.goalTarget.toLocaleString()),
        stat: e.stat, need: S.goalTarget, g: e.g, endless: true
    };
}

function rollEndlessGoal()
{
    var e = QUEST_ENDLESS[(S.goalIdx - QUEST_CHAIN.length) % QUEST_ENDLESS.length];
    var cur = questStat(e.stat);
    // roll from the CURRENT value so late-game entry does not auto-clear
    S.goalTarget = cur + e.step + Math.floor(Math.random() * Math.max(1, Math.floor(e.step * .4)));
}

function goalProgress()
{
    var g = currentGoal();
    if (!g)
    {
        return null;
    }
    return { goal: g, have: questStat(g.stat), need: g.need };
}

function checkGoal()
{
    var p = goalProgress();
    if (!p || p.have < p.need)
    {
        return false;
    }
    var g = p.goal;
    grantReward(g.g);
    S.goalIdx++;
    S.goalTarget = 0;
    if (S.goalIdx >= QUEST_CHAIN.length)
    {
        rollEndlessGoal();
    }
    var next = currentGoal();
    sfx('bundle');
    modalMsg('🎯 목표 달성! ' + g.t, rewardText(g.g) +
        (next ? '\n\n다음 목표: ' + next.t + '\n' + next.d : ''));
    checkTrophies();
    return true;
}

function grantReward(give)
{
    var k;
    for (k in give)
    {
        if (!give.hasOwnProperty(k))
        {
            continue;
        }
        if (k === 'g')
        {
            S.gold += give[k];
            S.stats.earned += give[k];
        }
        else if (ITEMS[k])
        {
            giveItem(k, give[k]);
        }
    }
}

function rewardText(give)
{
    var parts = [], k;
    for (k in give)
    {
        if (!give.hasOwnProperty(k))
        {
            continue;
        }
        parts.push(k === 'g' ? (give[k].toLocaleString() + 'G') : (ITEMS[k].name + ' ×' + give[k]));
    }
    return '보상: ' + parts.join(', ');
}

// give() lives in game.js; alias so quest code reads clearly
function giveItem(id, n, q)
{
    return give(id, n, q);
}

// ---------- help wanted board ----------

function poolFor(kind)
{
    var out = [], k;
    for (k in ITEMS)
    {
        if (!ITEMS.hasOwnProperty(k))
        {
            continue;
        }
        var it = ITEMS[k];
        if (kind === 'crop' && it.kind === 'crop')
        {
            out.push(k);
        }
        else if (kind === 'forage' && it.kind === 'forage')
        {
            out.push(k);
        }
        else if (kind === 'mineral' && it.kind === 'mineral' && it.price > 0 && it.price < 300)
        {
            out.push(k);
        }
    }
    return out;
}

function rollRequests()
{
    S.requests = [];
    var n = 1 + Math.floor(Math.random() * 3);
    var i;
    for (i = 0; i < n; i++)
    {
        var def = REQUEST_KINDS[Math.floor(Math.random() * REQUEST_KINDS.length)];
        var who = NPCS[Math.floor(Math.random() * NPCS.length)];
        var r = { kind: def.kind, days: def.days, who: who.id, taken: false, left: 0, prog: 0 };
        if (def.kind === 'gather')
        {
            var pool = poolFor(def.pool);
            if (pool.length === 0)
            {
                continue;
            }
            r.item = pool[Math.floor(Math.random() * pool.length)];
            r.n = 3 + Math.floor(Math.random() * 8);
            r.title = ITEMS[r.item].name + ' ' + r.n + '개 구해주세요';
        }
        else if (def.kind === 'fish')
        {
            var f = FISH[Math.floor(Math.random() * FISH.length)];
            if (f.rare)
            {
                f = FISH_BY_ID.sardine;
            }
            r.item = f.id;
            r.n = 1 + Math.floor(Math.random() * 3);
            r.title = f.name + ' ' + r.n + '마리 잡아주세요';
        }
        else if (def.kind === 'cook')
        {
            var known = S.recipes.slice();
            if (known.length === 0)
            {
                continue;
            }
            r.item = known[Math.floor(Math.random() * known.length)];
            r.n = 1;
            r.title = ITEMS[r.item].name + '를 만들어 주세요';
        }
        else if (def.kind === 'slay')
        {
            r.n = 5 + Math.floor(Math.random() * 16);
            r.base = questStat('monstersKilled');
            r.title = '괴물 ' + r.n + '마리를 처치해주세요';
        }
        else
        {
            r.n = (2 + Math.floor(Math.random() * 9)) * 500;
            r.base = questStat('earned');
            r.title = '출하로 ' + r.n.toLocaleString() + 'G를 벌어주세요';
        }
        r.reward = requestReward(r);
        S.requests.push(r);
    }
}

function requestReward(r)
{
    var base = 300;
    if (r.kind === 'gather' || r.kind === 'fish')
    {
        base = Math.max(300, Math.round((ITEMS[r.item].price || 30) * r.n * 2.2));
    }
    else if (r.kind === 'cook')
    {
        base = Math.max(500, Math.round((ITEMS[r.item].price || 100) * 2.5));
    }
    else if (r.kind === 'slay')
    {
        base = r.n * 90;
    }
    else
    {
        base = Math.round(r.n * .45);
    }
    return { g: base, hearts: 1 };
}

function acceptRequest(idx)
{
    var r = S.requests[idx];
    if (!r || r.taken)
    {
        return;
    }
    r.taken = true;
    r.left = r.days;
    // the clock only starts once accepted
    if (r.kind === 'slay')
    {
        r.base = questStat('monstersKilled');
    }
    if (r.kind === 'ship')
    {
        r.base = questStat('earned');
    }
    toast('의뢰를 수락했어요. ' + r.days + '일 안에!');
}

function requestProgress(r)
{
    if (r.kind === 'gather' || r.kind === 'fish' || r.kind === 'cook')
    {
        return Math.min(r.n, invCount(r.item));
    }
    if (r.kind === 'slay')
    {
        return Math.min(r.n, questStat('monstersKilled') - (r.base || 0));
    }
    return Math.min(r.n, questStat('earned') - (r.base || 0));
}

function canTurnIn(r)
{
    return r.taken && requestProgress(r) >= r.n;
}

function turnInRequest(idx)
{
    var r = S.requests[idx];
    if (!r || !canTurnIn(r))
    {
        return false;
    }
    if (r.kind === 'gather' || r.kind === 'fish' || r.kind === 'cook')
    {
        removeItem(r.item, r.n);
    }
    S.gold += r.reward.g;
    S.stats.earned += r.reward.g;
    S.stats.requestsDone = (S.stats.requestsDone || 0) + 1;
    if (S.npc[r.who])
    {
        addFriend(r.who, 250 * r.reward.hearts);
    }
    S.requests.splice(idx, 1);
    sfx('coin');
    modalMsg('의뢰 완료!', (NPC_BY_ID[r.who] ? NPC_BY_ID[r.who].name + '가 고마워합니다.\n\n' : '') +
        '보상: ' + r.reward.g.toLocaleString() + 'G, 호감도 +' + r.reward.hearts + '♥');
    checkTrophies();
    return true;
}

function tickRequests()
{
    var i, expired = 0;
    for (i = S.requests.length - 1; i >= 0; i--)
    {
        var r = S.requests[i];
        if (r.taken)
        {
            r.left--;
            if (r.left <= 0)
            {
                S.requests.splice(i, 1);
                expired++;
            }
        }
        else
        {
            // untaken offers are replaced each morning
            S.requests.splice(i, 1);
        }
    }
    var keep = S.requests.slice();
    rollRequests();
    S.requests = keep.concat(S.requests);
    if (expired > 0)
    {
        S.flags.requestExpired = expired;
    }
}

// ---------- trophies (separate storage, max merge) ----------

function loadTrophies()
{
    var t = { got: {}, best: {} };
    try
    {
        var raw = localStorage.getItem(TROPHY_KEY);
        if (raw)
        {
            var d = JSON.parse(raw);
            if (d && d.got)
            {
                t = d;
            }
        }
    }
    catch (e)
    {
        // corrupt trophy storage must never block play
        t = { got: {}, best: {} };
    }
    if (!t.best)
    {
        t.best = {};
    }
    return t;
}

function saveTrophies(t)
{
    try
    {
        localStorage.setItem(TROPHY_KEY, JSON.stringify(t));
    }
    catch (e)
    {
        // ignore: trophies are a bonus, not a requirement
    }
}

// record stats by MERGING with max, never overwriting: a snapshot write would
// erase the record the moment the player starts a new farm
function syncTrophyStats()
{
    var t = loadTrophies();
    var i;
    for (i = 0; i < TROPHIES.length; i++)
    {
        var key = TROPHIES[i].stat;
        var cur = questStat(key);
        if (t.best[key] === undefined || cur > t.best[key])
        {
            t.best[key] = cur;
        }
    }
    saveTrophies(t);
    return t;
}

function checkTrophies()
{
    var t = syncTrophyStats();
    var newly = [];
    var i;
    for (i = 0; i < TROPHIES.length; i++)
    {
        var tr = TROPHIES[i];
        if (t.got[tr.id])
        {
            continue;
        }
        if ((t.best[tr.stat] || 0) >= tr.need)
        {
            t.got[tr.id] = 1;
            newly.push(tr);
        }
    }
    if (newly.length > 0)
    {
        saveTrophies(t);
        var names = [];
        for (i = 0; i < newly.length; i++)
        {
            names.push('🏆 ' + newly[i].n + ' — ' + newly[i].d);
        }
        sfx('level');
        setTimeout(function ()
        {
            modalMsg('트로피 획득!', names.join('\n'));
        }, 350);
    }
    return newly.length;
}

function trophyCount()
{
    var t = loadTrophies();
    var n = 0, i;
    for (i = 0; i < TROPHIES.length; i++)
    {
        if (t.got[TROPHIES[i].id])
        {
            n++;
        }
    }
    return n;
}

// ---------- daily hook ----------

function tickQuests()
{
    tickRequests();
    checkTrophies();
    // TV cooking channel teaches one recipe a week
    if (S.day % 7 === 0)
    {
        var i;
        for (i = 0; i < TV_RECIPES.length; i++)
        {
            if (S.recipes.indexOf(TV_RECIPES[i]) < 0)
            {
                S.recipes.push(TV_RECIPES[i]);
                S.flags.newRecipe = ITEMS[TV_RECIPES[i]].name;
                break;
            }
        }
    }
}

// ---------- sound (synthesized, no external assets) ----------

var AC = null;

function audio()
{
    if (!AC)
    {
        try
        {
            AC = new (window.AudioContext || window.webkitAudioContext)();
        }
        catch (e)
        {
            AC = null;
        }
    }
    return AC;
}

function beep(freq, dur, type, vol)
{
    if (!UI.sound)
    {
        return;
    }
    var ac = audio();
    if (!ac)
    {
        return;
    }
    if (ac.state === 'suspended')
    {
        ac.resume();
    }
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = (vol || .06);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
    o.connect(g);
    g.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + dur);
}

function sfx(kind)
{
    switch (kind)
    {
        case 'hoe': beep(180, .09, 'square', .05); break;
        case 'water': beep(700, .12, 'sine', .05); break;
        case 'chop': beep(140, .12, 'sawtooth', .06); break;
        case 'mine': beep(220, .08, 'square', .06); break;
        case 'pickup': beep(880, .07, 'sine', .05); break;
        case 'harvest': beep(660, .09, 'sine', .05); setTimeout(function () { beep(990, .08, 'sine', .04); }, 60); break;
        case 'plant': beep(520, .07, 'triangle', .05); break;
        case 'cast': beep(400, .1, 'sine', .04); break;
        case 'bite': beep(1100, .06, 'square', .07); setTimeout(function () { beep(1400, .06, 'square', .06); }, 70); break;
        case 'hook': beep(600, .1, 'triangle', .06); break;
        case 'catch': beep(700, .1, 'sine', .06); setTimeout(function () { beep(1050, .14, 'sine', .05); }, 90); break;
        case 'swing': beep(300, .06, 'sawtooth', .05); break;
        case 'hurt': beep(150, .16, 'sawtooth', .08); break;
        case 'coin': beep(1200, .07, 'square', .05); setTimeout(function () { beep(1600, .08, 'square', .04); }, 60); break;
        case 'menu': beep(520, .05, 'square', .04); break;
        case 'gift': beep(760, .08, 'triangle', .05); setTimeout(function () { beep(1010, .1, 'triangle', .04); }, 70); break;
        case 'bundle': beep(660, .1, 'sine', .06); setTimeout(function () { beep(880, .1, 'sine', .05); }, 90);
            setTimeout(function () { beep(1170, .16, 'sine', .05); }, 180); break;
        case 'ladder': beep(400, .1, 'square', .05); setTimeout(function () { beep(300, .12, 'square', .05); }, 90); break;
        case 'machine': beep(240, .12, 'triangle', .04); break;
        case 'level': beep(520, .1, 'sine', .06); setTimeout(function () { beep(660, .1, 'sine', .06); }, 100);
            setTimeout(function () { beep(880, .2, 'sine', .06); }, 200); break;
        default: beep(600, .06, 'square', .04); break;
    }
}

// ---------- toast ----------

function toast(msg)
{
    var wrap = $('toastWrap');
    var t = el('div', 'toast', msg);
    wrap.appendChild(t);
    setTimeout(function ()
    {
        t.style.transition = 'opacity .4s';
        t.style.opacity = '0';
        setTimeout(function ()
        {

            {
                t.parentNode.removeChild(t);

    }
}
