        line = '오늘 내 생일이야! 선물 주면 정말 기쁠 텐데...';
    }
    else if (S.spouse === actor.id)
    {
        var sp = ['오늘도 농장 일 힘내!', '집에 일찍 와.', '당신이랑 사는 게 참 좋아.'];
        line = sp[Math.floor(Math.random() * sp.length)];
    }
    showDialogue(d, line);
}

// ---------- schedules / actors ----------

function rebuildActors()
{
    ACTORS = [];
    var hour = Math.floor(S.time / 60);
    var i;
    for (i = 0; i < NPCS.length; i++)
    {
        var d = NPCS[i];
        var spot = scheduleSpot(d, hour);
        if (!spot || spot.map !== MAP.id)
        {
            continue;
        }
        ACTORS.push({
            id: d.id, def: d,
            x: spot.x * TILE + HALF, y: spot.y * TILE + HALF,
            tx: spot.x, ty: spot.y,
            dir: 0, frame: 0, ft: 0, moving: false
        });
    }
    // shopkeeper always present in their own interior
    if (MAP.staticNpc)
    {
        var found = false;
        for (i = 0; i < ACTORS.length; i++)
        {
            if (ACTORS[i].id === MAP.staticNpc.id)
            {
                found = true;
                break;
            }
        }
        if (!found && NPC_BY_ID[MAP.staticNpc.id])
        {
            ACTORS.push({
                id: MAP.staticNpc.id, def: NPC_BY_ID[MAP.staticNpc.id],
                x: MAP.staticNpc.x * TILE + HALF, y: MAP.staticNpc.y * TILE + HALF,
                tx: MAP.staticNpc.x, ty: MAP.staticNpc.y,
                dir: 0, frame: 0, ft: 0, moving: false
            });
        }
    }
}

function scheduleSpot(d, hour)
{
    if (!d.sch || d.sch.length === 0)
    {
        return null;
    }
    var pick = d.sch[0];
    var i;
    for (i = 0; i < d.sch.length; i++)
    {
        if (hour >= d.sch[i][0])
        {
            pick = d.sch[i];
        }
    }
    // nudge each villager by a stable per-id offset so several people scheduled
    // to the same square do not end up stacked on one tile
    var off = npcOffset(d.id);
    var x = pick[2] + off.x;
    var y = pick[3] + off.y;
    var m = MAP_CACHE[pick[1]];
    if (m && isSolid(m, x, y))
    {
        x = pick[2];
        y = pick[3];
    }
    return { map: pick[1], x: x, y: y };
}

var NPC_OFFSET = {};

function npcOffset(id)
{
    if (!NPC_OFFSET[id])
    {
        var h = 0, i;
        for (i = 0; i < id.length; i++)
        {
            h = (h * 31 + id.charCodeAt(i)) | 0;
        }
        h = Math.abs(h);
        NPC_OFFSET[id] = { x: (h % 5) - 2, y: (Math.floor(h / 5) % 5) - 2 };
    }
    return NPC_OFFSET[id];
}

function updateActors(dt)
{
    var hour = Math.floor(S.time / 60);
    var i;
    for (i = 0; i < ACTORS.length; i++)
    {
        var a = ACTORS[i];
        var spot = scheduleSpot(a.def, hour);
        if (spot && spot.map === MAP.id)
        {
            a.tx = spot.x;
            a.ty = spot.y;
        }
        var gx = a.tx * TILE + HALF;
        var gy = a.ty * TILE + HALF;
        var dx = gx - a.x, dy = gy - a.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 2)
        {
            var sp = 56 * dt;
            var nx = a.x + (dx / dist) * sp;
            var ny = a.y + (dy / dist) * sp;
            if (!isSolid(MAP, Math.floor(nx / TILE), Math.floor(a.y / TILE)))
            {
                a.x = nx;
            }
            if (!isSolid(MAP, Math.floor(a.x / TILE), Math.floor(ny / TILE)))
            {
                a.y = ny;
            }
            a.moving = true;
            a.dir = Math.abs(dx) > Math.abs(dy) ? 2 : (dy < 0 ? 1 : 0);
            a.flip = dx > 0;
            a.ft += dt;
            if (a.ft > .16)
            {
                a.ft = 0;
                a.frame = (a.frame + 1) % 4;
            }
        }
        else
        {
            a.moving = false;
            a.frame = 0;
        }
    }
}

function drawActors(g, cam)
{
    var i;
    for (i = 0; i < ACTORS.length; i++)
    {
        var a = ACTORS[i];
        var x = Math.round(a.x - PW / 2 - cam.x);
        var y = Math.round(a.y - 50 - cam.y);
        if (x < -60 || y < -80 || x > cam.vw + 60 || y > cam.vh + 60)
        {
            continue;
        }
        var spr = personSprite(a.id, a.def.look, a.dir, a.frame);
        if (a.dir === 2 && a.flip)
        {
            g.save();
            g.translate(x + PW, y);
            g.scale(-1, 1);
            g.drawImage(spr, 0, 0);
            g.restore();
        }
        else
        {
            g.drawImage(spr, x, y);
        }
        if (isBirthday(a.id))
        {
            g.drawImage(sprParticle('spark'), x + PW / 2 - 6, y - 12);
        }
    }
}

function actorNear(px, py, range)
{
    var best = null, bd = range * range;
    var i;
    for (i = 0; i < ACTORS.length; i++)
    {
        var a = ACTORS[i];
        var dx = a.x - px, dy = a.y - py;
        var d2 = dx * dx + dy * dy;
        if (d2 < bd)
        {
            bd = d2;
            best = a;
        }
    }
    return best;
}

// ---------- marriage ----------

function tickMarriage()
{
    if (S.engaged > 0)
    {
        S.engaged--;
        if (S.engaged === 0 && S.spouse)
        {
            S.married = 1;
            var d = NPC_BY_ID[S.spouse];
            S.npc[S.spouse].pts = Math.max(S.npc[S.spouse].pts, 10 * 250);
            modalMsg('💒 결혼식', '마을 사람들이 모두 모였어요.\n\n' + d.name + '와(과) 결혼했습니다!\n\n오늘부터 함께 살아요.');
        }
    }
}

// ---------- festivals ----------

function todayFestival()
{
    var i;
    for (i = 0; i < FESTIVALS.length; i++)
    {
        var f = FESTIVALS[i];
        if (f.season === seasonId() && f.day === S.day)
        {
            return f;
        }
    }
    return null;
}

function festivalActive()
{
    var f = todayFestival();
    if (!f)
    {
        return null;
    }
    var hour = S.time / 60;
    if (hour >= f.start && hour < f.end)
    {
        return f;
    }
    return null;
}

    {

        {

            for (k in S.npc)
            {
                if (S.npc.hasOwnProperty(k))
                {
                    addFriend(k, 30);

    else if (f.kind === 'fair')
    {
        body += '농작물을 출품해 점수를 겨룹니다.';
        btns.push({ t: '🏆 출품하기', cb: function ()
        {
            var score = 0, i;
            var best = [];
            for (i = 0; i < S.inv.length; i++)
            {

                if (sl && (ITEMS[sl.id].kind === 'crop' || ITEMS[sl.id].kind === 'artisan' || ITEMS[sl.id].kind === 'animal'))

    {
        body += '어두운 미로에 도전합니다.';

        {
            var win = Math.random() < .45 + skillLvl('combat') * .03;

            {
                give('pumpkin_seeds', 5);

                modalMsg('유령의 밤', '미로를 통과했어요!\n\n호박 씨앗과 보라 버섯을 받았습니다.', endFestival);
            }
            else
            {
                modalMsg('유령의 밤', '길을 잃고 헤매다 밖으로 나왔어요.\n다음엔 성공할 수 있을 거예요!', endFestival);
            }
        } });
    }
    else if (f.kind === 'icefish')
    {
        body += '제한 시간 안에 물고기를 낚습니다.';
        btns.push({ t: '🎣 대회 참가', cb: function ()
        {
            var caught = Math.max(0, Math.round(1 + skillLvl('fishing') * .6 + Math.random() * 3));
            var rank = caught >= 6 ? 1 : (caught >= 4 ? 2 : 3);
            var prize = [0, 2000, 500, 100][rank];
            S.gold += prize;
            addXp('fishing', 60);
            modalMsg('얼음 축제', caught + '마리를 낚았어요!\n' + rank + '등!\n\n상금 ' + prize + 'G', endFestival);
        } });
    }
    else if (f.kind === 'gift')
    {
        body += '비밀 친구에게 선물을 줄 시간이에요.';
        btns.push({ t: '🎁 선물 주기', cb: function ()
        {
            openIngredientPicker(function (slotIdx)
            {
                var sl = S.inv[slotIdx];
                var who = NPCS[Math.floor(Math.random() * NPCS.length)];
                removeItem(sl.id, 1, sl.q);
                addFriend(who.id, 150);
                var back = ['cookie', 'ice_cream', 'diamond', 'wine', 'pumpkin_pie'];
                var got = back[Math.floor(Math.random() * back.length)];
                give(got, 1);
                modalMsg('겨울 별 축제', '비밀 친구는 ' + who.name + '이었어요!\n\n답례로 ' + ITEMS[got].name + '을(를) 받았습니다.', endFestival);
            });
        } });
    }
    btns.push({ t: '집으로 돌아가기', cls: 'gray', cb: endFestival });
    modalChoice('🎪 ' + f.name, body, btns);
}

function endFestival()
{
    closeModal();
    UI.blockTime = false;
    S.flags['fest_' + seasonId() + '_' + S.day + '_' + S.year] = true;
    fadeOut(function ()
    {
        S.time = 22 * 60;
        MAP = loadMap('farmhouse');
        S.map = 'farmhouse';
        S.px = 6 * TILE + HALF;
        S.py = 9 * TILE + HALF;
        ensureStandable();
        rebuildActors();
    });
}

function bestFriend(weddableOnly)
{
    var best = null, bp = -1;
    var k;
    for (k in S.npc)
    {
        if (!S.npc.hasOwnProperty(k))
        {
            continue;
        }
        var d = NPC_BY_ID[k];
        if (weddableOnly && (!d || !d.wed))
        {
            continue;
        }
        if (S.npc[k].pts > bp)
        {
            bp = S.npc[k].pts;
            best = k;
        }
    }
    return best;
}

// Starry Farm - HUD, panels, modals, dialogue, sound. All comments ASCII only.

var UI = {

function $(id)
{
    return document.getElementById(id);
}

function el(tag, cls, txt)
{
    var e = document.createElement(tag);
    if (cls)
    {
        e.className = cls;
    }
    if (txt !== undefined)
    {
        e.textContent = txt;
    }

// ---------- sound (synthesized, no external assets) ----------

var AC = null;

function audio()
{
    if (!AC)
    {
        try
        {
            AC = new (window.AudioContext || window.webkitAudioContext)();
        }
        catch (e)
        {
            AC = null;
        }
    }
    return AC;
}

function beep(freq, dur, type, vol)
{
    if (!UI.sound)
    {
        return;
    }
    var ac = audio();
    if (!ac)
    {
        return;
    }
    if (ac.state === 'suspended')
    {
        ac.resume();
    }
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = (vol || .06);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
    o.connect(g);
    g.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + dur);
}

function sfx(kind)
{
    switch (kind)
    {
        case 'hoe': beep(180, .09, 'square', .05); break;
        case 'water': beep(700, .12, 'sine', .05); break;
        case 'chop': beep(140, .12, 'sawtooth', .06); break;
        case 'mine': beep(220, .08, 'square', .06); break;
        case 'pickup': beep(880, .07, 'sine', .05); break;
        case 'harvest': beep(660, .09, 'sine', .05); setTimeout(function () { beep(990, .08, 'sine', .04); }, 60); break;
        case 'plant': beep(520, .07, 'triangle', .05); break;
        case 'cast': beep(400, .1, 'sine', .04); break;
        case 'bite': beep(1100, .06, 'square', .07); setTimeout(function () { beep(1400, .06, 'square', .06); }, 70); break;
        case 'hook': beep(600, .1, 'triangle', .06); break;
        case 'catch': beep(700, .1, 'sine', .06); setTimeout(function () { beep(1050, .14, 'sine', .05); }, 90); break;
        case 'swing': beep(300, .06, 'sawtooth', .05); break;
        case 'hurt': beep(150, .16, 'sawtooth', .08); break;
        case 'coin': beep(1200, .07, 'square', .05); setTimeout(function () { beep(1600, .08, 'square', .04); }, 60); break;
        case 'menu': beep(520, .05, 'square', .04); break;
        case 'gift': beep(760, .08, 'triangle', .05); setTimeout(function () { beep(1010, .1, 'triangle', .04); }, 70); break;
        case 'bundle': beep(660, .1, 'sine', .06); setTimeout(function () { beep(880, .1, 'sine', .05); }, 90);
            setTimeout(function () { beep(1170, .16, 'sine', .05); }, 180); break;
        case 'ladder': beep(400, .1, 'square', .05); setTimeout(function () { beep(300, .12, 'square', .05); }, 90); break;
        case 'machine': beep(240, .12, 'triangle', .04); break;
        case 'level': beep(520, .1, 'sine', .06); setTimeout(function () { beep(660, .1, 'sine', .06); }, 100);
            setTimeout(function () { beep(880, .2, 'sine', .06); }, 200); break;
        default: beep(600, .06, 'square', .04); break;
    }
}

// ---------- toast ----------

function toast(msg)
{
    var wrap = $('toastWrap');
    var t = el('div', 'toast', msg);
    wrap.appendChild(t);
    setTimeout(function ()
    {
        t.style.transition = 'opacity .4s';
        t.style.opacity = '0';
        setTimeout(function ()
        {
            if (t.parentNode)
            {
                t.parentNode.removeChild(t);
            }
        }, 420);
    }, 1800);
    while (wrap.children.length > 4)
    {
        wrap.removeChild(wrap.firstChild);
    }
}

// ---------- modals ----------

function openModal(node)
{
    var host = $('modalHost');
    host.innerHTML = '';
    host.appendChild(node);
    host.classList.add('on');
    $('dim').classList.add('on');
    UI.modal = node;
    sfx('menu');
}

function closeModal()
{
    $('modalHost').innerHTML = '';
    $('modalHost').classList.remove('on');
    $('dim').classList.remove('on');
    UI.modal = null;
}

function modalShell(title, closable)
{
    var m = el('div', 'modal');
    var head = el('div', 'modalHead');
    head.appendChild(el('span', '', title));
    if (closable !== false)
    {
        var x = el('button', 'x', '✕');
        x.onclick = closeModal;
        head.appendChild(x);
    }
    m.appendChild(head);
    var body = el('div', 'modalBody');
    m.appendChild(body);
    m.body = body;
    return m;
}

function modalMsg(title, text, cb)
{
    var m = modalShell(title, false);
    var p = el('div');
    p.style.cssText = 'font-size:15px;line-height:1.6;white-space:pre-wrap;font-weight:700;';
    p.textContent = text;
    m.body.appendChild(p);
    var foot = el('div', 'modalFoot');
    var ok = el('button', 'btn green', '확인');
    ok.onclick = function ()
    {
        closeModal();
        if (cb)
        {
            cb();
        }
    };
    foot.appendChild(ok);
    m.appendChild(foot);
    openModal(m);
}

function modalChoice(title, text, buttons)
{
    var m = modalShell(title, false);
    if (text)
    {
        var p = el('div');
        p.style.cssText = 'font-size:15px;line-height:1.6;white-space:pre-wrap;font-weight:700;margin-bottom:6px;';
        p.textContent = text;
        m.body.appendChild(p);
    }
    var foot = el('div', 'modalFoot');
    var i;
    for (i = 0; i < buttons.length; i++)
    {
        (function (b)
        {
            var btn = el('button', 'btn ' + (b.cls || 'green'), b.t);
            btn.onclick = function ()
            {
                if (b.cb)
                {
                    b.cb();
                }
            };
            foot.appendChild(btn);
        })(buttons[i]);
    }
    m.appendChild(foot);
    openModal(m);
}

// ---------- dialogue ----------

function showDialogue(npcDef, text)
{
    UI.dialogue = { def: npcDef, text: text };
    var box = $('dialogueBox');
    $('dlgName').textContent = npcDef.name + (S.spouse === npcDef.id ? ' 💗' : '');
    $('dlgText').textContent = text;
    var cv = $('dlgFace');
    var g = cv.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, 64, 64);
    g.fillStyle = '#e8dcc0';
    g.fillRect(0, 0, 64, 64);

function updateHud()
{

    {
        return;
    }
    var key = S.gold + '|' + S.time + '|' + S.day + '|' + S.season + '|' + Math.round(S.energy) +
        '|' + S.sel + '|' + S.health + '|' + S.weather + '|' + invSig();
    if (key === UI.lastHudKey)
    {
        return;
    }
    UI.lastHudKey = key;

    $('clockDate').textContent = S.year + '년 ' + dateLabel();
    $('clockDay').textContent = DAY_KR[dayOfWeek()] + '요일';
    $('clockTime').textContent = timeLabel();
    $('goldVal').textContent = S.gold.toLocaleString();

    var pct = Math.max(0, Math.min(1, S.energy / S.maxEnergy));
    $('energyFill').style.height = (pct * 100) + '%';
    $('energyTxt').textContent = Math.round(S.energy);
    $('energyFill').style.background = pct < .2 ? 'linear-gradient(180deg,#ff9a6a,#d84a2a)'
        : 'linear-gradient(180deg,#8fdc5a,#4fa32c)';

    var hw = $('healthWrap');
    if (MAP && MAP.id === 'mine')
    {
        hw.style.display = 'block';
        $('healthFill').style.height = Math.max(0, (S.health / S.maxHealth) * 100) + '%';
    }
    else
    {
        hw.style.display = 'none';
    }

    drawClockDial();
    buildToolbar();

    var wc = $('weatherChip');
    if (MAP && MAP.id === 'mine')
    {
        wc.textContent = '⛏ ' + MINE.floor + '층';
    }
    else
    {
        var icons = { sun: '☀️', rain: '🌧️', storm: '⛈️', snow: '❄️', wind: '🍃' };
        wc.textContent = icons[S.weather] + ' ' + WEATHER_KR[S.weather] + (MAP ? '  ·  ' + MAP.name : '');
    }
}

function invSig()
{
    var s = '', i;
    for (i = 0; i < S.invSize; i++)
    {
        var sl = S.inv[i];
        s += sl ? (sl.id + sl.n + (sl.q || 0)) : '-';
    }
    return s;
}

function drawClockDial()
{
    var cv = $('clockDial');
    if (!cv)
    {
        return;
    }
    var g = cv.getContext('2d');
    g.clearRect(0, 0, 72, 40);
    // arc from 6:00 to 26:00
    var p = Math.max(0, Math.min(1, (S.time - DAY_START) / (DAY_END - DAY_START)));
    var cx = 36, cy = 36, r = 28;
    g.lineWidth = 6;
    g.strokeStyle = '#c8a878';
    g.beginPath();
    g.arc(cx, cy, r, Math.PI, 0);
    g.stroke();
    g.strokeStyle = p < .55 ? '#6ab8e8' : (p < .8 ? '#e8a848' : '#4a4a8a');
    g.beginPath();
    g.arc(cx, cy, r, Math.PI, Math.PI + Math.PI * p);
    g.stroke();
    var a = Math.PI + Math.PI * p;
    g.fillStyle = '#4a2c14';
    g.beginPath();
    g.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 4, 0, Math.PI * 2);
    g.fill();
}

function afterWake(sum)
{
    var i;
    // profession choices from any level 5 / 10 reached
    var pending = null;
    for (i = 0; i < sum.levels.length; i++)
    {
        var lv = sum.levels[i];
        if ((lv.lvl === 5 || lv.lvl === 10) && PROFESSIONS[lv.skill])
        {
            if (!S.prof[lv.skill])
            {
                S.prof[lv.skill] = {};
            }
            if (!S.prof[lv.skill][lv.lvl])
            {
                pending = lv;
                break;
            }
        }
    }
    if (pending)
    {
        askProfession(pending, function ()
        {
            afterWake(sum);
        });
        return;
    }
    tickMarriage();
    if (S.flags.toolReady)
    {
        S.flags.toolReady = false;
        toast('클린트가 도구 작업을 끝냈어요!');
    }
    if (S.flags.buildReady)
    {
        S.flags.buildReady = false;
        toast('로빈이 건물을 완성했어요!');
    }
    var fest = todayFestival();
    if (fest)
    {
        setTimeout(function ()
        {
            modalMsg('🎪 오늘은 ' + fest.name, fest.desc + '\n\n' +
                fest.start + '시부터 ' + fest.end + '시까지 ' +
                ({ town: '마을 광장', beach: '해변', forest: '숲' }[fest.map]) + '에서 열려요.');
        }, 300);
    }
    rebuildActors();
}

function askProfession(lv, done)
{
    var opts = PROFESSIONS[lv.skill][lv.lvl];
    var m = modalShell('⭐ ' + SKILL_KR[lv.skill] + ' Lv.' + lv.lvl + ' 전문화', false);
    m.body.appendChild(el('div', 'hint', '하나를 고르세요. 나중에 바꿀 수 없어요.'));
    var i;
    for (i = 0; i < opts.length; i++)
    {
        (function (o)
        {
            var row = el('div', 'listRow');
            var tx = el('div', 'tx');
            tx.innerHTML = '<b>' + o.name + '</b>';
            tx.appendChild(el('small', '', o.desc));
            row.appendChild(tx);
            var b = el('button', 'btn small green', '선택');
            b.onclick = function ()
            {
                S.prof[lv.skill][lv.lvl] = o.id;
                closeModal();
                toast(o.name + ' 전문화를 얻었어요!');
                if (o.id === 'fighter')

                }
                done();

            row.appendChild(b);
            m.body.appendChild(row);
        })(opts[i]);

}

function itemDesc(sl)
{
    var it = ITEMS[sl.id];
    var s = '';
    var kindKr = { tool: '도구', seed: '씨앗', crop: '작물', forage: '채집물', fish: '물고기',
        mineral: '광물', artisan: '가공품', cook: '요리', craft: '제작', resource: '자원',
        animal: '축산물', misc: '기타' }[it.kind] || '';
    s += kindKr;
    if (it.price > 0 || sl.px)
    {
        s += '  ·  판매가 ' + itemPrice(sl) + 'G';
    }
    if (it.energy)
    {
        s += '\n기력 +' + it.energy;
    }
    if (CROPS[sl.id])
    {
        var cd = CROPS[sl.id];
        s += '\n' + cd.season.split(',').map(function (x) { return SEASON_KR[x]; }).join('/') +
            ' · ' + cd.days + '일 성장' + (cd.regrow ? ' · ' + cd.regrow + '일마다 재수확' : '');
    }
    if (it.desc)
    {
        s += '\n' + it.desc;
    }
    return s;
}

// ---------- shops ----------

function openShop(shopId)
{
    var sh = SHOPS[shopId];
    var m = modalShell('🛒 ' + sh.name);
    var tabs = el('div', 'tabRow');
    var bodyBuy = el('div');
    var bodySell = el('div');
    var tBuy = el('button', 'tab on', '사기');
    var tSell = el('button', 'tab', '팔기');
    tabs.appendChild(tBuy);
    tabs.appendChild(tSell);
    m.insertBefore(tabs, m.body);

    function show(which)
    {
        tBuy.className = 'tab' + (which === 'buy' ? ' on' : '');
        tSell.className = 'tab' + (which === 'sell' ? ' on' : '');
        m.body.innerHTML = '';
        m.body.appendChild(which === 'buy' ? bodyBuy : bodySell);
    }
    tBuy.onclick = function () { show('buy'); };
    tSell.onclick = function () { show('sell'); };

    // buy list
    function rebuildBuy()
    {
        bodyBuy.innerHTML = '';
        var i;
        for (i = 0; i < sh.stock.length; i++)
        {
            var st = sh.stock[i];
            if (st.hide)
            {
                continue;
            }
            if (st.season && st.season.indexOf(seasonId()) < 0)
            {
                continue;
            }
            if (st.year && S.year < st.year)
            {
                continue;
            }
            if (st.need && st.need.hearts)
            {
                var ok = false, k;
                for (k in S.npc)
                {
                    if (S.npc.hasOwnProperty(k) && NPC_BY_ID[k] && NPC_BY_ID[k].wed && hearts(k) >= st.need.hearts)
                    {
                        ok = true;
                        break;
                    }
                }
                if (!ok)
                {
                    continue;
                }
            }
            (function (stock)
            {
                var it = ITEMS[stock.id];
                var price = stock.price || it.buy || Math.max(1, it.price * 2);
                var row = el('div', 'listRow');
                var ic = el('div', 'ic');
                ic.appendChild(cvOf(itemIcon(stock.id, 30), 30));
                row.appendChild(ic);
                var tx = el('div', 'tx');
                tx.innerHTML = '<b>' + it.name + '</b>';
                var sub = el('small', '', price + 'G' + (CROPS[stock.id] ? '  ·  ' + CROPS[stock.id].days + '일 성장' : ''));
                tx.appendChild(sub);
                row.appendChild(tx);
                var wrap = el('div');
                wrap.style.cssText = 'display:flex;gap:4px;';
                var b1 = el('button', 'btn small', '1개');
                var b5 = el('button', 'btn small green', '5개');
                b1.onclick = function () { buyItem(stock.id, price, 1); };
                b5.onclick = function () { buyItem(stock.id, price, 5); };
                wrap.appendChild(b1);
                wrap.appendChild(b5);
                row.appendChild(wrap);
                bodyBuy.appendChild(row);
            })(st);
        }
        if (sh.service === 'upgrade')
        {
            bodyBuy.appendChild(el('div', 'sectionTitle', '🔨 도구 업그레이드'));
            addUpgradeRows(bodyBuy);
            bodyBuy.appendChild(el('div', 'sectionTitle', '💎 지오드 열기 (25G)'));
            addGeodeRow(bodyBuy);
        }
        if (sh.service === 'build')
        {
            bodyBuy.appendChild(el('div', 'sectionTitle', '🏠 건물 짓기'));
            addBuildRows(bodyBuy);
        }
        if (sh.service === 'animals')
        {
            bodyBuy.appendChild(el('div', 'sectionTitle', '🐮 동물 사기'));
            addAnimalRows(bodyBuy);
        }
        if (sh.service === 'rod')
        {
            bodyBuy.appendChild(el('div', 'sectionTitle', '🎣 낚싯대'));
            addRodRows(bodyBuy);
        }
    }

    function buyItem(id, price, n)
    {
        var total = price * n;
        if (S.gold < total)
        {
            toast('골드가 부족해요.');
            return;
        }
        if (invFull() && invCount(id) === 0)
        {
            toast('가방이 가득 찼어요.');
            return;
        }
        S.gold -= total;
        give(id, n);
        sfx('coin');
        toast(ITEMS[id].name + ' ×' + n + ' 구입');
        UI.lastHudKey = '';
        rebuildSell();
    }

    function rebuildSell()
    {
        bodySell.innerHTML = '';
        bodySell.appendChild(el('div', 'hint', '팔 물건을 누르세요. 도구는 팔 수 없어요.'));
        var grid = el('div', 'grid');
        var i;
        for (i = 0; i < S.invSize; i++)
        {
            (function (idx)
            {
                var sl = S.inv[idx];
                var c = el('div', 'cell' + (sl && isTool(sl.id) ? ' dim' : ''));
                if (sl)
                {
                    c.appendChild(cvOf(itemIcon(sl.id, 30), 30));
                    if (sl.n > 1)
                    {
                        c.appendChild(el('span', 'qty', String(sl.n)));
                    }
                    if (sl.q)
                    {
                        c.appendChild(el('span', 'qual s' + sl.q));
                    }
                    c.onclick = function ()
                    {
                        if (isTool(sl.id))
                        {
                            toast('도구는 팔 수 없어요.');
                            return;
                        }
                        var unit = itemPrice(sl);
                        modalChoice(ITEMS[sl.id].name + ' 팔기', '개당 ' + unit + 'G · ' + sl.n + '개 보유', [
                            { t: '1개 (' + unit + 'G)', cb: function ()
                            {
                                sellFromSlot(idx, 1);
                            } },
                            { t: '전부 (' + (unit * sl.n) + 'G)', cls: 'blue', cb: function ()
                            {
                                sellFromSlot(idx, sl.n);
                            } },
                            { t: '취소', cls: 'gray', cb: function ()
                            {
                                closeModal();
                                openShop(shopId);
                            } }
                        ]);
                    };
                }
                grid.appendChild(c);
            })(i);
        }
        bodySell.appendChild(grid);
    }

    function sellFromSlot(idx, n)
    {
        var sl = S.inv[idx];
        if (!sl)
        {
            return;
        }
        var unit = itemPrice(sl);
        S.gold += unit * n;
        S.stats.earned += unit * n;
        sl.n -= n;
        if (sl.n <= 0)
        {
            S.inv[idx] = null;
        }
        sfx('coin');
        UI.lastHudKey = '';
        closeModal();
        openShop(shopId);
    }

    rebuildBuy();
    rebuildSell();
    show('buy');
    openModal(m);
}

function addUpgradeRows(host)
{
    var tools = [['hoe', '괭이'], ['can', '물뿌리개'], ['axe', '도끼'], ['pick', '곡괭이']];
    var i;
    if (S.upgrade)
    {
        host.appendChild(el('div', 'hint', '작업 중: ' + S.upgrade.days + '일 남았어요.'));
        return;
    }
    for (i = 0; i < tools.length; i++)
    {
        (function (t)
        {
            var cur = S.tools[t[0]] || 0;
            if (cur >= 4)
            {
                return;
            }
            var next = cur + 1;
            var cost = TOOL_UPGRADE_COST[next];
            var bar = TOOL_UPGRADE_BAR[next];
            var row = el('div', 'listRow');
            var ic = el('div', 'ic');
            ic.appendChild(cvOf(itemIcon(t[0], 30), 30));
            row.appendChild(ic);
            var tx = el('div', 'tx');
            tx.innerHTML = '<b>' + TOOL_TIERS[next] + ' ' + t[1] + '</b>';
            tx.appendChild(el('small', '', cost + 'G + ' + ITEMS[bar].name + ' 5개 · 2일 소요'));
            row.appendChild(tx);
            var b = el('button', 'btn small green', '맡기기');
            b.disabled = S.gold < cost || invCount(bar) < 5;
            b.onclick = function ()
            {
                S.gold -= cost;

function startBuild(kind, bd)
{
    var kk;
    S.gold -= bd.cost;
    for (kk in bd.need)
    {
        if (bd.need.hasOwnProperty(kk))
        {
            removeItem(kk, bd.need[kk]);
        }
    }
    if (bd.from)
    {
        var i, target = null;
        for (i = 0; i < S.farmBuildings.length; i++)
        {
            if (S.farmBuildings[i].kind === bd.from)
            {
                target = S.farmBuildings[i];
                break;
            }
        }
        S.pendingBuild = { kind: kind, days: bd.days, upgradeOf: target ? target.id : null };
    }
    else
    {
        var spot = findBuildSpot(bd.w, bd.h);
        if (!spot)
        {
            toast('농장에 자리가 없어요.');
            return;
        }
        S.pendingBuild = { kind: kind, days: bd.days, x: spot.x, y: spot.y };
    }
    closeModal();
    modalMsg('로빈', bd.name + ' 공사를 시작할게요!\n' + bd.days + '일 뒤에 완성됩니다.');
    UI.lastHudKey = '';
}

function findBuildSpot(w, h)
{
    var farm = loadMap('farm');
    var x, y, i, j;
    for (y = 12; y < farm.h - h - 2; y++)
    {
        for (x = 30; x < farm.w - w - 2; x++)
        {
            var ok = true;
            for (j = 0; j < h + 1 && ok; j++)
            {
                for (i = 0; i < w && ok; i++)
                {
                    if (isSolid(farm, x + i, y + j) || objAt(farm, x + i, y + j))
                    {
                        ok = false;
                    }
                    if (soilAt('farm', x + i, y + j))
                    {
                        ok = false;
                    }
                }
            }
            if (ok)
            {
                return { x: x, y: y };
            }
        }
    }
    return null;
}

function findHome(kind)
{
    var a = ANIMALS[kind];
    var tierNeed = a.tier || 1;
    var i;
    for (i = 0; i < S.farmBuildings.length; i++)
    {
        var b = S.farmBuildings[i];
        var base = b.kind.indexOf('coop') === 0 ? 'coop' : 'barn';
        if (base !== a.home)
        {
            continue;
        }
        var tier = b.kind.indexOf('_deluxe') > 0 ? 3 : (b.kind.indexOf('_big') > 0 ? 2 : 1);
        if (tier < tierNeed)
        {
            continue;
        }
        if (b.animals.length >= b.cap)
        {
            continue;
        }
        return b;
    }
    return null;
}

function openCraft(mode)
{
    var isCook = mode === 'cook';
    var list = isCook ? COOKING : CRAFTING;
    var known = isCook ? S.recipes : S.crafts;
    var m = modalShell(isCook ? '🍳 요리' : '🔨 제작');
    var i;
    var any = false;
    for (i = 0; i < list.length; i++)
    {
        (function (rec)
        {
            var it = ITEMS[rec.id];
            if (!it)
            {
                return;
            }
            var unlocked = true;
            if (!isCook && rec.lvl)
            {
                var k;
                for (k in rec.lvl)
                {
                    if (rec.lvl.hasOwnProperty(k) && S.skills[k] < rec.lvl[k])
                    {
                        unlocked = false;
                    }
                }
            }
            if (isCook && known.indexOf(rec.id) < 0)
            {
                unlocked = false;
            }
            if (!unlocked)
            {
                return;
            }
            any = true;
            var row = el('div', 'listRow');
            var ic = el('div', 'ic');
            ic.appendChild(cvOf(itemIcon(rec.id, 30), 30));
            row.appendChild(ic);
            var tx = el('div', 'tx');
            tx.innerHTML = '<b>' + it.name + '</b>';
            var parts = [], can = true, kk;
            for (kk in rec.need)
            {
                if (!rec.need.hasOwnProperty(kk))
                {
                    continue;
                }
                var realId = resolveNeed(kk, rec);
                var have = invCount(realId);
                var want = rec.need[kk];
                parts.push((ITEMS[realId] ? ITEMS[realId].name : kk) + ' ' + have + '/' + want);
                if (have < want)
                {
                    can = false;
                }
            }
            tx.appendChild(el('small', '', parts.join(', ')));
            row.appendChild(tx);
            var b = el('button', 'btn small green', isCook ? '요리' : '제작');
            b.disabled = !can;
            b.onclick = function ()
            {
                var kk2;
                for (kk2 in rec.need)
                {
                    if (rec.need.hasOwnProperty(kk2))
                    {
                        removeItem(resolveNeed(kk2, rec), rec.need[kk2]);
                    }
                }
                give(rec.id, rec.out || 1);
                sfx('harvest');
                toast(it.name + ' 완성!');
                closeModal();
                openCraft(mode);
                UI.lastHudKey = '';
            };
            row.appendChild(b);
            m.body.appendChild(row);
        })(list[i]);
    }
    if (!any)
    {
        m.body.appendChild(el('div', 'hint', isCook
            ? '아직 배운 요리법이 없어요. 마을 사람들과 친해지면 알려줍니다.'
            : '스킬 레벨을 올리면 새 제작법이 열려요.'));
    }
    openModal(m);
}

function resolveNeed(k, rec)
{
    if (ITEMS[k])
    {
        return k;
    }
    if (rec.sub && rec.sub[k])
    {
        return rec.sub[k];
    }
    if (k === 'fish_any')
    {
        var i;
        for (i = 0; i < S.inv.length; i++)
        {
            if (S.inv[i] && ITEMS[S.inv[i].id].kind === 'fish')
            {
                return S.inv[i].id;
            }
        }
        return 'sunfish';
    }
    var orIdx = k.indexOf('_or_');
    if (orIdx > 0)
    {
        return k.slice(0, orIdx);
    }
    return k;
}

function locKr(loc)
{
    var map = { river: '강', lake: '호수', ocean: '바다', mine: '광산', forest: '숲 연못' };
    return loc.split(',').map(function (x) { return map[x] || x; }).join('/');
}

function openAnimalHouse(bid)
{
    var b = null, i;
    for (i = 0; i < S.farmBuildings.length; i++)
    {
        if (S.farmBuildings[i].id === bid)
        {
            b = S.farmBuildings[i];
        }
    }
    if (!b)
    {
        return;
    }
    var m = modalShell('🏠 ' + BUILDINGS[b.kind].name);
    var mine = [];
    for (i = 0; i < S.animals.length; i++)
    {
        if (S.animals[i].home === bid)
        {
            mine.push(S.animals[i]);
        }
    }
    if (mine.length === 0)
    {
        m.body.appendChild(el('div', 'hint', '아직 동물이 없어요. 마니 목장에서 데려오세요.'));
    }
    for (i = 0; i < mine.length; i++)
    {
        (function (a)
        {
            var def = ANIMALS[a.kind];
            var row = el('div', 'listRow');
            var ic = el('div', 'ic');
            ic.appendChild(cvOf(sprAnimal(def.sprite, 0, !a.mature), 30));
            row.appendChild(ic);
            var tx = el('div', 'tx');
            tx.innerHTML = '<b>' + def.name + (a.mature ? '' : ' (아기)') + '</b>';
            tx.appendChild(el('small', '', '애정도 ' + Math.floor(a.love / 200) + '/5' +
                (a.hungry ? '  ·  😖 배고픔' : '') + (a.product ? '  ·  ' + ITEMS[a.product.id].name + ' 있음' : '')));
            row.appendChild(tx);
            var wrap = el('div');
            wrap.style.cssText = 'display:flex;gap:4px;';
            var pb = el('button', 'btn small' + (a.pet ? ' gray' : ' green'), a.pet ? '✔' : '🤚');
            pb.disabled = a.pet;
            pb.onclick = function ()
            {
                a.pet = true;
                a.love = Math.min(1000, a.love + 30);
                closeModal();
                openAnimalHouse(bid);
                sfx('pickup');
            };
            wrap.appendChild(pb);
            var fb = el('button', 'btn small' + (a.fed ? ' gray' : ' blue'), a.fed ? '✔' : '🌾');
            fb.disabled = a.fed || invCount('hay') === 0;
            fb.onclick = function ()
            {
                removeItem('hay', 1);
                a.fed = true;
                closeModal();
                openAnimalHouse(bid);
            };
            wrap.appendChild(fb);
            if (a.product)
            {
                var cb2 = el('button', 'btn small', '📥');
                cb2.onclick = function ()
                {
                    give(a.product.id, 1, a.product.q);
                    addXp('farming', 5);
                    a.product = null;
                    closeModal();
                    openAnimalHouse(bid);
                    sfx('pickup');
                    UI.lastHudKey = '';
                };
                wrap.appendChild(cb2);
            }
            row.appendChild(wrap);
            m.body.appendChild(row);
        })(mine[i]);
    }
    m.body.appendChild(el('div', 'hint', '매일 쓰다듬고(🤚) 건초를 주면(🌾) 애정도가 오르고 좋은 산물이 나와요.'));
    openModal(m);
}

    {
        m.body.appendChild(el('div', 'hint', '완성됐어요!'));

        tx.textContent = (o.out.srcName ? o.out.srcName + ' ' : '') + ITEMS[o.out.id].name;
        row.appendChild(tx);
        var b = el('button', 'btn small green', '가져가기');
        b.onclick = function ()
        {
            machineCollect(o);
            closeModal();
            UI.lastHudKey = '';
        };
        row.appendChild(b);
        m.body.appendChild(row);
    }
    else if (o.busy)
    {
        var left = Math.max(0, (o.readyAt || 0) - nowHours());
        var txt = left < 24 ? ('약 ' + Math.ceil(left) + '시간') : ('약 ' + Math.ceil(left / 24) + '일');
        m.body.appendChild(el('div', 'hint', '작업 중... ' + txt + ' 남았어요.' +
            (o.pending ? '\n만드는 중: ' + (o.pending.srcName ? o.pending.srcName + ' ' : '') + ITEMS[o.pending.id].name : '')));
    }
    else
    {
        m.body.appendChild(el('div', 'hint', '넣을 재료를 고르세요.'));
        var grid = el('div', 'grid');
        var i;
        for (i = 0; i < S.invSize; i++)
        {
            (function (idx)
            {
                var sl = S.inv[idx];
                var c = el('div', 'cell');
                if (sl)
                {
                    c.appendChild(cvOf(itemIcon(sl.id, 30), 30));
                    if (sl.n > 1)
                    {
                        c.appendChild(el('span', 'qty', String(sl.n)));
                    }
                    c.onclick = function ()
                    {
                        if (machineInsert(o, idx))
                        {
                            closeModal();
                            toast('작업을 시작했어요.');
                            UI.lastHudKey = '';
                        }
                    };
                }
                grid.appendChild(c);
            })(i);
        }
        m.body.appendChild(grid);
    }
    openModal(m);
}

// ---------- museum ----------

function openMuseum()
{
    var m = modalShell('🏺 박물관');
    var donated = 0, k;
    for (k in S.museum)
    {
        if (S.museum.hasOwnProperty(k))
        {
            donated++;
        }
    }
    m.body.appendChild(el('div', 'hint', '광물과 유물을 기증하면 보상을 받습니다. 기증: ' + donated + '점'));
    var grid = el('div', 'grid');
    var i;
    for (i = 0; i < S.invSize; i++)
    {
        (function (idx)
        {
            var sl = S.inv[idx];
            if (!sl)
            {
                grid.appendChild(el('div', 'cell'));
                return;
            }
            var it = ITEMS[sl.id];
            var can = (it.kind === 'mineral') && !S.museum[sl.id];
            var c = el('div', 'cell' + (can ? '' : ' dim'));
            c.appendChild(cvOf(itemIcon(sl.id, 30), 30));
            if (can)
            {
                c.onclick = function ()
                {
                    S.museum[sl.id] = true;
                    removeItem(sl.id, 1, sl.q);
                    var n = 0, kk;
                    for (kk in S.museum)
                    {
                        if (S.museum.hasOwnProperty(kk))
                        {
                            n++;
                        }
                    }
                    var reward = null;
                    if (n === 5)
                    {
                        reward = { id: 'fert_quality', n: 10 };
                    }
                    else if (n === 10)
                    {
                        reward = { id: 'sprinkler_q', n: 1 };
                    }
                    else if (n === 20)
                    {
                        reward = { id: 'diamond', n: 1 };
                    }
                    else if (n === 30)
                    {
                        reward = { id: 'prismatic_shard', n: 1 };
                    }
                    if (reward)
                    {
                        give(reward.id, reward.n);
                        toast('기증 보상: ' + ITEMS[reward.id].name);
                    }
                    sfx('bundle');
                    addFriend('gunther', 40);
                    closeModal();
                    openMuseum();
                    UI.lastHudKey = '';
                };
            }
            grid.appendChild(c);
        })(i);
    }
    m.body.appendChild(grid);
    openModal(m);
}

{

    }
    catch (e)
    {
        UI.control = 'stick';

        }

    requestAnimationFrame(loop);

// ---------- sizing ----------

function resize()
{
    var w = window.innerWidth;
    var h = window.innerHeight;
    // target roughly 16 tiles across on an iPad; integer scale keeps pixels crisp.
    // 32px art at scale 2 costs the same fill rate as 16px art at scale 3 did.
    var scale = Math.floor(Math.min(w / 460, h / 300));
    scale = Math.max(2, Math.min(5, scale));
    VIEW.scale = scale;
    VIEW.cssW = w;
    VIEW.cssH = h;
    VIEW.w = Math.ceil(w / scale);
    VIEW.h = Math.ceil(h / scale);
    CV.width = VIEW.w * scale;
    CV.height = VIEW.h * scale;
    CV.style.width = w + 'px';
    CV.style.height = h + 'px';
    G = CV.getContext('2d');
    G.imageSmoothingEnabled = false;
    CAM.vw = VIEW.w;
    CAM.vh = VIEW.h;
}

// ---------- input ----------

function bindInput()
{
    var zone = document.getElementById('stickZone');
    var knob = document.getElementById('stickKnob');
    var base = document.getElementById('stickBase');

    function stickStart(e)
    {
        e.preventDefault();
        var t = e.changedTouches ? e.changedTouches[0] : e;
        INPUT.stickId = e.changedTouches ? t.identifier : 'mouse';
        var r = base.getBoundingClientRect();
        INPUT.sx = r.left + r.width / 2;
        INPUT.sy = r.top + r.height / 2;
        zone.classList.add('act');
        stickMove(e);
    }

    function stickMove(e)
    {
        if (INPUT.stickId === -1)
        {
            return;
        }
        e.preventDefault();
        var t = null;
        if (e.changedTouches)
        {
            var i;
            for (i = 0; i < e.changedTouches.length; i++)
            {
                if (e.changedTouches[i].identifier === INPUT.stickId)
                {
                    t = e.changedTouches[i];
                }
            }
            if (!t)
            {
                return;
            }
        }
        else
        {
            t = e;
        }
        var dx = t.clientX - INPUT.sx;
        var dy = t.clientY - INPUT.sy;
        var d = Math.sqrt(dx * dx + dy * dy);
        var max = 44;
        if (d > max)
        {
            dx = dx / d * max;
            dy = dy / d * max;
            d = max;
        }
        knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        var dead = 8;
        if (d < dead)
        {
            INPUT.dx = 0;
            INPUT.dy = 0;
        }
        else
        {
            INPUT.dx = dx / max;
            INPUT.dy = dy / max;
            INPUT.tapTarget = null;
        }
    }

    function stickEnd(e)
    {
        if (INPUT.stickId === -1)
        {
            return;
        }
        INPUT.stickId = -1;
        INPUT.dx = 0;
        INPUT.dy = 0;
        knob.style.transform = 'translate(0,0)';
        zone.classList.remove('act');
    }

    zone.addEventListener('touchstart', stickStart, { passive: false });
    zone.addEventListener('touchmove', stickMove, { passive: false });
    zone.addEventListener('touchend', stickEnd);
    zone.addEventListener('touchcancel', stickEnd);
    zone.addEventListener('mousedown', stickStart);
    window.addEventListener('mousemove', function (e)
    {
        if (INPUT.stickId === 'mouse')
        {
            stickMove(e);
        }
    });
    window.addEventListener('mouseup', function (e)
    {
        if (INPUT.stickId === 'mouse')
        {
            stickEnd(e);
        }
    });

    // action buttons
    var bt = document.getElementById('btnTool');
    var bu = document.getElementById('btnUse');

    function toolDown(e)
    {
        e.preventDefault();
        INPUT.toolHeld = true;
        if (FISHING.on)
        {
            fishingHold(true);
            return;
        }
        doToolAction();
    }
    function toolUp(e)
    {
        INPUT.toolHeld = false;
        if (FISHING.on)
        {
            fishingHold(false);
        }
    }
    bt.addEventListener('touchstart', toolDown, { passive: false });
    bt.addEventListener('touchend', toolUp);
    bt.addEventListener('touchcancel', toolUp);
    bt.addEventListener('mousedown', toolDown);
    bt.addEventListener('mouseup', toolUp);
    bt.addEventListener('mouseleave', toolUp);

    function useDown(e)
    {
        e.preventDefault();
        doUseAction();
    }
    bu.addEventListener('touchstart', useDown, { passive: false });
    bu.addEventListener('mousedown', useDown);

    // tap to move on the canvas
    var wrap = document.getElementById('cvWrap');
    function tap(e)
    {
        if (!S || UI.modal || UI.dialogue)
        {
            return;
        }
        var t = e.changedTouches ? e.changedTouches[0] : e;
        var x = (t.clientX / VIEW.scale) + CAM.x;
        var y = (t.clientY / VIEW.scale) + CAM.y;
        INPUT.tapTarget = { x: x, y: y };
    }
    wrap.addEventListener('touchstart', tap, { passive: true });
    wrap.addEventListener('mousedown', tap);

    // keyboard (desktop testing / play)
    var keys = {};
    window.addEventListener('keydown', function (e)
    {
        keys[e.key.toLowerCase()] = true;
        if (!S || UI.modal)
        {
            return;
        }
        if (e.key === ' ' || e.key === 'Enter')
        {
            e.preventDefault();
            doUseAction();
        }
        if (e.key.toLowerCase() === 'c' || e.key === 'Shift')
        {
            if (FISHING.on)
            {
                fishingHold(true);
            }
            else
            {
                doToolAction();
            }
        }
        if (e.key === 'e' || e.key === 'i')
        {
            openInventory();
        }
        if (e.key >= '1' && e.key <= '9')
        {
            S.sel = parseInt(e.key, 10) - 1;
            UI.lastHudKey = '';
        }
        if (e.key === '0')
        {
            S.sel = 9;
            UI.lastHudKey = '';
        }
    });
    window.addEventListener('keyup', function (e)
    {
        keys[e.key.toLowerCase()] = false;
        if (e.key.toLowerCase() === 'c' || e.key === 'Shift')
        {
            if (FISHING.on)
            {
                fishingHold(false);
            }
        }
    });
    INPUT.keys = keys;
}

function keyVector()
{
    var k = INPUT.keys || {};
    var dx = 0, dy = 0;
    if (k.arrowleft || k.a)
    {
        dx -= 1;
    }
    if (k.arrowright || k.d)
    {
        dx += 1;
    }
    if (k.arrowup || k.w)
    {
        dy -= 1;
    }
    if (k.arrowdown || k.s)
    {
        dy += 1;
    }
    return { dx: dx, dy: dy };
}

// ---------- player movement ----------

function movePlayer(dt)
{
    var dx = INPUT.dx, dy = INPUT.dy;
    var kv = keyVector();
    if (kv.dx || kv.dy)
    {
        dx = kv.dx;
        dy = kv.dy;
        INPUT.tapTarget = null;
    }
    if (dx === 0 && dy === 0 && INPUT.tapTarget)
    {
        var tdx = INPUT.tapTarget.x - S.px;
        var tdy = INPUT.tapTarget.y - S.py;
        var td = Math.sqrt(tdx * tdx + tdy * tdy);
        if (td < 6)
        {
            INPUT.tapTarget = null;
        }
        else
        {
            dx = tdx / td;
            dy = tdy / td;
        }
    }

    var mag = Math.sqrt(dx * dx + dy * dy);
    if (mag > 1)
    {
        dx /= mag;
        dy /= mag;
        mag = 1;
    }
    PLAYER.moving = mag > .05;

    if (PLAYER.moving)
    {
        var speed = 108 * (1 + buffOf('speed') * .12);
        if (isRaining() && MAP.outdoor)
        {
            speed *= .96;
        }
        var nx = S.px + dx * speed * dt;
        var ny = S.py + dy * speed * dt;
        if (canStand(nx, S.py))
        {
            S.px = nx;
        }
        if (canStand(S.px, ny))
        {
            S.py = ny;
        }
        if (Math.abs(dx) > Math.abs(dy))
        {
            S.dir = dx < 0 ? 2 : 3;
        }
        else
        {
            S.dir = dy < 0 ? 1 : 0;
        }
        PLAYER.ft += dt;
        if (PLAYER.ft > .13)
        {
            PLAYER.ft = 0;
            PLAYER.frame = (PLAYER.frame + 1) % 4;
        }
    }
    else
    {
        PLAYER.frame = 0;
    }

    checkWarp();
}

// feet collision box is a small rect at the bottom of the sprite
function canStand(px, py)
{
    var half = 8;
    var pts = [[px - half, py], [px + half, py], [px - half, py - 10], [px + half, py - 10]];
    var i;
    for (i = 0; i < pts.length; i++)
    {
        var tx = Math.floor(pts[i][0] / TILE);
        var ty = Math.floor(pts[i][1] / TILE);
        if (isSolid(MAP, tx, ty))
        {
            return false;
        }
    }
    return true;
}

// Safety net: if the player ends up inside something solid (bad spawn point,
// a building placed on top of them, a map edit) they can get wedged with no way
// out, because movePlayer only ever accepts a *fully* clear destination.
// Spiral out to the nearest standable tile and drop them there.
function ensureStandable()
{
    if (!S || !MAP)
    {
        return false;
    }
    if (canStand(S.px, S.py))
    {
        return false;
    }
    var cx = Math.floor(S.px / TILE), cy = Math.floor(S.py / TILE);
    var r, dx, dy;
    for (r = 0; r <= 12; r++)
    {
        for (dy = -r; dy <= r; dy++)
        {
            for (dx = -r; dx <= r; dx++)
            {
                if (Math.max(Math.abs(dx), Math.abs(dy)) !== r)
                {
                    continue;
                }
                var tx = cx + dx, ty = cy + dy;
                if (tx < 0 || ty < 0 || tx >= MAP.w || ty >= MAP.h)
                {
                    continue;
                }
                var px = tx * TILE + HALF, py = ty * TILE + HALF;
                if (canStand(px, py))
                {
                    S.px = px;
                    S.py = py;
                    return true;
                }
            }
        }
    }
    return false;
}

function facingTile()
{
    var tx = Math.floor(S.px / TILE);
    var ty = Math.floor(S.py / TILE);
    if (S.dir === 0)
    {
        ty += 1;
    }
    else if (S.dir === 1)
    {
        ty -= 1;
    }
    else if (S.dir === 2)
    {
        tx -= 1;
    }
    else
    {
        tx += 1;
    }
    return { x: tx, y: ty };
}

function checkWarp()
{
    var tx = Math.floor(S.px / TILE);
    var ty = Math.floor(S.py / TILE);
    var w = warpAt(MAP, tx, ty);
    if (!w || UI.warping)
    {
        return;
    }
    if (w.locked && !S.flags[w.locked])
    {
        toast('아직 들어갈 수 없어요.');
        return;
    }
    UI.warping = true;
    var target = w;
    fadeOut(function ()
    {
        if (target.mine)
        {
            enterMine(1);
        }
        else
        {
            MAP = loadMap(target.to);
            S.map = target.to;
            if (target.interior)
            {
                var d = INTERIORS[target.to];
                S.px = (d ? d.exit.x : 4) * TILE + HALF;
                S.py = (d ? d.exit.y - 1 : 4) * TILE + HALF;
                S.dir = 1;
            }
            else
            {
                S.px = target.tx * TILE + HALF;
                S.py = target.ty * TILE + HALF;
            }
        }
        ensureStandable();
        rebuildActors();
        UI.lastHudKey = '';
        setTimeout(function ()
        {
            UI.warping = false;
        }, 250);
    });
}

// ---------- actions ----------

function doToolAction()
{
    if (!S || UI.modal || UI.dialogue || UI.warping)
    {
        return;
    }
    var fest = festivalActive();
    if (fest && MAP.id === fest.map)
    {
        return;
    }
    var sl = selSlot();
    if (!sl)
    {
        return;
    }
    var f = facingTile();
    PLAYER.act = 14;
    PLAYER.actKind = sl.id;

    switch (sl.id)
    {
        case 'hoe':
            actHoe(f);
            break;
        case 'can':
            actWater(f);
            break;
        case 'axe':
            actAxe(f);
            break;
        case 'pick':
            actPick(f);
            break;
        case 'scythe':
            actScythe(f);
            break;
        case 'rod':
            if (isWater(MAP, f.x, f.y))
            {
                startFishing(f.x, f.y);
            }
            else
            {
                toast('물가에서 사용하세요.');
            }
            break;
        case 'sword':
            doSwing();
            break;
        default:
            if (CROPS[sl.id])
            {
                actPlant(f, sl.id);
            }
            else if (FRUIT_TREES[sl.id])
            {
                actPlantTree(f, sl.id);
            }
            else if (sl.id.indexOf('sapling_') === 0)
            {
                actPlantWildTree(f, sl.id);
            }
            else if (sl.id === 'crab_pot')
            {
                actPlacePot(f);
            }
            else if (sl.id === 'fert_basic' || sl.id === 'fert_quality' || sl.id === 'speed_gro')
            {
                actFertilize(f, sl.id);
            }
            else if (MACHINES[sl.id] || sl.id === 'chest' || sl.id === 'scarecrow' ||
                sl.id === 'sprinkler' || sl.id === 'sprinkler_q' || sl.id === 'torch')
            {
                actPlace(f, sl.id);
            }
            else if (sl.id === 'bomb')
            {
                actBomb(f);
            }
            else
            {
                doUseAction();
            }
            break;
    }
    UI.lastHudKey = '';
}

function actHoe(f)
{
    var did = false;
    var power = toolPower('hoe');
    var tiles = toolArea(f, power);
    var i;
    for (i = 0; i < tiles.length; i++)
    {
        var t = tiles[i];
        if (till(t.x, t.y))
        {
            did = true;
            spawnFx(t.x * TILE + HALF, t.y * TILE + HALF, 'dirt');
        }
        else
        {
            // digging sand can turn up buried items
            if (tileAt(MAP, t.x, t.y) === T_SAND && Math.random() < .08)
            {
                spawnDrop(MAP, t.x, t.y, Math.random() < .5 ? 'clay' : 'winter_root', 0);
                did = true;
            }
        }
    }
    if (did)
    {
        useEnergy(energyCostFor('hoe'));
        sfx('hoe');
    }
}

// bigger tools cover more tiles, like the real upgrades do
function toolArea(f, power)
{
    var out = [{ x: f.x, y: f.y }];
    if (power >= 3)
    {
        if (S.dir === 0 || S.dir === 1)
        {
            out.push({ x: f.x - 1, y: f.y });
            out.push({ x: f.x + 1, y: f.y });
        }
        else
        {
            out.push({ x: f.x, y: f.y - 1 });
            out.push({ x: f.x, y: f.y + 1 });
        }
    }
    if (power >= 5)
    {
        var extra = [];
        var i;
        for (i = 0; i < out.length; i++)
        {
            if (S.dir === 0)
            {
                extra.push({ x: out[i].x, y: out[i].y + 1 });
            }
            else if (S.dir === 1)
            {
                extra.push({ x: out[i].x, y: out[i].y - 1 });
            }
            else if (S.dir === 2)
            {
                extra.push({ x: out[i].x - 1, y: out[i].y });
            }
            else
            {
                extra.push({ x: out[i].x + 1, y: out[i].y });
            }
        }
        out = out.concat(extra);
    }
    return out;
}

function actWater(f)
{
    if (isWater(MAP, f.x, f.y))
    {
        S.water = S.waterCap;
        sfx('water');
        toast('물을 채웠어요.');
        return;
    }
    if (S.water <= 0)
    {
        toast('물이 없어요. 물가에서 채우세요.');
        return;
    }
    var power = toolPower('can');
    var tiles = toolArea(f, power);
    var did = false;
    var i;
    for (i = 0; i < tiles.length && S.water > 0; i++)
    {
        var t = tiles[i];
        var s = soilAt(MAP.id, t.x, t.y);
        if (s && !s.w)
        {
            s.w = 1;
            S.water--;
            did = true;
            spawnFx(t.x * TILE + HALF, t.y * TILE + 12, 'water');
        }
    }
    if (did)
    {
        useEnergy(energyCostFor('can'));
        sfx('water');
    }
}

function actAxe(f)
{
    var o = objAt(MAP, f.x, f.y);
    if (!o)
    {
        return;
    }
    if (o.kind === 'tree')
    {
        if (o.stage < 4)
        {
            removeObj(MAP, o);
            give('wood', 1);
            return;
        }
        o.hp -= toolPower('axe');
        useEnergy(energyCostFor('axe'));
        sfx('chop');
        spawnFx(f.x * TILE + HALF, f.y * TILE, 'leaf');
        if (o.hp <= 0)
        {
            var amount = 8 + Math.floor(Math.random() * 5);
            if (hasProf('forester'))
            {
                amount = Math.round(amount * 1.25);
            }
            var i;
            for (i = 0; i < amount; i++)
            {
                spawnDrop(MAP, f.x, f.y, 'wood', 0);
            }
            if (hasProf('lumberjack') || Math.random() < .1)
            {
                spawnDrop(MAP, f.x, f.y, 'hardwood', 0);
            }
            if (Math.random() < .5)
            {
                spawnDrop(MAP, f.x, f.y, 'sap', 0);
            }
            if (Math.random() < .3)
            {
                spawnDrop(MAP, f.x, f.y, o.tk === 'maple' ? 'sapling_maple' : (o.tk === 'pine' ? 'sapling_pine' : 'sapling_oak'), 0);
            }
            removeObj(MAP, o);
            addObj(MAP, { kind: 'stump', x: f.x, y: f.y, hp: 2 });
            addXp('foraging', 12);
        }
    }
    else if (o.kind === 'stump')
    {
        o.hp -= toolPower('axe');
        useEnergy(energyCostFor('axe'));
        sfx('chop');
        if (o.hp <= 0)
        {
            var n;
            for (n = 0; n < 3; n++)
            {
                spawnDrop(MAP, f.x, f.y, 'hardwood', 0);
            }
            removeObj(MAP, o);
            addXp('foraging', 6);
        }
    }
    else if (o.kind === 'branch')
    {
        give('wood', 2);
        removeObj(MAP, o);
        addXp('foraging', 3);
        sfx('chop');
    }
    else if (o.kind === 'bush' || o.kind === 'weed')
    {
        removeObj(MAP, o);
        give('fiber', 1);
        sfx('chop');
    }
    else if (o.kind === 'fruittree')
    {
        o.hp = (o.hp === undefined ? 6 : o.hp) - toolPower('axe');
        useEnergy(energyCostFor('axe'));
        sfx('chop');
        if (o.hp <= 0)
        {
            var w;
            for (w = 0; w < 6; w++)
            {
                spawnDrop(MAP, f.x, f.y, 'hardwood', 0);
            }
            removeObj(MAP, o);
            addXp('foraging', 10);
        }
    }
}

function actPick(f)
{
    var o = objAt(MAP, f.x, f.y);
    if (o && o.kind === 'rock')
    {
        o.hp -= toolPower('pick');
        useEnergy(energyCostFor('pick'));
        sfx('mine');
        spawnFx(f.x * TILE + HALF, f.y * TILE + HALF, 'spark');
        if (o.hp <= 0)
        {
            if (MAP.id === 'mine')
            {
                rockLoot(o);
            }
            else
            {
                spawnDrop(MAP, f.x, f.y, 'stone', 0);
                if (Math.random() < .12)
                {
                    spawnDrop(MAP, f.x, f.y, 'copper_ore', 0);
                }
                if (Math.random() < .05)
                {
                    spawnDrop(MAP, f.x, f.y, 'coal', 0);
                }
                addXp('mining', 3);
            }
            removeObj(MAP, o);
        }
        return;
    }
    if (o && o.kind === 'stump')
    {
        toast('도끼가 필요해요.');
        return;
    }
    // clear tilled soil
    var s = soilAt(MAP.id, f.x, f.y);
    if (s && !cropAt(MAP.id, f.x, f.y))
    {
        delete soilMap(MAP.id)[K(f.x, f.y)];
        useEnergy(energyCostFor('pick'));
        sfx('hoe');
        return;
    }
    if (o && (o.kind === 'machine' || o.kind === 'chest' || o.kind === 'sprinkler' || o.kind === 'scarecrow'))
    {
        give(o.mk || o.kind, 1);
        removeObj(MAP, o);
        toast('회수했어요.');
    }
}

function actScythe(f)
{
    var did = false;
    var dx, dy;
    for (dy = -1; dy <= 1; dy++)
    {
        for (dx = -1; dx <= 1; dx++)
        {
            var o = objAt(MAP, f.x + dx, f.y + dy);
            if (o && (o.kind === 'weed' || o.kind === 'grass'))
            {
                removeObj(MAP, o);
                if (Math.random() < .5)
                {
                    spawnDrop(MAP, f.x + dx, f.y + dy, 'fiber', 0);
                }
                if (o.kind === 'grass' && Math.random() < .35 && S.flags.hasSilo)
                {
                    spawnDrop(MAP, f.x + dx, f.y + dy, 'hay', 0);
                }
                did = true;
            }
            var c = cropAt(MAP.id, f.x + dx, f.y + dy);
            if (c && cropReady(c) && CROPS[c.seed].scythe)
            {
                harvestCrop(f.x + dx, f.y + dy);
                did = true;
            }
        }
    }
    if (did)
    {
        sfx('chop');
    }
}

function actPlant(f, seedId)
{
    var did = false;
    var i;
    var tiles = [{ x: f.x, y: f.y }];
    for (i = 0; i < tiles.length; i++)
    {
        var t = tiles[i];
        if (plantSeed(t.x, t.y, seedId))
        {
            consumeSel(1);
            did = true;
        }
        else if (!soilAt(MAP.id, t.x, t.y))
        {
            toast('먼저 괭이로 밭을 갈아주세요.');
            return;
        }
    }
    if (did)
    {
        sfx('plant');
    }
}

// fruit trees need a clear 3x3 around them, like the real game
function actPlantTree(f, sapId)
{
    if (MAP.id !== 'farm' && MAP.id !== 'greenhouse')
    {
        toast('농장에만 심을 수 있어요.');
        return;
    }
    var dx, dy;
    for (dy = -1; dy <= 1; dy++)
    {
        for (dx = -1; dx <= 1; dx++)
        {
            if (isSolid(MAP, f.x + dx, f.y + dy) || objAt(MAP, f.x + dx, f.y + dy))
            {
                toast('나무 주변 3×3이 비어 있어야 해요.');
                return;
            }
            if (soilAt(MAP.id, f.x + dx, f.y + dy))
            {
                toast('밭 위에는 심을 수 없어요.');
                return;
            }
        }
    }
    addObj(MAP, { kind: 'fruittree', sap: sapId, x: f.x, y: f.y, stage: 0, age: 0, fruit: 0 });
    consumeSel(1);
    sfx('plant');
    toast(FRUIT_TREES[sapId].name + '을(를) 심었어요. 28일 뒤 열매가 열려요!');
}

function actPlantWildTree(f, sapId)
{
    if (isSolid(MAP, f.x, f.y) || objAt(MAP, f.x, f.y) || soilAt(MAP.id, f.x, f.y))
    {
        toast('여기엔 심을 수 없어요.');
        return;
    }
    if (tileAt(MAP, f.x, f.y) !== T_GRASS && tileAt(MAP, f.x, f.y) !== T_DIRT)
    {
        toast('흙이나 풀 위에만 심을 수 있어요.');
        return;
    }
    var kind = sapId === 'sapling_maple' ? 'maple' : (sapId === 'sapling_pine' ? 'pine' : 'oak');
    addObj(MAP, { kind: 'tree', tk: kind, stage: 0, x: f.x, y: f.y, hp: 5 });
    consumeSel(1);
    sfx('plant');
}

function actPlacePot(f)
{
    if (!isWater(MAP, f.x, f.y))
    {
        toast('물 위에만 놓을 수 있어요.');
        return;
    }
    if (objAt(MAP, f.x, f.y))
    {
        toast('여기엔 이미 뭔가 있어요.');
        return;
    }
    addObj(MAP, { kind: 'crabpot', x: f.x, y: f.y, baited: false, out: null });
    consumeSel(1);
    sfx('plant');
    toast('게 통발을 놓았어요. 미끼를 넣으면 다음날 수확할 수 있어요.');
}

function actFertilize(f, fid)
{
    var s = soilAt(MAP.id, f.x, f.y);
    if (!s)
    {
        toast('밭에만 쓸 수 있어요.');
        return;
    }
    if (s.f)
    {
        toast('이미 비료가 있어요.');
        return;
    }
    s.f = fid;
    consumeSel(1);
    sfx('plant');
    toast(ITEMS[fid].name + '을(를) 뿌렸어요.');
}

function actPlace(f, id)
{
    if (isSolid(MAP, f.x, f.y) || objAt(MAP, f.x, f.y))
    {
        toast('여기엔 놓을 수 없어요.');
        return;
    }
    if (soilAt(MAP.id, f.x, f.y) && id !== 'sprinkler' && id !== 'sprinkler_q')
    {
        toast('밭 위에는 놓을 수 없어요.');
        return;
    }
    var o;
    if (MACHINES[id])
    {
        o = { kind: 'machine', mk: id, x: f.x, y: f.y, busy: false, out: null, readyAt: 0 };
    }
    else if (id === 'sprinkler' || id === 'sprinkler_q')
    {
        o = { kind: 'sprinkler', mk: id, x: f.x, y: f.y };
    }
    else if (id === 'chest')
    {
        o = { kind: 'chest', x: f.x, y: f.y, items: [] };
    }
    else if (id === 'scarecrow')
    {
        o = { kind: 'scarecrow', x: f.x, y: f.y };
    }
    else
    {
        o = { kind: 'chest', x: f.x, y: f.y, items: [] };
    }
    addObj(MAP, o);
    consumeSel(1);
    sfx('plant');
}

function actBomb(f)
{
    consumeSel(1);
    var cx = f.x, cy = f.y;
    var dx, dy;
    for (dy = -2; dy <= 2; dy++)
    {
        for (dx = -2; dx <= 2; dx++)
        {
            if (dx * dx + dy * dy > 6)
            {
                continue;
            }
            var o = objAt(MAP, cx + dx, cy + dy);
            if (o && o.kind === 'rock')
            {
                if (MAP.id === 'mine')
                {
                    rockLoot(o);
                }
                else
                {
                    spawnDrop(MAP, o.x, o.y, 'stone', 0);
                }
                removeObj(MAP, o);
            }
            spawnFx((cx + dx) * TILE + HALF, (cy + dy) * TILE + HALF, 'spark');
        }
    }
    var i;
    for (i = 0; i < MINE.mobs.length; i++)
    {
        var mob = MINE.mobs[i];
        var mdx = mob.x - (cx * TILE + HALF), mdy = mob.y - (cy * TILE + HALF);
        if (mdx * mdx + mdy * mdy < 88 * 88)
        {
            mob.hp -= 60;
            if (mob.hp <= 0)
            {
                killMob(mob);
            }
        }
    }
    sfx('hurt');
}

// interaction button
function doUseAction()
{
    if (!S || UI.warping)
    {
        return;
    }
    if (UI.dialogue)
    {
        document.getElementById('dialogueBox').style.display = 'none';
        UI.dialogue = null;
        return;
    }
    if (UI.modal)
    {
        return;
    }
    if (FISHING.on)
    {
        if (FISHING.phase === 'bite')
        {
            hookFish();
        }
        else if (FISHING.phase === 'wait' || FISHING.phase === 'cast')
        {
            endFishing();
        }
        return;
    }
    var fest = festivalActive();
    if (fest && MAP.id === fest.map && !S.flags['fest_' + seasonId() + '_' + S.day + '_' + S.year])
    {
        runFestival(fest);
        return;
    }

    // nearby villager first
    var a = actorNear(S.px, S.py, 46);
    if (a)
    {
        var sl = selSlot();
        if (sl && !isTool(sl.id))
        {
            modalChoice(a.def.name, '무엇을 할까요?', [
                { t: '💬 말 걸기', cb: function ()
                {
                    closeModal();
                    talkTo(a);
                } },
                { t: '🎁 ' + ITEMS[sl.id].name + ' 선물', cls: 'blue', cb: function ()
                {
                    closeModal();
                    giveGift(a.id, S.sel);
                    UI.lastHudKey = '';
                } },
                { t: '취소', cls: 'gray', cb: closeModal }
            ]);
        }
        else
        {
            talkTo(a);
        }
        return;
    }

    var f = facingTile();
    var here = { x: Math.floor(S.px / TILE), y: Math.floor(S.py / TILE) };

    // pick up drops / forage under and around the player
    if (pickupNear())
    {
        return;
    }

    // crop harvest
    var c = cropAt(MAP.id, f.x, f.y) || cropAt(MAP.id, here.x, here.y);
    if (c && cropReady(c))
    {
        var cx = cropAt(MAP.id, f.x, f.y) ? f.x : here.x;
        var cy = cropAt(MAP.id, f.x, f.y) ? f.y : here.y;
        harvestCrop(cx, cy);
        UI.lastHudKey = '';
        return;
    }

    var o = objAt(MAP, f.x, f.y) || objAt(MAP, here.x, here.y);
    if (o)
    {
        if (interactObject(o))
        {
            return;
        }
    }

    // fishing from the shore
    if (isWater(MAP, f.x, f.y))
    {
        var sl2 = selSlot();
        if (sl2 && sl2.id === 'rod')
        {
            startFishing(f.x, f.y);
        }
        else if (S.rod >= 0)
        {
            toast('낚싯대를 손에 드세요.');
        }
        return;
    }

    // interior specials
    if (!MAP.outdoor && MAP.interior)
    {
        if (MAP.interior.shop && nearFurniture('counter', f))
        {
            openShop(MAP.interior.shop);
            return;
        }
        if (MAP.interior.bundleRoom)
        {
            openBundles();
            return;
        }
        if (MAP.interior.museum)
        {
            openMuseum();
            return;
        }
        if (MAP.interior.heal)
        {
            modalChoice('해비 병원', '치료를 받을까요? (100G)', [
                { t: '치료 받기', cb: function ()
                {
                    if (S.gold < 100)
                    {
                        toast('골드가 부족해요.');
                        return;
                    }
                    S.gold -= 100;
                    S.health = S.maxHealth;
                    S.energy = Math.min(S.maxEnergy, S.energy + 80);
                    closeModal();
                    toast('몸이 가벼워졌어요!');
                    UI.lastHudKey = '';
                } },
                { t: '아니요', cls: 'gray', cb: closeModal }
            ]);
            return;
        }
        if (MAP.interior.guild)
        {
            openShop('clint');
            return;
        }
    }
}

function nearFurniture(kind, f)
{
    var i;
    for (i = 0; i < MAP.objects.length; i++)
    {
        var o = MAP.objects[i];
        if (o.kind === 'furn' && o.fk === kind)
        {
            if (Math.abs(o.x - f.x) <= 5 && Math.abs(o.y - f.y) <= 3)
            {
                return true;
            }
        }
    }
    return false;
}

function pickupNear()
{
    var here = { x: Math.floor(S.px / TILE), y: Math.floor(S.py / TILE) };
    var f = facingTile();
    var spots = [here, f,
        { x: here.x + 1, y: here.y }, { x: here.x - 1, y: here.y },
        { x: here.x, y: here.y + 1 }, { x: here.x, y: here.y - 1 }];
    var i;
    for (i = 0; i < spots.length; i++)
    {
        var o = objAt(MAP, spots[i].x, spots[i].y);
        if (!o)
        {
            continue;
        }
        if (o.kind === 'drop')
        {
            give(o.item, 1, o.q);
            removeObj(MAP, o);
            sfx('pickup');
            UI.lastHudKey = '';
            return true;
        }
        if (o.kind === 'forage')
        {
            var q = hasProf('botanist') ? 3 : (Math.random() < skillLvl('foraging') * .05 ? 1 : 0);
            var n = hasProf('gatherer') && Math.random() < .2 ? 2 : 1;
            give(o.item, n, q);
            addXp('foraging', 7);
            removeObj(MAP, o);
            sfx('pickup');
            UI.lastHudKey = '';
            return true;
        }
        if (o.kind === 'branch')
        {
            give('wood', 2);
            removeObj(MAP, o);
            sfx('pickup');
            UI.lastHudKey = '';
            return true;
        }
    }
    return false;
}

function interactObject(o)
{
    if (o.kind === 'bin')
    {
        openShipBin();
        return true;
    }
    if (o.kind === 'board')
    {
        modalMsg('게시판', '오늘의 날씨: ' + WEATHER_KR[S.weather] + '\n내일 날씨: ' + WEATHER_KR[S.tomorrow] +
            '\n\n오늘의 운세: ' + luckText());
        return true;
    }
    if (o.kind === 'sign')
    {
        toast(o.text || '표지판');
        return true;
    }
    if (o.kind === 'machine')
    {
        openMachine(o);
        return true;
    }
    if (o.kind === 'fruittree')
    {
        if (!o.fruit)
        {
            var def = FRUIT_TREES[o.sap];
            toast(o.stage >= 4 ? (SEASON_KR[def.season] + '에 열매가 열려요.')
                : ('자라는 중... ' + Math.max(1, 28 - (o.age || 0)) + '일 남음'));
            return true;
        }
        var q = Math.random() < skillLvl('farming') * .04 ? 1 : 0;
        give(FRUIT_TREES[o.sap].fruit, o.fruit, q);
        addXp('foraging', o.fruit * 5);
        o.fruit = 0;
        sfx('harvest');
        UI.lastHudKey = '';
        return true;
    }
    if (o.kind === 'crabpot')
    {
        if (o.out)
        {
            give(o.out, 1);
            addXp('fishing', 5);
            toast(ITEMS[o.out].name + '을(를) 건졌어요!');
            o.out = null;
            sfx('pickup');
            UI.lastHudKey = '';
        }
        else if (!o.baited)
        {
            if (invCount('bait') < 1)
            {
                toast('미끼가 필요해요. (윌리 가게)');
                return true;
            }
            removeItem('bait', 1);
            o.baited = true;
            toast('미끼를 넣었어요. 내일 확인해 보세요.');
            UI.lastHudKey = '';
        }
        else
        {
            toast('미끼를 넣어뒀어요. 내일 확인해 보세요.');
        }
        return true;
    }
    if (o.kind === 'chest')
    {
        openChest(o);
        return true;
    }
    if (o.kind === 'animalbuilding')
    {
        openAnimalHouse(o.bid);
        return true;
    }
    if (o.kind === 'mine_down')
    {
        mineDescend();
        return true;
    }
    if (o.kind === 'mine_up')
    {
        mineAscend();
        return true;
    }
    if (o.kind === 'elevator')
    {
        openElevator();
        return true;
    }
    if (o.kind === 'minechest')
    {
        openMineChest(o);
        return true;
    }
    if (o.kind === 'mine_entrance')
    {
        fadeOut(function ()
        {
            enterMine(1);
        });
        return true;
    }
    if (o.kind === 'furn')
    {
        if (o.fk === 'bed')
        {
            askSleep();
            return true;
        }
        if (o.fk === 'kitchen')
        {
            openCraft('cook');
            return true;
        }
        if (o.fk === 'tv')
        {
            watchTv();
            return true;
        }
        if (o.fk === 'calendar')
        {
            showCalendar();
            return true;
        }
        if (o.fk === 'chest')
        {
            openCraft('craft');
            return true;
        }
        if (o.fk === 'counter' && MAP.interior && MAP.interior.shop)
        {
            openShop(MAP.interior.shop);
            return true;
        }
        if (o.fk === 'forge')
        {
            openShop('clint');
            return true;
        }
    }
    return false;
}

function luckText()
{
    if (S.luck > .5)
    {
        return '별들이 활짝 웃고 있어요! 아주 운이 좋은 날입니다.';
    }
    if (S.luck > .1)
    {
        return '기분 좋은 하루가 될 것 같아요.';
    }
    if (S.luck > -.3)
    {
        return '평범한 하루예요.';
    }
    return '별들이 흐릿해요. 광산은 조심하세요.';
}

function watchTv()
{
    var tips = [
        '오늘의 요리: 재료를 모아 부엌에서 요리해 보세요!',
        '물고기는 계절·시간·날씨에 따라 다르게 나옵니다.',

        '나무를 다 베면 그루터기가 남아요. 도끼로 한 번 더!',
