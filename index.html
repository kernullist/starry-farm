            var col = ['#e6dcc8', '#c9a882', '#b09468'][(variant + i) % 3];
            pe(g, sx + 1, sy + 1, 2, 1, col);
            pr(g, sx, sy + 2, 3, 1, tone(col, -1.6));
        }
    });
}

function tileWater(frame, deep, variant)
{
    variant = variant || 0;
    return bake('t:water:' + frame + ':' + (deep ? 1 : 0) + ':' + variant, TILE, TILE, function (g)
    {
        // banding at fixed rows plus one shared tile made a lake read as
        // corduroy. every feature is now offset by a per-position variant.
        var base = deep ? '#1c4a76' : '#2e77b2';
        pr(g, 0, 0, TILE, TILE, base);
        var i;
        for (i = 0; i < 3; i++)
        {
            var px2 = Math.floor(hash2(variant, i, 193) * TILE) - 4;
            var py2 = Math.floor(hash2(i, variant, 197) * TILE) - 4;
            dither(g, Math.max(0, px2), Math.max(0, py2), 12, 9,
                tone(base, i % 2 ? -.8 : .7), base, .45);
        }
        // scrolling caustics: bright crest, dark trough underneath
        for (i = 0; i < 4; i++)
        {
            var y = (Math.floor(hash2(i, variant, 199) * TILE) + frame * 4) % TILE;
            var w = 7 + Math.floor(hash2(variant, i, 211) * 11);
            var x = (Math.floor(hash2(variant, i, 223) * TILE) + frame * 6) % TILE;
            var ww = Math.min(w, TILE - x);
            pr(g, x, y, ww, 1, tone(base, 2.2));
            pr(g, x + 1, y + 1, Math.max(1, ww - 2), 1, tone(base, 1.1));
            pr(g, x + 2, y + 2, Math.max(1, ww - 4), 1, tone(base, -1.6));
            if (ww < w)
            {
                pr(g, 0, y, w - ww, 1, tone(base, 2.2));
                pr(g, 0, y + 1, Math.max(1, w - ww - 1), 1, tone(base, 1.1));
            }
        }
        // specular sparkles, only on some tiles so the surface is not uniform
        if (hash2(variant, 7, 227) > .45)
        {
            var sx = (frame * 9 + variant * 5 + 3) % (TILE - 4);
            var sy = Math.floor(hash2(variant, 9, 229) * (TILE - 6));
            pr(g, sx, sy, 3, 1, 'rgba(255,255,255,.62)');
            pr(g, sx + 1, sy + 1, 1, 1, 'rgba(255,255,255,.4)');
            pr(g, (sx + 17) % (TILE - 4), (sy + 15) % (TILE - 2), 4, 1, 'rgba(255,255,255,.45)');
        }
    });
}

function tileStoneFloor(variant, col, style)
{
    variant = variant || 0;
    col = col || '#ab9b83';
    style = style || 'flag';
    return bake('t:sfloor:' + variant + ':' + col + ':' + style, TILE, TILE, function (g)
    {
        if (style === 'checker')
        {
            drawCheckerFloor(g, col, variant);
            return;
        }
        // warm irregular flagstones. slab tones stay close together on purpose:
        // a big tone gap here reads as a chessboard, not as paving.
        var base = col;
        pr(g, 0, 0, TILE, TILE, tone(base, -1.8));
        // four flagstone layouts so a plaza does not read as graph paper
        var sets = [
            [[1, 1, 17, 13], [19, 1, 12, 13], [1, 15, 12, 16], [14, 15, 17, 9], [14, 25, 17, 6]],
            [[1, 1, 11, 15], [13, 1, 18, 9], [13, 11, 18, 12], [1, 17, 15, 14], [17, 24, 14, 7]],
            [[1, 1, 20, 9], [22, 1, 9, 16], [1, 11, 12, 12], [14, 18, 17, 13], [1, 24, 12, 7]],
            [[1, 1, 14, 11], [16, 1, 15, 14], [1, 13, 9, 18], [11, 13, 10, 9], [11, 23, 20, 8], [22, 16, 9, 6]]
        ];
        var slabs = sets[variant % sets.length];
        var i;
        for (i = 0; i < slabs.length; i++)
        {
            var s = slabs[i];
            var c = tone(base, (i % 3 === 0) ? .18 : ((i % 3 === 1) ? -.16 : 0));
            pr(g, s[0], s[1], s[2], s[3], c);
            pr(g, s[0], s[1], s[2], 1, tone(c, 1));
            pr(g, s[0], s[1], 1, s[3], tone(c, .7));
            pr(g, s[0], s[1] + s[3] - 1, s[2], 1, tone(c, -1.4));
            pr(g, s[0] + s[2] - 1, s[1], 1, s[3], tone(c, -1.1));
            crumbs(g, s[0] + 2, s[1] + 2, s[2] - 4, s[3] - 4, [tone(c, -.9), tone(c, .9)], 5, i * 7 + 3);
        }
    });
}

function tileWoodFloor(variant, col)
{
    variant = variant || 0;
    col = col || '#b07f4a';
    return bake('t:wfloor:' + variant + ':' + col, TILE, TILE, function (g)
    {
        // A 2px dark seam every 8px, plus an end joint in every row, turned a
        // wooden floor into brickwork lying on its side. Boards are wider, the
        // seams are one soft pixel, and most tiles carry no end joint at all.
        var base = col;
        pr(g, 0, 0, TILE, TILE, base);
        var y, row = 0;
        for (y = 0; y < TILE; y += 8)
        {
            var c = tone(base, ((row + variant) % 3 === 0) ? .25 : (((row + variant) % 3 === 1) ? -.18 : .05));
            pr(g, 0, y, TILE, 8, c);
            pr(g, 0, y, TILE, 1, tone(c, .8));
            pr(g, 0, y + 7, TILE, 1, tone(c, -1.2));
            // grain: long, low contrast, positioned per tile so it does not rhyme
            pr(g, Math.floor(hash2(row, variant, 401) * TILE) - 6, y + 2,
                14 + Math.floor(hash2(variant, row, 403) * 12), 1, tone(c, -.55));
            pr(g, Math.floor(hash2(variant, row, 407) * TILE) - 4, y + 5,
                10 + Math.floor(hash2(row, variant, 409) * 10), 1, tone(c, .5));
            row++;
        }
        // at most one board end per tile, and only on some tiles
        if (hash2(variant, 5, 411) > .55)
        {
            var jr = Math.floor(hash2(variant, 7, 413) * 4);
            var ex = 3 + Math.floor(hash2(7, variant, 417) * 26);
            pr(g, ex, jr * 8 + 1, 1, 6, tone(base, -1.6));
            pr(g, ex + 1, jr * 8 + 1, 1, 6, tone(base, .7));
        }
    });
}

function tileCarpet(variant, col)
{
    variant = variant || 0;
    col = col || '#6a4a8a';
    return bake('t:carpet:' + variant + ':' + col, TILE, TILE, function (g)
    {
        var base = col;
        pr(g, 0, 0, TILE, TILE, base);
        dither(g, 0, 0, TILE, TILE, base, tone(base, -.6), .4);
        // woven pile: short diagonal strokes, not noise
        var i;
        for (i = 0; i < 22; i++)
        {
            var x = Math.floor(hash2(i, variant, 83) * TILE);
            var y = Math.floor(hash2(variant, i, 89) * TILE);
            pr(g, x, y, 2, 1, tone(base, i % 3 === 0 ? 1.1 : -1));
            pr(g, x + 1, y + 1, 1, 1, tone(base, .5));
        }
        // faint damask lattice
        for (i = 0; i < TILE; i += 8)
        {
            pr(g, i + (variant % 2) * 4, 0, 1, TILE, tone(base, .7));
            pr(g, 0, i + (variant % 2) * 4, TILE, 1, tone(base, .7));
        }
    });
}

function tilePath(variant)
{
    variant = variant || 0;
    return bake('t:path:' + variant, TILE, TILE, function (g)
    {
        var base = '#a68c66';
        pr(g, 0, 0, TILE, TILE, base);
        dither(g, 0, 0, TILE, TILE, base, tone(base, -1), .45);
        // pressed gravel: many small stones, a few larger ones
        var i;
        for (i = 0; i < 14; i++)
        {
            var x = 1 + Math.floor(hash2(i, variant + 3, 31) * 28);
            var y = 1 + Math.floor(hash2(variant + 3, i, 37) * 28);
            var w = 3 + Math.floor(hash2(i, variant, 41) * 5);
            var h = 2 + Math.floor(hash2(i, variant, 43) * 3);
            var c = tone(base, i % 3 === 0 ? 1.3 : (i % 3 === 1 ? -1.2 : .4));
            pe(g, x + w / 2, y + h / 2, w / 2, h / 2, c);
            pr(g, x + 1, y, w - 2, 1, tone(c, 1.4));
            pr(g, x, y + h, w, 1, tone(c, -1.8));
        }
        crumbs(g, 0, 0, TILE, TILE, [tone(base, 1.6), tone(base, -1.9), tone(base, -2.6)], 26, 53 + variant);
        // wheel ruts, but broken into segments -- a rut running the full tile
        // height turns a long path into woven fabric once the tile repeats
        var seg;
        for (seg = 0; seg < 3; seg++)
        {
            var sy = seg * 11 + (variant % 4);
            var sh = 5 + Math.floor(hash2(seg, variant, 91) * 5);
            if (hash2(seg, variant, 93) > .3)
            {
                pr(g, 6 + Math.floor(hash2(seg, variant, 95) * 3), sy, 2, sh, tone(base, -.7));
            }
            if (hash2(seg, variant, 97) > .3)
            {
                pr(g, 21 + Math.floor(hash2(seg, variant, 99) * 3), sy, 2, sh, tone(base, -.7));
            }
        }
    });
}

function tileCave(floor, variant)
{
    variant = variant || 0;
    return bake('t:cave:' + floor + ':' + variant, TILE, TILE, function (g)
    {
        // lighter than the walls so the walkable area reads at a glance
        var skull = floor >= 100;
        var base = floor < 40 ? '#75604a' : (floor < 80 ? '#5a6c80' : (skull ? '#6b4a52' : '#74463c'));
        pr(g, 0, 0, TILE, TILE, base);
        var i;
        for (i = 0; i < 2; i++)
        {
            var bx = Math.floor(hash2(variant, i, 311) * TILE) - 6;
            var by = Math.floor(hash2(i, variant, 313) * TILE) - 6;
            pe(g, bx + 9, by + 7, 10, 7, tone(base, -.9));
            dither(g, Math.max(0, bx), Math.max(0, by), 18, 14, tone(base, -.9), base, .5);
        }
        crumbs(g, 0, 0, TILE, TILE, [tone(base, 1.5), tone(base, -1.5), tone(base, -2.3)], 26, floor + variant);
        // embedded pebbles
        for (i = 0; i < 4; i++)
        {
            var x = 2 + Math.floor(hash2(i, variant, 61) * 27);
            var y = 2 + Math.floor(hash2(variant, i, 67) * 27);
            var w = 3 + Math.floor(hash2(i, i, variant) * 3);
            pe(g, x + w / 2, y + 1, w / 2, 2, tone(base, -1.2));
            pr(g, x, y - 1, w, 1, tone(base, 1.4));
        }
        // faint cracks
        pr(g, 6 + (variant % 5) * 4, 4, 1, 9, tone(base, -1.8));
        pr(g, 20 - (variant % 4) * 3, 19, 1, 8, tone(base, -1.8));
        if (skull)
        {
            // glowing lava seams so the skull cavern floor is unmistakable
            var lx = 3 + (variant % 4) * 7;
            var ly = 8 + (variant % 3) * 7;
            pr(g, lx, ly, 12, 2, '#8a2a1a');
            pr(g, lx + 1, ly, 10, 1, '#e05a24');
            pr(g, lx + 3, ly, 5, 1, '#ffb050');
            pr(g, lx + 14, ly + 5, 9, 2, '#8a2a1a');
            pr(g, lx + 15, ly + 5, 7, 1, '#e05a24');
            pr(g, 2, 26, 8, 2, '#7a2416');
            pr(g, 3, 26, 6, 1, '#c8481e');
        }
        else if (floor >= 80)
        {
            pr(g, 4 + (variant % 5) * 5, 22, 8, 1, '#7a3018');
            pr(g, 5 + (variant % 5) * 5, 22, 5, 1, '#c8501e');
        }
    });
}

function tileCaveWall(floor, variant)
{
    variant = variant || 0;
    return bake('t:cavew:' + floor + ':' + variant, TILE, TILE, function (g)
    {
        // skull cavern walls go much darker than the floor so the two never blend
        var skullW = floor >= 100;
        var base = floor < 40 ? '#4a3c2c' : (floor < 80 ? '#3a4a5c' : (skullW ? '#33212a' : '#4d2c22'));
        pr(g, 0, 0, TILE, TILE, tone(base, -1.6));
        // four block layouts, picked per tile so the wall does not tile visibly
        var sets = [
            [[0, 0, 14, 11], [14, 0, 18, 8], [0, 11, 9, 12], [9, 8, 13, 10], [22, 8, 10, 14], [0, 23, 16, 9], [16, 22, 16, 10]],
            [[0, 0, 11, 9], [11, 0, 21, 12], [0, 9, 17, 11], [17, 12, 15, 9], [0, 20, 12, 12], [12, 21, 20, 11]],
            [[0, 0, 19, 13], [19, 0, 13, 9], [19, 9, 13, 12], [0, 13, 10, 10], [10, 13, 9, 8], [0, 23, 19, 9], [10, 21, 9, 11]],
            [[0, 0, 15, 8], [15, 0, 17, 14], [0, 8, 8, 13], [8, 8, 7, 12], [0, 21, 14, 11], [14, 14, 18, 8], [14, 22, 18, 10]]
        ];
        var blocks = sets[variant % sets.length];
        var i;
        for (i = 0; i < blocks.length; i++)
        {
            var b = blocks[i];
            var c = tone(base, ((i + floor + variant) % 3 === 0) ? .8 : ((i + floor + variant) % 3 === 1) ? -.7 : 0);
            pr(g, b[0] + 1, b[1] + 1, b[2] - 2, b[3] - 2, c);
            pr(g, b[0] + 1, b[1] + 1, b[2] - 2, 2, tone(c, 1.5));
            pr(g, b[0] + 1, b[1] + 1, 2, b[3] - 2, tone(c, 1));
            pr(g, b[0] + 1, b[1] + b[3] - 3, b[2] - 2, 2, tone(c, -1.9));
            pr(g, b[0] + b[2] - 3, b[1] + 1, 2, b[3] - 2, tone(c, -1.4));
            crumbs(g, b[0] + 3, b[1] + 3, Math.max(2, b[2] - 6), Math.max(2, b[3] - 6),
                [tone(c, -1.3), tone(c, 1.2)], 4, i * 5 + floor + variant);
        }
        pr(g, 0, TILE - 3, TILE, 3, tone(base, -2.4));
        if (floor >= 80)
        {
            // ember rim light along the bottom edge, as if lava lies below
            pr(g, 0, TILE - 4, TILE, 1, 'rgba(226,90,36,.5)');
            pr(g, 0, TILE - 3, TILE, 1, 'rgba(180,60,24,.35)');
            var ei;
            for (ei = 0; ei < 3; ei++)
            {
                pr(g, ((variant * 9 + ei * 11) % (TILE - 3)), TILE - 6, 2, 2, 'rgba(255,140,60,.45)');
            }
        }
    });
}

function tileSnowIce()
{
    return bake('t:ice', TILE, TILE, function (g)
    {
        var base = '#bcd8ea';
        dither(g, 0, 0, TILE, TILE, base, tone(base, .8), .4);
        pr(g, 4, 7, 11, 1, '#eaf5fc');
        pr(g, 18, 19, 10, 1, '#eaf5fc');
        pr(g, 10, 24, 9, 1, tone(base, -1.2));
        pr(g, 22, 9, 6, 1, tone(base, -1.2));
    });
}


// ---------- interior walls ----------
// Interiors were flat colour blocks. Each room now gets a papered wall with a
// pattern, a lit top rail and a skirting board where it meets the floor.

function tileWall(col, paper, variant, bottom)
{
    return bake('t:wall:' + col + ':' + paper + ':' + variant + ':' + (bottom ? 1 : 0), TILE, TILE, function (g)
    {
        pr(g, 0, 0, TILE, TILE, col);
        pr(g, 0, 0, TILE, 2, tone(col, 1.4));
        var i, j;
        if (paper === 'stripe')
        {
            for (i = 2; i < TILE; i += 6)
            {
                pr(g, i, 0, 2, TILE, tone(col, -.7));
                pr(g, i + 2, 0, 1, TILE, tone(col, .6));
            }
        }
        else if (paper === 'floral')
        {
            for (j = 0; j < 2; j++)
            {
                for (i = 0; i < 2; i++)
                {
                    var fx = 8 + i * 16 + (j % 2) * 8, fy = 8 + j * 16;
                    var k;
                    for (k = 0; k < 4; k++)
                    {
                        var a = k * 1.571;
                        pr(g, fx + Math.round(Math.cos(a) * 3), fy + Math.round(Math.sin(a) * 3), 2, 2, tone(col, -1.1));
                    }
                    pr(g, fx, fy, 2, 2, tone(col, 1.6));
                }
            }
        }
        else if (paper === 'plank')
        {
            for (i = 0; i < TILE; i += 8)
            {
                pr(g, i, 0, 7, TILE, tone(col, (i / 8) % 2 ? -.5 : .3));
                pr(g, i, 0, 1, TILE, tone(col, 1));
                pr(g, i + 7, 0, 1, TILE, tone(col, -1.7));
            }
        }
        else if (paper === 'brick')
        {
            for (j = 0; j < TILE; j += 8)
            {
                var off = ((j / 8) % 2) * 8;
                for (i = -off; i < TILE; i += 16)
                {
                    pr(g, i + 1, j + 1, 14, 6, tone(col, ((i + j) % 3 === 0) ? .5 : -.4));
                    pr(g, i + 1, j + 1, 14, 1, tone(col, 1.2));
                }
                pr(g, 0, j + 7, TILE, 1, tone(col, -1.8));
            }
        }
        else if (paper === 'tile')
        {
            for (j = 0; j < TILE; j += 8)
            {
                for (i = 0; i < TILE; i += 8)
                {
                    pr(g, i + 1, j + 1, 6, 6, tone(col, ((i + j) / 8) % 2 ? .5 : -.3));
                    pr(g, i + 1, j + 1, 6, 1, tone(col, 1.3));
                }
            }
        }
        else
        {
            crumbs(g, 0, 0, TILE, TILE, [tone(col, .6), tone(col, -.6)], 10, variant);
        }
        // A flat slab of one colour reads as the same plane as the floor.
        // Light falls off down the wall, which is what says "this is vertical".
        var sh;
        for (sh = 0; sh < 4; sh++)
        {
            g.globalAlpha = .05 + sh * .035;
            pr(g, 0, TILE - 12 + sh * 3, TILE, 3, '#1a1830');
            g.globalAlpha = 1;
        }
        // top rail
        pr(g, 0, 0, TILE, 3, tone(col, 1.5));
        pr(g, 0, 3, TILE, 1, tone(col, -1.4));
        if (bottom)
        {
            // skirting board: a real trim colour, not just a darker wall, so it
            // reads at any wallpaper brightness
            pr(g, 0, TILE - 9, TILE, 6, tone(col, -2.2));
            pr(g, 0, TILE - 9, TILE, 1, tone(col, .4));
            pr(g, 0, TILE - 4, TILE, 1, tone(col, -3.2));
            pr(g, 0, TILE - 3, TILE, 3, tone(col, -3.6));
        }
    });
}

function sprRug(kind)
{
    return bake('rug:' + kind, TILE * 3, TILE * 2, function (g)
    {
        var pal = {
            red: ['#a84a48', '#d8746a', '#f0d8a8'],
            blue: ['#3f6a9a', '#6a9ac8', '#e8e8f0'],
            green: ['#4a7a4a', '#7aaa6a', '#e8e0c0'],
            purple: ['#6a4a8a', '#9a7ab8', '#f0e0f0']
        }[kind] || ['#a84a48', '#d8746a', '#f0d8a8'];
        var W = TILE * 3, H = TILE * 2;
        pr(g, 2, 2, W - 4, H - 4, pal[0]);
        pr(g, 2, 2, W - 4, 2, tone(pal[0], 1.2));
        pr(g, 2, H - 4, W - 4, 2, tone(pal[0], -1.6));
        pr(g, 8, 8, W - 16, H - 16, pal[1]);
        pr(g, 14, 14, W - 28, H - 28, pal[2]);
        pr(g, 20, 20, W - 40, H - 40, pal[1]);
        var i;
        for (i = 0; i < W; i += 4)
        {
            pr(g, i, 0, 2, 2, pal[2]);
            pr(g, i, H - 2, 2, 2, pal[2]);
        }
    });
}

// ---------- trees ----------

var TREE_W = 96, TREE_H = 128;

// lit: draw the highlight. A bright dot in the middle of every clump made any
// two clumps at the same height read as a pair of eyes, so the highlight is a
// crescent along the upper-left arc and only clumps facing the light get one.
function leafClump(g, cx, cy, r, col, lit)
{
    pe(g, cx, cy, r, r * .88, tone(col, -1.4));
    pe(g, cx, cy - r * .12, r - 1, r * .8, col);
    pe(g, cx + r * .3, cy + r * .28, r * .58, r * .44, tone(col, -.8));
    if (lit === false)
    {
        return;
    }
    // carve a crescent: lighter ellipse, then the base colour shaved off it
    pe(g, cx - r * .26, cy - r * .3, r * .66, r * .5, tone(col, 1.05));
    pe(g, cx - r * .4, cy - r * .48, r * .56, r * .4, col);
    pe(g, cx - r * .5, cy - r * .34, r * .2, r * .13, tone(col, 1.7));
}

function sprTree(kind, stage, season, variant)
{
    variant = (stage >= 3 ? (variant || 0) % 4 : 0);
    var key = 'tree:' + kind + ':' + stage + ':' + season + ':' + variant;
    return bake(key, TREE_W, TREE_H, function (g)
    {
        var leafCol = {
            oak: { spring: '#4f9a3a', summer: '#3a8a2b', fall: '#c8742a', winter: null },
            maple: { spring: '#66aa42', summer: '#4f9a32', fall: '#d0562a', winter: null },
            pine: { spring: '#2f6f3f', summer: '#2a6538', fall: '#2f6a3c', winter: '#35624a' }
        }[kind][season];
        var trunk = '#6d4a2c';
        var cx = TREE_W / 2, groundY = TREE_H - 6;

        if (stage >= 3)
        {
            castShadow(g, cx + 8, groundY - 2, 26, 20);
        }
        contactShadow(g, cx, groundY + 1, stage < 2 ? 7 : 18, stage < 2 ? 3 : 6);

        if (stage === 0)
        {
            pr(g, cx - 1, groundY - 10, 2, 10, trunk);
            pr(g, cx - 1, groundY - 10, 1, 10, tone(trunk, 1));
            if (leafCol)
            {
                leafClump(g, cx - 3, groundY - 12, 4, leafCol);
                leafClump(g, cx + 3, groundY - 14, 4, leafCol);
            }
            return;
        }
        if (stage === 1)
        {
            pr(g, cx - 2, groundY - 22, 4, 22, trunk);
            pr(g, cx - 2, groundY - 22, 1, 22, tone(trunk, 1));
            pr(g, cx + 1, groundY - 22, 1, 22, tone(trunk, -1.3));
            leafClump(g, cx - 6, groundY - 26, 7, leafCol || '#5d6a5a');
            leafClump(g, cx + 6, groundY - 29, 7, leafCol || '#5d6a5a');
            leafClump(g, cx, groundY - 34, 8, leafCol || '#5d6a5a');
            return;
        }
        if (stage === 2)
        {
            drawTrunk(g, cx, groundY, 42, 7, trunk);
            var r2 = 15;
            leafClump(g, cx - 11, groundY - 46, r2, leafCol || '#5d6a5a');
            leafClump(g, cx + 11, groundY - 49, r2, leafCol || '#5d6a5a');
            leafClump(g, cx, groundY - 58, r2 + 2, leafCol || '#5d6a5a');
            return;
        }

        // full grown
        var th = stage === 4 ? 60 : 50;
        drawTrunk(g, cx, groundY, th, stage === 4 ? 11 : 9, trunk);

        if (kind === 'pine')
        {
            drawPine(g, cx, groundY, stage, leafCol, variant);
            return;
        }
        if (!leafCol)
        {
            drawBareBranches(g, cx, groundY, th, trunk, season === 'winter');
            return;
        }
        drawCanopy(g, cx, groundY - th + 6, stage === 4 ? 34 : 28, leafCol, kind, season, variant);
    }, { outline: true });
}

function drawTrunk(g, cx, groundY, h, w, trunk)
{
    var top = groundY - h;
    pr(g, cx - w / 2, top, w, h, trunk);
    pr(g, cx - w / 2, top, 2, h, tone(trunk, 1.2));
    pr(g, cx + w / 2 - 3, top, 3, h, tone(trunk, -1.4));
    pr(g, cx + w / 2 - 1, top, 1, h, tone(trunk, -2.1));
    // bark marks
    var i;
    for (i = 0; i < Math.floor(h / 9); i++)
    {
        var by = top + 5 + i * 9;
        var bx = cx - w / 2 + 2 + (i % 2) * 3;
        pr(g, bx, by, 3, 1, tone(trunk, -1.7));
        pr(g, bx, by + 1, 2, 1, tone(trunk, .9));
    }
    // root flare
    pr(g, cx - w / 2 - 4, groundY - 5, w + 8, 5, trunk);
    pr(g, cx - w / 2 - 6, groundY - 3, w + 12, 3, trunk);
    pr(g, cx - w / 2 - 6, groundY - 3, 3, 3, tone(trunk, 1));
    pr(g, cx - w / 2 - 6, groundY - 1, w + 12, 1, tone(trunk, -2.2));
    pr(g, cx + w / 2, groundY - 5, 4, 5, tone(trunk, -1.5));
}

function drawCanopy(g, cx, cy, r, col, kind, season, variant)
{
    variant = variant || 0;
    // base mass, then clumps so the silhouette stays lumpy instead of circular.
    // every offset is jittered per variant: with one fixed table every tree in
    // the forest was the same stamp, and the clump highlights read as a face.
    var sq = 1 + (hash2(variant, 1, 251) - .5) * .34;
    var base = [
        [0, 4, 1.0], [-.62, -.1, .72], [.6, -.05, .74],
        [-.38, -.55, .66], [.36, -.58, .62], [0, -.72, .6],
        [-.72, .38, .5], [.68, .42, .52], [0, .5, .66]
    ];
    var keep = 7 + Math.floor(hash2(variant, 2, 257) * 3);
    var pts = [], i;
    for (i = 0; i < base.length && i < keep; i++)
    {
        pts.push([
            r * (base[i][0] + (hash2(variant, i, 263) - .5) * .3),
            r * (base[i][1] + (hash2(i, variant, 269) - .5) * .3) * sq,
            base[i][2] * (.86 + hash2(variant, i + 9, 271) * .3)
        ]);
    }
    for (i = 0; i < pts.length; i++)
    {
        var p = pts[i];
        pe(g, cx + p[0], cy + p[1], r * p[2], r * p[2] * .9, tone(col, -1.5));
    }
    for (i = 0; i < pts.length; i++)
    {
        var q = pts[i];
        // light comes from the top-left, so only clumps up there catch it
        leafClump(g, cx + q[0], cy + q[1], Math.max(4, r * q[2] * .82), col,
            (q[0] <= r * .12 && q[1] <= r * .16));
    }
    // gaps between clumps read as depth
    for (i = 0; i < 3; i++)
    {
        var gx = cx + r * (hash2(variant, i, 277) - .5) * 1.2;
        var gy = cy + r * (hash2(i, variant, 281) - .4) * .9;
        pr(g, gx, gy, 3 + Math.floor(hash2(i, variant, 283) * 3),
            4 + Math.floor(hash2(variant, i, 287) * 4), tone(col, -2.2));
    }
    // ragged leaf edge
    for (i = 0; i < 18; i++)
    {
        var a = (i / 18) * Math.PI * 2 + variant * .4;
        var rr = r * (.92 + hash2(i, variant + 3, 7) * .16);
        var lx = cx + Math.cos(a) * rr;
        var ly = cy + Math.sin(a) * rr * .92;
        var c = (a > 2.2 && a < 5.4) ? tone(col, -1.8) : tone(col, hash2(i, 5, 9) > .5 ? 1.4 : .3);
        pr(g, lx, ly, 2, 2, c);
    }
    if (season === 'fall')
    {
        pr(g, cx - r * .8, cy + r * .8, 2, 2, '#e08c38');
        pr(g, cx + r * .7, cy + r * .9, 2, 2, '#c0641f');
        pr(g, cx - r * .2, cy + r, 2, 2, '#e0a040');
    }
}

function drawPine(g, cx, groundY, stage, col, variant)
{
    variant = variant || 0;
    // The old version stacked separate triangles, which left gaps between the
    // layers and read as a pile of paper cutouts with a floating spike on top.
    // Now: one continuous cone silhouette, with skirt shadows and drooping
    // needle tips drawn on top of it, so nothing can come apart.
    var bottom = groundY - 12;
    var top = groundY - (stage === 4 ? 108 : 86);
    var botW = (stage === 4 ? 29 : 24) + Math.round((hash2(variant, 6, 311) - .5) * 7);
    var lean = (hash2(variant, 4, 293) - .5) * 9;
    var taper = .72 + hash2(variant, 8, 313) * .22;
    var span = bottom - top;
    var y, t, w, ax;
    for (y = top; y <= bottom; y++)
    {
        t = (y - top) / span;
        // jitter the silhouette so the edge reads as needles, not a ruled line
        w = Math.max(1, Math.round(botW * Math.pow(t, taper)
            + (hash2(y, variant, 307) - .5) * 2.6));
        ax = cx + lean * (1 - t);
        pr(g, ax - w, y, w * 2, 1, col);
        pr(g, ax - w, y, Math.max(1, Math.round(w * .42)), 1, tone(col, .85));
        pr(g, ax + Math.round(w * .5), y, Math.max(1, w - Math.round(w * .5)), 1, tone(col, -1.05));
    }
    var layers = stage === 4 ? 6 : 5;
    var i, d;
    for (i = 1; i <= layers; i++)
    {
        var ly = Math.round(top + span * (i / (layers + .35)));
        var lt = (ly - top) / span;
        var lw = Math.max(2, Math.round(botW * Math.pow(lt, taper)));
        var lx = cx + lean * (1 - lt);
        pr(g, lx - lw, ly, lw * 2, 1, tone(col, -2));
        pr(g, lx - lw + 1, ly + 1, lw * 2 - 2, 1, tone(col, -1.2));
        pr(g, lx - lw + 2, ly - 3, Math.round(lw * .85), 1, tone(col, 1.1));
        for (d = -lw; d <= lw; d += 4)
        {
            if (hash2(d + 40, variant * 3 + i, 301) < .3)
            {
                continue;
            }
            pr(g, lx + d, ly - 1, 2, 2 + Math.floor(hash2(d + 9, i + variant, 303) * 3),
                tone(col, -1.5));
        }
    }
    // crown: a short tapering spire welded to the cone, not floating above it
    for (y = top - 7; y < top + 2; y++)
    {
        w = Math.max(1, Math.round((y - (top - 8)) * .5));
        pr(g, cx + lean - w, y, w * 2, 1, col);
        pr(g, cx + lean - w, y, 1, 1, tone(col, 1.3));
    }
}

function drawBareBranches(g, cx, groundY, th, trunk, snowy)
{
    // Horizontal bars on both sides of a straight trunk read as a TV antenna.
    // Draw tapering limbs along real angles, each splitting once, so the
    // silhouette is a tree.
    var top = groundY - th;
    function limb(x0, y0, ang, len, w, depth)
    {
        var i, x = x0, y = y0;
        var dx = Math.cos(ang), dy = Math.sin(ang);
        for (i = 0; i < len; i++)
        {
            var ww = Math.max(1, Math.round(w * (1 - i / (len * 1.25))));
            x += dx;
            y += dy;
            pr(g, Math.round(x - ww / 2), Math.round(y), ww, 1, trunk);
            if (ww > 1)
            {
                pr(g, Math.round(x - ww / 2), Math.round(y), 1, 1, tone(trunk, 1));
            }
            if (snowy && i % 3 === 0 && dy < 0)
            {
                pr(g, Math.round(x - ww / 2), Math.round(y) - 1, Math.max(1, ww - 1), 1, '#eef6fc');
            }
        }
        if (depth > 0)
        {
            limb(x, y, ang - .5 - depth * .1, len * .62, w * .66, depth - 1);
            limb(x, y, ang + .42 + depth * .12, len * .55, w * .6, depth - 1);
        }
    }
    // main trunk continues above the drawn trunk into a leader
    pr(g, cx - 3, top - 16, 6, 22, trunk);
    pr(g, cx - 3, top - 16, 2, 22, tone(trunk, 1));
    limb(cx - 1, top + 4, -Math.PI * .78, 20, 5, 2);
    limb(cx + 1, top + 10, -Math.PI * .2, 19, 5, 2);
    limb(cx - 1, top + 18, -Math.PI * .86, 15, 4, 1);
    limb(cx + 1, top + 26, -Math.PI * .12, 14, 4, 1);
    limb(cx, top - 15, -Math.PI * .5, 12, 4, 1);
    if (snowy)
    {
        pr(g, cx - 3, top - 17, 6, 1, '#eef6fc');
    }
}

function sprFruitTree(saplingId, stage, fruit, season)
{
    var def = FRUIT_TREES[saplingId];
    var key = 'ftree:' + saplingId + ':' + stage + ':' + fruit + ':' + season;
    return bake(key, TREE_W, TREE_H, function (g)
    {
        var leaf = season === 'winter' ? null : (season === 'fall' ? '#c2833c' : '#42933a');
        var trunk = '#6d4a2c';
        var cx = TREE_W / 2, groundY = TREE_H - 6;
        contactShadow(g, cx, groundY + 1, stage < 2 ? 7 : 16, stage < 2 ? 3 : 5);

        if (stage === 0)
        {
            pr(g, cx - 1, groundY - 9, 2, 9, trunk);
            leafClump(g, cx, groundY - 12, 5, leaf || '#6a6a5a');
            return;
        }
        if (stage === 1)
        {
            pr(g, cx - 2, groundY - 20, 4, 20, trunk);
            leafClump(g, cx - 5, groundY - 24, 7, leaf || '#6a6a5a');
            leafClump(g, cx + 5, groundY - 26, 7, leaf || '#6a6a5a');
            return;
        }
        if (stage === 2)
        {
            drawTrunk(g, cx, groundY, 36, 6, trunk);
            leafClump(g, cx - 9, groundY - 42, 12, leaf || '#6a6a5a');
            leafClump(g, cx + 9, groundY - 44, 12, leaf || '#6a6a5a');
            leafClump(g, cx, groundY - 52, 13, leaf || '#6a6a5a');
            return;
        }
        var th = stage === 4 ? 52 : 44;
        drawTrunk(g, cx, groundY, th, stage === 4 ? 10 : 8, trunk);
        if (!leaf)
        {
            drawBareBranches(g, cx, groundY, th, trunk, season === 'winter');
            return;
        }
        drawCanopy(g, cx, groundY - th + 4, stage === 4 ? 28 : 24, leaf, 'oak', season);
        // hanging fruit
        var spots = [[-16, 10], [15, 16], [-2, -8], [-20, -6], [18, -2]];
        var i;
        for (i = 0; i < fruit && i < spots.length; i++)
        {
            var fx = cx + spots[i][0];
            var fy = groundY - th + 4 + spots[i][1];
            pr(g, fx, fy - 5, 1, 4, '#4a6a28');
            orb(g, fx, fy, 5, 5, def.col, 1.8);
        }
    }, { outline: true });
}

function sprStump()
{
    return bake('stump', TILE, TILE, function (g)
    {
        var w = '#6d4a2c';
        contactShadow(g, 16, 27, 11, 3);
        pr(g, 5, 12, 22, 14, w);
        pr(g, 5, 12, 3, 14, tone(w, 1.1));
        pr(g, 23, 12, 4, 14, tone(w, -1.4));
        pr(g, 5, 24, 22, 2, tone(w, -2));
        pe(g, 16, 13, 11, 5, tone(w, 1.4));
        pe(g, 16, 13, 8, 3, tone(w, .5));
        pe(g, 16, 13, 5, 2, tone(w, -.6));
        pe(g, 16, 13, 2, 1, tone(w, -1.6));
        pr(g, 4, 24, 24, 1, tone(w, -2.4));
    }, { outline: true });
}

function sprRock(kind)
{
    var accent = {
        stone: null, coal: '#2e2e36', copper: '#c8783a', iron: '#d8d2c8',
        gold: '#e8c838', iridium: '#c888e8', gem: '#7fd6e8'
    }[kind];
    var base = kind === 'coal' ? '#4a4a52' : '#9a958c';
    return bake('rock:' + kind, TILE, TILE, function (g)
    {
        contactShadow(g, 16, 27, 11, 3);
        // faceted boulder: three planes, lit from the top-left
        pr(g, 5, 14, 22, 12, tone(base, -1.1));
        pe(g, 16, 15, 11, 7, base);
        pe(g, 12, 12, 8, 5, tone(base, .9));
        pe(g, 10, 11, 5, 3, tone(base, 1.7));
        pr(g, 5, 23, 22, 3, tone(base, -1.8));
        pr(g, 6, 25, 20, 1, tone(base, -2.4));
        // facet lines
        pr(g, 14, 10, 1, 8, tone(base, -1.4));
        pr(g, 15, 17, 8, 1, tone(base, -1.4));
        pr(g, 21, 13, 1, 5, tone(base, .8));
        if (accent)
        {
            var spots = [[9, 17], [18, 14], [22, 20], [13, 21]];
            var i;
            for (i = 0; i < spots.length; i++)
            {
                orb(g, spots[i][0], spots[i][1], 3, 2, accent, 1.8);
            }
            pr(g, 9, 16, 1, 1, tone(accent, 2.4));
            pr(g, 18, 13, 1, 1, tone(accent, 2.4));
        }
    }, { outline: true });
}

function sprWeed(season)
{
    return bake('weed:' + season, TILE, TILE, function (g)
    {
        var c = season === 'fall' ? '#a89238' : (season === 'winter' ? '#8f9c98' : '#4f9a3a');
        contactShadow(g, 16, 27, 7, 2);
        pr(g, 15, 18, 2, 9, tone(c, -1.6));
        var i;
        for (i = 0; i < 5; i++)
        {
            var a = -1.3 + i * .62;
            var lx = 16 + Math.cos(a) * 8;
            var ly = 18 + Math.sin(a) * 6;
            pe(g, lx, ly, 4, 3, i % 2 ? c : tone(c, -.8));
            pe(g, lx - 1, ly - 1, 2, 1, tone(c, 1.3));
        }
        pe(g, 16, 11, 3, 4, tone(c, .6));
        pr(g, 16, 8, 1, 3, tone(c, 1.4));
    }, { outline: true });
}

function sprBush(season)
{
    return bake('bush:' + season, TILE * 2, TILE + 16, function (g)
    {
        var c = SEASON_TINT[season].leaf;
        contactShadow(g, 32, 42, 24, 5);
        leafClump(g, 16, 30, 13, tone(c, -.6));
        leafClump(g, 46, 28, 14, c);
        leafClump(g, 31, 22, 14, tone(c, .5));
        leafClump(g, 24, 33, 10, tone(c, -1));
        leafClump(g, 40, 34, 10, tone(c, -.4));
        if (season === 'spring')
        {
            pr(g, 20, 20, 2, 2, '#f2b6d0');
            pr(g, 44, 24, 2, 2, '#f2b6d0');
        }
        if (season === 'fall')
        {
            pr(g, 26, 26, 2, 2, '#d8443c');
            pr(g, 42, 30, 2, 2, '#d8443c');
        }
    }, { outline: true });
}

function sprGrassTuft(season)
{
    return bake('tuft:' + season, TILE, TILE, function (g)
    {
        var c = SEASON_TINT[season].grass;
        tuft(g, 10, 27, 10, c, 3);
        tuft(g, 17, 29, 13, tone(c, .4), 7);
        tuft(g, 23, 27, 9, tone(c, -.5), 11);
    });
}

function sprFlowerTile(col)
{
    return bake('fl:' + col, TILE, TILE, function (g)
    {
        contactShadow(g, 16, 28, 5, 2);
        pr(g, 15, 18, 2, 10, '#3f7a2a');
        pr(g, 15, 18, 1, 10, '#57a33c');
        pe(g, 11, 22, 3, 2, '#3f7a2a');
        pe(g, 21, 24, 3, 2, '#4a8a32');
        var i;
        for (i = 0; i < 5; i++)
        {
            var a = i * 1.256;
            orb(g, 16 + Math.cos(a) * 4, 15 + Math.sin(a) * 4, 3, 3, col, 1.6);
        }
        orb(g, 16, 15, 3, 3, '#f4dc6a', 1.6);
        pr(g, 15, 14, 1, 1, '#fff4b0');
    }, { outline: true });
}

// ---------- crops ----------

function sprCrop(seedId, stage)
{
    var cd = CROPS[seedId];
    var prod = ITEMS[cd.crop];
    var key = 'crop:' + seedId + ':' + stage;
    return bake(key, TILE, TILE + 12, function (g)
    {
        drawCropForm(g, cd, prod, stage);
    }, { outline: true });
}

// Every crop used to share one stem-and-leaf template, so 33 crops looked
// identical until the very last stage. Each growth form now has its own
// silhouette across all five stages.
function drawCropForm(g, cd, prod, stage)
{
    var H = TILE + 12;
    var base = H - 6;
    var stem = '#4d9130';
    var sd = tone(stem, -1.3), sl = tone(stem, 1.2);
    var form = cd.form || 'root';
    var pc = prod.cols[0];

    function sprout()
    {
        pr(g, 15, base - 5, 2, 5, stem);
        pe(g, 12, base - 6, 3, 2, sl);
        pe(g, 20, base - 7, 3, 2, stem);
    }
    function leafFan(cy, n, len, lift)
    {
        var i;
        for (i = 0; i < n; i++)
        {
            var a = Math.PI + (i + .5) * (Math.PI / n);
            var lx = 16 + Math.cos(a) * len;
            var ly = cy + Math.sin(a) * len * .42 + (lift || 0);
            pe(g, lx, ly, Math.max(2, len * .34), Math.max(1, len * .22), i % 2 ? stem : sd);
            pe(g, lx - 1, ly - 1, Math.max(1, len * .18), 1, sl);
        }
    }
    function upright(h, leaves)
    {
        pr(g, 15, base - h, 2, h, stem);
        pr(g, 15, base - h, 1, h, sl);
        var i;
        for (i = 0; i < leaves; i++)
        {
            var y = base - 4 - i * Math.floor(h / (leaves + 1));
            var side = i % 2 ? 1 : -1;
            pe(g, 16 + side * 6, y, 5, 2, side < 0 ? stem : sd);
            pe(g, 16 + side * 9, y - 1, 3, 1, sl);
        }
    }

    if (stage === 0)
    {
        sprout();
        return;
    }

    if (form === 'root')
    {
        if (stage === 1)
        {
            pr(g, 15, base - 5, 2, 5, stem);
            leafFan(base - 4, 3, 8);
        }
        else if (stage === 2)
        {
            pr(g, 15, base - 8, 2, 8, stem);
            leafFan(base - 6, 4, 12);
        }
        else if (stage === 3)
        {
            pr(g, 15, base - 11, 2, 11, stem);
            leafFan(base - 8, 5, 15);
        }
        else
        {
            pr(g, 15, base - 12, 2, 12, stem);
            leafFan(base - 9, 6, 17);
            pe(g, 16, base - 1, 6, 3, tone(pc, -.8));
            pe(g, 16, base - 2, 5, 2, pc);
            drawShape(g, prod.shape, prod.cols, 8, 0, 16);
        }
        return;
    }

    if (form === 'leafy')
    {
        var rings = [0, 2, 3, 4, 5][stage];
        var i;
        for (i = 0; i < rings; i++)
        {
            leafFan(base - 3 - i * 3, 4 + i, 9 + i * 3, -i);
        }
        if (stage === 4)
        {
            pr(g, 16, base - 18, 1, 4, sd);
            pe(g, 16, base - 12, 8, 7, tone(pc, -1.1));
            pe(g, 16, base - 13, 7, 6, pc);
            pe(g, 13, base - 15, 3, 2, tone(pc, 1.5));
        }
        else if (stage === 3)
        {
            pe(g, 16, base - 10, 5, 4, tone(stem, .5));
        }
        return;
    }

    if (form === 'bush')
    {
        var r = [0, 4, 7, 10, 12][stage];
        pr(g, 15, base - r, 2, r, sd);
        leafClump(g, 16 - r * .55, base - r * .7, Math.max(3, r * .45), stem);
        leafClump(g, 16 + r * .55, base - r * .6, Math.max(3, r * .42), tone(stem, -.5));
        leafClump(g, 16, base - r * 1.05, Math.max(3, r * .5), tone(stem, .5));
        if (stage >= 3)
        {
            leafClump(g, 16 - r * .3, base - r * 1.3, Math.max(3, r * .34), sl);
        }
        if (stage === 4)
        {
            var spots = [[-8, -6], [7, -9], [0, -15], [-4, -2]];
            var k;
            for (k = 0; k < spots.length; k++)
            {
                orb(g, 16 + spots[k][0], base + spots[k][1], 3, 3, pc, 1.8);
            }
        }
        return;
    }

    if (form === 'vine')
    {
        var post = '#8a6a3a';
        pr(g, 5, 4, 3, base - 4, post);
        pr(g, 24, 4, 3, base - 4, post);
        pr(g, 5, 4, 1, base - 4, tone(post, 1.1));
        pr(g, 24, 4, 1, base - 4, tone(post, 1.1));
        pr(g, 5, 12, 22, 2, post);
        pr(g, 5, 24, 22, 2, post);
        var climb = [0, 8, 16, 24, 30][stage];
        var y;
        for (y = 0; y < climb; y++)
        {
            var vx = 16 + Math.round(Math.sin(y * .45) * 6);
            pr(g, vx, base - y, 2, 1, y % 3 === 0 ? sl : stem);
            if (y % 5 === 2)
            {
                pe(g, vx + (y % 10 < 5 ? -4 : 5), base - y, 3, 2, sd);
            }
            if (y % 7 === 3)
            {
                pe(g, vx + (y % 14 < 7 ? 4 : -4), base - y - 1, 2, 1, sl);
            }
        }
        if (stage === 4)
        {
            var vs = [[-6, -8], [6, -16], [-3, -24]];
            var vi;
            for (vi = 0; vi < vs.length; vi++)
            {
                drawShape(g, prod.shape, prod.cols, 16 + vs[vi][0] - 6, base + vs[vi][1] - 6, 13);
            }
        }
        return;
    }

    if (form === 'stalk')
    {
        var h = [0, 7, 14, 22, 30][stage];
        upright(h, [0, 1, 2, 3, 4][stage]);
        if (stage === 4)
        {
            if (cd.crop === 'sunflower')
            {
                var si;
                for (si = 0; si < 9; si++)
                {
                    var sa = si * .698;
                    orb(g, 16 + Math.cos(sa) * 7, base - h - 3 + Math.sin(sa) * 7, 3, 3, pc, 1.7);
                }
                pe(g, 16, base - h - 3, 5, 5, '#6b4a1c');
                pe(g, 15, base - h - 4, 3, 3, '#8a6428');
            }
            else if (cd.crop === 'corn')
            {
                pr(g, 15, base - h - 8, 3, 6, sl);
                pe(g, 16, base - h + 4, 5, 9, tone(pc, -1));
                pe(g, 16, base - h + 3, 4, 8, pc);
                var ci;
                for (ci = 0; ci < 5; ci++)
                {
                    pr(g, 12, base - h - 2 + ci * 3, 9, 1, tone(pc, -1.2));
                }
            }
            else
            {
                drawShape(g, prod.shape, prod.cols, 8, base - h - 12, 17);
            }
        }
        else if (stage === 3)
        {
            pe(g, 16, base - h - 2, 3, 4, tone(pc, -1.4));
        }
        return;
    }

    if (form === 'sprawl')
    {
        var spread = [0, 5, 10, 14, 16][stage];
        var sx;
        for (sx = -spread; sx <= spread; sx++)
        {
            pr(g, 16 + sx, base - 2 + Math.round(Math.sin(sx * .5) * 2), 1, 2, sx % 4 === 0 ? sl : stem);
        }
        var li;
        for (li = 0; li < stage + 1; li++)
        {
            var lx2 = 16 + (li % 2 ? 1 : -1) * (3 + li * 3);
            pe(g, lx2, base - 5 - (li % 2) * 2, 5, 3, li % 2 ? stem : sd);
            pe(g, lx2 - 1, base - 6 - (li % 2) * 2, 2, 1, sl);
        }
        if (stage === 4)
        {
            drawShape(g, prod.shape, prod.cols, 7, base - 20, 19);
        }
        else if (stage === 3)
        {
            pe(g, 16, base - 4, 4, 3, tone(pc, -1.2));
        }
        return;
    }

    // flower
    var fh = [0, 6, 12, 18, 22][stage];
    pr(g, 15, base - fh, 2, fh, stem);
    pr(g, 15, base - fh, 1, fh, sl);
    pe(g, 11, base - 5, 4, 2, stem);
    if (stage >= 2)
    {
        pe(g, 21, base - 10, 4, 2, sd);
    }
    if (stage === 3)
    {
        pe(g, 16, base - fh - 3, 3, 5, tone(pc, -1.2));
        pe(g, 15, base - fh - 4, 2, 2, tone(pc, .4));
    }
    else if (stage === 4)
    {
        var pi;
        for (pi = 0; pi < 6; pi++)
        {
            var pa = pi * 1.047;
            orb(g, 16 + Math.cos(pa) * 6, base - fh - 4 + Math.sin(pa) * 6, 4, 4, pi % 2 ? pc : tone(pc, .5), 1.6);
        }
        orb(g, 16, base - fh - 4, 3, 3, '#f2d95e', 1.6);
        pr(g, 14, base - fh - 6, 1, 1, '#fff3b4');
    }
}

// ---------- item icon shapes ----------
// draws into a size-s box at (ox,oy). s is typically 16..32.

function drawShape(g, shape, cols, ox, oy, s)
{
    var a = cols[0];
    var b = cols[1] || tone(a, -1.6);
    var c = cols[2] || tone(a, 1.4);
    var leaf = '#4d9130', leafD = tone(leaf, -1.4), leafL = tone(leaf, 1.2);
    var k = s / 24;

    function P(x, y, w, h, col)
    {
        pr(g, ox + x * k, oy + y * k, Math.max(1, w * k), Math.max(1, h * k), col);
    }
    function E(cx, cy, rx, ry, col)
    {
        pe(g, ox + cx * k, oy + cy * k, Math.max(1, Math.round(rx * k)), Math.max(1, Math.round(ry * k)), col);
    }
    function O(cx, cy, rx, ry, col, lift)
    {
        orb(g, ox + cx * k, oy + cy * k, Math.max(1, Math.round(rx * k)), Math.max(1, Math.round(ry * k)), col, lift);
    }
    function stemUp(x, y, h)
    {
        P(x, y, 2, h, leafD);
        P(x, y, 1, h, leaf);
    }

    switch (shape)
    {
        case 'root':
            stemUp(11, 1, 5);
            E(7, 3, 4, 2, leaf); E(16, 3, 4, 2, leafL);
            O(12, 12, 6, 6, a, 1.6);
            P(10, 16, 4, 7, a); P(10, 16, 1, 7, c); P(13, 17, 1, 6, b);
            P(11, 22, 2, 2, b);
            break;
        case 'lump':
            O(12, 13, 8, 6, a, 1.5);
            E(8, 16, 2, 1, b); E(16, 11, 2, 1, b); E(13, 17, 2, 1, b);
            E(8, 9, 2, 1, c);
            break;
        case 'ball':
            stemUp(11, 1, 5); E(15, 3, 4, 2, leaf); E(8, 3, 3, 2, leafD);
            O(12, 14, 8, 8, a, 1.7);
            E(9, 10, 2, 1, tone(c, 1.5));
            break;
        case 'gourd':
            stemUp(11, 0, 5);
            E(12, 14, 10, 8, tone(a, -1.4));
            O(12, 14, 9, 8, a, 1.4);
            P(7, 8, 1, 12, tone(a, -1)); P(12, 7, 1, 14, tone(a, -1)); P(17, 8, 1, 12, tone(a, -1));
            E(8, 10, 2, 2, tone(c, 1.2));
            break;
        case 'berry':
            stemUp(11, 0, 4); E(8, 2, 4, 2, leaf); E(16, 2, 4, 2, leafD);
            O(8, 13, 4, 4, a, 1.7); O(16, 15, 4, 4, a, 1.5); O(12, 9, 4, 4, tone(a, .4), 1.8);
            O(12, 18, 4, 4, tone(a, -.5), 1.3);
            break;
        case 'cluster':
            stemUp(11, 0, 4);
            O(12, 8, 3, 3, a, 1.6); O(8, 12, 3, 3, a, 1.4); O(16, 12, 3, 3, tone(a, -.4), 1.4);
            O(10, 16, 3, 3, a, 1.3); O(15, 17, 3, 3, tone(a, -.4), 1.2); O(12, 20, 3, 3, tone(a, -.8), 1.2);
            break;
        case 'pod':
            P(11, 2, 2, 4, leafD); E(9, 3, 3, 2, leaf);
            E(12, 16, 5, 7, tone(a, -1.3));
            O(12, 15, 4, 7, a, 1.4);
            P(9, 10, 1, 11, tone(c, 1));
            E(12, 22, 2, 2, b);
            break;
        case 'leaf':
            E(12, 14, 9, 8, tone(a, -1.3));
            E(12, 12, 8, 7, a);
            E(9, 10, 4, 3, c);
            P(11, 5, 1, 16, tone(a, -1.8));
            E(12, 6, 4, 2, tone(a, -.6));
            var lv;
            for (lv = 0; lv < 4; lv++)
            {
                P(8 - lv, 9 + lv * 3, 4, 1, tone(a, -1.1));
                P(13, 10 + lv * 3, 4, 1, tone(a, -1.1));
            }
            break;
        case 'bulb':
            P(10, 1, 1, 7, leaf); P(13, 1, 1, 7, leafD); P(11, 2, 1, 6, leafL);
            O(12, 15, 7, 7, a, 1.5);
            P(9, 10, 1, 10, tone(a, -1)); P(14, 10, 1, 10, tone(a, -1));
            break;
        case 'stalk':
            P(10, 3, 4, 19, tone(a, -1.2)); P(10, 3, 2, 19, a); P(10, 3, 1, 19, c);
            E(7, 8, 4, 2, leaf); E(17, 12, 4, 2, leafD); E(7, 16, 3, 2, leaf);
            P(9, 21, 6, 2, b);
            break;
        case 'grain':
            P(11, 6, 2, 17, tone(a, -1.6)); P(11, 6, 1, 17, tone(a, -.6));
            var gi;
            for (gi = 0; gi < 5; gi++)
            {
                var gy = 3 + gi * 4;
                E(8, gy, 3, 2, gi % 2 ? a : tone(a, .8));
                E(16, gy + 2, 3, 2, gi % 2 ? tone(a, -.6) : a);
                pr(g, ox + 7 * k, oy + (gy - 1) * k, Math.max(1, 2 * k), 1, c);
            }
            E(12, 1, 2, 2, c);
            break;
        case 'corn':
            E(12, 12, 6, 11, tone(a, -1.3));
            O(12, 12, 5, 10, a, 1.3);
            var cy2;
            for (cy2 = 3; cy2 < 21; cy2 += 3)
            {
                P(8, cy2, 9, 1, tone(a, -1));
                P(9, cy2 + 1, 2, 1, tone(a, 1.6));
            }
            E(6, 13, 3, 9, leafD); E(18, 12, 3, 9, leaf);
            P(11, 0, 2, 4, leafL);
            break;
        case 'flower':
            P(11, 13, 2, 10, leafD); P(11, 13, 1, 10, leaf);
            E(7, 17, 4, 2, leaf); E(17, 19, 4, 2, leafD);
            var fi;
            for (fi = 0; fi < 6; fi++)
            {
                var fa = fi * 1.047;
                O(12 + Math.cos(fa) * 6, 9 + Math.sin(fa) * 6, 4, 4, fi % 2 ? a : tone(a, .5), 1.6);
            }
            O(12, 9, 3, 3, '#f2d95e', 1.6);
            P(10, 7, 1, 1, '#fff3b4');
            break;
        case 'sunflower':
            P(11, 14, 2, 9, leafD); P(11, 14, 1, 9, leaf); E(7, 18, 4, 2, leaf);
            var si;
            for (si = 0; si < 10; si++)
            {
                var sa = si * .628;
                O(12 + Math.cos(sa) * 7, 10 + Math.sin(sa) * 7, 3, 3, si % 2 ? a : tone(a, .6), 1.7);
            }
            E(12, 10, 5, 5, '#6b4a1c');
            E(11, 9, 3, 3, '#8a6428');
            crumbs(g, ox + 8 * k, oy + 7 * k, 8 * k, 7 * k, ['#4d3212'], 6, 3);
            break;
        case 'hat':
            // drawShape has no default branch, so a shape it does not know
            // draws nothing at all - a hat with no icon in the bag or the shop
            P(3, 13, 18, 4, a);
            P(3, 13, 18, 1, c);
            P(3, 16, 18, 1, b);
            P(7, 6, 10, 8, a);
            P(7, 6, 10, 1, c);
            P(7, 11, 10, 2, b);
            P(7, 6, 1, 8, c);
            break;

        case 'star':
            var sp = [];
            var st;
            for (st = 0; st < 10; st++)
            {
                var ang = -Math.PI / 2 + st * Math.PI / 5;
                var rr = (st % 2 === 0) ? 11 : 4.6;
                sp.push([12 + Math.cos(ang) * rr, 12 + Math.sin(ang) * rr]);
            }
            g.fillStyle = tone(a, -1.4);
            g.beginPath();
            g.moveTo(ox + sp[0][0] * k, oy + sp[0][1] * k);
            for (st = 1; st < sp.length; st++)
            {
                g.lineTo(ox + sp[st][0] * k, oy + sp[st][1] * k);
            }
            g.closePath();
            g.fill();
            g.fillStyle = a;
            g.beginPath();
            g.moveTo(ox + sp[0][0] * k, oy + (sp[0][1] + .8) * k);
            for (st = 1; st < sp.length; st++)
            {
                g.lineTo(ox + sp[st][0] * k * .97 + ox * .03, oy + (sp[st][1] + .8) * k);
            }
            g.closePath();
            g.fill();
            E(10, 9, 3, 3, c);
            break;
        case 'mushroom':
            P(9, 13, 6, 10, tone(c, -.5)); P(9, 13, 2, 10, c); P(14, 14, 1, 9, tone(c, -1.4));
            P(9, 21, 6, 2, tone(c, -1.8));
            E(12, 11, 11, 6, tone(a, -1.3));
            E(12, 9, 10, 6, a);
            E(8, 7, 5, 3, tone(a, 1.3));
            P(2, 12, 20, 1, tone(a, -2));
            E(16, 8, 2, 1, tone(a, 1.8)); E(9, 11, 2, 1, tone(a, 1.6));
            break;
        case 'fiddle':
            P(11, 8, 2, 15, tone(a, -1.2)); P(11, 8, 1, 15, a);
            E(12, 6, 5, 5, tone(a, -1)); E(12, 6, 3, 3, a); E(12, 6, 1, 1, b);
            E(7, 14, 3, 2, c); E(16, 18, 3, 2, c);
            break;
        case 'nut':
            E(12, 15, 7, 8, tone(a, -1.3));
            O(12, 14, 6, 7, a, 1.5);
            P(6, 5, 12, 5, b); P(7, 4, 10, 2, tone(b, 1.2));
            P(11, 2, 2, 3, tone(b, -1));
            break;
        case 'shell':
            E(12, 17, 11, 7, tone(a, -1.2));
            E(12, 16, 10, 7, a);
            var sh;
            for (sh = -3; sh <= 3; sh++)
            {
                P(12 + sh * 3, 9, 1, 12, tone(a, -1.3));
            }
            E(12, 12, 6, 3, c);
            P(2, 21, 20, 1, tone(a, -2));
            break;
        case 'coral':
            P(10, 12, 3, 11, a); P(10, 12, 1, 11, c);
            P(5, 8, 3, 11, tone(a, -.7)); P(16, 6, 3, 13, a);
            E(6, 7, 3, 3, c); E(17, 5, 3, 3, c); E(11, 11, 3, 3, tone(c, 1));
            break;
        case 'urchin':
            O(12, 14, 6, 6, a, 1.4);
            var ui;
            for (ui = 0; ui < 12; ui++)
            {
                var ua = ui * .524;
                var uw = 12 + Math.cos(ua) * 10;
                var uh = 14 + Math.sin(ua) * 10;
                P(uw, uh, 2, 2, ui % 2 ? c : tone(a, -.6));
            }
            break;
        case 'fish':
            E(13, 12, 9, 6, tone(a, -1.3));
            E(13, 11, 8, 5, a);
            E(10, 8, 4, 2, c);
            P(20, 6, 4, 5, tone(a, -.6)); P(20, 13, 4, 5, tone(a, -1));
            P(2, 6, 5, 4, a); P(2, 14, 5, 4, tone(a, -.8)); P(1, 9, 3, 6, tone(a, -1.4));
            E(8, 6, 3, 2, tone(a, -.8));
            E(18, 10, 2, 2, '#ffffff'); E(18, 10, 1, 1, '#1a1410');
            P(6, 12, 12, 1, tone(a, 1.3));
            crumbs(g, ox + 8 * k, oy + 8 * k, 9 * k, 6 * k, [tone(a, -1.5)], 5, 7);
            break;
        case 'lobster':
            E(12, 14, 6, 4, tone(a, -1.2)); O(12, 13, 5, 4, a, 1.4);
            P(4, 13, 6, 3, a); P(2, 17, 4, 2, tone(a, -.8));
            P(3, 5, 4, 6, a); P(17, 5, 4, 6, a);
            E(4, 4, 3, 2, c); E(19, 4, 3, 2, c);
            P(7, 20, 2, 3, b); P(12, 21, 2, 3, b); P(16, 20, 2, 3, b);
            break;
        case 'crab':
            E(12, 14, 9, 5, tone(a, -1.2)); O(12, 13, 8, 5, a, 1.5);
            P(1, 8, 5, 3, a); P(18, 8, 5, 3, a);
            E(2, 7, 3, 2, c); E(21, 7, 3, 2, c);
            P(8, 10, 2, 2, '#1a1410'); P(14, 10, 2, 2, '#1a1410');
            P(4, 19, 3, 2, b); P(10, 20, 3, 2, b); P(16, 19, 3, 2, b);
            break;
        case 'shrimp':

var ICON_CACHE = {};

function itemIcon(id, s)
{
    var it = ITEMS[id];
    if (!it)
    {
        return bake('ic:?:' + s, s, s, function (g)
        {
            pr(g, 1, 1, s - 2, s - 2, '#c8a878');
        });
    }
    return bake('ic:' + id + ':' + s, s, s, function (g)
    {
        drawShape(g, it.shape, it.cols, 0, 0, s);
    }, { outline: s >= 14 });
}

        mill: { w: 128, h: 112, wall: '#e0cda6', roof: '#8a5a30', trim: '#6d4a2c' },
        shop: { w: 192, h: 160, wall: '#eee0c4', roof: '#3f8a68', trim: '#8a6a3a' },
        shop2: { w: 192, h: 160, wall: '#ded0b6', roof: '#4a6a9a', trim: '#8a6a3a' },
        shop3: { w: 160, h: 144, wall: '#e4d8bc', roof: '#9a5a3a', trim: '#8a6a3a' },
        saloon: { w: 192, h: 160, wall: '#c8a878', roof: '#8a4a58', trim: '#6d4a2c' },
        center: { w: 256, h: 192, wall: '#dccca8', roof: '#7a6a5a', trim: '#8a7a5a' },
        cabin: { w: 128, h: 112, wall: '#c8a878', roof: '#7a5a3a', trim: '#6d4a2c' },
        greenhouse: { w: 192, h: 160, wall: '#c8e0d8', roof: '#7f9a8c', trim: '#6a7a6a' }
    };
    var d = defs[kind] || defs.cabin;
    return bake('bld:' + kind, d.w, d.h, function (g)
    {
        drawBuilding(g, d, kind);
    }, { outline: true });
}

function drawBuilding(g, d, kind)
{
    var W = d.w, H = d.h;
    var roofH = Math.round(H * .42);
    var wallY = roofH - 8;
    var wall = d.wall, roof = d.roof, trim = d.trim;

    // cast shadow along the base, thrown to the right by the top-left light
    var si;
    for (si = 0; si < 4; si++)
    {
        pr(g, 10 + si * 5, H - 8 + si * 2, W - 12 + si * 6, 4, 'rgba(24,18,10,' + (.17 - si * .035) + ')');
    }
    contactShadow(g, W / 2, H - 4, W * .44, 5);

    // ---- wall ----
    pr(g, 6, wallY, W - 12, H - wallY - 4, wall);
    // plank / plaster texture
    var i;
    for (i = wallY + 4; i < H - 6; i += 9)
    {
        pr(g, 7, i, W - 14, 1, tone(wall, -.55));
        pr(g, 7, i + 1, W - 14, 1, tone(wall, .5));
    }
    // corner posts
    pr(g, 6, wallY, 7, H - wallY - 4, tone(wall, -1.1));
    pr(g, W - 13, wallY, 7, H - wallY - 4, tone(wall, -1.5));
    pr(g, 6, wallY, 3, H - wallY - 4, tone(wall, .9));
    // eave shadow cast by the roof
    pr(g, 6, wallY, W - 12, 5, tone(wall, -1.6));
    pr(g, 6, wallY + 5, W - 12, 2, tone(wall, -.9));
    // foundation
    pr(g, 4, H - 10, W - 8, 6, '#8a8078');
    pr(g, 4, H - 10, W - 8, 2, '#a29a90');
    pr(g, 4, H - 5, W - 8, 2, '#5f5850');
    for (i = 6; i < W - 8; i += 12)
    {
        pr(g, i, H - 8, 1, 4, '#6f675f');
    }

    // ---- roof: stepped gable with shingle rows ----
    var rowH = 7;
    var y;
    for (y = 0; y < roofH; y++)
    {
        var t = y / roofH;
        var inset = Math.round((1 - t) * (W / 2 - 10));
        var x0 = inset, w0 = W - inset * 2;
        var row = Math.floor(y / rowH);
        var c = (row % 2 === 0) ? roof : tone(roof, -.5);
        pr(g, x0, roofH - y, w0, 1, c);
        if (y % rowH === 0)
        {
            pr(g, x0, roofH - y, w0, 1, tone(roof, -1.8));
        }
        if (y % rowH === 1)
        {
            pr(g, x0, roofH - y, w0, 1, tone(roof, 1.4));
        }
        if (y % rowH === 2)
        {
            pr(g, x0, roofH - y, w0, 1, tone(roof, .5));
        }
        if (y % rowH === rowH - 1)
        {
            pr(g, x0, roofH - y, w0, 1, tone(roof, -1.1));
        }
    }
    // shingle tabs
    var r2;
    for (r2 = 0; r2 * rowH < roofH - 4; r2++)
    {
        var yy = roofH - r2 * rowH - 3;
        var tt = (r2 * rowH) / roofH;
        var ins = Math.round((1 - tt) * (W / 2 - 10));
        var xx;
        for (xx = ins + 5 + (r2 % 2) * 7; xx < W - ins - 4; xx += 14)
        {
            pr(g, xx, yy - 1, 2, 5, tone(roof, -2.2));
            pr(g, xx + 2, yy - 1, 1, 5, tone(roof, .9));
        }
    }
    // ridge cap
    pr(g, W / 2 - 9, 0, 18, 4, tone(roof, 1.3));
    pr(g, W / 2 - 9, 3, 18, 1, tone(roof, -1.4));
    // eave board with a visible underside: this is what gives the roof depth
    pr(g, -2, roofH, W + 4, 4, tone(roof, .7));
    pr(g, -2, roofH, W + 4, 1, tone(roof, 1.6));
    pr(g, -2, roofH + 4, W + 4, 4, tone(roof, -2.1));       // shaded underside
    pr(g, -2, roofH + 8, W + 4, 2, 'rgba(24,18,10,.42)');   // shadow onto the wall
    // rafter tails poking out below the eave
    for (i = 4; i < W - 4; i += 16)
    {
        pr(g, i, roofH + 4, 3, 5, tone(roof, -2.4));
    }
    // chimney (skip the tiny buildings)
    if (W >= 120 && kind !== 'greenhouse' && kind !== 'silo' && kind !== 'well')
    {
        var chx = Math.round(W * .74);
        var chTop = Math.round(roofH * .34);
        pr(g, chx, chTop, 18, roofH - chTop + 6, '#8a6a5a');
        pr(g, chx, chTop, 6, roofH - chTop + 6, '#a08272');
        pr(g, chx + 14, chTop, 4, roofH - chTop + 6, '#6a4e40');
        var cr;
        for (cr = chTop + 4; cr < roofH; cr += 6)
        {
            pr(g, chx, cr, 18, 1, '#6a4e40');
        }
        pr(g, chx - 3, chTop - 5, 24, 6, '#7a5e4e');
        pr(g, chx - 3, chTop - 5, 24, 2, '#9c8070');
        pr(g, chx + 3, chTop - 8, 12, 3, '#2e2620');
    }

    // ---- door ----
    var dw = Math.max(26, Math.round(W * .16));
    var dh = Math.min(H - wallY - 14, 46);
    var dx = Math.round(W / 2 - dw / 2);
    var dy = H - 10 - dh;
    pr(g, dx - 4, dy - 4, dw + 8, dh + 4, trim);
    pr(g, dx - 4, dy - 4, dw + 8, 3, tone(trim, 1.3));
    pr(g, dx, dy, dw, dh, tone(trim, -1.4));
    pr(g, dx, dy, dw, 2, tone(trim, -2.2));
    pr(g, dx + 1, dy + 1, 3, dh - 2, tone(trim, -.7));
    // door panels
    pr(g, dx + 5, dy + 6, dw - 10, Math.round(dh * .35), tone(trim, -2));
    pr(g, dx + 6, dy + 7, dw - 12, Math.round(dh * .35) - 2, tone(trim, -1));
    pr(g, dx + 5, dy + Math.round(dh * .5), dw - 10, Math.round(dh * .35), tone(trim, -2));
    pr(g, dx + 6, dy + Math.round(dh * .5) + 1, dw - 12, Math.round(dh * .35) - 2, tone(trim, -1));
    // knob
    pr(g, dx + dw - 8, dy + Math.round(dh * .5) - 2, 3, 3, '#efc95c');
    pr(g, dx + dw - 8, dy + Math.round(dh * .5) - 2, 1, 1, '#fff0b8');
    // porch step
    pr(g, dx - 8, H - 10, dw + 16, 5, '#a09585');
    pr(g, dx - 8, H - 10, dw + 16, 2, '#bcb2a2');
    pr(g, dx - 11, H - 6, dw + 22, 5, '#948a7c');
    pr(g, dx - 11, H - 6, dw + 22, 2, '#aca294');
    pr(g, dx - 11, H - 2, dw + 22, 2, '#6e675d');

    // ---- windows ----
    function win(wx, wy, ww, wh)
    {
        pr(g, wx - 3, wy - 3, ww + 6, wh + 6, trim);
        pr(g, wx - 3, wy - 3, ww + 6, 2, tone(trim, 1.3));
        pr(g, wx, wy, ww, wh, '#5c4a2c');
        pr(g, wx + 1, wy + 1, ww - 2, wh - 2, '#8fc6e2');
        // glass gradient + highlight
        pr(g, wx + 1, wy + 1, ww - 2, Math.round(wh * .4), '#aadcf2');
        var gi;
        for (gi = 0; gi < 4; gi++)
        {
            pr(g, wx + 2 + gi * 2, wy + 2 + gi * 2, 4, 2, '#dff2fb');
        }
        // mullions
        pr(g, wx + Math.round(ww / 2) - 1, wy + 1, 2, wh - 2, '#5c4a2c');
        pr(g, wx + 1, wy + Math.round(wh / 2) - 1, ww - 2, 2, '#5c4a2c');
        // sill
        pr(g, wx - 5, wy + wh + 3, ww + 10, 4, trim);
        pr(g, wx - 5, wy + wh + 3, ww + 10, 1, tone(trim, 1.4));
        pr(g, wx - 5, wy + wh + 6, ww + 10, 1, tone(trim, -2));
    }
    var wy2 = wallY + 16;
    var wh2 = Math.min(28, H - wallY - 34);
    if (wh2 > 10)
    {
        if (W >= 176)
        {
            win(24, wy2, 26, wh2);
            win(W - 50, wy2, 26, wh2);
        }
        else if (W >= 120)
        {
            win(Math.round(W * .18), wy2, 24, wh2);
            win(Math.round(W * .66), wy2, 24, wh2);
        }
        else if (W >= 88)
        {
            win(Math.round(W / 2) - 12, wy2, 24, wh2);
        }
    }

    // ---- per-kind extras ----
    if (kind === 'silo')
    {
        pr(g, 8, 18, W - 16, H - 26, wall);
        for (i = 18; i < H - 10; i += 11)
        {
            pr(g, 8, i, W - 16, 1, tone(wall, -1.4));
            pr(g, 8, i + 1, W - 16, 1, tone(wall, .8));
        }
        pr(g, 8, 18, 8, H - 26, tone(wall, 1));
        pr(g, W - 18, 18, 10, H - 26, tone(wall, -1.2));
        pe(g, W / 2, 18, W / 2 - 8, 12, tone(roof, .7));
        pe(g, W / 2 - 6, 14, W / 4, 6, tone(roof, 1.6));
        pr(g, W / 2 - 14, H - 38, 28, 30, '#6a5a4a');
        pr(g, W / 2 - 14, H - 38, 28, 3, '#8a7a68');
    }
    if (kind === 'well')
    {
        pr(g, 10, 44, W - 20, H - 52, '#9a958c');
        pr(g, 10, 44, W - 20, 4, '#b5b0a6');
        pr(g, 10, H - 12, W - 20, 4, '#6d6860');
        for (i = 12; i < W - 20; i += 14)
        {
            pr(g, i, 48, 1, H - 60, '#7d786f');
        }
        pe(g, W / 2, 50, W / 2 - 12, 7, '#2a3a4a');
        pe(g, W / 2, 50, W / 2 - 16, 4, '#3d5a72');
        pr(g, 16, 10, 6, 36, trim);
        pr(g, W - 22, 10, 6, 36, trim);
        pr(g, 8, 2, W - 16, 12, roof);
        pr(g, 8, 2, W - 16, 3, tone(roof, 1.3));
        pr(g, W / 2 - 12, 14, 24, 8, '#6d4a2c');
    }
    if (kind === 'greenhouse')
    {
        pr(g, 12, wallY, W - 24, H - wallY - 12, '#bfe4dc');
        for (i = 20; i < W - 16; i += 22)
        {
            pr(g, i, wallY, 3, H - wallY - 12, '#7f9a8c');
            pr(g, i + 3, wallY, 1, H - wallY - 12, '#9fb8ac');
        }
        for (i = wallY + 10; i < H - 16; i += 22)
        {
            pr(g, 12, i, W - 24, 3, '#7f9a8c');
        }
        var gg;
        for (gg = 0; gg < 6; gg++)
        {
            pr(g, 18 + gg * 22, wallY + 6, 8, 4, 'rgba(255,255,255,.5)');
        }
    }
    if (kind === 'center')
    {
        pr(g, W / 2 - 20, roofH - 40, 40, 38, tone(roof, -.6));
        pr(g, W / 2 - 20, roofH - 40, 40, 3, tone(roof, 1));
        pr(g, W / 2 - 5, roofH - 62, 10, 24, '#8a7a5a');
        pe(g, W / 2, roofH - 66, 8, 8, '#e8c860');
        pe(g, W / 2 - 2, roofH - 68, 4, 3, '#f8e8a0');
        pr(g, W / 2 - 14, roofH - 30, 28, 22, '#6d5a48');
        pr(g, W / 2 - 12, roofH - 28, 24, 18, '#9fc4d8');
    }
    if (kind === 'barn' || kind === 'barn_big' || kind === 'barn_deluxe')
    {
        // white cross-brace doors, the classic barn read
        var bx = Math.round(W / 2 - 34), by = H - 10 - 54;
        pr(g, bx, by, 68, 54, tone(wall, -1.6));
        pr(g, bx + 2, by + 2, 64, 50, tone(wall, -.8));
        pr(g, bx + 32, by, 4, 54, trim);
        pr(g, bx, by, 68, 4, trim);
        pr(g, bx, by + 50, 68, 4, trim);
        var bi;
        for (bi = 0; bi < 26; bi++)
        {
            pr(g, bx + 4 + bi, by + 6 + bi * 1.7, 3, 2, trim);
            pr(g, bx + 62 - bi, by + 6 + bi * 1.7, 3, 2, trim);
        }
        pr(g, W / 2 - 12, roofH - 22, 24, 20, tone(roof, -1));
        pr(g, W / 2 - 9, roofH - 19, 18, 14, '#3a2a1a');
    }
    if (kind === 'saloon')
    {
        pr(g, 14, wallY + 4, W - 28, 14, '#6d4a2c');
        pr(g, 14, wallY + 4, W - 28, 2, '#8a5f38');
        pr(g, 22, wallY + 8, W - 44, 6, '#e8d8a8');
    }
}

function sprShippingBin()
{
    return bake('bin', TILE * 2, TILE + 24, function (g)
    {
        var w = '#8a5a2a';
        contactShadow(g, 32, 52, 26, 5);
        // body
        pr(g, 4, 20, 56, 30, w);
        pr(g, 4, 20, 56, 3, tone(w, 1.3));
        pr(g, 4, 46, 56, 4, tone(w, -2));
        pr(g, 4, 20, 5, 30, tone(w, 1));
        pr(g, 55, 20, 5, 30, tone(w, -1.4));
        var i;
        for (i = 0; i < 5; i++)
        {
            pr(g, 10 + i * 10, 22, 1, 26, tone(w, -1.6));
            pr(g, 11 + i * 10, 22, 1, 26, tone(w, .8));
        }
        // metal bands
        pr(g, 4, 28, 56, 3, '#6a6a72');
        pr(g, 4, 28, 56, 1, '#8f8f98');
        pr(g, 4, 40, 56, 3, '#6a6a72');
        pr(g, 4, 40, 56, 1, '#8f8f98');
        // open lid + dark interior
        pr(g, 0, 12, 64, 10, tone(w, -.4));
        pr(g, 0, 12, 64, 3, tone(w, 1.4));
        pr(g, 0, 20, 64, 2, tone(w, -2.2));
        pr(g, 8, 4, 48, 10, '#241a10');
        pr(g, 8, 4, 48, 2, '#3a2a18');
        pr(g, 6, 2, 52, 4, tone(w, -1));
        pr(g, 6, 2, 52, 1, tone(w, .9));
    }, { outline: true });
}

function sprFence(kind)
{
    return bake('fence:' + kind, TILE, TILE + 8, function (g)
    {
        var c = kind === 'stone' ? '#9a958c' : '#8a5a2a';
        contactShadow(g, 16, 36, 8, 3);
        pr(g, 12, 8, 8, 28, c);
        pr(g, 12, 8, 3, 28, tone(c, 1.1));
        pr(g, 18, 8, 2, 28, tone(c, -1.5));
        pr(g, 12, 8, 8, 2, tone(c, 1.5));
        pr(g, 0, 14, TILE, 5, c);
        pr(g, 0, 14, TILE, 1, tone(c, 1.4));
        pr(g, 0, 18, TILE, 1, tone(c, -1.9));
        pr(g, 0, 26, TILE, 5, c);
        pr(g, 0, 26, TILE, 1, tone(c, 1.4));
        pr(g, 0, 30, TILE, 1, tone(c, -1.9));
    }, { outline: true });
}

// ---------- monsters (32 x 32) ----------

function sprMonster(kind, col, frame)
{
    return bake('mon:' + kind + ':' + frame, TILE, TILE, function (g)
    {
        var a = col[0];
        var bob = frame % 2;
        contactShadow(g, 16, 29, 9, 3);

        if (kind === 'slime')
        {
            var sy = 20 + bob;
            pe(g, 16, sy, 12, 9, tone(a, -1.4));
            pe(g, 16, sy - 1, 11, 8, a);
            pr(g, 4, sy, 24, 8, a);
            pr(g, 4, sy + 6, 24, 2, tone(a, -1.6));
            pe(g, 10, sy - 5, 5, 3, tone(a, 1.6));
            pe(g, 9, sy - 6, 2, 1, tone(a, 2.4));
            pr(g, 9, sy - 3 + bob, 4, 5, '#ffffff');
            pr(g, 18, sy - 3 + bob, 4, 5, '#ffffff');
            pr(g, 10, sy - 1 + bob, 3, 3, '#161620');
            pr(g, 19, sy - 1 + bob, 3, 3, '#161620');
            pr(g, 10, sy - 1 + bob, 1, 1, '#ffffff');
            pr(g, 13, sy + 4 + bob, 6, 1, tone(a, -2));
        }
        else if (kind === 'bat')
        {
            var by = 14 + bob;
            pr(g, 1, by - 2, 12, 5, tone(a, -.8));
            pr(g, 19, by - 2, 12, 5, tone(a, -.8));
            pr(g, 2, by - 4, 10, 4, a);
            pr(g, 20, by - 4, 10, 4, a);
            pr(g, 1, by + 2, 12, 2, tone(a, -1.8));
            pr(g, 19, by + 2, 12, 2, tone(a, -1.8));
            orb(g, 16, by + 2, 6, 6, a, 1.4);
            pr(g, 11, by - 6, 3, 5, tone(a, -.6));
            pr(g, 18, by - 6, 3, 5, tone(a, -.6));
            pr(g, 13, by, 3, 3, '#ff5050');
            pr(g, 17, by, 3, 3, '#ff5050');
            pr(g, 13, by, 1, 1, '#ffd0d0');
            pr(g, 14, by + 5, 4, 2, '#ffffff');
        }
        else if (kind === 'bug' || kind === 'grub')
        {
            var gy = 18 + bob;
            pe(g, 16, gy, 10, 6, tone(a, -1.2));
            pe(g, 16, gy - 1, 9, 5, a);
            pe(g, 12, gy - 3, 4, 2, tone(a, 1.5));
            var seg;
            for (seg = 0; seg < 3; seg++)
            {
                pr(g, 9 + seg * 5, gy - 4, 1, 8, tone(a, -1.4));
            }
            orb(g, 24, gy - 2, 5, 4, a, 1.3);
            pr(g, 26, gy - 4, 2, 2, '#161620');
            pr(g, 22, gy - 4, 2, 2, '#161620');
            pr(g, 27, gy - 7, 1, 3, tone(a, -1.6));
            pr(g, 23, gy - 7, 1, 3, tone(a, -1.6));
            pr(g, 8, gy + 3, 3, 2, tone(a, -1.6));
        }
        else if (kind === 'fly')
        {
            var fy = 15 + bob;
            pr(g, 2, fy - 4 - bob, 11, 4, 'rgba(215,228,255,.55)');
            pr(g, 19, fy - 4 - bob, 11, 4, 'rgba(215,228,255,.55)');
            pr(g, 3, fy - 4 - bob, 9, 1, 'rgba(255,255,255,.75)');
            orb(g, 16, fy + 2, 7, 6, a, 1.4);
            pr(g, 11, fy, 4, 4, '#ff5050');
            pr(g, 17, fy, 4, 4, '#ff5050');
            pr(g, 11, fy, 2, 2, '#ffc0c0');
            pr(g, 13, fy + 7, 6, 2, tone(a, -1.8));
        }
        else if (kind === 'skeleton')
        {
            var ky = 4 + bob;
            pr(g, 10, ky, 12, 11, a);
            pr(g, 10, ky, 5, 11, tone(a, 1));
            pr(g, 19, ky + 1, 3, 10, tone(a, -1.2));
            pr(g, 12, ky + 4, 4, 4, '#161620');
            pr(g, 17, ky + 4, 4, 4, '#161620');
            pr(g, 13, ky + 5, 2, 2, '#ff6a3a');
            pr(g, 18, ky + 5, 2, 2, '#ff6a3a');
            pr(g, 12, ky + 10, 9, 2, tone(a, -1.4));
            pr(g, 13, ky + 10, 1, 2, a);
            pr(g, 16, ky + 10, 1, 2, a);
            pr(g, 19, ky + 10, 1, 2, a);
            pr(g, 14, ky + 12, 5, 5, a);
            var rb;
            for (rb = 0; rb < 3; rb++)
            {
                pr(g, 8, ky + 14 + rb * 4, 17, 2, a);
                pr(g, 8, ky + 15 + rb * 4, 17, 1, tone(a, -1.4));
            }
            pr(g, 10, ky + 26 + bob, 4, 5, a);
            pr(g, 18, ky + 26 - bob, 4, 5, a);
        }
        else if (kind === 'dust')
        {
            var dy = 18 + bob;
            orb(g, 16, dy, 10, 9, a, 1.2);
            pe(g, 6, dy - 8 + bob, 5, 4, tone(a, -.6));
            pe(g, 26, dy - 8 - bob, 5, 4, tone(a, -.6));
            pe(g, 10, dy - 11 + bob, 3, 3, tone(a, .8));
            pr(g, 10, dy - 3, 5, 5, '#f2e070');
            pr(g, 17, dy - 3, 5, 5, '#f2e070');
            pr(g, 11, dy - 2, 3, 3, '#fff8b8');
            pr(g, 18, dy - 2, 3, 3, '#fff8b8');
        }
        else if (kind === 'shadow')
        {
            var hy = 16 + bob;
            pe(g, 16, hy + 8, 11, 8, tone(a, -1.2));
            pr(g, 5, hy + 4, 22, 10, a);
            pr(g, 5, hy + 12, 22, 3, tone(a, -1.8));
            pr(g, 8, hy - 8, 16, 13, a);
            pr(g, 8, hy - 8, 6, 13, tone(a, .9));
            pr(g, 6, hy - 5, 3, 8, a);
            pr(g, 23, hy - 5, 3, 8, a);
            pr(g, 11, hy - 4, 4, 4, '#e04040');
            pr(g, 17, hy - 4, 4, 4, '#e04040');
            pr(g, 11, hy - 4, 2, 2, '#ff9090');
            pr(g, 12, hy + 2, 8, 1, tone(a, -2));
        }
        else if (kind === 'serpent')
        {
            var vy = 12 + bob;
            orb(g, 9, vy, 7, 6, a, 1.4);
            pr(g, 12, vy + 2, 9, 7, a);
            pr(g, 18, vy + 6, 9, 7, tone(a, -.6));
            pr(g, 24, vy + 10 - bob, 7, 5, tone(a, -1.2));
            pr(g, 12, vy + 7, 9, 2, tone(a, -1.6));
            pr(g, 18, vy + 11, 9, 2, tone(a, -1.6));
            pr(g, 6, vy - 3, 3, 3, '#f2e050');
            pr(g, 11, vy - 3, 3, 3, '#f2e050');
            pr(g, 6, vy - 3, 1, 1, '#ffffff');
            pr(g, 2, vy + 2, 5, 2, tone(a, -1.4));
            pr(g, 1, vy + 3, 3, 1, '#e04040');
        }
        else
        {
            orb(g, 16, 18, 9, 9, a, 1.4);
            pr(g, 11, 15, 4, 4, '#161620');
            pr(g, 18, 15, 4, 4, '#161620');
        }
    }, { outline: true });
}

// ---------- animals ----------

function sprAnimal(kind, frame, baby)
{
    var s = baby ? .68 : 1;
    var W = Math.round(48 * s), H = Math.round(40 * s);
    return bake('ani:' + kind + ':' + frame + ':' + (baby ? 1 : 0), W, H, function (g)
    {
        var bob = frame % 2;
        var body = { chicken: '#f4f4ec', duck: '#f2f2fa', rabbit: '#f0e8da',
            cow: '#f6f2ea', goat: '#eae0d2', sheep: '#f6f2e6', pig: '#f2b2ba' }[kind] || '#eee';
        var spot = { chicken: '#dedecc', duck: '#c8d8e8', rabbit: '#d2c6b2',
            cow: '#3d2c1c', goat: '#a89880', sheep: '#e2ded2', pig: '#da8a9a' }[kind];
        var q = function (v) { return Math.round(v * s); };

        contactShadow(g, W / 2, H - 3, q(17), q(4));

        if (kind === 'chicken' || kind === 'duck')
        {
            orb(g, q(22), q(24) + bob, q(13), q(10), body, 1.5);
            pe(g, q(14), q(26) + bob, q(7), q(6), spot);
            orb(g, q(33), q(13) + bob, q(8), q(8), body, 1.6);
            pr(g, q(39), q(13) + bob, q(7), q(4), '#eaa02a');
            pr(g, q(39), q(15) + bob, q(6), q(2), '#c07a10');
            pr(g, q(33), q(10) + bob, q(3), q(3), '#1d1710');
            pr(g, q(33), q(10) + bob, q(1), q(1), '#ffffff');
            if (kind === 'chicken')
            {
                pe(g, q(31), q(5) + bob, q(4), q(3), '#d84040');
                pe(g, q(35), q(4) + bob, q(3), q(2), '#e85858');
                pe(g, q(37), q(19) + bob, q(2), q(2), '#d84040');
            }
            else
            {
                pe(g, q(31), q(6) + bob, q(4), q(3), tone(body, -1));
            }
            pr(g, q(16), q(32), q(3), q(6), '#eaa02a');
            pr(g, q(25), q(32), q(3), q(6), '#eaa02a');
            pr(g, q(14), q(37), q(6), q(2), '#c07a10');
            pr(g, q(23), q(37), q(6), q(2), '#c07a10');
            pe(g, q(11), q(22) + bob, q(4), q(5), tone(body, -.8));
        }
        else if (kind === 'rabbit')
        {
            orb(g, q(21), q(26) + bob, q(13), q(10), body, 1.5);
            orb(g, q(34), q(18) + bob, q(8), q(8), body, 1.6);
            pe(g, q(32), q(6) + bob, q(3), q(8), body);
            pe(g, q(38), q(6) + bob, q(3), q(8), body);
            pe(g, q(32), q(7) + bob, q(2), q(5), '#e8b0b8');
            pe(g, q(38), q(7) + bob, q(2), q(5), '#e8b0b8');
            pr(g, q(37), q(16) + bob, q(3), q(3), '#1d1710');
            pr(g, q(37), q(16) + bob, q(1), q(1), '#ffffff');
            pr(g, q(41), q(20) + bob, q(3), q(2), '#e8a0a8');
            orb(g, q(9), q(26), q(5), q(5), '#ffffff', 1.6);
            pr(g, q(16), q(34), q(4), q(4), tone(body, -1.4));
            pr(g, q(24), q(34), q(4), q(4), tone(body, -1.4));
        }
        else
        {
            // quadrupeds
            pr(g, q(9), q(28), q(6), q(11), tone(body, -1.6));
            pr(g, q(29), q(28), q(6), q(11), tone(body, -1.6));
            pr(g, q(9), q(36), q(6), q(3), '#584838');
            pr(g, q(29), q(36), q(6), q(3), '#584838');
            orb(g, q(22), q(22) + bob, q(17), q(11), body, 1.4);
            pr(g, q(6), q(16) + bob, q(32), q(14), body);
            pr(g, q(6), q(26) + bob, q(32), q(4), tone(body, -1.2));
            pr(g, q(6), q(16) + bob, q(32), q(3), tone(body, 1.2));
            orb(g, q(39), q(15) + bob, q(9), q(9), body, 1.5);
            pr(g, q(43), q(13) + bob, q(3), q(3), '#1d1710');
            pr(g, q(43), q(13) + bob, q(1), q(1), '#ffffff');
            pr(g, q(45), q(18) + bob, q(4), q(3), tone(body, -1.4));
            pr(g, q(2), q(18) + bob, q(6), q(3), tone(body, -1));
            if (kind === 'cow')
            {
                pe(g, q(16), q(20), q(6), q(4), spot);
                pe(g, q(30), q(24), q(4), q(3), spot);
                pe(g, q(10), q(25), q(3), q(2), spot);
                pr(g, q(36), q(7) + bob, q(3), q(6), '#e8e0d0');
                pr(g, q(44), q(7) + bob, q(3), q(6), '#e8e0d0');
                pe(g, q(22), q(31), q(4), q(3), '#e8b0b8');
            }
            else if (kind === 'sheep')
            {
                orb(g, q(13), q(15), q(7), q(6), spot, 1.6);
                orb(g, q(23), q(13), q(8), q(7), spot, 1.7);
                orb(g, q(32), q(16), q(6), q(6), spot, 1.5);
                orb(g, q(18), q(22), q(6), q(5), spot, 1.3);
                orb(g, q(28), q(23), q(5), q(5), spot, 1.2);
            }
            else if (kind === 'goat')
            {
                pr(g, q(36), q(4) + bob, q(3), q(7), '#8a7a60');
                pr(g, q(43), q(4) + bob, q(3), q(7), '#8a7a60');
                pr(g, q(35), q(3) + bob, q(3), q(3), '#6a5a44');
                pr(g, q(44), q(3) + bob, q(3), q(3), '#6a5a44');
                pr(g, q(41), q(22) + bob, q(4), q(6), '#d8ccb8');
                pe(g, q(12), q(20), q(5), q(4), spot);
            }
            else if (kind === 'pig')
            {
                pe(g, q(46), q(17) + bob, q(4), q(3), spot);
                pr(g, q(45), q(16) + bob, q(1), q(1), '#8a4a58');
                pr(g, q(47), q(16) + bob, q(1), q(1), '#8a4a58');
                pe(g, q(37), q(7) + bob, q(4), q(4), spot);
                pe(g, q(44), q(7) + bob, q(4), q(4), spot);
                pe(g, q(12), q(22), q(5), q(4), spot);
                pr(g, q(3), q(16) + bob, q(4), q(2), spot);
            }
        }
    }, { outline: true });
}

// ---------- effects ----------

function sprParticle(kind)
{
    return bake('fx:' + kind, 12, 12, function (g)
    {
        if (kind === 'water')
        {
            pe(g, 6, 6, 3, 3, 'rgba(150,210,255,.85)');
            pr(g, 4, 4, 2, 1, 'rgba(230,248,255,.9)');
        }
        else if (kind === 'dirt')
        {
            pe(g, 5, 6, 3, 2, '#7a5430');
            pr(g, 4, 5, 2, 1, '#96683c');
        }
        else if (kind === 'leaf')
        {
            pe(g, 6, 6, 4, 2, '#59a83c');
            pr(g, 4, 5, 2, 1, '#7cc45a');
            pr(g, 2, 6, 8, 1, '#3f7a28');
        }
        else if (kind === 'leaf_fall')
        {
            pe(g, 6, 6, 4, 2, '#c8742a');
            pr(g, 4, 5, 2, 1, '#e8a04a');
            pr(g, 2, 6, 8, 1, '#9a4e18');
        }
        else if (kind === 'heart')
        {
            pe(g, 4, 5, 2, 2, '#e8567a');
            pe(g, 8, 5, 2, 2, '#e8567a');
            pr(g, 3, 5, 7, 3, '#e8567a');
            pr(g, 4, 8, 5, 1, '#e8567a');
            pr(g, 5, 9, 3, 1, '#c8395e');
            pr(g, 6, 10, 1, 1, '#c8395e');
            pr(g, 4, 4, 2, 1, '#f79ab0');
        }
        else if (kind === 'fishmark')
        {
            pe(g, 5, 6, 4, 2, '#8fd0f0');
            pr(g, 8, 5, 3, 3, '#8fd0f0');
            pr(g, 3, 5, 1, 1, '#1a3a52');
            pr(g, 2, 6, 4, 1, 'rgba(143,208,240,.6)');
        }
        else if (kind === 'spark')
        {
            pr(g, 5, 1, 2, 10, '#fff4b0');
            pr(g, 1, 5, 10, 2, '#fff4b0');
            pr(g, 4, 4, 4, 4, '#ffffff');
            pr(g, 3, 3, 2, 2, 'rgba(255,240,150,.7)');
        }
        else if (kind === 'puff')
        {
            pe(g, 6, 6, 5, 5, 'rgba(220,220,235,.5)');
            pe(g, 4, 4, 3, 3, 'rgba(255,255,255,.6)');
        }
        else if (kind === 'snow')
        {
            pe(g, 6, 6, 2, 2, 'rgba(255,255,255,.92)');
            pr(g, 5, 5, 1, 1, '#ffffff');
        }
        else if (kind === 'rain')
        {
            pr(g, 5, 0, 1, 9, 'rgba(175,210,240,.75)');
            pr(g, 5, 7, 2, 2, 'rgba(200,228,250,.55)');
        }
        else
        {
            pe(g, 6, 6, 3, 3, '#ffffff');
        }
    });
}

function drawHeartIcon(g, x, y, s, filled)
{

    var rows = [
        '.aa.aa.',
        'aaaaaaa',
        'aaaaaaa',
        '.aaaaa.',
        '..aaa..',
