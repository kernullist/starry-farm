}

function showCalendar()
{
    var lines = [];
    var i;
    for (i = 0; i < FESTIVALS.length; i++)
    {
        var f = FESTIVALS[i];
        if (f.season === seasonId())
        {
            lines.push('  ' + f.day + '일 — ' + f.name);
        }
    }
    var bd = [];
    for (i = 0; i < NPCS.length; i++)
    {
        var d = NPCS[i];
        if (d.bd && d.bd.s === seasonId())
        {
            bd.push('  ' + d.bd.d + '일 — ' + d.name + ' 생일');
        }
    }
    bd.sort();
    modalMsg('📅 ' + SEASON_KR[seasonId()] + ' 달력',
        (lines.length ? '축제\n' + lines.join('\n') + '\n\n' : '') +
        (bd.length ? '생일\n' + bd.join('\n') : ''));
}

function openElevator()
{
    var m = modalShell('🛗 엘리베이터');
    m.body.appendChild(el('div', 'hint', '최고 깊이: ' + S.mineDeep + '층'));
    var grid = el('div');
    grid.style.cssText = 'display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;';
    var f;
    for (f = 0; f <= S.mineDeep; f += 5)
    {
        (function (fl)
        {
            var b = el('button', 'btn small' + (fl === MINE.floor ? ' gray' : ''), fl === 0 ? '입구' : fl + 'F');
            b.onclick = function ()
            {
                closeModal();
                fadeOut(function ()
                {
                    if (fl === 0)
                    {
                        leaveMine();
                    }
                    else
                    {
                        enterMine(fl);
                    }
                });
            };
            grid.appendChild(b);
        })(f);
    }
    m.body.appendChild(grid);
    openModal(m);
}

function openChest(o)
{
    var m = modalShell('📦 상자');
    m.body.appendChild(el('div', 'sectionTitle', '상자 안'));
    var g1 = el('div', 'grid');
    var i;
    for (i = 0; i < 24; i++)
    {
        (function (idx)
        {
            var sl = o.items[idx];
            var c = el('div', 'cell');
            if (sl)
            {
                c.appendChild(cvOf(itemIcon(sl.id, 30), 30));
                if (sl.n > 1)
                {
                    c.appendChild(el('span', 'qty', String(sl.n)));
                }
                c.onclick = function ()
                {
                    if (addItemWithPrice(sl))
                    {
                        o.items.splice(idx, 1);
                        closeModal();
                        openChest(o);
                        UI.lastHudKey = '';
                    }
                    else
                    {
                        toast('가방이 가득 찼어요.');
                    }
                };
            }
            g1.appendChild(c);
        })(i);
    }
    m.body.appendChild(g1);
    m.body.appendChild(el('div', 'sectionTitle', '내 가방'));
    var g2 = el('div', 'grid');
    for (i = 0; i < S.invSize; i++)
    {
        (function (idx)
        {
            var sl = S.inv[idx];
            var c = el('div', 'cell' + (sl && isTool(sl.id) ? ' dim' : ''));
            if (sl)
            {
                c.appendChild(cvOf(itemIcon(sl.id, 30), 30));
                if (sl.n > 1)
                {
                    c.appendChild(el('span', 'qty', String(sl.n)));
                }
                c.onclick = function ()
                {
                    if (isTool(sl.id))
                    {
                        toast('도구는 넣을 수 없어요.');
                        return;
                    }
                    if (o.items.length >= 24)
                    {
                        toast('상자가 가득 찼어요.');
                        return;
                    }
                    o.items.push({ id: sl.id, n: sl.n, q: sl.q || 0, px: sl.px });
                    S.inv[idx] = null;
                    closeModal();
                    openChest(o);
                    UI.lastHudKey = '';
                };
            }
            g2.appendChild(c);
        })(i);
    }
    m.body.appendChild(g2);
    openModal(m);
}

// ---------- sprinklers ----------

function runSprinklers()
{
    var mid;
    for (mid in MAP_CACHE)
    {
        if (!MAP_CACHE.hasOwnProperty(mid))
        {
            continue;
        }
        var m = MAP_CACHE[mid];
        var i;
        for (i = 0; i < m.objects.length; i++)
        {
            var o = m.objects[i];
            if (o.kind !== 'sprinkler')
            {
                continue;
            }
            var r = o.mk === 'sprinkler_q' ? 1 : 0;
            var dx, dy;
            for (dy = -1 - r; dy <= 1 + r; dy++)
            {
                for (dx = -1 - r; dx <= 1 + r; dx++)
                {
                    if (r === 0 && Math.abs(dx) + Math.abs(dy) !== 1)
                    {
                        continue;
                    }
                    if (dx === 0 && dy === 0)
                    {
                        continue;
                    }
                    var s = soilAt(mid, o.x + dx, o.y + dy);
                    if (s)
                    {
                        s.w = 1;
                    }
                }
            }
        }
    }
}

// ---------- particles ----------

function spawnFx(x, y, kind)
{
    var i;
    var n = kind === 'spark' ? 4 : 5;
    for (i = 0; i < n; i++)
    {
        FX.push({
            x: x, y: y, kind: kind,
            vx: (Math.random() * 2 - 1) * 46,
            vy: -34 - Math.random() * 42,
            life: .45 + Math.random() * .3
        });
    }
}

function updateFx(dt)
{
    var i;
    for (i = FX.length - 1; i >= 0; i--)
    {
        var p = FX[i];
        p.life -= dt;
        if (p.life <= 0)
        {
            FX.splice(i, 1);
            continue;
        }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 175 * dt;
    }
}

// ---------- weather particles ----------

var WEATHER_P = [];

function updateWeather(dt)
{
    if (!MAP || !MAP.outdoor)
    {
        WEATHER_P.length = 0;
        return;
    }
    var want = 0;
    if (S.weather === 'rain')
    {
        want = 70;
    }
    else if (S.weather === 'storm')
    {
        want = 110;
    }
    else if (S.weather === 'snow')
    {
        want = 55;
    }
    else if (S.weather === 'wind')
    {
        want = 22;
    }
    while (WEATHER_P.length < want)
    {
        WEATHER_P.push({
            x: Math.random() * (VIEW.w + 60) - 30,
            y: Math.random() * VIEW.h,
            v: S.weather === 'snow' ? 26 + Math.random() * 18 : 200 + Math.random() * 120,
            sway: Math.random() * 6.28
        });
    }
    while (WEATHER_P.length > want)
    {
        WEATHER_P.pop();
    }
    var i;
    for (i = 0; i < WEATHER_P.length; i++)
    {
        var p = WEATHER_P[i];
        p.y += p.v * dt;
        p.x += (S.weather === 'snow' ? Math.sin(p.sway + TICK * .02) * 8 : -30) * dt;
        if (p.y > VIEW.h)
        {
            p.y = -6;
            p.x = Math.random() * (VIEW.w + 60) - 30;
        }
        if (p.x < -30)
        {
            p.x = VIEW.w + 20;
        }
    }
}

// ---------- render ----------

function render()
{
    if (!S || !MAP)
    {
        return;
    }
    var g = G;
    g.setTransform(VIEW.scale, 0, 0, VIEW.scale, 0, 0);
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, VIEW.w, VIEW.h);

    var season = seasonId();
    camFollow(CAM, S.px, S.py - 16, MAP);
    var cx = Math.round(CAM.x), cy = Math.round(CAM.y);
    CAM.x = cx;
    CAM.y = cy;

    // ground
    var gc = groundCanvas(MAP, season);
    g.drawImage(gc, cx, cy, VIEW.w, VIEW.h, 0, 0, VIEW.w, VIEW.h);
    drawWaterOverlay(g, MAP, CAM, WATER_FRAME, VIEW.w, VIEW.h);

    // tilled soil + crops
    drawSoil(g, season);

    // y-sorted entities
    var list = [];
    var i;
    var x0 = cx - 80, y0 = cy - 130, x1 = cx + VIEW.w + 80, y1 = cy + VIEW.h + 80;
    for (i = 0; i < MAP.objects.length; i++)
    {
        var o = MAP.objects[i];
        var ox = o.x * TILE, oy = o.y * TILE;
        if (ox < x0 || oy < y0 || ox > x1 || oy > y1)
        {
            continue;
        }
        list.push({ y: oy + (o.kind === 'building' || o.kind === 'animalbuilding' ? o.th * TILE : TILE), o: o });
    }
    for (i = 0; i < ACTORS.length; i++)
    {
        list.push({ y: ACTORS[i].y, a: ACTORS[i] });
    }
    for (i = 0; i < MINE.mobs.length; i++)
    {
        list.push({ y: MINE.mobs[i].y, m: MINE.mobs[i] });
    }
    list.push({ y: S.py, p: true });
    list.sort(function (a, b) { return a.y - b.y; });

    for (i = 0; i < list.length; i++)
    {
        var e = list[i];
        if (e.o)
        {
            drawObject(g, e.o, CAM, season, TICK);
        }
        else if (e.a)
        {
            drawOneActor(g, e.a);
        }
        else if (e.m)
        {
            drawOneMob(g, e.m);
        }
        else
        {
            drawPlayer(g);
        }
    }

    drawSwing(g, CAM);
    drawFishingWorld(g, CAM);

    // particles
    for (i = 0; i < FX.length; i++)
    {
        var p = FX[i];
        g.globalAlpha = Math.min(1, p.life * 2.5);
        g.drawImage(sprParticle(p.kind), Math.round(p.x - cx - 6), Math.round(p.y - cy - 6));
    }
    g.globalAlpha = 1;

    // weather
    if (MAP.outdoor && WEATHER_P.length)
    {
        var img = sprParticle(S.weather === 'snow' ? 'snow' : 'rain');
        for (i = 0; i < WEATHER_P.length; i++)
        {
            g.drawImage(img, Math.round(WEATHER_P[i].x), Math.round(WEATHER_P[i].y));
        }
    }

    // night / indoor tint
    var dk = MAP.outdoor ? darkness() : (MAP.id === 'mine' ? .35 : Math.min(.28, darkness()));
    if (dk > .01)
    {
        g.fillStyle = 'rgba(18,20,52,' + dk + ')';
        g.fillRect(0, 0, VIEW.w, VIEW.h);
        // player light pool
        var lg = g.createRadialGradient(S.px - cx, S.py - cy - 18, 10, S.px - cx, S.py - cy - 18, 118);
        lg.addColorStop(0, 'rgba(255,225,150,' + (dk * .5) + ')');
        lg.addColorStop(1, 'rgba(255,225,150,0)');
        g.fillStyle = lg;
        g.fillRect(S.px - cx - 120, S.py - cy - 138, 240, 240);
    }
    if (S.weather === 'storm' && MAP.outdoor && Math.random() < .004)
    {
        g.fillStyle = 'rgba(255,255,255,.5)';
        g.fillRect(0, 0, VIEW.w, VIEW.h);
    }

    // interaction hint
    drawHint(g);
}

function drawSoil(g, season)
{
    var mid = MAP.id;
    var sm = S.soil[mid];
    if (!sm)
    {
        return;
    }
    var cx = CAM.x, cy = CAM.y;
    var k;
    for (k in sm)
    {
        if (!sm.hasOwnProperty(k))
        {
            continue;
        }
        var parts = k.split(',');
        var x = parseInt(parts[0], 10) * TILE - cx;
        var y = parseInt(parts[1], 10) * TILE - cy;
        if (x < -TILE || y < -TILE || x > VIEW.w || y > VIEW.h)
        {
            continue;
        }
        var s = sm[k];
        g.drawImage(tileTilled(s.w || (isRaining() && MAP.outdoor)), x, y);
        if (s.f)
        {
            g.globalAlpha = .5;
            g.fillStyle = s.f === 'fert_quality' ? '#4a9a6a' : (s.f === 'speed_gro' ? '#5a8ad0' : '#8a6a3a');
            g.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);
            g.globalAlpha = 1;
        }
    }
    var cm = S.crops[mid];
    if (!cm)
    {
        return;
    }
    for (k in cm)
    {
        if (!cm.hasOwnProperty(k))
        {
            continue;
        }
        var p2 = k.split(',');
        var tx = parseInt(p2[0], 10), ty = parseInt(p2[1], 10);
        var sx = tx * TILE - cx, sy = ty * TILE - cy;
        if (sx < -TILE * 2 || sy < -TILE * 2 || sx > VIEW.w + TILE || sy > VIEW.h + TILE)
        {
            continue;
        }
        var c = cm[k];
        var st = cropStage(c);
        g.drawImage(sprCrop(c.seed, st), sx, sy - 12);
        if (cropReady(c))
        {
            drawSparkle(g, sx + HALF, sy - 4, TICK);
        }
    }
}

// the sprite's contact shadow sits at y=50, so anchor the feet to S.py
var PLAYER_DX = -PW / 2;
var PLAYER_DY = -50;

function drawPlayer(g)
{
    var x = Math.round(S.px + PLAYER_DX - CAM.x);
    var y = Math.round(S.py + PLAYER_DY - CAM.y);
    var dir = S.dir === 0 ? 0 : (S.dir === 1 ? 1 : 2);
    var flip = S.dir === 3;
    var frame = PLAYER.moving ? PLAYER.frame : 0;
    if (MINE.hurtCd > 40 && MINE.hurtCd % 6 < 3)
    {
        g.globalAlpha = .5;
    }
    var spr = personSprite('me', S.look, dir, frame);
    if (flip)
    {
        g.save();
        g.translate(x + PW, y);
        g.scale(-1, 1);
        g.drawImage(spr, 0, 0);
        g.restore();
    }
    else
    {
        g.drawImage(spr, x, y);
    }
    g.globalAlpha = 1;

    // tool swing pose
    if (PLAYER.act > 0)
    {
        PLAYER.act--;
        var p = 1 - PLAYER.act / 14;
        var ico = itemIcon(PLAYER.actKind, 26);
        var ox = S.dir === 2 ? -22 : (S.dir === 3 ? 22 : 0);
        var oy = S.dir === 1 ? -22 : (S.dir === 0 ? 14 : -4);
        g.save();
        g.translate(x + PW / 2 + ox, y + 30 + oy);
        g.rotate((S.dir === 2 ? -1 : 1) * (-.7 + p * 1.5));
        g.drawImage(ico, -13, -13);
        g.restore();
    }
}

function drawOneActor(g, a)
{
    var x = Math.round(a.x - PW / 2 - CAM.x);
    var y = Math.round(a.y - 50 - CAM.y);
    var spr = personSprite(a.id, a.def.look, a.dir, a.frame);
    if (a.dir === 2 && a.flip)
    {
        g.save();
        g.translate(x + PW, y);
        g.scale(-1, 1);
        g.drawImage(spr, 0, 0);
        g.restore();
    }
    else
    {
        g.drawImage(spr, x, y);
    }
    if (isBirthday(a.id))
    {
        drawSparkle(g, x + PW / 2, y - 4, TICK);
    }
}

function drawOneMob(g, mob)
{
    var def = MONSTERS[mob.kind];
    var x = Math.round(mob.x - HALF - CAM.x);
    var y = Math.round(mob.y - 26 - CAM.y);
    if (mob.hurt > 0 && mob.hurt % 4 < 2)
    {
        g.globalAlpha = .55;
    }
    g.drawImage(sprMonster(def.sprite, def.col, mob.frame), x, y);
    g.globalAlpha = 1;
    if (mob.hp < mob.maxHp)
    {
        pr(g, x + 2, y - 7, 28, 4, 'rgba(0,0,0,.6)');
        pr(g, x + 2, y - 7, Math.max(1, Math.round(28 * mob.hp / mob.maxHp)), 4, '#e05050');
    }
}

// small marker on the tile the tool would hit
function drawHint(g)
{
    if (FISHING.on || UI.modal)
    {
        return;
    }
    var f = facingTile();
    var sl = selSlot();
    if (!sl)
    {
        return;
    }
    var show = false;
    if (sl.id === 'hoe')
    {
        show = isTillable(MAP, f.x, f.y) && !soilAt(MAP.id, f.x, f.y);
    }
    else if (sl.id === 'can')
    {
        var s = soilAt(MAP.id, f.x, f.y);
        show = (s && !s.w) || isWater(MAP, f.x, f.y);
    }
    else if (CROPS[sl.id])
    {
        show = !!soilAt(MAP.id, f.x, f.y) && !cropAt(MAP.id, f.x, f.y);
    }
    if (!show)
    {
        return;
    }
    var x = f.x * TILE - CAM.x, y = f.y * TILE - CAM.y;
    g.strokeStyle = 'rgba(255,245,190,.8)';
    g.lineWidth = 1;
    g.strokeRect(x + .5, y + .5, TILE - 1, TILE - 1);
}

// ---------- title animation ----------

function animateTitle()
{
    var cv = document.getElementById('titleArt');
    if (!cv)
    {
        return;
    }
    var g = cv.getContext('2d');
    g.imageSmoothingEnabled = false;
    function step(t)
    {
        if (!document.getElementById('title').classList.contains('off'))
        {
            drawTitleArt(g, cv.width, cv.height, t);
        }
        requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
}

// ---------- main loop ----------

var CLOCK_ACC = 0;
var SAVE_ACC = 0;

function loop(ts)
{
    requestAnimationFrame(loop);
    if (!LAST)
    {
        LAST = ts;
    }
    var dt = Math.min(.05, (ts - LAST) / 1000);
    LAST = ts;
    TICK += dt * 60;

    if (!S || !document.getElementById('title').classList.contains('off'))
    {
        return;
    }

    var busy = UI.modal || UI.dialogue || UI.warping;

    if (!busy)
    {
        movePlayer(dt);
        updateActors(dt);
        updateMine(dt);
        updateFishing(dt);
    }
    updateFx(dt);
    updateWeather(dt);

    WATER_T += dt;
    if (WATER_T > .22)
    {
        WATER_T = 0;
        WATER_FRAME = (WATER_FRAME + 1) % 4;
    }

    // game clock
    if (!busy && !UI.blockTime && !UI.collapsing)
    {
        CLOCK_ACC += dt;
        if (CLOCK_ACC >= SEC_PER_TICK)
        {
            CLOCK_ACC -= SEC_PER_TICK;
            var before = S.time;
            advanceClock(MIN_PER_TICK);
            onClockTick(before);
        }
    }

    // periodic autosave
    SAVE_ACC += dt;
    if (SAVE_ACC > 60)
    {
        SAVE_ACC = 0;
        saveGame(true);
    }

    render();
    drawFishingBar();
    updateHud();
}

function onClockTick(before)
{
    // sprinklers fire at 6:10 each morning
    if (before < DAY_START + MIN_PER_TICK && S.time >= DAY_START + MIN_PER_TICK)
    {
        runSprinklers();
    }
    // short recipes (furnace, cheese, mayo) should finish within the same day
    tickMachines();
    // villagers change position on the hour
    if (Math.floor(S.time / 60) !== Math.floor(before / 60))
    {
        rebuildActors();
    }
    if (S.time === 25 * 60)
    {
        toast('벌써 새벽 1시예요! 곧 쓰러져요.');
    }
    else if (S.time === 24 * 60)
    {
        toast('자정이에요. 슬슬 자러 가요.');
    }
}

// ---------- start ----------

if (document.readyState === 'loading')
{
    document.addEventListener('DOMContentLoaded', boot);
}
else
{
    boot();
}

</script>
