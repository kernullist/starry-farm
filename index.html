<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="&#48324;&#48164; &#45453;&#51109;">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2d1b0e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%235a8f3d'/%3E%3Cpath d='M7 3h2v3h3v2H9v5H7V8H4V6h3z' fill='%23ffe9a8'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%235a8f3d'/%3E%3Cpath d='M7 3h2v3h3v2H9v5H7V8H4V6h3z' fill='%23ffe9a8'/%3E%3C/svg%3E">
<title>&#48324;&#48164; &#45453;&#51109;</title>
<style>
/* Starry Farm - UI styles. Stardew-like wooden/parchment theme. ASCII comments only. */

:root
{
    --wood-dark: #4a2c14;
    --wood: #7a4a22;
    --wood-light: #a86b32;
    --panel: #f3d9a4;
    --panel-2: #e8c689;
    --panel-hi: #fff0cd;
    --ink: #46280f;
    --ink-soft: #7a5730;
    --green: #6aa84f;
    --green-d: #4a7a34;
    --red: #c0392b;
    --blue: #3d7ea6;
    --gold: #f2c14e;
    --shadow: rgba(0, 0, 0, .35);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
}

*
{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
}

html, body
{
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #17100a;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    font-weight: 800;
    color: var(--ink);
    overscroll-behavior: none;
    touch-action: none;
}

#app
{
    position: fixed;
    inset: 0;
    overflow: hidden;
}

/* ---------- canvas ---------- */

#cvWrap
{
    position: absolute;
    inset: 0;
    background: #101a10;
}

#cv
{
    position: absolute;
    left: 0;
    top: 0;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
}

/* ---------- shared panel look ---------- */

.panel
{
    background: var(--panel);
    border: 3px solid var(--wood);
    border-radius: 8px;
    box-shadow: 0 0 0 3px var(--wood-dark), 0 6px 14px var(--shadow), inset 0 0 0 2px var(--panel-hi);
}

/* ---------- HUD: clock box (top right) ---------- */

#hud
{
    position: absolute;
    top: calc(6px + var(--safe-t));
    right: calc(8px + var(--safe-r));
    display: flex;
    align-items: flex-start;
    gap: 8px;
    z-index: 30;
    pointer-events: none;
}

#clockBox
{
    background: var(--panel);
    border: 3px solid var(--wood);
    border-radius: 10px;
    box-shadow: 0 0 0 3px var(--wood-dark), 0 6px 14px var(--shadow);
    padding: 6px 10px 7px;
    min-width: 116px;
    text-align: center;
    line-height: 1.15;
}

#clockDate
{
    font-size: 15px;
    letter-spacing: -.3px;
}

#clockDay
{
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 2px;
}

#clockFace
{
    position: relative;
    margin: 1px 0 3px;
}

#clockDial
{
    display: block;
    margin: 0 auto;
    image-rendering: pixelated;
}

#clockTime
{
    font-size: 13px;
    margin-top: -2px;
}

#clockGold
{
    font-size: 14px;
    border-top: 2px solid var(--wood-light);
    padding-top: 3px;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
}

.coin
{
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe9a0, var(--gold) 60%, #b8860b);
    box-shadow: inset 0 0 0 1px #8a6410;
    display: inline-block;
}

/* energy bar (vertical, right of clock in stardew; below it here for width) */

#energyWrap
{
    position: relative;
    width: 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

#energyBar
{
    width: 22px;
    height: 150px;
    background: #5c4326;
    border: 3px solid var(--wood);
    border-radius: 11px;
    box-shadow: 0 0 0 3px var(--wood-dark);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
}

#energyFill
{
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, #8fdc5a, #4fa32c);
    transition: height .25s ease;
}

#energyTxt
{
    font-size: 10px;
    color: var(--panel);
    text-shadow: 0 1px 2px #000, 0 0 3px #000;
    margin-top: 2px;
}

#healthWrap
{
    width: 26px;
}

#healthBar
{
    width: 22px;
    height: 150px;
    background: #5c4326;
    border: 3px solid var(--wood);
    border-radius: 11px;
    box-shadow: 0 0 0 3px var(--wood-dark);
    overflow: hidden;
    display: flex;
    align-items: flex-end;
}

#healthFill
{
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, #ff7b6b, #c0392b);
    transition: height .25s ease;
}

/* ---------- top-left buttons ---------- */

#topLeft
{
    position: absolute;
    top: calc(6px + var(--safe-t));
    left: calc(8px + var(--safe-l));
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 30;
}

.iconBtn
{
    width: 42px;
    height: 42px;
    font-size: 19px;
    background: var(--panel);
    border: 3px solid var(--wood);
    border-radius: 9px;
    box-shadow: 0 0 0 3px var(--wood-dark), 0 4px 8px var(--shadow);
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
}

.iconBtn:active
{
    transform: translateY(2px);
    background: var(--panel-2);
}

#questChip
{
    background: var(--panel);
    border: 3px solid var(--wood);
    border-radius: 9px;
    box-shadow: 0 0 0 3px var(--wood-dark);
    padding: 5px 10px;
    font-size: 12px;
    max-width: 190px;
    line-height: 1.25;
}

#weatherChip
{
    position: absolute;
    top: calc(54px + var(--safe-t));
    left: calc(8px + var(--safe-l));
    z-index: 29;
    font-size: 12px;
    color: #fff;
    text-shadow: 0 1px 3px #000, 0 0 6px #000;
    pointer-events: none;
}

/* ---------- bottom toolbar ---------- */

#toolbar
{
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(6px + var(--safe-b));
    display: flex;
    gap: 3px;
    padding: 4px;
    background: rgba(74, 44, 20, .82);
    border: 3px solid var(--wood-dark);
    border-radius: 10px;
    z-index: 28;
    max-width: calc(100% - 24px);
}

.slot
{
    position: relative;
    width: 44px;
    height: 44px;
    background: var(--panel-2);
    border: 2px solid var(--wood-light);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex: 0 0 auto;
}

.slot.sel
{
    background: var(--panel-hi);
    border-color: var(--gold);
    box-shadow: 0 0 0 2px var(--gold), 0 0 10px rgba(242, 193, 78, .7);
}

.slot canvas
{
    image-rendering: pixelated;
    display: block;
}

.slot .qty
{
    position: absolute;
    right: 2px;
    bottom: 0;
    font-size: 11px;
    color: #fff;
    text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
    pointer-events: none;
}

.slot .qbar
{
    position: absolute;
    left: 2px;
    right: 2px;
    bottom: 2px;
    height: 3px;
    border-radius: 2px;
    background: #6a4a2a;
    overflow: hidden;
}

.slot .qbar i
{
    display: block;
    height: 100%;
    background: #4fa32c;
}

/* item quality star */
.slot .qual
{
    position: absolute;
    left: 2px;
    bottom: 1px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .5);
}

.qual.s1 { background: #c0c8d0; }
.qual.s2 { background: #f2c14e; }
.qual.s3 { background: #b06ddb; }

/* ---------- touch controls ---------- */

#stickZone
{
    position: absolute;
    left: calc(10px + var(--safe-l));
    bottom: calc(62px + var(--safe-b));
    width: 132px;
    height: 132px;
    z-index: 27;
    touch-action: none;
}

#stickBase
{
    position: absolute;
    left: 0;
    top: 0;
    width: 132px;
    height: 132px;
    border-radius: 50%;
    background: rgba(255, 245, 220, .13);
    border: 3px solid rgba(255, 245, 220, .3);
    opacity: .55;
    transition: opacity .2s;
}

#stickZone.act #stickBase
{
    opacity: 1;
    background: rgba(255, 245, 220, .2);
}

#stickKnob
{
    position: absolute;
    left: 50%;
    top: 50%;
    width: 56px;
    height: 56px;
    margin: -28px 0 0 -28px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff3d6, #d8b077 70%, #9a7040);
    border: 3px solid rgba(74, 44, 20, .8);
    box-shadow: 0 3px 8px rgba(0, 0, 0, .5);
}

#actZone
{
    position: absolute;
    right: calc(14px + var(--safe-r));
    bottom: calc(62px + var(--safe-b));
    width: 156px;
    height: 132px;
    z-index: 27;
    pointer-events: none;
}

.actBtn
{
    position: absolute;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #ffeec6, #e2b877 62%, #a8742f);
    border: 4px solid rgba(74, 44, 20, .85);
    box-shadow: 0 4px 10px rgba(0, 0, 0, .5);
    font-family: inherit;
    cursor: pointer;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
}

#btnTool
{
    right: 0;
    bottom: 6px;
}

.actBtn.small
{
    width: 62px;
    height: 62px;
    left: 0;
    bottom: 12px;
    background: radial-gradient(circle at 35% 28%, #dff0ff, #93c4e0 62%, #4c7f9e);
}

.actBtn:active
{
    transform: scale(.93);
    filter: brightness(1.1);
}

.actIco
{
    font-size: 30px;
    line-height: 1;
    filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .4));
}

.actBtn.small .actIco
{
    font-size: 24px;
}

.actBtn canvas
{
    image-rendering: pixelated;
}

/* ---------- dialogue ---------- */

#dialogueBox
{
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(64px + var(--safe-b));
    width: min(680px, calc(100% - 32px));
    background: var(--panel);
    border: 4px solid var(--wood);
    border-radius: 12px;
    box-shadow: 0 0 0 4px var(--wood-dark), 0 10px 24px var(--shadow);
    padding: 12px 14px;
    display: flex;
    gap: 12px;
    z-index: 60;
    cursor: pointer;
}

#dlgPortrait
{
    flex: 0 0 auto;
    width: 64px;
    height: 64px;
    background: var(--panel-2);
    border: 3px solid var(--wood-light);
    border-radius: 8px;
    overflow: hidden;
}

#dlgFace
{
    image-rendering: pixelated;
    width: 100%;
    height: 100%;
    display: block;
}

#dlgBody
{
    flex: 1 1 auto;
    min-width: 0;
}

#dlgName
{
    font-size: 15px;
    color: var(--wood);
    margin-bottom: 3px;
}

#dlgText
{
    font-size: 15px;
    line-height: 1.5;
    font-weight: 700;
    min-height: 44px;
    white-space: pre-wrap;
}

#dlgNext
{
    position: absolute;
    right: 12px;
    bottom: 6px;
    font-size: 15px;
    color: var(--wood);
    animation: bob .8s ease-in-out infinite;
}

@keyframes bob
{
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(3px); }
}

/* ---------- fishing minigame bar ---------- */

#fishBox
{
    position: absolute;
    right: calc(24px + var(--safe-r));
    top: 50%;
    transform: translateY(-50%);
    z-index: 55;
    pointer-events: none;
}

#fishCv
{
    image-rendering: pixelated;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .6));
}

/* ---------- modals ---------- */

#dim
{
    position: absolute;
    inset: 0;
    background: rgba(20, 12, 5, .55);
    display: none;
    z-index: 70;
}

#dim.on
{
    display: block;
}

#modalHost
{
    position: absolute;
    inset: 0;
    z-index: 80;
    display: none;
    align-items: center;
    justify-content: center;
    padding: calc(10px + var(--safe-t)) 10px calc(10px + var(--safe-b));
}

#modalHost.on
{
    display: flex;
}

.modal
{
    background: var(--panel);
    border: 4px solid var(--wood);
    border-radius: 14px;
    box-shadow: 0 0 0 4px var(--wood-dark), 0 14px 34px var(--shadow);
    width: min(720px, 100%);
    max-height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.modalHead
{
    background: var(--wood);
    color: var(--panel-hi);
    padding: 9px 14px;
    font-size: 17px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex: 0 0 auto;
    border-bottom: 3px solid var(--wood-dark);
}

.modalHead .x
{
    width: 30px;
    height: 30px;
    border-radius: 7px;
    background: var(--panel);
    color: var(--ink);
    border: 2px solid var(--wood-dark);
    font-family: inherit;
    font-size: 16px;
    cursor: pointer;
}

.modalBody
{
    padding: 12px 14px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    flex: 1 1 auto;
    touch-action: pan-y;
}

.modalFoot
{
    padding: 8px 12px calc(10px);
    border-top: 3px solid var(--wood-light);
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    flex: 0 0 auto;
    flex-wrap: wrap;
}

.tabRow
{
    display: flex;
    gap: 4px;
    padding: 6px 10px 0;
    background: var(--wood);
    flex-wrap: wrap;
}

.tab
{
    background: var(--panel-2);
    border: 2px solid var(--wood-dark);
    border-bottom: none;
    border-radius: 7px 7px 0 0;
    padding: 5px 11px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    cursor: pointer;
    opacity: .7;
}

.tab.on
{
    background: var(--panel);
    opacity: 1;
}

/* inventory / shop grids */

.grid
{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
    gap: 5px;
}

.cell
{
    position: relative;
    aspect-ratio: 1;
    background: var(--panel-2);
    border: 2px solid var(--wood-light);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.cell.sel
{
    border-color: var(--gold);
    box-shadow: 0 0 0 2px var(--gold);
}

.cell.dim
{
    opacity: .38;
}

.cell canvas
{
    image-rendering: pixelated;
}

.cell .qty
{
    position: absolute;
    right: 2px;
    bottom: 1px;
    font-size: 11px;
    color: #fff;
    text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
}

.cell .qual
{
    position: absolute;
    left: 2px;
    bottom: 2px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .5);
}

.listRow
{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 8px;
    border-bottom: 2px solid rgba(122, 74, 34, .25);
}

.listRow:last-child
{
    border-bottom: none;
}

.listRow .ic
{
    width: 40px;
    height: 40px;
    flex: 0 0 auto;
    background: var(--panel-2);
    border: 2px solid var(--wood-light);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.listRow .ic canvas
{
    image-rendering: pixelated;
}

.listRow .tx
{
    flex: 1 1 auto;
    min-width: 0;
    font-size: 14px;
    line-height: 1.35;
}

.listRow .tx small
{
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
}

/* ---------- buttons ---------- */

.btn
{
    background: linear-gradient(180deg, var(--panel-hi), var(--panel-2));
    border: 3px solid var(--wood);
    border-radius: 9px;
    box-shadow: 0 0 0 2px var(--wood-dark), 0 3px 0 var(--wood-dark);
    padding: 8px 16px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 800;
    color: var(--ink);
    cursor: pointer;
}

.btn:active
{
    transform: translateY(3px);
    box-shadow: 0 0 0 2px var(--wood-dark);
}

.btn.green { background: linear-gradient(180deg, #9fd97a, var(--green)); }
.btn.red { background: linear-gradient(180deg, #f08d81, var(--red)); color: #fff2ea; }
.btn.blue { background: linear-gradient(180deg, #8fc6e5, var(--blue)); color: #f0f8ff; }
.btn.gray { background: linear-gradient(180deg, #ded4c4, #b5a692); }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }

/* ---------- toasts ---------- */

#toastWrap
{
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: calc(64px + var(--safe-t));
    z-index: 90;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    pointer-events: none;
    width: max-content;
    max-width: 90%;
}

.toast
{
    background: rgba(74, 44, 20, .93);
    color: var(--panel-hi);
    border: 2px solid var(--gold);
    border-radius: 9px;
    padding: 7px 14px;
    font-size: 14px;
    box-shadow: 0 4px 12px var(--shadow);
    animation: toastIn .25s ease;
    text-align: center;
}

@keyframes toastIn
{
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ---------- fade veil (sleep / warp) ---------- */

#fadeVeil
{
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 95;
    transition: opacity .45s linear;
}

#fadeVeil.on
{
    opacity: 1;
}

/* ---------- title screen ---------- */

#title
{
    position: absolute;
    inset: 0;
    z-index: 100;
    background:
        radial-gradient(ellipse at 50% 120%, #2f5c33 0%, #1b3320 45%, #0d1a14 100%),
        #0d1a14;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));
    text-align: center;
}

#title.off
{
    display: none;
}

#titleArt
{
    image-rendering: pixelated;
    width: min(480px, 80vw);
    height: auto;
    filter: drop-shadow(0 6px 16px rgba(0, 0, 0, .6));
}

#title h1
{
    font-size: clamp(30px, 8vw, 52px);
    color: #ffe9a8;
    letter-spacing: 2px;
    text-shadow: 0 3px 0 #7a4a22, 0 5px 12px rgba(0, 0, 0, .7);
}

#title .subtitle
{
    font-size: 14px;
    color: #cbe3c0;
    font-weight: 700;
    margin-bottom: 6px;
}

#titleBtns
{
    display: flex;
    flex-direction: column;
    gap: 9px;
    width: min(300px, 78vw);
}

#titleBtns .btn
{
    width: 100%;
}

.titleFoot
{
    position: absolute;
    bottom: calc(8px + var(--safe-b));
    font-size: 11px;
    color: #7f9179;
    font-weight: 700;
}

/* ---------- misc form bits used in modals ---------- */

.fld
{
    width: 100%;
    background: var(--panel-hi);
    border: 3px solid var(--wood);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 15px;
    font-family: inherit;
    font-weight: 800;
    color: var(--ink);
    -webkit-user-select: text;
    user-select: text;
}

textarea.fld
{
    min-height: 96px;
    resize: none;
    font-size: 12px;

    background: #b9a586;
}

.bundleSlot
{
    width: 40px;
    height: 40px;
    background: var(--panel-2);
    border: 2px solid var(--wood-light);
    border-radius: 6px;
    display: flex;
    align-items: center;

}

.bundleSlot.done
{
    border-color: var(--green);
    box-shadow: 0 0 0 2px var(--green);
}

.bundleSlot canvas
{
    image-rendering: pixelated;
}

@media (max-height: 480px)
{

    .actBtn { width: 70px; height: 70px; }

            I(k, t.name, 'seed', Math.floor(t.cost / 4), 'seed', [t.col, shade2(t.col, -50)], { buy: t.cost, sapling: k });
        }
    }
})();

function shade2(hex, amt)
{
    var n = parseInt(hex.slice(1), 16);
    var r = Math.max(0, Math.min(255, ((n >> 16) & 255) + amt));
    var g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
    var b = Math.max(0, Math.min(255, (n & 255) + amt));
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

    like: ['cheese', 'goat_cheese', 'wine', 'honey', 'jelly', 'truffle', 'diamond', 'emerald', 'ruby', 'jade', 'aquamarine', 'amethyst', 'topaz'],
    dislike: ['trash', 'slime', 'bat_wing', 'bug_meat', 'seaweed', 'algae', 'clay', 'coal', 'stone', 'fiber', 'sap'],
    hate: ['trash', 'bomb']
};

// season -> tint used by the renderer
// grass/grassAlt are deliberately far apart so the ground reads as patchy
// turf rather than one flat fill (see docs/plan/2026-07-29-art-overhaul.md)
var SEASON_TINT = {
    spring: { grass: '#57933a', grassAlt: '#41752c', leaf: '#64ac46', sky: '#8ec8e8' },
    summer: { grass: '#4d9130', grassAlt: '#376f22', leaf: '#3f9c34', sky: '#7ec0f0' },
    fall: { grass: '#8a8134', grassAlt: '#6d6425', leaf: '#c8742a', sky: '#b8b0d0' },
    winter: { grass: '#d6e2ee', grassAlt: '#bccddd', leaf: '#9fb8cc', sky: '#c8d8e8' }
};


/* ===== sprites.js ===== */

// Starry Farm - procedural pixel art (art v2).
// Everything is drawn in code and baked once into offscreen canvases.
// No external image assets. All comments ASCII only.
//
// Art rules (see docs/plan/2026-07-29-art-overhaul.md):
//   1. 32px tiles - enough pixel budget for 3-5 tone shading
//   2. tone() shifts hue, not just brightness: shadows go blue, highlights go warm
//   3. every baked sprite gets an alpha-edge outline derived from its own colours
//   4. entities get a contact shadow so nothing floats
//   5. texture is drawn as clusters (tufts, leaf clumps), never per-pixel noise

var SPR_CACHE = {};
var LIGHT_X = -1, LIGHT_Y = -1;   // light comes from the top-left

function makeCv(w, h)
{
    var c = document.createElement('canvas');
    c.width = Math.max(1, w | 0);
    c.height = Math.max(1, h | 0);
    var g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    return c;
}

// ---------- colour ----------

function hex2rgb(h)
{
    var n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function rgb2hex(r, g, b)
{
    r = Math.max(0, Math.min(255, Math.round(r)));
    g = Math.max(0, Math.min(255, Math.round(g)));
    b = Math.max(0, Math.min(255, Math.round(b)));
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function rgb2hsl(r, g, b)
{
    r /= 255;
    g /= 255;
    b /= 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    var l = (mx + mn) / 2, h = 0, s = 0;
    if (mx !== mn)
    {
        var d = mx - mn;
        s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
        if (mx === r)
        {
            h = ((g - b) / d + (g < b ? 6 : 0));
        }
        else if (mx === g)
        {
            h = (b - r) / d + 2;
        }
        else
        {
            h = (r - g) / d + 4;
        }
        h *= 60;
    }
    return [h, s, l];
}

function hsl2rgb(h, s, l)
{
    h = ((h % 360) + 360) % 360;
    var c = (1 - Math.abs(2 * l - 1)) * s;
    var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    var m = l - c / 2;
    var r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; }
    else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; }
    else { r = c; b = x; }
    return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
}

function rotToward(h, target, deg)
{
    var d = ((target - h + 540) % 360) - 180;
    if (Math.abs(d) <= deg)
    {
        return target;
    }
    return h + (d > 0 ? deg : -deg);
}

var TONE_CACHE = {};

// step < 0 -> shadow (hue toward blue, more saturated, darker)
// step > 0 -> highlight (hue toward warm yellow, less saturated, lighter)
function tone(hex, step)
{
    if (!step)
    {
        return hex;
    }
    var key = hex + '|' + step;
    var hit = TONE_CACHE[key];
    if (hit)
    {
        return hit;
    }
    var rgb = hex2rgb(hex);
    var hsl = rgb2hsl(rgb[0], rgb[1], rgb[2]);
    var h = hsl[0], s = hsl[1], l = hsl[2];
    var k = Math.abs(step);
    if (s < .06)
    {
        // greys still get a colour cast so they do not read as flat concrete
        h = step < 0 ? 225 : 45;
        s = .05 + .035 * k;
    }
    if (step < 0)
    {
        h = rotToward(h, 235, 9 * k);
        s = Math.min(1, s + .045 * k);
        l = Math.max(.02, l - .085 * k);
    }
    else
    {
        h = rotToward(h, 48, 7 * k);
        s = Math.max(0, s - .04 * k);
        l = Math.min(.98, l + .095 * k);
    }
    var out = hsl2rgb(h, s, l);
    var res = rgb2hex(out[0], out[1], out[2]);
    TONE_CACHE[key] = res;
    return res;
}

// kept for older call sites: brightness-only nudge expressed in tone steps
function shade(hex, amt)
{
    return tone(hex, amt / 22);
}

function mix(a, b, t)
{
    var A = hex2rgb(a), B = hex2rgb(b);
    return rgb2hex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
}

// ---------- pixel primitives ----------

function pr(g, x, y, w, h, c)
{
    g.fillStyle = c;
    g.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h)));
}

function pe(g, cx, cy, rx, ry, c)
{
    g.fillStyle = c;
    var y;
    for (y = -ry; y <= ry; y++)
    {
        var t = 1 - (y * y) / (ry * ry);
        if (t <= 0)
        {
            continue;
        }
        var w = Math.round(rx * Math.sqrt(t));
        if (w <= 0)
        {
            continue;
        }
        g.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2, 1);
    }
}

// filled ellipse with a light-source aware 3 tone shade
function orb(g, cx, cy, rx, ry, col, lift)
{
    lift = lift === undefined ? 1 : lift;
    pe(g, cx, cy, rx, ry, tone(col, -1.2));
    pe(g, cx, cy - Math.max(1, ry * .12), rx - 1, ry - 1, col);
    if (rx > 2 && ry > 2)
    {
        pe(g, cx + LIGHT_X * (rx * .32), cy + LIGHT_Y * (ry * .3), Math.max(1, rx * .42), Math.max(1, ry * .38), tone(col, lift));
    }
}

function pmap(g, rows, pal, x, y, flip)
{
    var r, c;
    for (r = 0; r < rows.length; r++)
    {
        var row = rows[r];
        for (c = 0; c < row.length; c++)
        {
            var ch = row.charAt(c);
            if (ch === '.' || ch === ' ')
            {
                continue;
            }
            var col = pal[ch];
            if (!col)
            {
                continue;
            }
            var cx = flip ? (row.length - 1 - c) : c;
            g.fillStyle = col;
            g.fillRect(x + cx, y + r, 1, 1);
        }
    }
}

function hash2(x, y, seed)
{
    var h = (x * 374761393 + y * 668265263 + (seed || 0) * 1274126177) | 0;
    h = (h ^ (h >> 13)) * 1274126177;
    h = h ^ (h >> 16);
    return ((h >>> 0) % 100000) / 100000;
}

// ---------- texture helpers ----------

var BAYER4 = [
    [0, 8, 2, 10],
    [12, 4, 14, 6],
    [3, 11, 1, 9],
    [15, 7, 13, 5]
];

// ordered dither between two colours; t = 0 all A, 1 all B
function dither(g, x, y, w, h, a, b, t)
{
    var i, j;
    for (j = 0; j < h; j++)
    {
        for (i = 0; i < w; i++)
        {
            var th = (BAYER4[j & 3][i & 3] + .5) / 16;
            g.fillStyle = t > th ? b : a;
            g.fillRect(x + i, y + j, 1, 1);
        }
    }
}

// a tuft of grass blades: reads as a clump, not noise
function tuft(g, x, y, hgt, col, seed)
{
    var n = 3 + Math.floor(hash2(x, y, seed) * 3);
    var i;
    for (i = 0; i < n; i++)
    {
        var bx = x + i - (n >> 1);
        var bh = Math.max(2, hgt - Math.abs(i - (n >> 1)) * 2 - Math.floor(hash2(i, y, seed) * 2));
        var lean = (i - (n >> 1)) > 0 ? 1 : -1;
        var c = i % 2 === 0 ? tone(col, .9) : tone(col, -.6);
        var k;
        for (k = 0; k < bh; k++)
        {
            var off = k > bh - 2 ? lean : 0;
            pr(g, bx + off, y - k, 1, 1, k === bh - 1 ? tone(col, 1.4) : c);
        }
    }
}

// small irregular blob cluster (pebbles, crumbs, leaf litter)
function crumbs(g, x, y, w, h, cols, n, seed)
{
    var i;
    for (i = 0; i < n; i++)
    {
        var px = x + Math.floor(hash2(i, seed, 11) * w);
        var py = y + Math.floor(hash2(seed, i, 23) * h);
        var c = cols[i % cols.length];
        var sz = hash2(i, i, seed) > .6 ? 2 : 1;
        pr(g, px, py, sz, 1, c);
        if (sz === 2 && hash2(i, seed, 31) > .5)
        {
            pr(g, px, py + 1, 1, 1, c);
        }
    }
}

// contact shadow so entities sit on the ground. offset toward the light's
// opposite corner (lower-right) so it reads as a cast shadow, not a dark halo.
function contactShadow(g, cx, cy, rx, ry)
{
    var ox = -LIGHT_X * rx * .22, oy = -LIGHT_Y * ry * .3;
    pe(g, cx + ox, cy + oy, rx, ry, 'rgba(26,20,12,.3)');
    pe(g, cx + ox * .4, cy, Math.max(1, rx * .72), Math.max(1, ry * .8), 'rgba(26,20,12,.24)');
}

// a longer shadow thrown across the ground by something tall
function castShadow(g, cx, cy, len, wide)
{
    var i;
    for (i = 0; i < 3; i++)
    {
        var t = i / 3;
        pe(g, cx + len * t * .9, cy + len * t * .35,
            wide * (1 - t * .35), wide * (.42 - t * .12), 'rgba(24,18,10,' + (.2 - t * .05) + ')');
    }
}

// ---------- ground edge transitions ----------
// Two textures butted together in a straight line is the single most amateur
// looking thing in tile art. Higher-priority ground grows a ragged fringe over
// its lower-priority neighbour so every boundary is broken up.

var EDGE_PRI = {};
EDGE_PRI[T_GRASS] = 5;
EDGE_PRI[T_SAND] = 4;
EDGE_PRI[T_PATH] = 3;
EDGE_PRI[T_DIRT] = 2;
EDGE_PRI[T_STONE] = 1;
EDGE_PRI[T_WOOD] = 1;
EDGE_PRI[T_BRIDGE] = 1;

function edgeColorOf(t, season)
{
    if (t === T_GRASS)
    {
        return SEASON_TINT[season].grass;
    }
    if (t === T_SAND)
    {
        return '#ddcb9a';
    }
    if (t === T_PATH)
    {
        return '#a68c66';
    }
    if (t === T_DIRT)
    {
        return '#7a5636';
    }
    return null;
}

// side: 0 top, 1 right, 2 bottom, 3 left
function drawFringe(g, px, py, side, col, t, season, seed)
{
    var i, depth, x, y;
    var grassy = (t === T_GRASS);
    for (i = 0; i < TILE; i++)
    {
        // jagged inner boundary, 3..9 px deep
        depth = 3 + Math.floor(hash2(i, seed, side * 17 + 3) * 5)
            + (Math.sin((i + seed) * .7) > .3 ? 2 : 0);
        var d2;
        for (d2 = 0; d2 < depth; d2++)
        {
            if (side === 0) { x = px + i; y = py + d2; }
            else if (side === 2) { x = px + i; y = py + TILE - 1 - d2; }
            else if (side === 3) { x = px + d2; y = py + i; }
            else { x = px + TILE - 1 - d2; y = py + i; }
            var c = col;
            if (d2 === depth - 1)
            {
                c = tone(col, -1.2);
            }
            else if (d2 === 0)
            {
                c = tone(col, .7);
            }
            pr(g, x, y, 1, 1, c);
        }
        // detached specks just past the fringe
        if (hash2(i, seed + 5, side) > .82)
        {
            var e = depth + 1 + Math.floor(hash2(i, side, seed) * 3);
            if (side === 0) { x = px + i; y = py + e; }
            else if (side === 2) { x = px + i; y = py + TILE - 1 - e; }
            else if (side === 3) { x = px + e; y = py + i; }
            else { x = px + TILE - 1 - e; y = py + i; }
            pr(g, x, y, 1, 1, tone(col, -.6));
        }
    }
    // grass throws a few blades over the edge so the seam disappears
    if (grassy && season !== 'winter')
    {
        for (i = 0; i < 5; i++)
        {
            var o = 3 + Math.floor(hash2(i, seed, side + 11) * 26);
            if (side === 0) { tuft(g, px + o, py + 8 + Math.floor(hash2(i, 2, seed) * 4), 5, col, seed + i); }
            else if (side === 2) { tuft(g, px + o, py + TILE - 2, 6, col, seed + i); }
            else if (side === 3) { tuft(g, px + 5 + Math.floor(hash2(i, 3, seed) * 4), py + o, 5, col, seed + i); }
            else { tuft(g, px + TILE - 5 - Math.floor(hash2(i, 4, seed) * 4), py + o, 5, col, seed + i); }
        }
    }
}

// ---------- outline post-pass ----------

var OUT_CACHE = {};

function outlineColorOf(r, g, b)
{
    var key = (r << 16) | (g << 8) | b;
    var hit = OUT_CACHE[key];
    if (hit)
    {
        return hit;
    }
    var hex = tone(rgb2hex(r, g, b), -3.4);
    var v = hex2rgb(hex);
    OUT_CACHE[key] = v;
    return v;
}

// add a 1px border on transparent pixels that touch an opaque pixel.
// the border colour is derived from the neighbour, never flat black.
function outlinePass(cv)
{
    var w = cv.width, h = cv.height;
    if (w < 3 || h < 3)
    {
        return;
    }
    var g = cv.getContext('2d');
    var img;
    try
    {
        img = g.getImageData(0, 0, w, h);
    }
    catch (e)
    {
        return;
    }
    var src = img.data;
    var dst = new Uint8ClampedArray(src);
    var x, y;
    for (y = 0; y < h; y++)
    {
        for (x = 0; x < w; x++)
        {
            var i = (y * w + x) * 4;
            if (src[i + 3] > 40)
            {
                continue;
            }
            var nr = -1, ng = 0, nb = 0;
            var k;
            var nx = [x - 1, x + 1, x, x];
            var ny = [y, y, y - 1, y + 1];
            for (k = 0; k < 4; k++)
            {
                var ax = nx[k], ay = ny[k];
                if (ax < 0 || ay < 0 || ax >= w || ay >= h)
                {
                    continue;
                }
                var j = (ay * w + ax) * 4;
                if (src[j + 3] > 150)
                {
                    nr = src[j];
                    ng = src[j + 1];
                    nb = src[j + 2];
                    break;
                }
            }
            if (nr < 0)
            {
                continue;
            }
            var oc = outlineColorOf(nr, ng, nb);
            dst[i] = oc[0];
            dst[i + 1] = oc[1];
            dst[i + 2] = oc[2];
            dst[i + 3] = 235;
        }
    }
    img.data.set(dst);
    g.putImageData(img, 0, 0);
}

// bake(key, w, h, fn, opt) -> canvas. opt.outline adds the border pass.
function bake(key, w, h, fn, opt)
{
    var c = SPR_CACHE[key];
    if (!c)
    {
        c = makeCv(w, h);
        var g = c.getContext('2d');
        fn(g);
        if (opt && opt.outline)
        {
            outlinePass(c);
        }
        SPR_CACHE[key] = c;
    }
    return c;
}

// ---------- people (32 x 52) ----------

var HAIR_STYLES = ['bowl', 'long', 'spiky', 'bun', 'curly', 'short', 'pony', 'wave'];

var PW = 32, PH = 54;

function drawPerson(g, o, dir, frame)
{
    var skin = o.skin || '#f0c8a0';
    var hair = o.hair || '#5a3a1a';
    var shirt = o.shirt || '#4a7ac8';
    var pants = o.pants || '#3a4a6a';
    var shoe = o.shoe || '#4a2a12';
    var eye = o.eye || '#33241a';

    var step = (frame === 1) ? 1 : ((frame === 3) ? -1 : 0);
    var bob = (frame === 1 || frame === 3) ? -1 : 0;

    contactShadow(g, 16, 50, 9, 3);

    // Proportions: head+hair ~19px, body ~29px. The first pass made the head
    // almost half the sprite, which reads as a bobblehead toy.
    // ---- legs (y 34..50) ----
    var legTop = 34 + bob;
    var lx = 10, rx = 17;
    var lLen = 12 + (step > 0 ? -2 : 0);
    var rLen = 12 + (step < 0 ? -2 : 0);
    pr(g, lx, legTop, 5, lLen, pants);
    pr(g, rx, legTop, 5, rLen, pants);
    pr(g, lx, legTop, 1, lLen, tone(pants, 1));
    pr(g, rx + 4, legTop, 1, rLen, tone(pants, -1.4));
    pr(g, lx, legTop + lLen - 1, 5, 1, tone(pants, -1.6));
    pr(g, rx, legTop + rLen - 1, 5, 1, tone(pants, -1.6));
    pr(g, lx + 1, legTop + 3, 1, lLen - 5, tone(pants, -.8));
    pr(g, rx + 1, legTop + 3, 1, rLen - 5, tone(pants, -.8));
    // shoes
    pr(g, lx - 1, legTop + lLen, 6, 4, shoe);
    pr(g, rx, legTop + rLen, 6, 4, shoe);
    pr(g, lx - 1, legTop + lLen, 6, 1, tone(shoe, 1.2));
    pr(g, rx, legTop + rLen, 6, 1, tone(shoe, 1.2));
    pr(g, lx - 1, legTop + lLen + 3, 6, 1, tone(shoe, -1.6));
    pr(g, rx, legTop + rLen + 3, 6, 1, tone(shoe, -1.6));

    // ---- torso (y 21..36) ----
    var ty = 21 + bob;
    pr(g, 10, ty, 12, 1, shirt);
    pr(g, 9, ty + 1, 14, 1, shirt);
    pr(g, 8, ty + 2, 16, 13, shirt);
    pr(g, 8, ty + 2, 3, 13, tone(shirt, .9));         // lit side
    pr(g, 21, ty + 2, 3, 13, tone(shirt, -1.2));      // shaded side
    pr(g, 10, ty, 12, 1, tone(shirt, 1.5));           // shoulder highlight
    pr(g, 9, ty + 1, 14, 1, tone(shirt, 1.2));
    pr(g, 8, ty + 13, 16, 2, tone(shirt, -1.7));      // hem shadow
    // belt
    pr(g, 8, ty + 11, 16, 3, tone(pants, -.6));
    pr(g, 8, ty + 11, 16, 1, tone(pants, .9));
    pr(g, 14, ty + 11, 4, 3, '#d8b048');
    pr(g, 15, ty + 12, 2, 1, '#8a6a18');
    // fold hints
    pr(g, 13, ty + 5, 1, 6, tone(shirt, -.8));
    pr(g, 18, ty + 6, 1, 5, tone(shirt, -.8));
    // collar with a v-notch
    pr(g, 11, ty, 10, 2, tone(shirt, -1.9));
    pr(g, 13, ty, 6, 2, tone(skin, -1.2));
    pr(g, 14, ty + 2, 4, 1, tone(skin, -1.8));

    // ---- arms ----
    var swing = step * 2;
    if (dir === 2)
    {
        pr(g, 12, ty + 3 + swing, 5, 9, shirt);
        pr(g, 12, ty + 3 + swing, 1, 9, tone(shirt, 1));
        pr(g, 12, ty + 11 + swing, 5, 2, tone(shirt, -1.8));   // cuff
        pr(g, 12, ty + 13 + swing, 5, 4, skin);
        pr(g, 12, ty + 16 + swing, 5, 1, tone(skin, -1.5));
    }
    else
    {
        pr(g, 4, ty + 3 - swing, 5, 9, shirt);
        pr(g, 23, ty + 3 + swing, 5, 9, shirt);
        pr(g, 4, ty + 3 - swing, 1, 9, tone(shirt, 1));
        pr(g, 27, ty + 3 + swing, 1, 9, tone(shirt, -1.4));
        pr(g, 4, ty + 11 - swing, 5, 2, tone(shirt, -1.8));
        pr(g, 23, ty + 11 + swing, 5, 2, tone(shirt, -1.8));
        pr(g, 4, ty + 13 - swing, 5, 4, skin);
        pr(g, 23, ty + 13 + swing, 5, 4, skin);
        pr(g, 4, ty + 16 - swing, 5, 1, tone(skin, -1.5));
        pr(g, 23, ty + 16 + swing, 5, 1, tone(skin, -1.5));
    }

    // ---- head (y 6..21), 15 rows, tapering to a chin ----
    var hy = 6 + bob;
    var spans = [
        [10, 12], [9, 14],
        [8, 16], [8, 16], [8, 16], [8, 16], [8, 16], [8, 16], [8, 16], [8, 16], [8, 16], [8, 16],
        [9, 14], [10, 12], [12, 8]
    ];
    var r;
    // ears sit behind the face spans
    pr(g, 6, hy + 7, 3, 4, tone(skin, -.6));
    pr(g, 23, hy + 7, 3, 4, tone(skin, -1.1));
    pr(g, 7, hy + 8, 1, 2, tone(skin, -1.8));
    pr(g, 24, hy + 8, 1, 2, tone(skin, -1.8));
    for (r = 0; r < spans.length; r++)
    {
        pr(g, spans[r][0], hy + r, spans[r][1], 1, skin);
    }
    // form shading
    for (r = 0; r < spans.length; r++)
    {
        pr(g, spans[r][0], hy + r, 2, 1, tone(skin, .8));
        pr(g, spans[r][0] + spans[r][1] - 3, hy + r, 3, 1, tone(skin, -1));
        pr(g, spans[r][0] + spans[r][1] - 1, hy + r, 1, 1, tone(skin, -1.6));
    }
    pr(g, 11, hy + 14, 10, 1, tone(skin, -1.4));

    if (dir === 0)
    {
        pr(g, 10, hy + 7, 4, 4, '#fdfdfa');
        pr(g, 18, hy + 7, 4, 4, '#fdfdfa');
        pr(g, 11, hy + 8, 3, 3, eye);
        pr(g, 19, hy + 8, 3, 3, eye);
        pr(g, 11, hy + 8, 1, 1, '#ffffff');
        pr(g, 19, hy + 8, 1, 1, '#ffffff');
        pr(g, 12, hy + 10, 2, 1, tone(eye, -1.2));
        pr(g, 20, hy + 10, 2, 1, tone(eye, -1.2));
        pr(g, 10, hy + 6, 4, 1, tone(hair, -1));
        pr(g, 18, hy + 6, 4, 1, tone(hair, -1));
        // nose + mouth
        pr(g, 15, hy + 10, 2, 2, tone(skin, -1.3));
        pr(g, 13, hy + 13, 6, 1, tone(skin, -2.2));
        pr(g, 14, hy + 14, 4, 1, mix(skin, '#c05a5a', .35));
        if (o.blush !== false)
        {
            pr(g, 9, hy + 11, 4, 2, mix(skin, '#e07a86', .38));
            pr(g, 19, hy + 11, 4, 2, mix(skin, '#e07a86', .3));
        }
    }
    else if (dir === 2)
    {
        pr(g, 17, hy + 7, 5, 4, '#fdfdfa');
        pr(g, 18, hy + 8, 3, 3, eye);
        pr(g, 18, hy + 8, 1, 1, '#ffffff');
        pr(g, 17, hy + 6, 5, 1, tone(hair, -1));
        pr(g, 23, hy + 8, 2, 3, skin);              // nose in profile
        pr(g, 24, hy + 9, 1, 2, tone(skin, -1.4));
        pr(g, 20, hy + 13, 5, 1, tone(skin, -2.2));
        pr(g, 9, hy + 11, 4, 2, mix(skin, '#e07a86', .3));
    }

    drawHair(g, o.hairStyle || 'bowl', hair, dir, hy, skin);

    if (o.hat)
    {
        var ht = o.hat;
        pr(g, 4, hy - 2, 24, 4, ht);
        pr(g, 8, hy - 6, 16, 5, ht);
        pr(g, 8, hy - 6, 16, 1, tone(ht, 1.2));
        pr(g, 4, hy + 1, 24, 1, tone(ht, -2));
        pr(g, 8, hy - 2, 16, 1, tone(ht, -1.4));
    }
}

function drawHair(g, style, hair, dir, hy, skin)
{
    var d1 = tone(hair, -1.2), d2 = tone(hair, -2.2);
    var l1 = tone(hair, 1.1), l2 = tone(hair, 2);

    // skull cap sits ~4px above the head, not 6 - keeps the head from ballooning
    pr(g, 10, hy - 4, 12, 2, hair);
    pr(g, 8, hy - 3, 16, 3, hair);
    pr(g, 7, hy - 1, 18, 4, hair);
    pr(g, 6, hy + 1, 2, 5, hair);
    pr(g, 24, hy + 1, 2, 5, hair);
    pr(g, 5, hy + 2, 1, 3, d1);
    pr(g, 26, hy + 2, 1, 3, d1);
    // uneven fringe: the tips of the bangs sit at different heights
    var fr = [4, 2, 5, 3, 2, 4, 2, 5, 3];
    var fi;
    for (fi = 0; fi < fr.length; fi++)
    {
        pr(g, 7 + fi * 2, hy, 2, fr[fi], hair);
        pr(g, 7 + fi * 2, hy + fr[fi], 2, 1, d2);
    }
    // specular band (what makes hair read as hair rather than a helmet)
    pr(g, 9, hy - 3, 9, 2, l1);
    pr(g, 10, hy - 4, 6, 1, l2);
    pr(g, 19, hy - 2, 4, 1, l1);
    pr(g, 21, hy + 1, 3, 4, d1);
    pr(g, 7, hy - 1, 2, 4, l1);

    if (style === 'long')
    {
        pr(g, 4, hy + 2, 3, 15, hair);
        pr(g, 25, hy + 2, 3, 15, hair);
        pr(g, 4, hy + 13, 3, 4, d1);
        pr(g, 25, hy + 13, 3, 4, d1);
        pr(g, 5, hy + 4, 1, 7, l1);
    }
    else if (style === 'spiky')
    {
        pr(g, 7, hy - 6, 4, 3, hair);
        pr(g, 13, hy - 8, 4, 5, hair);
        pr(g, 20, hy - 6, 4, 3, hair);
        pr(g, 14, hy - 8, 2, 3, l1);
        pr(g, 8, hy - 6, 2, 2, l1);
    }
    else if (style === 'bun')
    {
        orb(g, 16, hy - 6, 5, 4, hair, 1.4);
        pr(g, 12, hy - 3, 8, 2, d1);
    }
    else if (style === 'curly')
    {
        orb(g, 6, hy + 1, 4, 4, hair, 1.2);
        orb(g, 26, hy + 1, 4, 4, hair, 1.2);
        orb(g, 10, hy - 4, 4, 3, hair, 1.4);
        orb(g, 22, hy - 4, 4, 3, hair, 1.2);
        orb(g, 16, hy - 6, 4, 3, hair, 1.4);
    }
    else if (style === 'pony')
    {
        pr(g, 25, hy - 1, 5, 13, hair);
        pr(g, 26, hy + 10, 4, 4, d1);
        pr(g, 25, hy + 1, 2, 6, l1);
        pr(g, 23, hy - 2, 4, 3, d1);
    }
    else if (style === 'wave')
    {
        pr(g, 4, hy + 2, 3, 10, hair);
        pr(g, 25, hy + 2, 3, 10, hair);
        pr(g, 5, hy + 10, 3, 3, d1);
        pr(g, 24, hy + 10, 3, 3, d1);
        pr(g, 5, hy + 4, 1, 5, l1);
    }
    else if (style === 'short')
    {
        pr(g, 6, hy + 1, 1, 4, d1);
        pr(g, 25, hy + 1, 1, 4, d1);
    }

    if (dir === 1)
    {
        // back of the head: hair covers the whole face area
        pr(g, 8, hy - 3, 16, 17, hair);
        pr(g, 7, hy - 1, 18, 13, hair);
        pr(g, 6, hy + 1, 2, 9, hair);
        pr(g, 24, hy + 1, 2, 9, hair);
        pr(g, 10, hy - 4, 12, 2, hair);
        // nape: shorter strands, then the neck below
        pr(g, 9, hy + 11, 14, 3, d1);
        pr(g, 10, hy + 13, 12, 2, d2);
        pr(g, 12, hy + 14, 8, 2, tone(skin || '#f0c8a0', -1.4));
        // parting + strand separations so the back of the head is not a flat block
        pr(g, 15, hy - 4, 2, 15, d2);
        pr(g, 14, hy - 4, 1, 15, d1);
        pr(g, 10, hy - 2, 2, 13, d2);
        pr(g, 19, hy - 2, 2, 13, d2);
        pr(g, 12, hy - 2, 1, 13, d1);
        pr(g, 21, hy - 2, 1, 13, d1);
        pr(g, 8, hy + 2, 1, 9, d2);
        pr(g, 23, hy + 2, 1, 9, d2);
        pr(g, 9, hy - 3, 9, 2, l1);
        pr(g, 10, hy - 4, 6, 1, l2);
        pr(g, 19, hy - 2, 4, 1, l1);
    }
}

function personSprite(key, opt, dir, frame)
{
    return bake('p:' + key + ':' + dir + ':' + frame, PW, PH, function (g)
    {
        drawPerson(g, opt, dir, frame);
    }, { outline: true });
}

// ---------- terrain tiles (32 x 32) ----------

function tileGrass(season, variant)
{
    return bake('t:grass:' + season + ':' + variant, TILE, TILE, function (g)
    {
        var t = SEASON_TINT[season];
        var a = t.grass, b = t.grassAlt;
        var i;
        // 1) flat base, 2) irregular darker patches, 3) dithered seams, 4) blade clusters
        pr(g, 0, 0, TILE, TILE, a);
        for (i = 0; i < 3; i++)
        {
            var bx = Math.floor(hash2(variant, i, 131) * TILE) - 6;
            var by = Math.floor(hash2(i, variant, 137) * TILE) - 6;
            var bw = 10 + Math.floor(hash2(i, i, variant + 3) * 14);
            var bh = 8 + Math.floor(hash2(variant, i, 149) * 12);
            pe(g, bx + bw / 2, by + bh / 2, bw / 2, bh / 2, b);
            dither(g, Math.max(0, bx), Math.max(0, by),
                Math.min(TILE - Math.max(0, bx), bw), Math.min(TILE - Math.max(0, by), bh), b, a, .45);
        }
        if (season === 'winter')
        {
            pr(g, 0, 0, TILE, TILE, '#dde8f2');
            // wind-blown drifts: lit crest, blue-shadowed lee side
            for (i = 0; i < 3; i++)
            {
                var dx = Math.floor(hash2(variant, i, 41) * TILE) - 8;
                var dy = Math.floor(hash2(i, variant, 57) * TILE) - 4;
                var dw = 12 + Math.floor(hash2(i, i, variant) * 14);
                pe(g, dx + dw / 2, dy + 4, dw / 2, 4, '#f2f8fd');
                pe(g, dx + dw / 2, dy + 6, dw / 2 - 1, 3, '#c6d6e6');
                pr(g, Math.max(0, dx + 2), dy + 1, Math.min(dw - 4, TILE), 1, '#ffffff');
            }
            dither(g, 0, 0, TILE, TILE, '#e9f2f8', '#cfdde9', .35);
            // dead grass and twigs poking through
            for (i = 0; i < 2 + (variant % 2); i++)
            {
                var gx = 4 + Math.floor(hash2(variant, i, 61) * 24);
                var gy = 10 + Math.floor(hash2(i, variant, 67) * 18);
                tuft(g, gx, gy, 4 + (i % 3), '#a9b09a', variant * 5 + i);
            }
            crumbs(g, 0, 0, TILE, TILE, ['#c3d3e3', '#ffffff', '#b3c5d8'], 16, variant + 9);
            // sparkle on the snow
            pr(g, (variant * 7 + 5) % TILE, (variant * 11 + 9) % TILE, 1, 1, '#ffffff');
            pr(g, (variant * 13 + 19) % TILE, (variant * 5 + 22) % TILE, 1, 1, '#ffffff');
            return;
        }
        // soil showing through
        crumbs(g, 0, 0, TILE, TILE, [tone(a, -2), tone(a, -2.8)], 9, variant + 5);
        // blade clusters - the main thing that stops turf reading as a flat fill
        var n = 7 + (variant % 3);
        for (i = 0; i < n; i++)
        {
            var tx = 2 + Math.floor(hash2(variant, i, 71) * 28);
            var ty = 6 + Math.floor(hash2(i, variant, 83) * 26);
            var col = (i % 3 === 0) ? tone(a, -1.5) : ((i % 3 === 1) ? tone(a, 1.4) : a);
            tuft(g, tx, ty, 5 + Math.floor(hash2(i, i, variant) * 5), col, variant * 7 + i);
        }
        // lit tips catch the eye and break up any residual banding
        for (i = 0; i < 7; i++)
        {
            var px = Math.floor(hash2(i, variant, 97) * TILE);
            var py = Math.floor(hash2(variant, i, 101) * TILE);
            pr(g, px, py, 1, 1, tone(a, 2.2));
            pr(g, (px + 5) % TILE, (py + 9) % TILE, 1, 1, tone(a, -2.4));
        }
        if (season === 'fall' && variant % 2 === 1)
        {
            pr(g, 6, 20, 3, 2, '#c4762c');
            pr(g, 7, 21, 1, 1, '#e08c38');
            pr(g, 22, 9, 3, 2, '#a85a26');
        }
        if (season === 'spring' && variant === 2)
        {
            pr(g, 20, 18, 2, 2, '#f0e26a');
            pr(g, 21, 17, 1, 1, '#fff3a0');
        }
    });
}

function tileDirt(season)
{
    return bake('t:dirt:' + season, TILE, TILE, function (g)
    {
        var base = '#7a5636';
        dither(g, 0, 0, TILE, TILE, base, tone(base, -.9), .4);
        crumbs(g, 0, 0, TILE, TILE, [tone(base, 1.2), tone(base, -1.5), tone(base, -2.2)], 22, 13);
        pr(g, 0, 0, TILE, 1, tone(base, .8));
        pr(g, 0, TILE - 1, TILE, 1, tone(base, -1.6));
    });
}

function tileTilled(watered)
{
    return bake('t:till:' + (watered ? 1 : 0), TILE, TILE, function (g)
    {
        var base = watered ? '#4a3320' : '#8a6038';
        pr(g, 0, 0, TILE, TILE, base);
        // four furrows with a lit crest and a shadowed trough
        var y;
        for (y = 2; y < TILE - 2; y += 8)
        {
            pr(g, 1, y, TILE - 2, 3, tone(base, .55));
            pr(g, 1, y, TILE - 2, 1, tone(base, 1.5));
            pr(g, 1, y + 3, TILE - 2, 3, tone(base, -1.1));
            pr(g, 1, y + 5, TILE - 2, 1, tone(base, -1.8));
        }
        crumbs(g, 2, 2, TILE - 4, TILE - 4, [tone(base, 1.1), tone(base, -1.9)], 16, watered ? 3 : 7);
        // soft tile border: enough to read the plot grid, not a hard black cage
        var edge = tone(base, -1.5);
        pr(g, 0, 0, TILE, 1, edge);
        pr(g, 0, TILE - 1, TILE, 1, edge);
        pr(g, 0, 0, 1, TILE, edge);
        pr(g, TILE - 1, 0, 1, TILE, edge);
        pr(g, 1, 1, TILE - 2, 1, tone(base, 1.1));
        if (watered)
        {
            pr(g, 5, 9, 3, 1, 'rgba(150,205,240,.5)');
            pr(g, 19, 20, 4, 1, 'rgba(150,205,240,.45)');
            pr(g, 11, 26, 2, 1, 'rgba(150,205,240,.4)');
            pr(g, 24, 6, 2, 1, 'rgba(150,205,240,.4)');
        }
    });
}

function tileSand(variant)
{
    variant = variant || 0;
    return bake('t:sand:' + variant, TILE, TILE, function (g)
    {
        var base = '#ddcb9a';
        pr(g, 0, 0, TILE, TILE, base);
        // damp patches
        var i;
        for (i = 0; i < 2; i++)
        {
            var bx = Math.floor(hash2(variant, i, 211) * TILE) - 5;
            var by = Math.floor(hash2(i, variant, 223) * TILE) - 5;
            pe(g, bx + 8, by + 6, 9, 6, tone(base, -.8));
            dither(g, Math.max(0, bx), Math.max(0, by), 16, 12, tone(base, -.8), base, .5);
        }
        // wind ripples: crest lit, trough shaded
        for (i = 0; i < 5; i++)
        {
            var ry = 3 + i * 6 + (variant % 3);
            var rx = ((i * 9 + variant * 5) % 14);
            var rw = 14 + ((i * 7) % 12);
            pr(g, rx, ry, rw, 1, tone(base, 1.5));
            pr(g, rx + 1, ry + 1, rw - 2, 1, tone(base, -1.2));
            pr(g, (rx + 18) % TILE, ry + 3, 10, 1, tone(base, 1.2));
            pr(g, (rx + 18) % TILE, ry + 4, 9, 1, tone(base, -1));
        }
        crumbs(g, 0, 0, TILE, TILE, [tone(base, 1.8), tone(base, -1.6), tone(base, -2.4)], 30, variant + 19);
        // shell fragments and pebbles
        for (i = 0; i < 3; i++)
        {
            var sx = 2 + Math.floor(hash2(i, variant, 71) * 27);
            var sy = 2 + Math.floor(hash2(variant, i, 73) * 27);
            var col = ['#f3ece0', '#d8c0ae', '#c2b08c'][i % 3];
            pr(g, sx, sy, 2, 1, col);
            pr(g, sx, sy + 1, 1, 1, tone(col, -1.4));
        }
    });
}

function tileWater(frame, deep)
{
    return bake('t:water:' + frame + ':' + (deep ? 1 : 0), TILE, TILE, function (g)
    {
        var base = deep ? '#1c4a76' : '#2e77b2';
        pr(g, 0, 0, TILE, TILE, base);
        // depth banding
        dither(g, 0, 0, TILE, 14, tone(base, .8), base, .5);
        dither(g, 0, 18, TILE, 14, base, tone(base, -1), .5);
        // scrolling caustics: bright crest, dark trough underneath
        var i;
        for (i = 0; i < 5; i++)
        {
            var y = ((i * 7) + frame * 4) % TILE;
            var w = 8 + ((i * 5) % 12);
            var x = ((i * 11) + frame * 6) % TILE;
            var ww = Math.min(w, TILE - x);
            pr(g, x, y, ww, 1, tone(base, 2.2));
            pr(g, x + 1, y + 1, Math.max(1, ww - 2), 1, tone(base, 1.1));
            pr(g, x + 2, y + 2, Math.max(1, ww - 4), 1, tone(base, -1.6));
            if (ww < w)
            {
                pr(g, 0, y, w - ww, 1, tone(base, 2.2));
                pr(g, 0, y + 1, Math.max(1, w - ww - 1), 1, tone(base, 1.1));
            }
        }
        // specular sparkles
        var sx = (frame * 9 + 3) % (TILE - 4);
        pr(g, sx, 9, 3, 1, 'rgba(255,255,255,.7)');
        pr(g, sx + 1, 10, 1, 1, 'rgba(255,255,255,.45)');
        pr(g, (sx + 17) % (TILE - 4), 24, 4, 1, 'rgba(255,255,255,.5)');
        pr(g, (sx + 8) % (TILE - 4), 2, 2, 1, 'rgba(255,255,255,.35)');
    });
}

function tileStoneFloor(variant)
{
    variant = variant || 0;
    return bake('t:sfloor:' + variant, TILE, TILE, function (g)
    {
        // warm irregular flagstones. slab tones stay close together on purpose:
        // a big tone gap here reads as a chessboard, not as paving.
        var base = '#a09585';
        pr(g, 0, 0, TILE, TILE, tone(base, -1.8));
        // four flagstone layouts so a plaza does not read as graph paper
        var sets = [
            [[1, 1, 17, 13], [19, 1, 12, 13], [1, 15, 12, 16], [14, 15, 17, 9], [14, 25, 17, 6]],
            [[1, 1, 11, 15], [13, 1, 18, 9], [13, 11, 18, 12], [1, 17, 15, 14], [17, 24, 14, 7]],
            [[1, 1, 20, 9], [22, 1, 9, 16], [1, 11, 12, 12], [14, 18, 17, 13], [1, 24, 12, 7]],
            [[1, 1, 14, 11], [16, 1, 15, 14], [1, 13, 9, 18], [11, 13, 10, 9], [11, 23, 20, 8], [22, 16, 9, 6]]
        ];
        var slabs = sets[variant % sets.length];
        var i;
        for (i = 0; i < slabs.length; i++)
        {
            var s = slabs[i];
            var c = tone(base, (i % 3 === 0) ? .18 : ((i % 3 === 1) ? -.16 : 0));
            pr(g, s[0], s[1], s[2], s[3], c);
            pr(g, s[0], s[1], s[2], 1, tone(c, 1));
            pr(g, s[0], s[1], 1, s[3], tone(c, .7));
            pr(g, s[0], s[1] + s[3] - 1, s[2], 1, tone(c, -1.4));
            pr(g, s[0] + s[2] - 1, s[1], 1, s[3], tone(c, -1.1));
            crumbs(g, s[0] + 2, s[1] + 2, s[2] - 4, s[3] - 4, [tone(c, -.9), tone(c, .9)], 5, i * 7 + 3);
        }
    });
}

function tileWoodFloor()
{
    return bake('t:wfloor', TILE, TILE, function (g)
    {
        var base = '#9a6a3c';
        pr(g, 0, 0, TILE, TILE, base);
        var y;
        for (y = 0; y < TILE; y += 8)
        {
            pr(g, 0, y, TILE, 7, y % 16 === 0 ? tone(base, .4) : tone(base, -.35));
            pr(g, 0, y, TILE, 1, tone(base, 1.2));
            pr(g, 0, y + 7, TILE, 1, tone(base, -2));
            // grain
            pr(g, 4, y + 3, 9, 1, tone(base, -.9));
            pr(g, 18, y + 4, 11, 1, tone(base, -.9));
            pr(g, 8, y + 5, 6, 1, tone(base, .8));
        }
        // plank ends
        pr(g, 11, 0, 1, 8, tone(base, -2.2));
        pr(g, 23, 8, 1, 8, tone(base, -2.2));
        pr(g, 6, 16, 1, 8, tone(base, -2.2));
        pr(g, 26, 24, 1, 8, tone(base, -2.2));
    });
}

function tilePath()
{
    return bake('t:path', TILE, TILE, function (g)
    {
        var base = '#a68c66';
        pr(g, 0, 0, TILE, TILE, base);
        dither(g, 0, 0, TILE, TILE, base, tone(base, -1), .45);
        // pressed gravel: many small stones, a few larger ones
        var i;
        for (i = 0; i < 14; i++)
        {
            var x = 1 + Math.floor(hash2(i, 3, 31) * 28);
            var y = 1 + Math.floor(hash2(3, i, 37) * 28);
            var w = 3 + Math.floor(hash2(i, i, 41) * 5);
            var h = 2 + Math.floor(hash2(i, i, 43) * 3);
            var c = tone(base, i % 3 === 0 ? 1.3 : (i % 3 === 1 ? -1.2 : .4));
            pe(g, x + w / 2, y + h / 2, w / 2, h / 2, c);
            pr(g, x + 1, y, w - 2, 1, tone(c, 1.4));
            pr(g, x, y + h, w, 1, tone(c, -1.8));
        }
        crumbs(g, 0, 0, TILE, TILE, [tone(base, 1.6), tone(base, -1.9), tone(base, -2.6)], 26, 53);
        // faint wheel ruts
        pr(g, 7, 0, 2, TILE, tone(base, -.7));
        pr(g, 22, 0, 2, TILE, tone(base, -.7));
    });
}

function tileCave(floor, variant)
{
    variant = variant || 0;
    return bake('t:cave:' + floor + ':' + variant, TILE, TILE, function (g)
    {
        // lighter than the walls so the walkable area reads at a glance
        var base = floor < 40 ? '#75604a' : (floor < 80 ? '#5a6c80' : '#74463c');
        pr(g, 0, 0, TILE, TILE, base);
        var i;
        for (i = 0; i < 2; i++)
        {
            var bx = Math.floor(hash2(variant, i, 311) * TILE) - 6;
            var by = Math.floor(hash2(i, variant, 313) * TILE) - 6;
            pe(g, bx + 9, by + 7, 10, 7, tone(base, -.9));
            dither(g, Math.max(0, bx), Math.max(0, by), 18, 14, tone(base, -.9), base, .5);
        }
        crumbs(g, 0, 0, TILE, TILE, [tone(base, 1.5), tone(base, -1.5), tone(base, -2.3)], 26, floor + variant);
        // embedded pebbles
        for (i = 0; i < 4; i++)
        {
            var x = 2 + Math.floor(hash2(i, variant, 61) * 27);
            var y = 2 + Math.floor(hash2(variant, i, 67) * 27);
            var w = 3 + Math.floor(hash2(i, i, variant) * 3);
            pe(g, x + w / 2, y + 1, w / 2, 2, tone(base, -1.2));
            pr(g, x, y - 1, w, 1, tone(base, 1.4));
        }
        // faint cracks
        pr(g, 6 + (variant % 5) * 4, 4, 1, 9, tone(base, -1.8));
        pr(g, 20 - (variant % 4) * 3, 19, 1, 8, tone(base, -1.8));
    });
}

function tileCaveWall(floor, variant)
{
    variant = variant || 0;
    return bake('t:cavew:' + floor + ':' + variant, TILE, TILE, function (g)
    {
        var base = floor < 40 ? '#4a3c2c' : (floor < 80 ? '#3a4a5c' : '#4d2c22');
        pr(g, 0, 0, TILE, TILE, tone(base, -1.6));
        // four block layouts, picked per tile so the wall does not tile visibly
        var sets = [
            [[0, 0, 14, 11], [14, 0, 18, 8], [0, 11, 9, 12], [9, 8, 13, 10], [22, 8, 10, 14], [0, 23, 16, 9], [16, 22, 16, 10]],
            [[0, 0, 11, 9], [11, 0, 21, 12], [0, 9, 17, 11], [17, 12, 15, 9], [0, 20, 12, 12], [12, 21, 20, 11]],
            [[0, 0, 19, 13], [19, 0, 13, 9], [19, 9, 13, 12], [0, 13, 10, 10], [10, 13, 9, 8], [0, 23, 19, 9], [10, 21, 9, 11]],
            [[0, 0, 15, 8], [15, 0, 17, 14], [0, 8, 8, 13], [8, 8, 7, 12], [0, 21, 14, 11], [14, 14, 18, 8], [14, 22, 18, 10]]
        ];
        var blocks = sets[variant % sets.length];
        var i;
        for (i = 0; i < blocks.length; i++)
        {
            var b = blocks[i];
            var c = tone(base, ((i + floor + variant) % 3 === 0) ? .8 : ((i + floor + variant) % 3 === 1) ? -.7 : 0);
            pr(g, b[0] + 1, b[1] + 1, b[2] - 2, b[3] - 2, c);
            pr(g, b[0] + 1, b[1] + 1, b[2] - 2, 2, tone(c, 1.5));
            pr(g, b[0] + 1, b[1] + 1, 2, b[3] - 2, tone(c, 1));
            pr(g, b[0] + 1, b[1] + b[3] - 3, b[2] - 2, 2, tone(c, -1.9));
            pr(g, b[0] + b[2] - 3, b[1] + 1, 2, b[3] - 2, tone(c, -1.4));
            crumbs(g, b[0] + 3, b[1] + 3, Math.max(2, b[2] - 6), Math.max(2, b[3] - 6),
                [tone(c, -1.3), tone(c, 1.2)], 4, i * 5 + floor + variant);
        }
        pr(g, 0, TILE - 3, TILE, 3, tone(base, -2.4));
    });
}

function tileSnowIce()
{
    return bake('t:ice', TILE, TILE, function (g)
    {
        var base = '#bcd8ea';
        dither(g, 0, 0, TILE, TILE, base, tone(base, .8), .4);
        pr(g, 4, 7, 11, 1, '#eaf5fc');
        pr(g, 18, 19, 10, 1, '#eaf5fc');
        pr(g, 10, 24, 9, 1, tone(base, -1.2));
        pr(g, 22, 9, 6, 1, tone(base, -1.2));
    });
}

// ---------- trees ----------

var TREE_W = 96, TREE_H = 128;

function leafClump(g, cx, cy, r, col)
{
    pe(g, cx, cy, r, r * .88, tone(col, -1.4));
    pe(g, cx, cy - r * .12, r - 1, r * .8, col);
    pe(g, cx - r * .34, cy - r * .34, r * .5, r * .42, tone(col, 1.1));
    pe(g, cx - r * .44, cy - r * .46, r * .24, r * .2, tone(col, 1.9));
}

function sprTree(kind, stage, season)
{
    var key = 'tree:' + kind + ':' + stage + ':' + season;
    return bake(key, TREE_W, TREE_H, function (g)
    {
        var leafCol = {
            oak: { spring: '#4f9a3a', summer: '#3a8a2b', fall: '#c8742a', winter: null },
            maple: { spring: '#66aa42', summer: '#4f9a32', fall: '#d0562a', winter: null },
            pine: { spring: '#2f6f3f', summer: '#2a6538', fall: '#2f6a3c', winter: '#35624a' }
        }[kind][season];
        var trunk = '#6d4a2c';
        var cx = TREE_W / 2, groundY = TREE_H - 6;

        if (stage >= 3)
        {
            castShadow(g, cx + 8, groundY - 2, 26, 20);
        }
        contactShadow(g, cx, groundY + 1, stage < 2 ? 7 : 18, stage < 2 ? 3 : 6);

        if (stage === 0)
        {
            pr(g, cx - 1, groundY - 10, 2, 10, trunk);
            pr(g, cx - 1, groundY - 10, 1, 10, tone(trunk, 1));
            if (leafCol)
            {
                leafClump(g, cx - 3, groundY - 12, 4, leafCol);
                leafClump(g, cx + 3, groundY - 14, 4, leafCol);
            }
            return;
        }
        if (stage === 1)
        {
            pr(g, cx - 2, groundY - 22, 4, 22, trunk);
            pr(g, cx - 2, groundY - 22, 1, 22, tone(trunk, 1));
            pr(g, cx + 1, groundY - 22, 1, 22, tone(trunk, -1.3));
            leafClump(g, cx - 6, groundY - 26, 7, leafCol || '#5d6a5a');
            leafClump(g, cx + 6, groundY - 29, 7, leafCol || '#5d6a5a');
            leafClump(g, cx, groundY - 34, 8, leafCol || '#5d6a5a');
            return;
        }
        if (stage === 2)
        {
            drawTrunk(g, cx, groundY, 42, 7, trunk);
            var r2 = 15;
            leafClump(g, cx - 11, groundY - 46, r2, leafCol || '#5d6a5a');
            leafClump(g, cx + 11, groundY - 49, r2, leafCol || '#5d6a5a');
            leafClump(g, cx, groundY - 58, r2 + 2, leafCol || '#5d6a5a');
            return;
        }

        // full grown
        var th = stage === 4 ? 60 : 50;
        drawTrunk(g, cx, groundY, th, stage === 4 ? 11 : 9, trunk);

        if (kind === 'pine')
        {
            drawPine(g, cx, groundY, stage, leafCol);
            return;
        }
        if (!leafCol)
        {
            drawBareBranches(g, cx, groundY, th, trunk, season === 'winter');
            return;
        }
        drawCanopy(g, cx, groundY - th + 6, stage === 4 ? 34 : 28, leafCol, kind, season);
    }, { outline: true });
}

function drawTrunk(g, cx, groundY, h, w, trunk)
{
    var top = groundY - h;
    pr(g, cx - w / 2, top, w, h, trunk);
    pr(g, cx - w / 2, top, 2, h, tone(trunk, 1.2));
    pr(g, cx + w / 2 - 3, top, 3, h, tone(trunk, -1.4));
    pr(g, cx + w / 2 - 1, top, 1, h, tone(trunk, -2.1));
    // bark marks
    var i;
    for (i = 0; i < Math.floor(h / 9); i++)
    {
        var by = top + 5 + i * 9;
        var bx = cx - w / 2 + 2 + (i % 2) * 3;
        pr(g, bx, by, 3, 1, tone(trunk, -1.7));
        pr(g, bx, by + 1, 2, 1, tone(trunk, .9));
    }
    // root flare
    pr(g, cx - w / 2 - 4, groundY - 5, w + 8, 5, trunk);
    pr(g, cx - w / 2 - 6, groundY - 3, w + 12, 3, trunk);
    pr(g, cx - w / 2 - 6, groundY - 3, 3, 3, tone(trunk, 1));
    pr(g, cx - w / 2 - 6, groundY - 1, w + 12, 1, tone(trunk, -2.2));
    pr(g, cx + w / 2, groundY - 5, 4, 5, tone(trunk, -1.5));
}

function drawCanopy(g, cx, cy, r, col, kind, season)
{
    // base mass, then clumps so the silhouette stays lumpy instead of circular
    var pts = [
        [0, 4, 1.0], [-r * .62, -r * .1, .72], [r * .6, -r * .05, .74],
        [-r * .38, -r * .55, .66], [r * .36, -r * .58, .62], [0, -r * .72, .6],
        [-r * .72, r * .38, .5], [r * .68, r * .42, .52], [0, r * .5, .66]
    ];
    var i;
    for (i = 0; i < pts.length; i++)
    {
        var p = pts[i];
        pe(g, cx + p[0], cy + p[1], r * p[2], r * p[2] * .9, tone(col, -1.5));
    }
    for (i = 0; i < pts.length; i++)
    {
        var q = pts[i];
        leafClump(g, cx + q[0], cy + q[1], Math.max(4, r * q[2] * .82), col);
    }
    // gaps between clumps read as depth
    pr(g, cx - 3, cy + r * .1, 4, 6, tone(col, -2.2));
    pr(g, cx + r * .3, cy - r * .1, 3, 7, tone(col, -2.2));
    pr(g, cx - r * .45, cy + r * .3, 5, 4, tone(col, -2));
    // ragged leaf edge
    for (i = 0; i < 18; i++)
    {
        var a = (i / 18) * Math.PI * 2;
        var rr = r * (.92 + hash2(i, 3, 7) * .16);
        var lx = cx + Math.cos(a) * rr;
        var ly = cy + Math.sin(a) * rr * .92;
        var c = (a > 2.2 && a < 5.4) ? tone(col, -1.8) : tone(col, hash2(i, 5, 9) > .5 ? 1.4 : .3);
        pr(g, lx, ly, 2, 2, c);
    }
    if (season === 'fall')
    {
        pr(g, cx - r * .8, cy + r * .8, 2, 2, '#e08c38');
        pr(g, cx + r * .7, cy + r * .9, 2, 2, '#c0641f');
        pr(g, cx - r * .2, cy + r, 2, 2, '#e0a040');
    }
}

function drawPine(g, cx, groundY, stage, col)
{
    var layers = stage === 4 ? 5 : 4;
    var i, t;
    for (i = 0; i < layers; i++)
    {
        var ly = groundY - 34 - i * 17;
        var lw = 34 - i * 6;
        for (t = 0; t < 20; t++)
        {
            var ww = Math.round(lw * (1 - t / 22));
            if (ww <= 0)
            {
                continue;
            }
            var c = t < 3 ? tone(col, 1.3) : (t < 9 ? col : tone(col, -1.2));
            pr(g, cx - ww, ly + t, ww * 2, 1, c);
        }
        // needle notches on the skirt
        for (t = -lw; t < lw; t += 6)
        {
            pr(g, cx + t, ly + 18, 3, 2, tone(col, -1.9));
        }
        pr(g, cx - lw + 2, ly + 12, lw - 4, 1, tone(col, .9));
    }
    pr(g, cx - 2, groundY - 34 - layers * 17 + 4, 4, 8, col);
    pr(g, cx - 2, groundY - 34 - layers * 17 + 4, 2, 6, tone(col, 1.4));
}

function drawBareBranches(g, cx, groundY, th, trunk, snowy)
{
    var top = groundY - th;
    var arms = [
        [-1, 18, 26, 4], [1, 26, 30, 4], [-1, 34, 22, 3], [1, 42, 24, 3], [-1, 50, 16, 3]
    ];
    var i;
    for (i = 0; i < arms.length; i++)
    {
        var a = arms[i];
        var y = top + (th - a[1]);
        var len = a[2], w = a[3];
        var x0 = a[0] < 0 ? cx - len : cx;
        pr(g, x0, y, len, w, trunk);
        pr(g, x0, y, len, 1, tone(trunk, 1));
        pr(g, x0, y + w - 1, len, 1, tone(trunk, -1.8));
        var tipX = a[0] < 0 ? x0 - 6 : x0 + len;
        pr(g, tipX, y - 8, 3, 10, trunk);
        pr(g, tipX, y - 8, 1, 10, tone(trunk, .9));
        if (snowy)
        {
            pr(g, x0, y - 1, len, 1, '#eef6fc');
            pr(g, tipX, y - 9, 3, 1, '#eef6fc');
        }
    }
    pr(g, cx - 3, top - 12, 6, 20, trunk);
    pr(g, cx - 3, top - 12, 2, 20, tone(trunk, 1));
    if (snowy)
    {
        pr(g, cx - 3, top - 13, 6, 1, '#eef6fc');
    }
}

// fruit tree
function sprFruitTree(saplingId, stage, fruit, season)
{
    var def = FRUIT_TREES[saplingId];
    var key = 'ftree:' + saplingId + ':' + stage + ':' + fruit + ':' + season;
    return bake(key, TREE_W, TREE_H, function (g)
    {
        var leaf = season === 'winter' ? null : (season === 'fall' ? '#c2833c' : '#42933a');
        var trunk = '#6d4a2c';
        var cx = TREE_W / 2, groundY = TREE_H - 6;
        contactShadow(g, cx, groundY + 1, stage < 2 ? 7 : 16, stage < 2 ? 3 : 5);

        if (stage === 0)
        {
            pr(g, cx - 1, groundY - 9, 2, 9, trunk);
            leafClump(g, cx, groundY - 12, 5, leaf || '#6a6a5a');
            return;
        }
        if (stage === 1)
        {
            pr(g, cx - 2, groundY - 20, 4, 20, trunk);
            leafClump(g, cx - 5, groundY - 24, 7, leaf || '#6a6a5a');
            leafClump(g, cx + 5, groundY - 26, 7, leaf || '#6a6a5a');
            return;
        }
        if (stage === 2)
        {
            drawTrunk(g, cx, groundY, 36, 6, trunk);
            leafClump(g, cx - 9, groundY - 42, 12, leaf || '#6a6a5a');
            leafClump(g, cx + 9, groundY - 44, 12, leaf || '#6a6a5a');
            leafClump(g, cx, groundY - 52, 13, leaf || '#6a6a5a');
            return;
        }
        var th = stage === 4 ? 52 : 44;
        drawTrunk(g, cx, groundY, th, stage === 4 ? 10 : 8, trunk);
        if (!leaf)
        {
            drawBareBranches(g, cx, groundY, th, trunk, season === 'winter');
            return;
        }
        drawCanopy(g, cx, groundY - th + 4, stage === 4 ? 28 : 24, leaf, 'oak', season);
        // hanging fruit
        var spots = [[-16, 10], [15, 16], [-2, -8], [-20, -6], [18, -2]];
        var i;
        for (i = 0; i < fruit && i < spots.length; i++)
        {
            var fx = cx + spots[i][0];
            var fy = groundY - th + 4 + spots[i][1];
            pr(g, fx, fy - 5, 1, 4, '#4a6a28');
            orb(g, fx, fy, 5, 5, def.col, 1.8);
        }
    }, { outline: true });
}

function sprStump()
{
    return bake('stump', TILE, TILE, function (g)
    {
        var w = '#6d4a2c';
        contactShadow(g, 16, 27, 11, 3);
        pr(g, 5, 12, 22, 14, w);
        pr(g, 5, 12, 3, 14, tone(w, 1.1));
        pr(g, 23, 12, 4, 14, tone(w, -1.4));
        pr(g, 5, 24, 22, 2, tone(w, -2));
        pe(g, 16, 13, 11, 5, tone(w, 1.4));
        pe(g, 16, 13, 8, 3, tone(w, .5));
        pe(g, 16, 13, 5, 2, tone(w, -.6));
        pe(g, 16, 13, 2, 1, tone(w, -1.6));
        pr(g, 4, 24, 24, 1, tone(w, -2.4));
    }, { outline: true });
}

function sprRock(kind)
{
    var accent = {
        stone: null, coal: '#2e2e36', copper: '#c8783a', iron: '#d8d2c8',
        gold: '#e8c838', iridium: '#c888e8', gem: '#7fd6e8'
    }[kind];
    var base = kind === 'coal' ? '#4a4a52' : '#9a958c';
    return bake('rock:' + kind, TILE, TILE, function (g)
    {
        contactShadow(g, 16, 27, 11, 3);
        // faceted boulder: three planes, lit from the top-left
        pr(g, 5, 14, 22, 12, tone(base, -1.1));
        pe(g, 16, 15, 11, 7, base);
        pe(g, 12, 12, 8, 5, tone(base, .9));
        pe(g, 10, 11, 5, 3, tone(base, 1.7));
        pr(g, 5, 23, 22, 3, tone(base, -1.8));
        pr(g, 6, 25, 20, 1, tone(base, -2.4));
        // facet lines
        pr(g, 14, 10, 1, 8, tone(base, -1.4));
        pr(g, 15, 17, 8, 1, tone(base, -1.4));
        pr(g, 21, 13, 1, 5, tone(base, .8));
        if (accent)
        {
            var spots = [[9, 17], [18, 14], [22, 20], [13, 21]];
            var i;
            for (i = 0; i < spots.length; i++)
            {
                orb(g, spots[i][0], spots[i][1], 3, 2, accent, 1.8);
            }
            pr(g, 9, 16, 1, 1, tone(accent, 2.4));
            pr(g, 18, 13, 1, 1, tone(accent, 2.4));
        }
    }, { outline: true });
}

function sprWeed(season)
{
    return bake('weed:' + season, TILE, TILE, function (g)
    {
        var c = season === 'fall' ? '#a89238' : (season === 'winter' ? '#8f9c98' : '#4f9a3a');
        contactShadow(g, 16, 27, 7, 2);
        pr(g, 15, 18, 2, 9, tone(c, -1.6));
        var i;
        for (i = 0; i < 5; i++)
        {
            var a = -1.3 + i * .62;
            var lx = 16 + Math.cos(a) * 8;
            var ly = 18 + Math.sin(a) * 6;
            pe(g, lx, ly, 4, 3, i % 2 ? c : tone(c, -.8));
            pe(g, lx - 1, ly - 1, 2, 1, tone(c, 1.3));
        }
        pe(g, 16, 11, 3, 4, tone(c, .6));
        pr(g, 16, 8, 1, 3, tone(c, 1.4));
    }, { outline: true });
}

function sprBush(season)
{
    return bake('bush:' + season, TILE * 2, TILE + 16, function (g)
    {
        var c = SEASON_TINT[season].leaf;
        contactShadow(g, 32, 42, 24, 5);
        leafClump(g, 16, 30, 13, tone(c, -.6));
        leafClump(g, 46, 28, 14, c);
        leafClump(g, 31, 22, 14, tone(c, .5));
        leafClump(g, 24, 33, 10, tone(c, -1));
        leafClump(g, 40, 34, 10, tone(c, -.4));
        if (season === 'spring')
        {
            pr(g, 20, 20, 2, 2, '#f2b6d0');
            pr(g, 44, 24, 2, 2, '#f2b6d0');
        }
        if (season === 'fall')
        {
            pr(g, 26, 26, 2, 2, '#d8443c');
            pr(g, 42, 30, 2, 2, '#d8443c');
        }
    }, { outline: true });
}

function sprGrassTuft(season)
{
    return bake('tuft:' + season, TILE, TILE, function (g)
    {
        var c = SEASON_TINT[season].grass;
        tuft(g, 10, 27, 10, c, 3);
        tuft(g, 17, 29, 13, tone(c, .4), 7);
        tuft(g, 23, 27, 9, tone(c, -.5), 11);
    });
}

function sprFlowerTile(col)
{
    return bake('fl:' + col, TILE, TILE, function (g)
    {
        contactShadow(g, 16, 28, 5, 2);
        pr(g, 15, 18, 2, 10, '#3f7a2a');
        pr(g, 15, 18, 1, 10, '#57a33c');
        pe(g, 11, 22, 3, 2, '#3f7a2a');
        pe(g, 21, 24, 3, 2, '#4a8a32');
        var i;
        for (i = 0; i < 5; i++)
        {
            var a = i * 1.256;
            orb(g, 16 + Math.cos(a) * 4, 15 + Math.sin(a) * 4, 3, 3, col, 1.6);
        }
        orb(g, 16, 15, 3, 3, '#f4dc6a', 1.6);
        pr(g, 15, 14, 1, 1, '#fff4b0');
    }, { outline: true });
}

// ---------- crops ----------

function sprCrop(seedId, stage)
{
    var cd = CROPS[seedId];
    var prod = ITEMS[cd.crop];
    var key = 'crop:' + seedId + ':' + stage;
    return bake(key, TILE, TILE + 12, function (g)
    {
        var H = TILE + 12;
        var stem = '#4d9130';
        var base = H - 6;

        function leafPair(y, len, up)
        {
            pe(g, 16 - len, y, len * .7, 3, tone(stem, -.7));
            pe(g, 16 + len, y - (up || 0), len * .7, 3, stem);
            pe(g, 16 - len - 1, y - 1, len * .4, 1, tone(stem, 1.2));
            pe(g, 16 + len - 1, y - 1 - (up || 0), len * .4, 1, tone(stem, 1.4));
        }

        if (stage === 0)
        {
            pr(g, 15, base - 5, 2, 5, stem);
            pe(g, 13, base - 6, 3, 2, tone(stem, .8));
            pe(g, 19, base - 7, 3, 2, stem);
            return;
        }
        if (stage === 1)
        {
            pr(g, 15, base - 11, 2, 11, stem);
            pr(g, 15, base - 11, 1, 11, tone(stem, 1));
            leafPair(base - 9, 5);
            leafPair(base - 4, 4, 1);
            return;
        }
        if (stage === 2)
        {
            pr(g, 15, base - 18, 2, 18, stem);
            pr(g, 15, base - 18, 1, 18, tone(stem, 1));
            leafPair(base - 15, 7);
            leafPair(base - 10, 8, 1);
            leafPair(base - 5, 6);
            return;
        }
        if (stage === 3)
        {
            pr(g, 15, base - 24, 2, 24, stem);
            pr(g, 15, base - 24, 1, 24, tone(stem, 1));
            leafPair(base - 21, 9);
            leafPair(base - 15, 10, 1);
            leafPair(base - 9, 8);
            leafPair(base - 4, 6, 1);
            // a bud hints that harvest is close
            orb(g, 16, base - 26, 3, 3, tone(prod.cols[0], -1), 1);
            return;
        }

        // ripe
        if (cd.trellis)
        {
            var post = '#8a6a3a';
            pr(g, 5, 4, 3, base - 4, post);
            pr(g, 24, 4, 3, base - 4, post);
            pr(g, 5, 4, 1, base - 4, tone(post, 1.1));
            pr(g, 24, 4, 1, base - 4, tone(post, 1.1));
            pr(g, 5, 12, 22, 2, post);
            pr(g, 5, 24, 22, 2, post);
            pr(g, 5, 12, 22, 1, tone(post, 1.1));
            pr(g, 5, 24, 22, 1, tone(post, 1.1));
        }
        pr(g, 15, base - 26, 2, 26, stem);
        pr(g, 15, base - 26, 1, 26, tone(stem, 1));
        leafPair(base - 22, 10);
        leafPair(base - 15, 11, 1);
        leafPair(base - 8, 9);
        drawShape(g, prod.shape, prod.cols, 6, 2, 20);
    }, { outline: true });
}

// ---------- item icon shapes ----------
// draws into a size-s box at (ox,oy). s is typically 16..32.

function drawShape(g, shape, cols, ox, oy, s)
{
    var a = cols[0];
    var b = cols[1] || tone(a, -1.6);
    var c = cols[2] || tone(a, 1.4);
    var leaf = '#4d9130', leafD = tone(leaf, -1.4), leafL = tone(leaf, 1.2);
    var k = s / 24;

    function P(x, y, w, h, col)
    {
        pr(g, ox + x * k, oy + y * k, Math.max(1, w * k), Math.max(1, h * k), col);
    }
    function E(cx, cy, rx, ry, col)
    {
        pe(g, ox + cx * k, oy + cy * k, Math.max(1, Math.round(rx * k)), Math.max(1, Math.round(ry * k)), col);
    }
    function O(cx, cy, rx, ry, col, lift)
    {

var ICON_CACHE = {};

function itemIcon(id, s)
{
    var it = ITEMS[id];
    if (!it)
    {
        return bake('ic:?:' + s, s, s, function (g)
        {
            pr(g, 1, 1, s - 2, s - 2, '#c8a878');
        });
    }
    return bake('ic:' + id + ':' + s, s, s, function (g)
    {
        drawShape(g, it.shape, it.cols, 0, 0, s);
    }, { outline: s >= 14 });
}

// ---------- buildings ----------

function sprBuilding(kind)
{
    var defs = {
        house: { w: 192, h: 192, wall: '#e0cda6', roof: '#b04a38', trim: '#8a6a3a' },
        coop: { w: 192, h: 128, wall: '#e6d6b4', roof: '#c07840', trim: '#8a6a3a' },
        coop_big: { w: 192, h: 128, wall: '#e6d6b4', roof: '#a85838', trim: '#8a6a3a' },
        coop_deluxe: { w: 192, h: 128, wall: '#eee0c4', roof: '#8a4a30', trim: '#6a4a2a' },
        barn: { w: 224, h: 160, wall: '#c05648', roof: '#7a4a30', trim: '#eee6d6' },
        barn_big: { w: 224, h: 160, wall: '#ba5040', roof: '#6a4028', trim: '#eee6d6' },
        barn_deluxe: { w: 224, h: 160, wall: '#b04838', roof: '#5a3620', trim: '#f4ecdc' },
        silo: { w: 96, h: 144, wall: '#adadb6', roof: '#8a8a92', trim: '#787880' },
        well: { w: 96, h: 96, wall: '#9a958c', roof: '#8a5a30', trim: '#6d4a2c' },
        shed: { w: 224, h: 112, wall: '#e0cda6', roof: '#7a6a4a', trim: '#8a6a3a' },
        stable: { w: 128, h: 80, wall: '#c8a878', roof: '#8a5a30', trim: '#6d4a2c' },
        mill: { w: 128, h: 112, wall: '#e0cda6', roof: '#8a5a30', trim: '#6d4a2c' },
        shop: { w: 192, h: 160, wall: '#eee0c4', roof: '#3f8a68', trim: '#8a6a3a' },
        shop2: { w: 192, h: 160, wall: '#ded0b6', roof: '#4a6a9a', trim: '#8a6a3a' },
        shop3: { w: 160, h: 144, wall: '#e4d8bc', roof: '#9a5a3a', trim: '#8a6a3a' },
        saloon: { w: 192, h: 160, wall: '#c8a878', roof: '#8a4a58', trim: '#6d4a2c' },
        center: { w: 256, h: 192, wall: '#dccca8', roof: '#7a6a5a', trim: '#8a7a5a' },
        cabin: { w: 128, h: 112, wall: '#c8a878', roof: '#7a5a3a', trim: '#6d4a2c' },

    var d = defs[kind] || defs.cabin;
